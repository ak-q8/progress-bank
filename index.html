ron supplement. She is 162 cm (5 ft 4 in) tall and weighs 101.2 kg (223 lbs); BMI is 38 kg/m2. Her temperature is 36.5°C (97.7°F), pulse is 89/min, and blood pressure is 130/80 mm Hg. Rectal examination shows anal skin tags. Anoscopy shows multiple enlarged bluish veins above the dentate line at 7 and 11 o'clock positions. When asked to exhale through a closed nostril a mass prolapses but spontaneously reduces when breathing normally. Which of the following is the most appropriate next step in management?", "opts": ["Injection sclerotherapy", "Stool softeners", "Topical diltiazem", "Propranolol therapy", "Hemorrhoidectomy"], "ans": 1, "exp": "Haemorrhoids are first managed conservatively: fibre, stool softeners, avoiding straining, and topical analgesia if painful.", "why": ["Sclerotherapy is for persistent first or second-degree disease.", "", "Topical diltiazem is for anal fissure.", "Propranolol has no role.", "Haemorrhoidectomy is for failed non-operative treatment or large prolapsing piles."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 334}, {"group": "Surgery", "topic": "Hernia", "stem": "A 37-year-old woman comes to the physician because of right-sided inguinal pain for the past 8 weeks. During this period, the patient has had increased pain during activities such as walking and standing. She has no nausea, vomiting, or fever. Her temperature is 36.8°C (98.2°F), pulse is 73/min, and blood pressure is 132/80 mm Hg. The abdomen is soft and nontender. There is a visible and palpable groin protrusion above the inguinal ligament on the right side. Bulging is felt during Valsalva maneuver. Which of the following is the most likely diagnosis?", "opts": ["Femoral hernia", "Psoas abscess", "Indirect inguinal hernia", "Lipoma", "Strangulated hernia"], "ans": 2, "exp": "A groin protrusion above the inguinal ligament that bulges on Valsalva is an inguinal hernia. Femoral hernias lie below and lateral to the pubic tubercle.", "why": ["Femoral hernias appear below the inguinal ligament.", "A psoas abscess is a tender, non-reducible mass with infection signs.", "", "A lipoma does not bulge with raised pressure.", "Strangulation would be tender and irreducible, which is not described."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 335}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 42-year-old man is brought to the emergency department because of several episodes of black, tarlike stool and lightheadedness over the past couple of days. He underwent an appendectomy at the age of 16. He has hypertension and tension headaches. He drinks 4 beers daily. Current medications include amlodipine and naproxen. His temperature is 36.7°C (98°F), pulse is 100/min, and his blood pressure is 100/70 mm Hg. The lungs are clear to auscultation bilaterally. The abdomen is soft, nondistended, and nontender. The liver is palpated 3 cm below the right costal margin. His hemoglobin concentration is 10 g/dL. Intravenous fluid resuscitation is begun. An OGD is performed, which does not show bleeding. Which of the following is the most appropriate next step in management?", "opts": ["CT enterography", "Capsule en.doscopy", "Colonoscopy", "Laparotomy", "Angiography"], "ans": 2, "exp": "With melaena-free bleeding and a normal OGD, the source is likely lower GI, so colonoscopy is the next step.", "why": ["CT enterography is for suspected small bowel sources.", "Capsule endoscopy follows if both OGD and colonoscopy are negative.", "", "Laparotomy is for instability or failed localisation.", "Angiography needs active brisk bleeding and instability."], "refs": [["LITFL: gastrointestinal haemorrhage", "https://litfl.com/gastrointestinal-haemorrhage/"]], "note": "Main point checked against the linked source; fine detail also from your course explanation.", "src": "Linked sources", "id": 336}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 29-year-old woman comes to the physician for evaluation of a mass in the left breast that she ﬁrst noticed 2 weeks ago. During this period, the mass has not increased in size and the patient has had no pain. Three months ago, she hit her left chest against the closet door, which was painful for a day. Menses occurs at regular 28-day intervals and last for 5 days with moderate ﬂow. Her last menstrual period was 3 weeks ago. Physical examination shows dense breasts and a 2.5-cm well-deﬁned, rubbery, mobile mass that is non tender in the upper outer quadrant of the left breast. There is no axillary adenopathy. Which of the following is the most likely diagnosis?", "opts": ["Phyllodes tumor", "Intraductal papilloma", "Fibrocystic changes of the breast", "Fibroadenoma", "Paget disease of the breast"], "ans": 3, "exp": "A mobile, rubbery, painless, well-defined mass in a young woman is a fibroadenoma, the commonest benign breast tumour.", "why": ["Phyllodes tumours grow rapidly and are usually larger.", "Papilloma presents with nipple discharge.", "Fibrocystic change is cyclical and tender.", "", "Paget disease affects the nipple skin."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 337}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "An otherwise healthy 45-year-old woman comes to the physician because of a 2-week history of an itchy rash on her left nipple. The rash began as small vesicles on the nipple and spread to the areola. It has become a painful ulcer with yellow, watery discharge that is occasionally blood-tinged. She has asthma treated with theophylline and inhaled salbutamol. Her younger sister was diagnosed with endometrial cancer a year ago. Examination shows a weeping, ulcerated lesion involving the entire left nipple-areolar complex. There are no breast masses, dimpling, or axillary lymphadenopathy. The remainder of the examination shows no abnormalities. Which of the following is the most likely diagnosis?", "opts": ["Paget disease of the breast", "Breast fibroadenoma", "Mastitis", "Breast abscess", "Inflammatory breast cancer"], "ans": 0, "exp": "An itchy, scaly, erythematous nipple-areolar rash with no mass points to Paget disease of the breast, an underlying ductal carcinoma.", "why": ["", "Fibroadenoma is a discrete mass.", "Mastitis is painful and associated with lactation.", "An abscess is a painful fluctuant collection.", "Inflammatory cancer affects the breast skin diffusely, with oedema and peau d'orange."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 338}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 36-year-old woman comes to the physician because of a painless lump on her neck for 3 months that has increased in size. She appears healthy. Examination shows a 2.5-cm (1-in) firm, irregular swelling on the left side of the neck that moves with swallowing. There is painless cervical lymphadenopathy. Ultrasound of the neck shows a solitary left lobe thyroid mass with increased vascularity and hyperechogenic punctate regions. A fine needle aspiration biopsy is scheduled for the following week. Which of the following is the most likely diagnosis?", "opts": ["Follicular carcinoma", "Hürthle cell carcinoma of the thyroid", "Papillary carcinoma of the thyroid", "Medullary carcinoma of the thyroid", "Anaplastic carcinoma of the thyroid"], "ans": 2, "exp": "Papillary carcinoma is the commonest thyroid cancer (about 80%), typically in young to middle-aged adults presenting with a neck lump or cervical nodes.", "why": ["Follicular carcinoma spreads by blood and is less common.", "Hürthle cell carcinoma is a rarer variant.", "", "Medullary carcinoma arises from C cells and is linked to MEN2.", "Anaplastic carcinoma affects older patients and grows rapidly."], "refs": [["iatrox: thyroid nodules and cancer", "https://www.iatrox.com/academy/ukmla/thyroid-nodules-cancer"]], "note": "Main point checked against the linked source; fine detail also from your course explanation.", "src": "Linked sources", "id": 339}, {"group": "Surgery", "topic": "Urology", "stem": "A 25-year-old man comes to the physician because of right-sided painless scrotal swelling that he noticed yesterday while taking a shower. He is currently sexually active with two female partners and uses condoms inconsistently. He immigrated to the US from Argentina 2 years ago. His immunization records are unavailable. He has smoked one pack of cigarettes daily for the last 5 years. He is 170 cm (5 ft 7 in) tall and weighs 70 kg (154 lb); BMI is 24.2 kg/m2. He appears healthy and well nourished. His temperature is 37°C (98.6°F), pulse is 72/min, and blood pressure is 125/75 mm Hg. The lungs are clear to auscultation. Cardiac examination shows no abnormalities. The abdomen is soft with dull lower abdominal discomfort. Testicular examination shows a solid mass in the right testis that is firm and nontender. A light held behind the scrotum does not shine through. The mass is not reduced when the patient is in a supine position. The remainder of the physical examination shows no abnormalities. Which of the following is the most likely diagnosis in this patient?", "opts": ["Scrotal hernia", "Testicular tumor", "Testicular torsion", "Varicocele testis", "Spermatocele testis"], "ans": 1, "exp": "A firm painless testicular swelling that does not transilluminate is a testicular tumour until proven otherwise.", "why": ["A scrotal hernia reduces when lying and usually has bowel sounds.", "", "Torsion is acutely painful.", "Varicocele feels like a bag of worms and decompresses supine.", "A spermatocele transilluminates."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 340}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 62-year-old man comes to the physician because of a 5-month history of difficulty swallowing solids and liquids. He points to the middle of his sternum, saying “I feel like food is getting stuck there.” He has had a 4.5-kg (10-lb) weight loss over the past 2 months and reports that his symptoms have progressively worsened over the same period. He also reports intermittent heartburn that is worse after drinking coffee. Treatment with over-the-counter pantoprazole has been ineffective. He has not had fever, chills, or night sweats. He underwent a cholecystectomy for cholecystitis 10 years ago and partial bowel resection for complicated sigmoid diverticulitis 5 years ago. He has smoked one pack of cigarettes daily for 20 years. He is 170 cm (5 ft 7 in) tall and weighs 100 kg (220 lb); BMI is 34.6 kg/m2. His temperature is 36°C (96.8°F), pulse is 68/min, respirations are 18/min, and blood pressure is 150/85 mm Hg. Physical examination shows no abnormalities. Barium esophagram shows dilation of the proximal esophagus with stenosis of the gastroesophageal junction. There is contrast pooling in the lower esophagus. Which of the following is the most likely cause of this patient's symptoms?", "opts": ["Eosinophillic inflammation of the esophagus", "Fibrosis of esophageal smooth muscle", "Degeneration of esophageal myenteric plexus", "Premature contraction of the esophagus", "Outpouching of the upper esophageal wall"], "ans": 2, "exp": "Achalasia is caused by degeneration of the oesophageal myenteric plexus, giving failed LES relaxation and a dilated oesophagus with a 'bird's beak' narrowing.", "why": ["Eosinophilic oesophagitis gives rings and food impaction.", "Fibrosis of smooth muscle occurs in scleroderma.", "", "Premature contractions describe diffuse oesophageal spasm.", "An outpouching is a Zenker diverticulum."], "refs": [["GPnotebook: achalasia aetiology", "https://gpnotebook.com/pages/gastroenterology/achalasia/aetiology"]], "note": "Main point checked against the linked source; fine detail also from your course explanation.", "src": "Linked sources", "id": 341}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 45-year-old woman comes to the emergency department because of right upper abdominal pain and nausea that have become progressively worse since eating a large meal 8 hours ago. She has had intermittent pain similar to this before, but it has never lasted this long. She has a history of hypertension and type 2 diabetes mellitus. She does not smoke or drink alcohol. Current medications include metformin and enalapril. Her temperature is 38.5°C (101.3°F), pulse is 90/min, and blood pressure is 130/80 mm Hg. The abdomen is soft, and bowel sounds are normal. The patient has sudden inspiratory arrest during right upper quadrant palpation. Laboratory studies show a leukocyte count of 13,000/mm3. Serum alkaline phosphatase, total bilirubin, amylase, and aspartate aminotransferase levels are within the reference ranges. Imaging is most likely to show which of the following findings?", "opts": ["Enlargement of the pancreas with peripancreatic fluid", "Dilated common bile duct with intrahepatic biliary dilatation", "Fistula formation between the gallbladder and bowel", "Gallstone in the cystic duct", "Gas in the gallbladder wall"], "ans": 3, "exp": "Acute cholecystitis is usually caused by a gallstone obstructing the cystic duct, giving RUQ pain, fever and leucocytosis with normal LFTs.", "why": ["Pancreatic enlargement describes pancreatitis.", "A dilated bile duct implies common duct obstruction, with abnormal LFTs.", "A cholecystoenteric fistula causes gallstone ileus.", "", "Gas in the wall indicates emphysematous cholecystitis."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 342}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 65-year-old woman comes to the physician for the evaluation of sharp, stabbing pain in the lower back for 3 weeks. The pain radiates to the back of her right leg and is worse at night. She reports decreased sensation around her buttocks and inner thighs. During the last several days, she has had trouble urinating. Three years ago, she was diagnosed with breast cancer and was treated with lumpectomy and radiation. Her only medication is anastrozole. Her temperature is 37°C (98.6°F), pulse is 80/min, respirations are 12/min, and blood pressure is 130/70 mm Hg. Neurologic examination shows 4/5 strength in the left lower extremity and 2/5 strength in her right lower extremity. Knee and ankle reflexes are 1+ on the right. The resting anal sphincter tone is normal but the squeeze tone is reduced. Which of the following is the most likely diagnosis?", "opts": ["Central cord syndrome", "Anterior spinal cord syndrome", "Conus medullaris syndrome", "Brown-sequard syndrome", "Cauda-equina syndrome"], "ans": 4, "exp": "Back pain with asymmetric leg weakness, reduced reflexes, saddle numbness and reduced anal squeeze tone is cauda equina syndrome, a surgical emergency.", "why": ["Central cord syndrome mainly affects the arms.", "Anterior cord syndrome spares dorsal column sensation.", "Conus lesions are usually symmetrical with upper motor neuron signs.", "Brown-Séquard causes ipsilateral weakness and contralateral pain loss.", ""], "refs": [["iatrox: cauda equina syndrome", "https://www.iatrox.com/academy/ukmla/cauda-equina-syndrome"]], "note": "Main point checked against the linked source; fine detail also from your course explanation.", "src": "Linked sources", "id": 343}, {"group": "Surgery", "topic": "Urology", "stem": "A 33-year-old woman comes to the emergency department because of severe right ﬂank pain for 2 hours. The pain is colicky in nature and she describes it as 9 out of 10 in intensity. She has had 2 episodes of vomiting. She has no history of similar episodes in the past. She is 160 cm (5 ft 3 in) tall and weighs 104 kg (229 lb); BMI is 41 kg/m2. Her temperature is 37.3°C (99.1°F), pulse is 96/min, respirations are 16/min and blood pressure is 116/76 mm Hg. The abdomen is soft and there is mild tenderness to palpation in the right lower quadrant. Bowel sounds are reduced. The remainder of the examination shows no abnormalities. Her leukocyte count is 7,400/mm3. A low- dose CT scan of the abdomen and pelvis shows a round 12-mm stone in the distal right ureter. Urine dipstick is mildly positive for blood. Microscopic examination of the urine shows RBCs and no WBCs. 0.9% saline infusion is begun and intravenous ketorolac is administered. Which of the following is the most appropriate next step in management?", "opts": ["Ureterorenoscopic stone removal", "Extracorporeal shock wave lithotripsy", "Laparoscopic ureterolithotomy", "Observation", "Ureteral stenting"], "ans": 0, "exp": "A distal or mid-ureteric stone of 10 mm or larger is best treated by ureteroscopic removal, and this works regardless of body habitus.", "why": ["", "Shock wave lithotripsy is less effective in obesity and for larger stones.", "Laparoscopic ureterolithotomy is reserved for failure of other options.", "A stone this size is unlikely to pass.", "Stenting alone does not remove the stone."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 344}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 46-year-old woman comes to the physician for a routine health examination. She was last seen by a physician 3 years ago. She has been healthy aside from occasional mild ﬂank pain. Her only medication is a multivitamin. Her blood pressure is 154/90 mm Hg. Physical examination shows no abnormalities. Serum studies show: Sodium 141 mEq/L Potassium 3.7 mEq/L Calcium 11.3 mg/dL Phosphorus 2.3 mg/dL Urea nitrogen15 mg/dL Creatinine 0.9 mg/dL Albumin 3.6 g/dL Subsequent serum studies show a repeat calcium of 11.2 mg/dL, parathyroid hormone concentration of 890 pg/mL, and 25-hydroxyvitamin D of 48 ng/mL (N = 25–80). Her 24-hour urine calcium excretion is elevated. An abdominal ultrasound shows several small calculi in bilateral kidneys. Further testing shows normal bone mineral density. Which of the following is the most appropriate next step in management?", "opts": ["Begin hydrochlorothiazide therapy", "Begin cinacalcet therapy", "Order CT scan of the chest and abdomen", "Refer to surgery for parathyroidectomy", "Recommend low-calcium diet"], "ans": 3, "exp": "Primary hyperparathyroidism with complications such as kidney stones is treated by parathyroidectomy.", "why": ["Thiazides raise calcium and worsen hypercalcaemia.", "Cinacalcet is for those who cannot have surgery.", "Further imaging is for localisation before surgery, not the next step.", "", "A low-calcium diet does not treat the cause."], "refs": [["MDedge: primary hyperparathyroidism, when to operate", "https://www.mdedge.com/jfponline/article/178451/endocrinology/primary-hyperparathyroidism-labs-order-tx-consider/page/0/3"]], "note": "Main point checked against the linked source; fine detail also from your course explanation.", "src": "Linked sources", "id": 345}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 41-year-old woman comes to the physician because of bleeding from the nipple of her right breast for 3 months. There is no bleeding from the other breast. Menses occur at regular 30-day intervals and lasts for 5 days with moderate ﬂow. Her last menstrual period was 1 week ago. Her mother died of breast cancer at the age of 53 years. She does not smoke or drink alcohol. She appears healthy. Her temperature is 37°C (98.7°F), pulse is 76/min, and blood pressure is 118/70 mm Hg. Cardiopulmonary examination shows no abnormalities. The abdomen is soft and nontender. Breast examination shows bleeding of the right breast on application of pressure with no palpable mass. The left breast shows no abnormalities. There is no palpable axillary lymphadenopathy. Pelvic examination shows a normal vagina and cervix. Ultrasonography shows a dilated duct enclosing a well-deﬁned solitary mass. Which of the following is the most likely diagnosis?", "opts": ["Paget disease of the breast", "Intraductal papilloma", "Invasive ductal carcinoma", "Papillary carcinoma", "Phyllodes tumor"], "ans": 1, "exp": "A solitary intraductal papilloma typically causes unilateral bloody nipple discharge, with a dilated duct containing a mass on ultrasound.", "why": ["Paget disease affects the nipple skin.", "", "Invasive carcinoma would appear as an irregular mass.", "Papillary carcinoma is rarer and tends to occur in older patients.", "Phyllodes tumours are large, rapidly growing masses."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 346}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 56-year-old woman, gravida 3, para 3, comes to the physician because her left breast has become larger, hot, and itchy over the past 2 months. The patient felt a small lump in her left breast 1 year ago but did not seek medical attention at that time. She has hypertension and hyperlipidemia. Menarche was at the age of 11 years and menopause at the age of 46 years. Her mother died of breast cancer at the age of 45 years. The patient does not smoke or drink alcohol. Current medications include labetalol, simvastatin, and daily low-dose aspirin. She is 170 cm (5 ft 7 in) tall and weighs 78 kg (172 lb); BMI is 27 kg/m2. Her temperature is 37.7°C (99.9°F), pulse is 78/min, and blood pressure is 138/88 mm Hg. Examination shows large dense breasts. There is widespread erythema and edematous skin plaques over a breast mass in the left breast. The left breast is tender to touch and left-sided axillary lymphadenopathy is noted. Which of the following is the most likely diagnosis?", "opts": ["Inﬂammatory breast cancer", "Mastitis", "Breast abscess", "Breast ﬁbroadenoma", "Paget's disease of the breast"], "ans": 0, "exp": "A red, oedematous, tender breast with a mass and axillary nodes of short duration suggests inflammatory breast cancer.", "why": ["", "Mastitis occurs in breastfeeding women with fever and responds to antibiotics.", "An abscess is fluctuant.", "A fibroadenoma is a discrete, mobile mass.", "Paget disease is limited to the nipple-areola."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 347}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "57-year-old nulliparous woman comes to the physician 2 weeks after noticing a lump in her right breast. Her last mammogram was performed 4 years ago and showed no abnormalities. Menopause began 2 years ago, during which time the patient was prescribed hormone replacement therapy for severe hot ﬂashes and vaginal dryness. Vital signs are within normal limits. Examination of the right breast shows a ﬁrm, nontender mass close to the nipple. There are no changes in the skin or nipple, and there is no palpable axillary adenopathy. The abdomen is soft and nontender; there is no organomegaly. Mammography shows a suspicious 2-cm mass adjacent to the nipple. Which of the following is the most appropriate next step in management?", "opts": ["Fine needle aspiration", "Excisional biopsy", "Measurement of serum CA 15–3", "Mastectomy", "Core needle biopsy"], "ans": 4, "exp": "A suspicious palpable mass on mammography needs image-guided core needle biopsy to confirm cancer and give receptor status before treatment.", "why": ["FNA gives less tissue and no receptor status.", "Excisional biopsy comes later if needed.", "CA 15-3 is not diagnostic.", "Mastectomy needs histological confirmation first.", ""], "refs": [["iatrox: breast lump assessment", "https://www.iatrox.com/guidelines/breast-lump-referral"]], "note": "Main point checked against the linked source; fine detail also from your course explanation.", "src": "Linked sources", "id": 348}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 19-year-old man comes to the emergency department because of abdominal pain, nausea, and vomiting for 4 hours. Initially, the pain was dull and located diffusely around his umbilicus, but it has now become sharper and moved towards his lower right side. He has no history of serious illness and takes no medications. His temperature is 38.2°C (100.7°F) and blood pressure is 123/80 mm Hg. Physical examination shows severe right lower quadrant tenderness without rebound or guarding; bowel sounds are decreased. His hemoglobin concentration is 14.2 g/dL, leukocyte count is 12,000/mm3, and platelet count is 280,000/mm3. Abdominal ultrasonography shows a dilated noncompressible appendix with distinct wall layers and echogenic periappendiceal fat. Intravenous fluid resuscitation is begun. Which of the following is the most appropriate next step in management?", "opts": ["Prescribe oral amoxicillin and clavulanic acid", "Perform interval appendectomy", "Perform laparoscopic appendectomy", "Begin bowel rest and nasogastric aspiration", "Obtain CT scan of the abdomen"], "ans": 2, "exp": "Confirmed acute appendicitis on ultrasound is treated with appendicectomy, usually laparoscopic.", "why": ["Oral antibiotics alone are not the standard for suspected complicated disease.", "Interval appendicectomy follows an abscess treated conservatively.", "", "Bowel rest does not treat appendicitis.", "CT is unnecessary when ultrasound is diagnostic."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 349}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 66-year-old man comes to the physician because of yellowish discoloration of his eyes and skin, abdominal discomfort, and generalized fatigue for the past 2 weeks. He has had dark urine and pale stools during this period. He has had a 10-kg (22-lb) weight loss since his last visit 6 months ago. He has hypertension. He has smoked one pack of cigarettes daily for 34 years. He drinks three to four beers over the weekends. His only medication is amlodipine. His temperature is 37.3°C (99.1°F), pulse is 89/min, respirations are 14/min, and blood pressure is 114/74 mm Hg. Examination shows jaundice of the sclera and skin and excoriation marks on his trunk and extremities. The lungs are clear to auscultation. The abdomen is soft and nontender. The remainder of the examination shows no abnormalities. Laboratory studies show: Hemoglobin 12 g/dL Leukocyte count 5,000/mm3 Platelet count 400,000/mm3 Serum Urea nitrogen 28 mg/dL Creatinine 1.2 mg/dL Bilirubin Total 7.0 mg/dL Direct 5.5 mg/dL Alkaline phosphatase 615 U/L Aspartate aminotransferase (AST, GOT)170 U/L Alanine aminotransferase (ALT, GPT) 310 U/L γ-Glutamyltransferase (GGT) 592 U/L (N = 5–50 U/L) An ultrasound shows extrahepatic biliary dilation. A CT scan of the abdomen shows a 2.5-cm (1-in) mass in the head of the pancreas with no abdominal lymphadenopathy. The patient undergoes biliary stenting. Which of the following is the most appropriate next step in the management of this patient?", "opts": ["Complete duodenopancreatectomy with splenectomy", "Stereotactic radiation therapy", "Duodenum-preserving pancreatic head resection", "Gastroenterostomy", "Pancreaticoduodenectomy"], "ans": 4, "exp": "Resectable pancreatic head cancer is treated by pancreaticoduodenectomy (Whipple), which offers the only chance of cure.", "why": ["Total duodenopancreatectomy is more extensive than needed.", "Stereotactic radiotherapy is not curative alone.", "Duodenum-preserving resection is for benign disease.", "Gastroenterostomy is a palliative bypass.", ""], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 350}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 38-year-old woman is brought to the emergency department because of three 1-hour episodes of severe, sharp, penetrating abdominal pain in the right upper quadrant. During these episodes, she has had nausea and vomiting. She has no diarrhea, dysuria, or hematuria and is asymptomatic between episodes. She has hypertension and hyperlipidemia. Seven years ago, she underwent resection of the terminal ileum because of severe Crohn's disease. She is 155 cm (5 ft 2 in) tall and weighs 79 kg (175 lb); BMI is 32 kg/m2. Her temperature is 36.9°C (98.5°F), pulse is 80/min, and blood pressure is 130/95 mm Hg. There is mild scleral icterus. Cardiopulmonary examination shows no abnormalities. The abdomen is soft, and there is tenderness to palpation of the right upper quadrant without guarding or rebound. Bowel sounds are normal. The stool is brown, and test for occult blood is negative. Laboratory studies show: Hemoglobin 12.5 g/dL Leukocyte count 9,500 mm3 Platelet count 170,000 mm3 Serum Total bilirubin 4.1 mg/dL Alkaline phosphatase348 U/L AST 187 U/L ALT 260 U/L Abdominal ultrasonography shows a normal liver, a common bile duct caliber of 10 mm (normal < 6 mm) and a gallbladder with multiple gallstones and no wall thickening or pericholecystic fluid. Which of the following is the most likely cause of these findings?", "opts": ["Cholecystitis", "Choledocholithiasis", "Cholangitis", "Primary biliary cholangitis", "Primary sclerosing cholangitis"], "ans": 1, "exp": "Gallstones with a dilated common bile duct (10 mm) and no signs of inflammation indicate choledocholithiasis.", "why": ["Cholecystitis shows wall thickening and fluid around the gallbladder.", "", "Cholangitis would have fever and sepsis.", "PBC does not dilate ducts.", "PSC shows a beaded biliary tree."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 351}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "Fourteen days after a laparoscopic cholecystectomy for cholelithiasis, a 45-year-old woman comes to the emergency department because of persistent episodic epigastric pain for 3 days. The pain radiates to her back, occurs randomly throughout the day, and is associated with nausea and vomiting. Each episode lasts 30 minutes to one hour. Antacids do not improve her symptoms. She has hypertension and fibromyalgia. She has smoked 1–2 packs of cigarettes daily for the past 10 years and drinks 4 cans of beer every week. She takes lisinopril and pregabalin. She appears uncomfortable. Her temperature is 37°C (98.6° F), pulse is 84/min, respirations are 14/min, and blood pressure is 127/85 mm Hg. Abdominal examination shows tenderness to palpation in the upper quadrants without rebound or guarding. Bowel sounds are normal. The incisions are clean, dry, and intact. Serum studies show: AST 80 U/L ALT 95 U/L Alkaline phosphatase213 U/L Bilirubin, total 1.3 mg/dL Direct 0.7 mg/dL Amylase 52 U/L Abdominal ultrasonography shows dilation of the common bile duct and no gallstones. Which of the following is the most appropriate next step in management?", "opts": ["Proton pump inhibitor therapy", "Counseling on alcohol cessation", "Reassurance and follow-up in 4 weeks", "ERCP", "CT scan of the abdomen"], "ans": 3, "exp": "After cholecystectomy, a dilated bile duct with a cholestatic picture suggests a retained duct stone or sphincter dysfunction; ERCP can both diagnose and treat.", "why": ["PPI therapy does not address biliary obstruction.", "Alcohol counselling is not relevant.", "Watching and waiting risks cholangitis.", "", "CT adds little over ultrasound."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 352}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 63-year-old man is brought to the emergency department after having 8–9 episodes of red watery stool. He has no abdominal pain or fever. He underwent an angioplasty 4 years ago and received 2 stents in his left main coronary artery. He has hypertension, hypercholesterolemia, coronary artery disease, and chronic constipation. Current medications include aspirin, metoprolol, and simvastatin. He drinks one beer daily. He is in distress. His temperature is 37.3°C (99.1°F), pulse is 110/min, respirations are 14/min, and blood pressure is 86/58 mm Hg. Examination shows pale conjunctivae. The abdomen is soft and nontender. Bowel sounds are increased. The lungs are clear to auscultation. Cardiac examination shows an S4 gallop. Rectal examination shows frank blood. Laboratory studies show: Hemoglobin 9.8 g/dL Leukocyte count 7,800/mm3 Platelet count 280,000/mm3 Prothrombin time14 seconds (INR=0.9) Serum Na+ 135 mEq/L K+ 4.1 mEq/L - Cl 101 mEq/L Urea nitrogen 16 mg/dL Glucose 96 mg/dL Creatinine 0.7 mg/dL Two large bore intravenous catheters are inserted and 0.9% saline infusions are administered. A nasogastric tube is inserted. Aspiration shows clear gastric content containing bile. Directly afterwards, his pulse is 133/min and blood pressure is 80/54 mm Hg. Which of the following is the most appropriate next step in management?", "opts": ["OGD", "Colonoscopy", "Radionuclide scanning", "Angiography", "Laparotomy"], "ans": 3, "exp": "Persistent lower GI bleeding with haemodynamic instability despite resuscitation needs angiography, which localises the bleed and allows embolisation.", "why": ["OGD was used to exclude an upper source and was negative or already done.", "Colonoscopy needs a stable, prepared patient.", "Radionuclide scanning is slow and unsuitable when unstable.", "", "Laparotomy comes after other options fail."], "refs": [["LITFL: gastrointestinal haemorrhage", "https://litfl.com/gastrointestinal-haemorrhage/"]], "note": "Main point checked against the linked source; fine detail also from your course explanation.", "src": "Linked sources", "id": 353}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 36-year-old woman is brought to the emergency department after the sudden onset of severe, generalized abdominal pain. The pain is constant and she describes it as 9 out of 10 in intensity. She has hypertension, hyperlipidemia, and chronic lower back pain. Menses occur at regular 28-day intervals with moderate flow and last 4 days. Her last menstrual period was 2 weeks ago. She is sexually active with one male partner and uses condoms inconsistently. She has smoked one pack of cigarettes daily for 15 years and drinks 2–3 beers on the weekends. Current medications include ranitidine, hydrochlorothiazide, atorvastatin, and ibuprofen. The patient appears ill and does not want to move. Her temperature is 38.4°C (101.1°F), pulse is 125/min, respirations are 30/min, and blood pressure is 85/40 mm Hg. Examination shows a distended, tympanic abdomen with diffuse tenderness, guarding, and rebound; bowel sounds are absent. Her leukocyte count is 14,000/mm3 and hematocrit is 32%. Which of the following is the most likely cause of this patient's pain?", "opts": ["Ruptured ectopic pregnancy", "Pancreatitis", "Acute mesenteric ischemia", "Perforation", "Bowel obstruction"], "ans": 3, "exp": "Sudden severe generalised pain with peritonism and absent bowel sounds points to a perforated viscus, often a duodenal ulcer.", "why": ["A ruptured ectopic gives a positive pregnancy test and pelvic pain.", "Pancreatitis does not cause rigid peritonitis.", "Mesenteric ischaemia causes pain out of proportion to the signs.", "", "Obstruction causes colicky pain with distension and vomiting."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 354}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 63-year-old man comes to the emergency department because of a 2-day history of persistent vomiting after meals. The vomit consists of undigested food and a clear fluid. His last attempt to eat was 6 hours ago and his last bowel movement was 3 days ago. For the past 3 weeks, the patient has had worsening nausea and early satiety. He also reports a 6.8-kg (15-lb) weight loss over the past 4 months. He has hypercholesterolemia treated with atorvastatin. The patient drinks 2–3 glasses of wine daily. He appears thin. His temperature is 37.2°C (99.0°F), pulse is 80/min and blood pressure is 120/65 mm Hg. Examination shows dry oral mucosa and conjunctival pallor. Abdominal examination shows epigastric fullness with mild tenderness. A sloshing sound is heard upon auscultation of the epigastrium when rocking the patient back and forth. Which of the following is most likely to confirm the diagnosis?", "opts": ["Fecal elastase measurement", "Abdominal ultrasound", "CT angiography", "Upper endoscopy", "Esophageal manometry"], "ans": 3, "exp": "Persistent vomiting with a succussion splash suggests gastric outlet obstruction; endoscopy confirms it and allows biopsy if malignant.", "why": ["Faecal elastase tests exocrine pancreatic function.", "Ultrasound is not diagnostic for outlet obstruction.", "CT angiography assesses vessels.", "", "Manometry assesses oesophageal motility."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 355}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 30-year-old woman comes to the physician because of a swelling on her neck for 5 months. It has gradually enlarged in size and is mildly painful. She has also had intermittent episodes of throbbing headache, sweating, and palpitations over the past 3 months. Menses occur at regular 28-day intervals and last for 4–5 days. She does not smoke, occasionally consumes alcohol on weekends. She appears thin and pale. Her temperature is 38.7°C (101.7°F), pulse is 112/min, and blood pressure is 140/90 mm Hg. Examination shows a firm, 3-cm swelling on the neck that moves with swallowing; there is no lymphadenopathy. Cardiopulmonary examination shows no abnormalities. Laboratory studies show: Hemoglobin 13 g/dL 3 Leukocyte count9500/mm3 Platelet count 230,000/mm3 Serum Na+ 136 mEq/L K+ 3.5 mEq/L - Cl 104 mEq/L TSH 2.3 μU/mL Calcitonin 300 ng/dL (Normal < 5 ng/dL) An electrocardiogram shows sinus tachycardia. Which of the following laboratory abnormalities is most likely to be seen?", "opts": ["Increased serum cortisol", "Increased serum T3 levels", "Increased serum gastrin", "Increased plasma metanephrines", "Increased urinary 5-HIAA"], "ans": 3, "exp": "A neck mass with markedly raised calcitonin means medullary thyroid carcinoma, which is linked to MEN2 and phaeochromocytoma. Plasma free metanephrines are the most sensitive test for phaeochromocytoma and must be checked before any thyroid surgery.", "why": ["Raised cortisol points to Cushing syndrome, which is not part of MEN2.", "TSH is normal, so T3 is not raised.", "Raised gastrin points to a gastrinoma (MEN1).", "", "Urinary 5-HIAA is for carcinoid syndrome."], "refs": [["iatrox: phaeochromocytoma", "https://www.iatrox.com/academy/ukmla/phaeochromocytoma"], ["iatrox: thyroid nodules and cancer", "https://www.iatrox.com/academy/ukmla/thyroid-nodules-cancer"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 356}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 56-year-old man is brought to the emergency department for the evaluation of a 3-day history of left lower abdominal pain. During this period, the patient has also had a low-grade fever and has not had a bowel movement. He has a history of constipation. He underwent a cholecystectomy at the age of 53 years. He has smoked one pack of cigarettes daily for the last 30 years. His temperature is 38.8°C (101.8°F), pulse is 80/min, respirations are 18/min, and blood pressure is 130/84 mm Hg. Cardiopulmonary examination shows no abnormalities. Abdominal examination shows left lower quadrant tenderness with no guarding or rebound. There is no edema of his lower extremities. CT of the abdomen with contrast shows segmental wall thickening of the descending colon with multiple diverticula, surrounding fat stranding, and a 5.5-cm, low-attenuating pelvic fluid collection. Intravenous fluids and bowel rest are started. Treatment with intravenous morphine, ciprofloxacin, and metronidazole is begun. Which of the following is the most appropriate next step in the management of this patient?", "opts": ["CT-guided percutaneous abscess drainage", "Left laparoscopic hemicolectomy", "Colonoscopy", "Exploratory laparotomy", "Observation and serial CT scans"], "ans": 0, "exp": "Diverticulitis with a large abscess (over 3 cm) and no peritonitis is treated with IV antibiotics plus percutaneous drainage if anatomically feasible; surgery is for peritonitis or failed drainage.", "why": ["", "Emergency resection is for generalised peritonitis, which this man does not have.", "Colonoscopy in acute diverticulitis risks perforation and is delayed until inflammation settles.", "Laparotomy is not needed without peritonitis.", "Observation alone is not enough for a 5.5 cm abscess."], "refs": [["NICE NG147: diverticular disease", "https://www.nice.org.uk/guidance/NG147/chapter/recommendations"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 357}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 44-year-old woman comes to the physician for the evaluation of a 1- month history of fatigue and difﬁculty swallowing. During this period, she has also had dry skin, thinning hair, and rounding of her face. She has type 1 diabetes mellitus and rheumatoid arthritis. Her father had a thyroidectomy for papillary thyroid cancer. The patient had smoked one pack of cigarettes daily for 20 years but quit 3 years ago. She drinks 2–3 glasses of wine daily. Her current medications include insulin, omeprazole, and daily ibuprofen. She appears well. Her temperature is 36.3°C (97.3°F), pulse is 62/min, and blood pressure is 102/76 mm Hg. Examination of the neck shows a painless, diffusely enlarged thyroid gland. Cardiopulmonary examination shows no abnormalities. Further evaluation is most likely to show which of the following?", "opts": ["Positive thyroid peroxidase antibodies and thyroglobulin antibodies in serum", "Spindle cells, pleomorphic giant cells, and mitotic ﬁgures on thyroid biopsy", "Large irregular nuclei, nuclear grooves, and Psammoma bodies on thyroid biopsy", "Diffusely increased uptake on a radioactive iodine scan", "Positive TSH receptor antibodies and thyroglobulin antibodies in serum"], "ans": 0, "exp": "Fatigue with a painless, diffusely enlarged thyroid suggests Hashimoto thyroiditis. Anti-TPO antibodies are present in about 95% and anti-thyroglobulin antibodies in 60-80%.", "why": ["", "Spindle cells and giant cells describe anaplastic carcinoma.", "Psammoma bodies and grooved nuclei describe papillary carcinoma, which presents as a nodule.", "Diffusely raised iodine uptake is seen in Graves disease.", "TSH receptor antibodies are the marker of Graves disease."], "refs": [["AAFP: Hashimoto thyroiditis", "https://www.aafp.org/pubs/afp/issues/2021/1200/p609.pdf"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 358}, {"group": "Surgery", "topic": "Colorectal", "stem": "32-year-old man comes to the emergency department because of recurrent episodes of vomiting for 1 day. He has had over 15 episodes of bilious vomiting. During this period he has had cramping abdominal pain but has not had a bowel movement or passed flatus. He does not have fever or diarrhea. He was diagnosed with Crohn disease at the age of 28 years which has been well controlled with oral mesalamine. He underwent a partial small bowel resection for midgut volvulus at birth. His other medications include vitamin B12, folic acid, loperamide, ferrous sulfate, and vitamin D3. He appears uncomfortable and his lips are parched. His temperature is 37.1°C (99.3°F), pulse is 103/min, and blood pressure is 104/70 mm Hg. The abdomen is distended, tympanitic, and tender to palpation over the periumbilical area and the right lower quadrant. Rectal examination is unremarkable. A CT scan of the abdomen shows multiple dilated loops of small bowel with a transition zone in the mid to distal ileum. After 24 hours of conservative management with IV fluid resuscitation, nasogastric bowel decompression, promethazine, and analgesia, his condition does not improve and a laparotomy is scheduled. During the laparotomy, two discrete strictures are noted in the mid-ileum, around 20 cm apart. Which of the following is the most appropriate next step in management?", "opts": ["Small bowel resection and primary anastomosis", "Small bowel resection with ileostomy", "Strictureplasty of individual strictures", "Ileocolectomy", "Abdominal closure and start palliative care"], "ans": 2, "exp": "In Crohn disease with a few discrete fibrotic strictures, strictureplasty preserves bowel length, which matters because repeated resections risk short bowel syndrome. It is suitable when there is no phlegmon, fistula or sepsis.", "why": ["Resection removes bowel unnecessarily when strictureplasty is possible.", "A stoma is not required without perforation or sepsis.", "", "Ileocolectomy is overly aggressive for two mid-ileal strictures.", "This is treatable, so palliative care is not appropriate."], "refs": [["StatPearls: Crohn stricturoplasty", "https://statpearls.com/ArticleLibrary/viewarticle/540"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 359}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 64-year-old woman has progressively worsening abdominal pain 5 hours after an open valve replacement with cardiopulmonary bypass. The pain is crampy and associated with an urge to defecate. The patient reports having had 2 bloody bowel movements in the last hour. Her operation was complicated by significant intraoperative blood loss, which prolonged the operation and necessitated 2 transfusions of red blood cells. She has hypercholesterolemia and type 2 diabetes mellitus. The patient received prophylactic perioperative antibiotics and opioid pain management during recovery. Her temperature is 37.9°C (98.9°F), pulse is 95/min, and blood pressure is 115/69 mm Hg. Examination shows a soft abdomen with mild tenderness to palpation in the left quadrants but no rebound tenderness or guarding. Bowel sounds are decreased. Rectal examination shows blood on the examining finger. Which of the following is the most likely underlying cause of this patient's symptoms?", "opts": ["Small outpouchings in the sigmoid wall", "Infection with Clostridioides difficile", "Decreased blood flow to the splenic flexure", "Embolization of superior mesenteric artery", "Atherosclerotic narrowing of the intestinal vessels"], "ans": 2, "exp": "Ischaemia usually affects watershed areas such as the splenic flexure, and low-flow states (here around cardiac surgery) are a typical trigger. It presents with abdominal pain and rectal bleeding.", "why": ["Diverticula bleed painlessly and do not cause ischaemic pain.", "C. difficile would cause diarrhoea after antibiotics.", "", "An SMA embolus causes small bowel ischaemia with pain out of proportion to the signs.", "Chronic atherosclerotic narrowing causes postprandial pain over weeks, not acute pain after surgery."], "refs": [["MDedge: clinical approach to colonic ischaemia", "https://mdedge.com/content/clinical-approach-colonic-ischemia"]], "note": "Source confirms watershed areas and common hypotensive causes; it does not mention cardiac surgery specifically.", "src": "Linked sources", "id": 360}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 36-year-old woman comes to the physician for a follow-up visit after she had a PET scan that showed a nodule on the thyroid gland. She has no difﬁculty or pain while swallowing. She was treated for non-Hodgkin lymphoma at the age of 28 years, which included external beam radiation to the head and neck and 4 cycles of chemotherapy. She appears healthy. Vital signs are within normal limits. Physical examination shows no abnormalities. Serum studies show: Glucose 82 mg/dL Creatinine 0.7 mg/dL Thyroid-stimulating hormone 3 μU/mL Ultrasound of the neck shows a 1.2-cm (0.5-in) nodule on the left lobe of the thyroid with irregular margins and microcalciﬁcations. A ﬁne-needle aspiration biopsy shows Psammoma bodies and cells with clear, ground-glass, empty nuclei. Which of the following is the most appropriate next step in management?", "opts": ["Radioiodine therapy", "Observation and follow-up in 3 months", "Thyroid scintigraphy", "Surgical excision of the nodule", "Total thyroidectomy"], "ans": 4, "exp": "Fine-needle aspiration showing psammoma bodies and ground-glass nuclei confirms papillary thyroid carcinoma, treated usually with total thyroidectomy.", "why": ["Radioiodine follows surgery as adjuvant treatment, not before.", "Waiting is wrong for a confirmed cancer.", "Scintigraphy is not needed once cytology is diagnostic.", "Excising only the nodule is inadequate treatment for papillary carcinoma.", ""], "refs": [["iatrox: thyroid nodules and cancer", "https://www.iatrox.com/academy/ukmla/thyroid-nodules-cancer"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 361}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 30-year-old man presents with recurrent painful oral ulcers and genital sores. He also reports intermittent joint pain and blurred vision. Examination shows erythema nodosum and a pustular lesion at a venepuncture site. What is the most likely diagnosis?", "opts": ["Systemic lupus erythematosus", "Reactive arthritis", "Behçet disease", "Crohn disease", "Herpes simplex infection"], "ans": 2, "exp": "Behçet disease is a relapsing vasculitis in which recurrent oral and genital ulcers appear with uveitis, erythema nodosum and often a positive pathergy reaction (a pustule after a needle prick). The arthritis is usually mild.", "why": ["SLE has painless oral ulcers, a malar rash and positive ANA/dsDNA, and no pathergy.", "Reactive arthritis gives urethritis, conjunctivitis and arthritis after an infection; genital ulcers are painless balanitis.", "", "Crohn disease can cause oral ulcers and erythema nodosum but not genital ulcers with uveitis and pathergy.", "Herpes simplex ulcers are self-limited and do not explain uveitis, joint pain or pathergy."], "refs": [["MSD Manual: Behçet disease", "https://www.merckmanuals.com/professional/musculoskeletal-and-connective-tissue-disorders/vasculitis/behçet-disease"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 362}, {"group": "Medicine", "topic": "Neurology", "stem": "An 83-year-old man is admitted with acute confusion and agitation. He is pulling at monitoring equipment and is at risk of harming himself. Non-pharmacological de-escalation has been unsuccessful, and there is no evidence of infection or intracranial pathology. What is the most appropriate next step?", "opts": ["IM benzodiazepine", "IM antipsychotic medication", "Physical restraints alone", "Immediate CT brain", "Start antidepressant therapy"], "ans": 1, "exp": "Delirium is managed with non-drug measures first. If the patient is distressed or a risk to themselves and de-escalation fails, short-term low-dose haloperidol (usually a week or less) may be used. Restraints should be avoided.", "why": ["Benzodiazepines can worsen confusion in older people and are generally avoided, except in alcohol withdrawal.", "", "Restraints alone are discouraged because they increase agitation and risk.", "The question rules out intracranial pathology, so CT would not help the agitation.", "Antidepressants have no role in acute delirium."], "refs": [["GPnotebook: delirium management", "https://gpnotebook.com/pages/psychiatry/delirium/management"]], "note": "The source supports non-drug measures first and short-term haloperidol if de-escalation fails; it does not discuss benzodiazepines, so that reason is standard teaching.", "src": "Linked sources", "id": 363}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 15-year-old patient with cystic fibrosis presents with a productive cough and fever. Chest X-ray shows peribronchial infiltrates and cavitation in the upper lobes. He has poor adherence to routine follow-up. Which is the most appropriate investigation to identify the likely pathogen?", "opts": ["Sputum culture for bacteria and fungi", "Blood cultures", "CT pulmonary angiography", "Galactomannan assay alone", "Nasopharyngeal swab for viruses"], "ans": 0, "exp": "In a CF exacerbation, a sputum culture (requested as a CF culture) identifies the organism so antibiotics can be tailored. Common organisms are Pseudomonas, MSSA and MRSA, and fungi are looked for in cavitating disease.", "why": ["", "Blood cultures are rarely positive in CF lung infection.", "CTPA looks for pulmonary embolism, not the pathogen.", "Galactomannan alone covers only Aspergillus and misses bacteria.", "Viral swabs miss the bacterial pathogens that drive CF exacerbations."], "refs": [["VIMbook: CF exacerbation", "https://www.vim-book.org/pulmonary/pulmonary-cf-exacerbation/"]], "note": "Source confirms sputum CF culture and common organisms; fungal testing in cavitation is from your course key.", "src": "Linked sources", "id": 364}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 12-year-old child presents with an itchy, erythematous rash behind the knees present for several months and unresponsive to over-the-counter topical corticosteroids. Examination shows lichenified plaques with excoriations and no systemic symptoms. What is the most appropriate next step?", "opts": ["Oral antibiotics", "Topical calcineurin inhibitor", "Oral corticosteroids", "Antifungal cream", "Phototherapy"], "ans": 1, "exp": "This is atopic eczema not controlled by topical steroids. Topical calcineurin inhibitors are an anti-inflammatory alternative. Phototherapy and systemic drugs are for more severe disease under specialist care.", "why": ["There is no sign of infection, so antibiotics would not help.", "", "Routine oral steroids are not recommended for chronic atopic dermatitis.", "This is not a fungal rash.", "Phototherapy comes after optimised topical therapy fails."], "refs": [["iatrox: eczema guidance (AAD-based)", "https://www.iatrox.com/guidelines/eczema"]], "note": "The source supports calcineurin inhibitors and that routine oral steroids should be avoided. It doesn't give age limits or UK specialist-start rules, so check those locally.", "src": "Linked sources", "id": 365}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 60-year-old woman presents with pain and swelling in the small joints of her hands. Examination reveals ulnar deviation of the fingers and synovial thickening, and she reports morning stiffness lasting over an hour. What is the most likely diagnosis?", "opts": ["Osteoarthritis", "Rheumatoid arthritis", "Gout", "Psoriatic arthritis", "Systemic lupus erythematosus"], "ans": 1, "exp": "Rheumatoid arthritis causes symmetrical synovitis of the small joints with morning stiffness over 30 minutes (often over an hour) and later ulnar deviation. The DIP joints are spared.", "why": ["OA gives brief morning stiffness (under 30 minutes) and DIP involvement.", "", "Gout is acute and monoarticular.", "Psoriatic arthritis often involves the DIP joints and nails and is linked to psoriasis.", "SLE arthritis is non-erosive and comes with a rash and other systemic features."], "refs": [["iatrox: rheumatoid arthritis", "https://www.iatrox.com/academy/ukmla/rheumatoid-arthritis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 366}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 52-year-old current smoker with alpha-1 antitrypsin deficiency has early emphysema on imaging and asks about long-term management. What is the most important lifestyle recommendation?", "opts": ["Begin inhaled corticosteroids", "Start a long-acting beta-agonist", "Stop smoking", "Begin augmentation therapy immediately", "Begin prophylactic antibiotics"], "ans": 2, "exp": "Care follows standard COPD management, beginning with smoking cessation. Augmentation therapy is reserved for established airflow obstruction, with the strongest evidence in moderate obstruction.", "why": ["Inhaled steroids are not first-line and do not slow progression.", "A LABA treats symptoms and is a drug, not a lifestyle step.", "", "Augmentation is for established airflow obstruction, not for early emphysema alone.", "Prophylactic antibiotics have no role here."], "refs": [["MDedge/CCJM: alpha-1 antitrypsin deficiency", "https://www.mdedge.com/ccjm/article/109842/hepatology/alpha-1-antitrypsin-deficiency-underrecognized-treatable-cause-copd/page/0/1"]], "note": "The source lists smoking cessation first but doesn't call it the most important; that emphasis is standard teaching.", "src": "Linked sources", "id": 367}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 67-year-old man presents with progressive dyspnoea and dry cough. HRCT shows diffuse interstitial fibrosis, and pulmonary function tests show restrictive disease. Which spirometry finding is typical?", "opts": ["Reduced FEV1 with normal FVC", "Reduced FVC and DLCO with normal FEV1/FVC ratio", "Normal spirometry", "Reduced FEV1/FVC ratio", "Obstructive pattern with hyperinflation"], "ans": 1, "exp": "Pulmonary fibrosis causes a restrictive pattern: FVC is reduced, DLCO falls, and the FEV1/FVC ratio is preserved or raised.", "why": ["Reduced FEV1 with normal FVC is not a recognised pattern.", "", "Spirometry is abnormal in established fibrosis.", "A reduced ratio means airflow obstruction (COPD, asthma).", "Hyperinflation is seen in emphysema, not fibrosis."], "refs": [["MDedge/CCJM: idiopathic pulmonary fibrosis", "https://www.mdedge.com/ccjm/article/164223/pulmonology/idiopathic-pulmonary-fibrosis-what-primary-care-physicians-need-know/page/0/1"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 368}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 58-year-old woman with a history of autoimmune disease presents with fatigue, cold intolerance and constipation. Tests show low free T4 and raised TSH. Which test would be most useful to determine the cause of her hypothyroidism?", "opts": ["Anti-thyroglobulin antibodies", "Cortisol level", "TSH receptor antibodies", "Radioactive iodine uptake scan", "Serum ferritin"], "ans": 0, "exp": "Primary hypothyroidism with other autoimmune disease is most likely Hashimoto thyroiditis. Thyroid peroxidase antibodies are found in about 95% and thyroglobulin antibodies in 60-80%.", "why": ["", "Cortisol assesses adrenal function.", "TSH receptor antibodies are the marker of Graves disease.", "An iodine uptake scan is for hyperthyroidism.", "Ferritin is not used to find the cause of hypothyroidism."], "refs": [["AAFP: Hashimoto thyroiditis", "https://www.aafp.org/pubs/afp/issues/2021/1200/p609.pdf"]], "note": "Source gives TPO and thyroglobulin antibody rates; the answer here is thyroglobulin antibodies, though TPO antibodies are the more sensitive test.", "src": "Linked sources", "id": 369}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 45-year-old smoker has just completed H. pylori eradication therapy and asks how to prevent further complications, including gastric cancer. What is the most appropriate recommendation?", "opts": ["Stop smoking", "Start lifelong proton pump inhibitor", "Schedule annual endoscopy", "Continue triple therapy for 2 more years", "PRN antacids for life"], "ans": 0, "exp": "Smoking raises gastric cancer risk and the risk falls after quitting. Eradicating H. pylori has already lowered risk.", "why": ["", "Lifelong PPI is not needed after successful eradication.", "Routine annual endoscopy is not recommended for a person without risk markers.", "Prolonged antibiotics add harm without benefit.", "Antacids treat symptoms, not cancer risk."], "refs": [["NCI PDQ: stomach cancer prevention", "https://www.cancer.gov/types/stomach/hp/stomach-prevention-pdq"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 370}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 65-year-old man with cirrhosis presents with fever, abdominal pain, worsening ascites, mild hypotension and confusion. Bloods show leukocytosis and raised CRP. Paracentesis is performed. What is the most likely diagnosis?", "opts": ["Spontaneous bacterial peritonitis", "Hepatorenal syndrome", "Secondary peritonitis", "Viral hepatitis", "Cholecystitis"], "ans": 0, "exp": "Fever, abdominal pain and worsening ascites in cirrhosis suggest SBP. An ascitic neutrophil count of 250/mm³ or more confirms it, and prompt antibiotics are started.", "why": ["", "Hepatorenal syndrome presents with falling urine output and rising creatinine, not fever.", "Secondary peritonitis follows a perforated viscus and shows polymicrobial fluid with high protein.", "Viral hepatitis does not cause fever with ascites infection.", "Cholecystitis gives RUQ pain and a positive Murphy sign."], "refs": [["AMBOSS: spontaneous bacterial peritonitis", "https://www.amboss.com/us/knowledge/spontaneous-bacterial-peritonitis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 371}, {"group": "Medicine", "topic": "Haematology", "stem": "A 58-year-old man with untreated hereditary haemochromatosis presents with fatigue and joint pain. Ferritin and transferrin saturation are markedly raised. Which is the preferred treatment to reduce iron overload?", "opts": ["Oral chelation therapy", "Phlebotomy (venesection)", "Deferasirox", "Blood transfusion", "Iron restriction only"], "ans": 1, "exp": "Venesection is the first-line treatment for haemochromatosis and gives a survival benefit when started before cirrhosis.", "why": ["Chelation is a second-line option when venesection is not possible.", "", "Deferasirox is an oral chelator, a second-line drug.", "Transfusion would add iron.", "Diet alone cannot remove the iron already stored."], "refs": [["BSG/BASL: venesection in haemochromatosis", "https://www.bsg.org.uk/clinical-resource/venesection-treatment-in-haemochromatosis"]], "note": "Source confirms venesection as main treatment; chelation as second-line is standard teaching.", "src": "Linked sources", "id": 372}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 36-year-old man with ulcerative colitis is asymptomatic but has persistently raised liver enzymes. Imaging shows features suggestive of chronic cholestasis. Which condition is he most likely developing?", "opts": ["Primary biliary cholangitis", "Primary sclerosing cholangitis", "Autoimmune hepatitis", "Drug-induced liver injury", "Non-alcoholic fatty liver disease"], "ans": 1, "exp": "PSC is strongly linked to ulcerative colitis. It gives a raised alkaline phosphatase, beaded and strictured bile ducts on MRCP, and a risk of cholangiocarcinoma.", "why": ["PBC affects middle-aged women, with positive anti-mitochondrial antibodies.", "", "Autoimmune hepatitis is hepatocellular, with high transaminases and autoantibodies.", "No drug is described.", "NAFLD is not cholestatic."], "refs": [["CCJM: primary sclerosing cholangitis", "https://www.ccjm.org/content/78/5/306.full.pdf"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 373}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 62-year-old man with known oesophageal varices presents with coffee-ground vomiting and hypotension (systolic 80 mmHg) despite initial fluid resuscitation. Endoscopy is not immediately available. What is the most appropriate next step?", "opts": ["Ligation of varices with endoscopy immediately", "TIPS", "Sengstaken-Blakemore tube placement", "Laparotomy", "Observation"], "ans": 2, "exp": "Balloon tamponade with a Sengstaken-Blakemore tube is a temporary salvage option for uncontrolled variceal bleeding when endoscopy is not available, while terlipressin and antibiotics are given.", "why": ["Endoscopic banding is first-line but is not available in this scenario.", "TIPS is rescue after failed endoscopic therapy, not an immediate step.", "", "Laparotomy has no role.", "Observation is dangerous in shock."], "refs": [["GPnotebook: bleeding oesophageal varices", "https://gpnotebook.com/pages/gastroenterology/bleeding-oesophageal-varices-management"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 374}, {"group": "Medicine", "topic": "Neurology", "stem": "A 72-year-old man presents with sudden right-sided weakness and dysarthria that resolved within 15 minutes. He has a previous stroke. CT brain shows an old infarct and no acute bleed. What is the most likely diagnosis?", "opts": ["Bell's palsy", "Transient ischaemic attack", "Ischaemic stroke", "Haemorrhagic stroke", "Seizure"], "ans": 1, "exp": "A TIA is a brief episode of focal ischaemia without infarction that clears within 24 hours. Aspirin 300 mg is given once haemorrhage is excluded, with specialist review within a day.", "why": ["Bell's palsy affects the face only, with a lower motor neuron pattern.", "", "A stroke persists beyond 24 hours.", "CT excludes acute haemorrhage.", "A seizure typically causes positive symptoms followed by post-ictal weakness."], "refs": [["iatrox: transient ischaemic attack", "https://www.iatrox.com/academy/ukmla/transient-ischaemic-attack"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 375}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 38-year-old man with severe Crohn's disease remains symptomatic despite maximal therapy and is being considered for anti-TNF therapy. Which screening test is most appropriate before starting?", "opts": ["Tuberculin skin test", "Quantiferon (interferon-gamma release assay)", "Hepatitis B surface antibody", "HIV antibody", "Chest X-ray"], "ans": 1, "exp": "Before anti-TNF therapy, test for TB (skin test or IGRA). An IGRA is especially helpful after BCG vaccination or in immunosuppressed patients, and hepatitis B status should also be checked.", "why": ["A skin test is acceptable but is less reliable after BCG or with immunosuppression.", "", "Hepatitis B immunity should be checked, but the key safety test is TB screening, and surface antigen is the infection test.", "HIV testing is reasonable but is not the key pre-biologic screen.", "A chest X-ray alone misses latent TB."], "refs": [["MDedge/CCJM: managing risks of TNF inhibitors", "https://www.mdedge.com/ccjm/article/96047/drug-therapy/managing-risks-tnf-inhibitors-update-internist/page/0/3"]], "note": "Source lists both TST and IGRA, so IGRA vs skin test is a judgement; the course key chose IGRA.", "src": "Linked sources", "id": 376}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 44-year-old woman has had 2 years of diarrhoea, abdominal bloating, flatus, 3 kg weight loss and lethargy. Her sister was diagnosed with coeliac disease after similar symptoms. What is the most sensitive serological test to diagnose coeliac disease?", "opts": ["IgA anti-tissue transglutaminase antibody", "IgG deamidated gliadin peptide antibodies", "IgG anti-tissue transglutaminase antibodies", "IgG endomysial antibodies", "Small bowel biopsy"], "ans": 0, "exp": "First-line serology in adults is IgA tissue transglutaminase together with total IgA (to catch IgA deficiency). Endomysial antibodies are added if the tTG result is weak. IgG tests are used only when IgA is deficient.", "why": ["", "IgG DGP is used only if IgA is deficient.", "IgG tTG is also reserved for IgA deficiency.", "IgG EMA is for IgA-deficient patients.", "Biopsy confirms the diagnosis, but it is not a serological test."], "refs": [["GPnotebook: serological testing for coeliac disease (NICE-based)", "https://gpnotebook.com/pages/paediatrics/serological-testing-for-coeliac-disease"]], "note": "The source says serology cannot replace biopsy; the page does not say patients must be eating gluten, but that is standard practice.", "src": "Linked sources", "id": 377}, {"group": "Medicine", "topic": "Infectious Disease", "stem": "A 44-year-old man presents with bloody diarrhoea (about 20 motions/day), abdominal cramps and fever. He recently returned from South Africa, where he took a 7-day course of co-amoxiclav and clarithromycin for a chest infection. What is the most likely cause?", "opts": ["Campylobacter", "Clostridium difficile", "Enterohaemorrhagic E. coli", "Enteroinvasive E. coli", "Shigella"], "ans": 1, "exp": "Recent antibiotics are the strongest risk factor for C. difficile infection. Co-amoxiclav, cephalosporins, clindamycin and fluoroquinolones carry the highest risk.", "why": ["Campylobacter is food-borne and not linked to antibiotic exposure.", "", "EHEC follows undercooked beef, causing haemorrhagic colitis without much fever.", "EIEC is a travellers' infection but is much rarer.", "Shigella causes dysentery but is not triggered by antibiotics."], "refs": [["iatrox: C. difficile infection", "https://www.iatrox.com/academy/ukmla/clostridioides-difficile-infection"]], "note": "The source lists co-amoxiclav but not clarithromycin; the trip abroad is a distractor.", "src": "Linked sources", "id": 378}, {"group": "Medicine", "topic": "Infectious Disease", "stem": "A 67-year-old man has had 6 days of vomiting, profuse diarrhoea and abdominal cramps after clindamycin from his GP 10 days ago. He is febrile (38.4°C), tachycardic (110/min), hypotensive (92/55 mmHg) with dry mucous membranes. C. difficile toxins have been sent. Creatinine is 157 (baseline 68) and urea 16 (baseline 4). What is the most appropriate initial management?", "opts": ["IV fluids", "PO fluids", "PO metronidazole", "PO vancomycin", "Antipyretic medication"], "ans": 0, "exp": "He is dehydrated with acute kidney injury and hypotension, so resuscitation with IV fluids comes first. Oral vancomycin or fidaxomicin treats the infection, and the causative antibiotic is stopped where possible.", "why": ["", "Oral fluids are not enough for a hypotensive patient with AKI.", "Metronidazole is no longer first-line; IV metronidazole is for when oral therapy isn't possible.", "Vancomycin is right for the infection but follows resuscitation, and the diagnosis is not yet confirmed.", "Treating the fever does nothing for the dehydration."], "refs": [["iatrox: C. difficile infection", "https://www.iatrox.com/academy/ukmla/clostridioides-difficile-infection"]], "note": "The source confirms drug choices and severity markers (rising creatinine). Putting fluids before the antibiotic is your course answer and standard resuscitation practice.", "src": "Linked sources", "id": 379}, {"group": "Medicine", "topic": "Infectious Disease", "stem": "A 19-year-old care assistant presents with 3 days of vomiting, watery diarrhoea (about 6 motions/day), abdominal cramps and mild fever. Several sick patients on his floor in a nursing home have similar symptoms. Which organism is the most likely cause?", "opts": ["Astrovirus", "Bacillus cereus", "E. coli", "Norovirus", "Rotavirus"], "ans": 3, "exp": "Norovirus is the most common cause of vomiting and diarrhoea outbreaks in hospitals and care homes, and it spreads very easily.", "why": ["Astrovirus causes mild gastroenteritis, mostly in young children.", "B. cereus gives vomiting within hours of eating reheated rice, not a ward outbreak.", "E. coli would not usually spread through a ward in this pattern.", "", "Rotavirus mainly affects unvaccinated infants and young children."], "refs": [["UKHSA: managing norovirus outbreaks in healthcare settings", "https://assets.publishing.service.gov.uk/media/5a7da76ee5274a5eaea65866/Guidance_for_managing_norovirus_outbreaks_in_healthcare_settings.pdf"]], "note": "The source confirms norovirus as the commonest cause of outbreaks in care settings; the symptom detail is standard teaching.", "src": "Linked sources", "id": 380}, {"group": "Medicine", "topic": "Haematology", "stem": "A 45-year-old man has no symptoms, but screening blood tests raise concern for haemochromatosis. Which result is most suggestive?", "opts": ["CRP of 115", "Haematocrit of 55%", "Haemoglobin of 12.5 g/dL", "Serum ferritin of 1,225", "Transferrin saturation of 23%"], "ans": 3, "exp": "Haemochromatosis causes iron overload, so ferritin is markedly raised. EASL's pathway starts with a transferrin saturation above 45% together with ferritin.", "why": ["A raised CRP shows inflammation, not iron overload.", "A high haematocrit points to polycythaemia.", "Iron overload does not cause anaemia.", "", "A transferrin saturation of 23% is normal; in haemochromatosis it is above 45%."], "refs": [["EASL guideline on haemochromatosis (PubMed summary)", "https://pubmed.ncbi.nlm.nih.gov/35662478/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 381}, {"group": "Medicine", "topic": "Haematology", "stem": "A 45-year-old man has screening blood tests concerning for haemochromatosis. Which gene mutation is most likely to be present?", "opts": ["ATP7B homozygosity", "C282Y homozygosity", "H63D homozygosity", "HTT (CAG repeat) homozygosity", "PiZZ homozygosity"], "ans": 1, "exp": "Most hereditary haemochromatosis is due to HFE C282Y homozygosity, and finding it confirms the diagnosis.", "why": ["ATP7B mutations cause Wilson disease.", "", "H63D homozygosity rarely causes significant iron overload.", "HTT CAG repeats cause Huntington disease.", "PiZZ is the alpha-1 antitrypsin deficiency genotype."], "refs": [["EASL guideline on haemochromatosis (PubMed summary)", "https://pubmed.ncbi.nlm.nih.gov/35662478/"]], "note": "Source confirms C282Y homozygosity as diagnostic; the contrast with H63D is standard teaching.", "src": "Linked sources", "id": 382}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 67-year-old woman has 8 months of vomiting, nausea and epigastric pain. She was diagnosed with peptic ulcer disease a year ago and completed triple therapy. She drinks 2 units of alcohol a week and smokes socially. She takes diclofenac intermittently for knee osteoarthritis and had a gout flare 4 weeks ago. What is the most likely aetiology of her symptoms?", "opts": ["Alcohol", "Helicobacter pylori infection", "Smoking", "NSAID use", "Steroids"], "ans": 3, "exp": "H. pylori and long-term NSAID use are the strongest risk factors for peptic ulcers. She was treated for H. pylori and is taking an NSAID (diclofenac, plus likely more for gout), so NSAIDs are the likeliest cause now.", "why": ["Two units a week is too low to be a main cause.", "She was treated, and recurrence is less likely than ongoing NSAID injury; a test of cure would still be sensible.", "Smoking is a minor risk factor.", "", "No steroid use is described."], "refs": [["AAFP: peptic ulcer disease and H. pylori", "https://www.aafp.org/pubs/afp/issues/2023/0200/peptic-ulcer-disease-h-pylori-infection.html"]], "note": "Source confirms the two main risk factors; it doesn't explain the mechanism. A test of cure is advised about 4 weeks after therapy.", "src": "Linked sources", "id": 383}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "An 18-year-old woman has 3 months of hand tremor, falling school grades, cognitive decline and bizarre, borderline manic behaviour. When she presents to psychiatry she is noted to be very jaundiced. What is the most likely unifying diagnosis?", "opts": ["Chorea gravidarum", "Huntington's disease", "Parkinson's disease", "Sydenham's chorea", "Wilson's disease"], "ans": 4, "exp": "Young age with liver disease (jaundice), tremor and psychiatric or cognitive change suggests Wilson disease. It is confirmed by low ceruloplasmin, Kayser-Fleischer rings, high urinary copper and ATP7B testing.", "why": ["Chorea gravidarum occurs in pregnancy and does not explain jaundice.", "Huntington's disease does not cause liver disease and usually starts later.", "Parkinson's disease is rare at 18 and has no liver involvement.", "Sydenham's chorea follows streptococcal infection and doesn't cause jaundice.", ""], "refs": [["AASLD guideline: Wilson disease", "https://www.aasld.org/sites/default/files/2022-04/Wilson-Disease2009.pdf"]], "note": "Source covers diagnosis and treatment; the unifying age and presentation is standard teaching.", "src": "Linked sources", "id": 384}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 34-year-old man has intermittent crampy abdominal pain and bloody diarrhoea (over 15 motions a day) and is diagnosed with ulcerative colitis at colonoscopy. Which feature is most consistent with that diagnosis?", "opts": ["Abscesses", "Continuous inflammation", "Fistulae", "Granulomas", "Transmural inflammation"], "ans": 1, "exp": "UC causes continuous inflammation starting in the rectum and spreading proximally, limited to the mucosa and submucosa. Skip lesions, granulomas and transmural inflammation point to Crohn's disease.", "why": ["Abscesses are more a feature of Crohn's disease.", "", "Fistulae are a feature of Crohn's disease.", "Granulomas point to Crohn's disease.", "Transmural inflammation is typical of Crohn's disease."], "refs": [["iatrox: ulcerative colitis", "https://www.iatrox.com/academy/ukmla/ulcerative-colitis"]], "note": "The source doesn't mention fistulae or abscesses; the link to Crohn's is standard teaching.", "src": "Linked sources", "id": 385}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 34-year-old man with ulcerative colitis has bloody diarrhoea of more than 15 motions a day. Which complication is most associated with this diagnosis?", "opts": ["Abscess", "Enterocutaneous fistula", "Colovesical fistula", "Skin tags", "Toxic megacolon"], "ans": 4, "exp": "Toxic megacolon (colonic dilatation over 6 cm with systemic toxicity) is a life-threatening complication of severe UC and a surgical emergency.", "why": ["Abscess formation is more typical of Crohn's disease.", "Fistulae are typical of Crohn's disease.", "Colovesical fistulae are associated with diverticular disease and Crohn's disease.", "Perianal skin tags are mostly seen in Crohn's disease.", ""], "refs": [["iatrox: ulcerative
