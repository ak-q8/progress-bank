leaves out items he scores, such as PE being the most likely diagnosis.", "This misses at least one of the 3-point items.", "6.5 is the total if 'PE most likely' is not counted, but the stem states it is.", "", "10.5 would need an extra point he doesn't have: there is no previous DVT/PE and no recent immobilisation or surgery."], "refs": [["MDCalc: Wells criteria for PE", "https://www.mdcalc.com/calc/115/wells-criteria-pulmonary-embolism"]], "note": "The course notes this is unlikely to be examined.", "src": "Linked sources", "id": 52}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 67-year-old man collapses with right pleuritic chest pain and right thigh swelling. SpO2 is 92% on 15 L oxygen, BP 83/43 mmHg and HR 131. CTPA confirms a saddle embolus with right ventricular dilatation. What is the next most appropriate management step?", "opts": ["Intravenous alteplase", "Oral dabigatran", "Subcutaneous tinzaparin", "Intravenous unfractionated heparin", "Oral warfarin"], "ans": 0, "exp": "Hypotension with a confirmed PE means high-risk (massive) PE. Systemic thrombolysis is recommended for haemodynamically unstable patients, with unfractionated heparin alongside or while awaiting reperfusion.", "why": ["", "Oral anticoagulants are for stable patients and would not reverse the obstruction fast enough.", "LMWH is preferred for stable patients, not for a patient in shock.", "UFH is appropriate alongside reperfusion in unstable patients, but on its own it does not clear the clot.", "Warfarin is slow to act and is not an emergency treatment."], "refs": [["ACC summary of 2019 ESC acute PE guideline", "https://www.acc.org/Latest-in-Cardiology/Articles/2020/07/10/08/44/2019-ESC-Guidelines-for-the-Diagnosis-and-Management-of-Acute-PE"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 53}, {"group": "Medicine", "topic": "Haematology", "stem": "A 64-year-old man is diagnosed with high-grade B-cell lymphoma. Before chemotherapy that includes rituximab, he should be screened for which infection?", "opts": ["Aspergillus", "Cryptosporidium", "E. coli", "Hepatitis B", "Morbillivirus"], "ans": 3, "exp": "Hepatitis B can reactivate during chemotherapy and especially rituximab, sometimes causing fatal fulminant hepatitis. The MHRA recommends screening all patients before rituximab.", "why": ["Aspergillus is an environmental mould, not something screened for before chemotherapy.", "Cryptosporidium causes diarrhoea in the immunosuppressed but isn't screened for.", "E. coli is a common gut organism and isn't a reactivation risk.", "", "Morbillivirus (measles) is not a latent infection that reactivates."], "refs": [["MHRA: rituximab, screen for hepatitis B", "https://www.gov.uk/drug-safety-update/rituximab-screen-for-hepatitis-b-virus-before-treatment"]], "note": "The MHRA source is specific to rituximab. The stem names only chemotherapy; the course key is the same.", "src": "Linked sources", "id": 54}, {"group": "Medicine", "topic": "Haematology", "stem": "A 37-year-old man in resus after multiple stab wounds is given a red cell transfusion. Shortly after it starts he complains of pain in his back, chest and arm at the cannula site. There is blood oozing from the IV cannula and the urinary catheter drains red-coloured urine. BP is 75/55. Which transfusion complication is most likely?", "opts": ["Acute anaphylaxis", "Acute haemolytic transfusion reaction", "Acute febrile non-haemolytic transfusion reaction", "Transfusion-related acute lung injury", "Transfusion-associated circulatory overload"], "ans": 1, "exp": "Pain at the infusion site, back or chest pain, abnormal bleeding, haemoglobinuria and shock soon after starting a transfusion indicate an acute haemolytic reaction. Stop the transfusion immediately and seek urgent help.", "why": ["Anaphylaxis gives bronchospasm, urticaria and angioedema, not bleeding and haemoglobinuria.", "", "A febrile non-haemolytic reaction gives fever and chills without haemolysis or shock.", "TRALI presents with acute hypoxia and bilateral infiltrates.", "TACO presents with breathlessness and signs of fluid overload."], "refs": [["Australian transfusion resource: acute haemolytic reaction", "https://transfusion.com.au/adverse_transfusion_reactions/acute_haemolytic_reaction"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 55}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 38-year-old woman with asthma has rhinorrhoea and sinusitis, then weight loss, fevers and malaise over a few months. She develops a purpuric rash and a full blood count shows marked eosinophilia. What is the most likely diagnosis?", "opts": ["Eosinophilic granulomatosis with polyangiitis", "Goodpasture's syndrome", "Granulomatosis with polyangiitis", "Henoch-Schonlein purpura", "Polyarteritis nodosa"], "ans": 0, "exp": "Asthma with sinus disease, blood eosinophilia and small-vessel vasculitis (purpura) is EGPA (Churg-Strauss). Asthma often precedes the vasculitic phase by years.", "why": ["", "Goodpasture's causes lung haemorrhage and glomerulonephritis with anti-GBM antibodies, with no asthma or eosinophilia.", "GPA lacks asthma, allergy and eosinophilia.", "HSP is an IgA vasculitis mainly of children, with purpura, arthralgia, abdominal pain and nephritis.", "PAN lacks pulmonary symptoms, ANCA and eosinophilia."], "refs": [["MedLink: EGPA", "https://www.medlink.com/articles/eosinophilic-granulomatosis-with-polyangiitis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 56}, {"group": "Medicine", "topic": "Geriatrics", "stem": "An 83-year-old nursing home resident with a suspected fractured hip is intermittently confused, which is new. You suspect delirium. Which tool is used to screen for it?", "opts": ["CAM (Confusion Assessment Method)", "Chest X-ray", "Comprehensive blood panel", "CT brain", "ECG"], "ans": 0, "exp": "Delirium is diagnosed clinically, and the Confusion Assessment Method is a validated tool for it. It requires acute onset or fluctuating course and inattention, plus disorganised thinking or altered consciousness. NICE advises confirming with DSM criteria or the short CAM.", "why": ["", "A chest X-ray looks for a trigger such as infection, not for delirium itself.", "Bloods look for causes, such as infection or electrolyte disturbance.", "CT brain is only for suspected intracranial causes.", "An ECG looks for arrhythmia as a possible trigger."], "refs": [["GPnotebook: diagnosis of delirium", "https://gpnotebook.com/pages/psychiatry/delirium/diagnosis-of-delirium"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 57}, {"group": "Medicine", "topic": "Haematology", "stem": "A 68-year-old man with hypothyroidism on levothyroxine has a painful swollen left elbow with extensive ecchymosis. He is apyrexial, X-ray shows no bony injury, platelets are 4 x10^9/L, with otherwise normal Hb, renal and liver profile. What is the most appropriate first-line treatment?", "opts": ["Dialysis", "Immunoglobulins", "Plasma exchange", "Prednisolone", "Splenectomy"], "ans": 3, "exp": "An isolated severe thrombocytopenia with bleeding and an autoimmune association suggests immune thrombocytopenia (ITP). Corticosteroids (prednisolone/prednisone or dexamethasone) are standard first-line treatment, and treatment is advised when platelets are below about 20.", "why": ["Dialysis has no role as renal function is normal.", "IVIg can be added for severe bleeding or a quick rise but isn't the standard first-line single agent here.", "Plasma exchange is for TTP, where there would be anaemia and organ dysfunction.", "", "Splenectomy is reserved for patients who relapse or fail steroids."], "refs": [["MJA: Consensus guidelines on adult ITP (Australia and NZ)", "https://www.mja.com.au/journal/2022/216/1/consensus-guidelines-management-adult-immune-thrombocytopenia-australia-and-new"]], "note": "The source mentions IVIg alongside steroids as an option in first-line therapy, so a case could be made for it with active bleeding. The course key is prednisolone.", "src": "Linked sources", "id": 58}, {"group": "Medicine", "topic": "Haematology", "stem": "A 16-year-old boy has a large spontaneous epistaxis. His brother has a known bleeding disorder. His platelet count is normal and Hb is 11.6 g/dL. Which test is most likely to yield the diagnosis?", "opts": ["Bone marrow biopsy", "Direct Coombs test", "Factor VIII assay", "Peripheral blood smear", "Platelet autoantibodies"], "ans": 2, "exp": "A family history of a bleeding disorder with normal platelets fits haemophilia A. APTT is prolonged and the diagnosis is confirmed by a factor VIII activity assay.", "why": ["A marrow biopsy would look for marrow failure or infiltration, which isn't suggested.", "A Coombs test detects antibody-mediated haemolysis.", "", "A smear can show platelet or red cell abnormalities but won't diagnose a factor deficiency.", "Platelet autoantibodies relate to ITP, and the platelet count is normal."], "refs": [["NHS Genomics Education: Haemophilia A", "https://genomicseducation.hee.nhs.uk/genotes/knowledge-hub/haemophilia-a/"]], "note": "Epistaxis is less typical of haemophilia than of platelet or von Willebrand disorders, but the course key is the factor VIII assay. The source does not name vWD in this context.", "src": "Linked sources", "id": 59}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 19-year-old non-smoking woman is seen in OPD with a 4-month history of nocturnal cough and wheeze, with a bilateral expiratory wheeze. Spirometry shows FEV1 1.8 L (72% predicted) with 17% reversibility in FEV1 after a bronchodilator. What is the most likely diagnosis?", "opts": ["Asthma", "Bronchiectasis", "COPD", "Churg-Strauss syndrome", "Vocal cord dysfunction"], "ans": 0, "exp": "Young age, nocturnal cough and wheeze, and significant reversibility point to asthma. Reversibility is confirmed with an FEV1 rise of at least 12% and at least 200 mL (here 17% is about 300 mL).", "why": ["", "Bronchiectasis gives chronic productive cough with recurrent infections.", "COPD is unlikely in a young non-smoker, and its airflow obstruction is not significantly reversible.", "Churg-Strauss (EGPA) would include eosinophilia and vasculitic features.", "Vocal cord dysfunction gives inspiratory stridor and normal spirometry between episodes."], "refs": [["Asthma + Lung UK: diagnosing asthma in adults", "https://www.asthmaandlung.org.uk/healthcare-professionals/adult-asthma/diagnosis-testing/diagnosing-asthma-adults"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 60}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 56-year-old man presents with epistaxis and haematuria. Blood tests show acute kidney injury. Which antibody is most likely to be diagnostic?", "opts": ["Anti-centromere", "Anti-citrullinated protein", "Anti-double-stranded DNA", "Anti-mitochondrial", "Anti-neutrophil cytoplasmic antibody"], "ans": 4, "exp": "Upper airway involvement with a renal picture suggests granulomatosis with polyangiitis, where PR3 c-ANCA is positive in about 90%. Renal disease is pauci-immune and can progress to rapidly progressive glomerulonephritis.", "why": ["Anti-centromere is associated with limited systemic sclerosis.", "Anti-CCP is specific for rheumatoid arthritis.", "Anti-dsDNA indicates lupus.", "Anti-mitochondrial antibodies are the marker of primary biliary cholangitis.", ""], "refs": [["Medibuddy: granulomatosis with polyangiitis", "https://medibuddy.co.uk/mrcp-1-explanations/vasculitis/granulomatosis-with-polyangiitis-wegeners-granulomatosis/"]], "note": "The source does not mention epistaxis specifically but describes nasal and sinus disease.", "src": "Linked sources", "id": 61}, {"group": "Medicine", "topic": "Emergency", "stem": "A 38-year-old woman presents to the ED having taken 80 x 300 mg aspirin tablets 4 hours earlier. She is currently asymptomatic. Which is a well-recognised symptom or sign of acute aspirin toxicity?", "opts": ["Tinnitus", "Oscillopsia", "Facial nerve palsy", "Bladder dystonia", "Paraesthesia"], "ans": 0, "exp": "Early salicylate toxicity causes tinnitus, nausea, vomiting and rapid breathing from respiratory alkalosis. Later features are sweating, fever, confusion, seizures and pulmonary oedema. Being asymptomatic early does not exclude toxicity, as levels may be delayed.", "why": ["", "Oscillopsia (visual shaking) is not a recognised feature of salicylate toxicity.", "Facial nerve palsy is not associated with salicylate poisoning.", "Bladder dystonia is not a feature of salicylate overdose.", "Paraesthesia is not a typical feature of salicylate toxicity."], "refs": [["WikEM: salicylate toxicity", "https://wikem.org/wiki/Salicylate_Toxicity"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 62}, {"group": "Medicine", "topic": "Emergency", "stem": "A 57-year-old man presents after a witnessed ingestion of 40 g of paracetamol exactly 2 hours ago, following a suicide attempt. He has no background history. When should a serum paracetamol level be measured for use with the treatment nomogram?", "opts": ["1 hour after ingestion", "2 hours after ingestion", "3 hours after ingestion", "4 hours after ingestion", "5 hours after ingestion"], "ans": 3, "exp": "For a single acute ingestion presenting within 8 hours, the level is taken at 4 hours post-ingestion (or as soon as possible after) and plotted on the treatment nomogram.", "why": ["Levels taken too early can underestimate the peak and cannot be interpreted on the nomogram.", "The patient is currently at this time point, but a level now is too early to use with the nomogram.", "A level at this point is still before the time the nomogram is valid from.", "", "The nomogram is read from 4 hours, so waiting longer delays a decision on treatment."], "refs": [["Perth Children's Hospital ED guideline: paracetamol poisoning (Australia)", "https://www.health.wa.gov.au/sitecore/content/Hospitals/PCH/Home/For-health-professionals/Emergency-Department-Guidelines/Poisoning-Paracetamol"]], "note": "This is an Australian hospital guideline. UK practice is also a 4-hour level; check your local protocol.", "src": "Linked sources", "id": 63}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 48-year-old man with a one-year history of crusted, scaly skin lesions is diagnosed with pemphigus foliaceus. In which skin layer do the blisters occur?", "opts": ["Intraepidermal", "Subepidermal", "Papillary dermis", "Reticular dermis", "Subcutaneous tissue"], "ans": 0, "exp": "In pemphigus foliaceus, loss of keratinocyte cohesion (acantholysis) occurs in the superficial epidermis, from the stratum granulosum into the stratum corneum. This is why the blisters are fragile and the lesions are crusted and scaly.", "why": ["", "Subepidermal blistering is seen in the pemphigoid group and epidermolysis bullosa acquisita.", "The papillary dermis lies beneath the epidermis, and pemphigus blisters form within the epidermis.", "The reticular dermis is deeper still and is not where acantholysis occurs.", "Subcutaneous tissue is far deeper than the level at which the blistering forms."], "refs": [["DermNet: pemphigus foliaceus pathology", "https://pro.dermnetnz.org/topics/pemphigus-foliaceus-pathology"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 64}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 45-year-old man is diagnosed with epidermolysis bullosa acquisita after a 6-month history of blisters on his hands, feet, sacrum, elbows and knees. In which skin layer does the blister occur?", "opts": ["Intraepidermal", "Subepidermal", "Papillary dermis", "Reticular dermis", "Subcutaneous tissue"], "ans": 1, "exp": "EBA is a subepidermal blistering disease. IgG autoantibodies against type VII collagen (anchoring fibrils) split the skin just below the epidermis, typically at friction-prone sites, and the lesions heal with scarring and milia.", "why": ["Intraepidermal splitting occurs in the pemphigus group.", "", "The papillary dermis is the layer the anchoring fibrils connect to; the split forms above it, at the basement membrane zone.", "The reticular dermis is deeper than the plane of the split.", "Subcutaneous tissue is far deeper than the plane of the split."], "refs": [["DermNet: epidermolysis bullosa acquisita", "https://dermnetnz.org/topics/epidermolysis-bullosa-acquisita"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 65}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 29-year-old pregnant woman is admitted with widespread tense bullous lesions that began as itchy papules on her abdomen. A skin biopsy shows subepidermal blistering. What is the most likely cause?", "opts": ["Intrahepatic cholestasis of pregnancy", "Pemphigoid gestationis", "PUPPP", "Cicatricial pemphigoid", "Bullous pemphigoid"], "ans": 1, "exp": "Pemphigoid gestationis usually begins in the second or third trimester with intense itch and periumbilical papules and urticarial plaques, followed by bullae. Biopsy shows subepidermal blistering, and immunofluorescence shows linear C3 along the basement membrane.", "why": ["Cholestasis causes itch (often palms and soles) without a primary rash, so blistering wouldn't be expected.", "", "PUPPP gives papules and plaques within striae but spares the umbilicus and does not blister.", "Cicatricial pemphigoid mainly scars mucous membranes, such as the eyes and mouth, in older people.", "Bullous pemphigoid is a disease of the elderly and is not related to pregnancy."], "refs": [["AAFP: dermatoses of pregnancy", "https://www.aafp.org/afp/2017/0401/p453.html"]], "note": "The source describes the bullae as subepidermal but does not call them tense.", "src": "Linked sources", "id": 66}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 25-year-old man presents with a 2-month history of a scaly rash. Examination shows scaly erythematous raindrop-like lesions on his trunk and upper limbs. He had a recent sore throat but is otherwise well. What is the most likely diagnosis?", "opts": ["Plaque psoriasis", "Inverse psoriasis", "Pustular psoriasis", "Guttate psoriasis", "Erythrodermic psoriasis"], "ans": 3, "exp": "Guttate psoriasis presents as a shower of small, scaly pink-red 'raindrop' lesions on the trunk and limbs, mostly in children and young adults, usually 1-2 weeks after a streptococcal throat infection.", "why": ["Plaque psoriasis gives larger, well-demarcated thick plaques, typically on extensor surfaces.", "Inverse psoriasis affects flexures and skin folds.", "Pustular psoriasis has sterile pustules, not scaly small papules.", "", "Erythrodermic psoriasis involves most of the body surface with widespread redness."], "refs": [["DermNet: guttate psoriasis", "https://dermnetnz.org/topics/guttate-psoriasis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 67}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 34-year-old woman with tender, raised red lesions on her shins is diagnosed with erythema nodosum. Which of the following is the most likely underlying cause?", "opts": ["Recent streptococcal infection", "TB infection", "Yersinia infection", "Inflammatory bowel disease", "Sarcoidosis"], "ans": 0, "exp": "Erythema nodosum is a panniculitis with inflammation of the septa between fat lobules. Triggers include streptococcal throat infection, sarcoidosis, TB, IBD and drugs, and the cause is unknown in about half. A recent streptococcal infection is the textbook UK answer.", "why": ["", "TB is a recognised trigger but is rarer in the UK and Ireland.", "Yersinia is a recognised but less common infective cause.", "IBD is a recognised association but is not the most common cause.", "Sarcoidosis is a recognised cause (with hilar lymphadenopathy) but is less common than streptococcal infection overall."], "refs": [["DermNet: erythema nodosum", "https://pro.dermnetnz.org/topics/erythema-nodosum"]], "note": "The source lists throat infections first but does not rank causes by frequency. Several of the other options are real triggers, so the question depends on the course's ranking.", "src": "Linked sources", "id": 68}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 48-year-old woman with rheumatoid arthritis develops a painful necrotic cutaneous ulcer on her lateral malleolus and is diagnosed with pyoderma gangrenosum. What treatment should be commenced?", "opts": ["Biologic treatment with infliximab", "Antibacterial treatment with flucloxacillin", "Ciclosporin", "Oral corticosteroids", "Topical antifungal"], "ans": 3, "exp": "Pyoderma gangrenosum is an inflammatory neutrophilic dermatosis, not an infection. Moderate to severe disease is treated with systemic corticosteroids (prednisone) and/or ciclosporin first, with biologics for refractory disease. Avoid debriding the wound, as trauma can worsen it (pathergy).", "why": ["Biologics are used when first-line immunosuppression fails.", "Antibiotics only treat a superimposed infection, which the ulcer is not caused by.", "Ciclosporin is also first-line in the source, but oral corticosteroids are the usual first step.", "", "An antifungal has no role as the ulcer is not fungal."], "refs": [["AMBOSS: pyoderma gangrenosum", "https://amboss.com/us/knowledge/pyoderma-gangrenosum"]], "note": "The source lists prednisone and/or ciclosporin together as first-line, so ciclosporin is also defensible. The course key is oral corticosteroids.", "src": "Linked sources", "id": 69}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 32-year-old woman with polycystic ovary syndrome presents with polydipsia. On examination she has acanthosis nigricans on her neck and a pyogenic skin infection on her left foot. What is the most likely diagnosis?", "opts": ["Multiple endocrine neoplasia", "Leukocytoclastic vasculitis", "Diabetes mellitus type 2", "Pyoderma gangrenosum", "Diabetes mellitus type 1"], "ans": 2, "exp": "Acanthosis nigricans reflects insulin resistance, seen in obesity, PCOS and type 2 diabetes. With polydipsia and a skin infection, type 2 diabetes is the most likely diagnosis.", "why": ["MEN does not explain the pattern of insulin resistance and infection.", "Vasculitis presents with palpable purpura rather than velvety skin thickening.", "", "Pyoderma gangrenosum is an ulcerating neutrophilic dermatosis, not a cause of polydipsia.", "Type 1 diabetes is typically in younger, thinner patients and is not linked with acanthosis nigricans."], "refs": [["DermNet: acanthosis nigricans", "https://dermnetnz.org/topics/acanthosis-nigricans"]], "note": "The source links acanthosis nigricans to insulin resistance, obesity, PCOS and type 2 diabetes, and does not discuss polydipsia.", "src": "Linked sources", "id": 70}, {"group": "Medicine", "topic": "Dermatology", "stem": "Which of the following factors favours a diagnosis of erythema multiforme major rather than erythema multiforme minor?", "opts": ["Truncal distribution", "Presence of mucous membrane involvement", "Presence of raised targetoid lesions", "Recent herpes infection", "Recent medication exposure"], "ans": 1, "exp": "Significant mucosal involvement distinguishes erythema multiforme major from minor. Minor has little or no mucosal involvement.", "why": ["Truncal spread does not separate the two. Lesions are typically symmetrical and acral, favouring extensor surfaces.", "", "Target lesions occur in both forms.", "HSV is the commonest trigger of both forms.", "Drugs can trigger either form but are less common than infection."], "refs": [["DermNet: erythema multiforme", "https://dermnetnz.org/topics/erythema-multiforme"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 71}, {"group": "Medicine", "topic": "Dermatology", "stem": "Which of the following infections is most commonly associated with erythema multiforme?", "opts": ["Staphylococcus aureus", "Hepatitis C", "Herpes simplex virus", "Streptococcus pneumoniae", "Mycoplasma pneumoniae"], "ans": 2, "exp": "Infection causes about 90% of erythema multiforme, and herpes simplex virus (mostly type 1) is the predominant trigger.", "why": ["S. aureus is not a recognised major trigger.", "Hepatitis C is not a typical trigger.", "", "S. pneumoniae is not a typical trigger.", "Mycoplasma is a recognised but much less common trigger."], "refs": [["DermNet: erythema multiforme", "https://dermnetnz.org/topics/erythema-multiforme"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 72}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 32-year-old woman is admitted with a stroke. On examination you note raised, erythematous discoid plaques on the scalp with evidence of scarring. What is the most likely diagnosis?", "opts": ["Scleroderma", "Alopecia areata", "Discoid lupus", "Vasculitis", "Malignancy"], "ans": 2, "exp": "Discoid lupus is a chronic scarring skin disease: red scaly plaques on the scalp and face that heal with atrophic scarring and permanent (scarring) alopecia. Some patients have or later develop SLE.", "why": ["Scleroderma causes skin tightening and sclerosis, not scarring scaly plaques.", "Alopecia areata gives smooth non-scarred patches of hair loss without plaques.", "", "Vasculitis presents with purpura, ulcers or nodules rather than chronic discoid plaques.", "Malignancy would not account for multiple scarring scaly plaques."], "refs": [["DermNet: discoid lupus erythematosus", "https://dermnetnz.org/topics/discoid-lupus-erythematosus"]], "note": "The source doesn't discuss stroke. The link with lupus (and antiphospholipid antibodies) is standard teaching.", "src": "Linked sources", "id": 73}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 55-year-old woman has a 6-week history of progressive, symmetric muscle weakness with an associated rash and swelling of her eyelids. Dermatomyositis is suspected. Which autoantibodies would be useful in confirming the diagnosis?", "opts": ["Anti-synthetase antibodies and anti-Jo-1", "AMA (anti-mitochondrial) and ASM (anti-smooth muscle)", "ANA and AMA", "RF", "Anti-CCP"], "ans": 0, "exp": "Myositis-specific antibodies include anti-Jo-1 and the other anti-synthetase antibodies, which define antisynthetase syndrome (myositis, interstitial lung disease, mechanic's hands). Anti-TIF1 is linked to a high risk of malignancy.", "why": ["", "AMA and ASM are associated with primary biliary cholangitis and autoimmune hepatitis respectively.", "ANA is nonspecific and AMA indicates PBC.", "RF is associated with rheumatoid arthritis.", "Anti-CCP is highly specific for rheumatoid arthritis."], "refs": [["PCDS: dermatomyositis and antisynthetase syndrome", "https://www.pcds.org.uk/clinical-guidance/dermatomyositis"]], "note": "The source describes anti-Jo-1 as the commonest antisynthetase antibody but doesn't mention Mi-2, which is also characteristic of dermatomyositis.", "src": "Linked sources", "id": 74}, {"group": "Medicine", "topic": "Vascular", "stem": "How should an ankle-brachial index (ABI) of 1.5 be interpreted?", "opts": ["The patient is subcritical because they are above the normal range", "The patient is subcritical because they are in the normal range", "The arteries are too hard (calcified) to compress, so the result is unreliable", "This is critical limb ischaemia"], "ans": 2, "exp": "An ABI above about 1.4 suggests non-compressible, calcified vessels (common in diabetes and the elderly), which resist cuff collapse and give a falsely high pressure. The result is unreliable and needs a different test or vascular referral.", "why": ["A high ABI does not mean subcritical ischaemia. It signals a measurement problem.", "The normal range is lower than this value, and a normal ABI wouldn't be described as subcritical ischaemia.", "", "Critical limb ischaemia is associated with low ABI values, not high ones."], "refs": [["Stanford Medicine 25: ankle-brachial index", "https://med.stanford.edu/stanfordmedicine25/the25/ankle-brachial-index.html"], ["Patient.info: leg ulcers (ABPI above 1.5)", "https://patient.info/doctor/leg-ulcers-pro"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 75}, {"group": "Medicine", "topic": "Vascular", "stem": "What is the best management of compartment syndrome that develops after revascularisation for acute limb ischaemia?", "opts": ["Fluid resuscitation", "Antibiotics", "Kidney transplant", "Fasciotomies", "Amputation"], "ans": 3, "exp": "Reperfusion injury after vascular repair is a common cause of compartment syndrome. Treatment is urgent fasciotomy to open all fascial compartments, unless pressure falls quickly. Amputation is only for extensive necrosis.", "why": ["Fluids support the circulation and help limit rhabdomyolysis, but do not relieve the raised compartment pressure.", "Antibiotics don't address a pressure problem, as this is not an infection.", "A kidney transplant is not a treatment for the acute problem.", "", "Amputation is indicated if there is extensive muscle necrosis, not as the first step."], "refs": [["MSD Manual: compartment syndrome", "https://www.msdmanuals.com/professional/injuries-poisoning/fractures/compartment-syndrome"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 76}, {"group": "Medicine", "topic": "Vascular", "stem": "What is the best management of an arterial ulcer?", "opts": ["Amputation", "Compression bandage", "Debridement", "Revascularisation", "Hyperbaric oxygen therapy"], "ans": 3, "exp": "An arterial ulcer reflects peripheral arterial disease. Compression is contraindicated when the ABPI is very low, and patients should be referred to vascular surgery, where current management favours revascularisation if there is a vascular component. Avoid debriding ischaemic wounds.", "why": ["Amputation is a last resort when limb salvage is not possible.", "Compression is used for venous ulcers and is contraindicated in significant arterial disease.", "Debriding an ischaemic wound can worsen it, as the tissue lacks the blood supply to heal.", "", "Hyperbaric oxygen is not a standard treatment for arterial ulcers."], "refs": [["Patient.info: leg ulcers", "https://patient.info/doctor/leg-ulcers-pro"]], "note": "The source says management 'leans towards revascularisation', and says dressing choice has little evidence. The point about debriding is mine and not from this source.", "src": "Linked sources", "id": 77}, {"group": "Medicine", "topic": "Breast & Endocrine", "stem": "A premenopausal woman had a lumpectomy and axillary dissection for a stage II breast cancer. Pathology showed pT2pN1Mx, ER/PR positive and HER2 positive. She will require all of the following adjuvant therapies EXCEPT:", "opts": ["Chemotherapy", "Radiation therapy", "Tamoxifen", "Trastuzumab", "Anastrozole"], "ans": 4, "exp": "She is premenopausal and ER/PR positive, so endocrine therapy is tamoxifen (aromatase inhibitors are for postmenopausal women). HER2-positive disease gets trastuzumab, chemotherapy is given for node-positive disease, and radiotherapy follows breast-conserving surgery.", "why": ["Chemotherapy is indicated for node-positive, HER2-positive disease.", "Radiotherapy follows breast-conserving surgery.", "Tamoxifen is the initial endocrine choice before the menopause.", "Trastuzumab is offered for HER2-positive tumours.", ""], "refs": [["GPnotebook: adjuvant therapy in early breast cancer", "https://gpnotebook.com/pages/oncology/adjuvant-therapy-in-early-breast-cancer"]], "note": "The source covers tamoxifen, aromatase inhibitors, trastuzumab and chemotherapy. It does not give guidance on radiotherapy after lumpectomy, which is standard teaching.", "src": "Linked sources", "id": 78}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 70-year-old man comes to the physician for the evaluation of an 8- week history of blood in his stool. Two months ago, he had an episode of bronchitis and was treated with amoxicillin. Since then, he has noticed blood in his stool and on the toilet paper occasionally. The patient has had intermittent constipation for the past 5 years. Six months ago, he had severe left lower quadrant pain and fever that resolved with antibiotic therapy. He underwent a colonoscopy 3 years ago, which did not show any evidence of malignancy. He takes levothyroxine for hypothyroidism. He had smoked one pack of cigarettes daily for 45 years, but quit smoking 10 years ago. He drinks one glass of red wine every night. He appears pale. He is 180 cm (5 ft 11 in) tall and weighs 98 kg (216 lb); BMI is 32 kg/m2. His temperature is 36°C (96.8°F), pulse is 85/min, and blood pressure is 135/80 mm Hg. Physical examination shows pale conjunctivae. Cardiopulmonary examination shows no abnormalities. The abdomen is soft and nontender with no organomegaly. Digital rectal examination shows no masses. Test of the stool for occult blood is positive. Laboratory studies show: Hemoglobin 11 g/dL Mean corpuscular volume76 μ m3 Red cell distribution width 17% (N = 13–15) Leukocyte count 5,000/mm3 Which of the following is the most likely diagnosis?", "opts": ["Colorectal cancer", "Diverticulosis", "Anal fissure", "Hemorrhoids", "Pseudomembranous colitis"], "ans": 1, "exp": "Diverticulosis is common in older people, particularly with low fibre intake, obesity and smoking, and can bleed painlessly. Diverticular bleeding is typically sudden, painless red or maroon blood, and a colonoscopy should follow to find the source and exclude cancer. Chronic occult bleeding explains the microcytic anaemia here.", "why": ["Colorectal cancer also causes occult bleeding and microcytic anaemia, but with weight loss and a change in bowel habit, and nothing here points to it more than to the benign diagnosis.", "", "An anal fissure causes painful defecation with bright red blood on the paper and does not cause anaemia.", "Haemorrhoids cause bright red bleeding on wiping, which is rarely enough to cause a microcytic anaemia.", "Pseudomembranous colitis follows antibiotics with profuse watery diarrhoea, not intermittent constipation and occult bleeding."], "refs": [["Patient.info: diverticular disease", "https://patient.info/doctor/Diverticular-Disease"]], "note": "The source lists age, low fibre, obesity and smoking as risk factors. It does not list constipation as a risk factor, and it does not discuss the antibiotic history in this stem.", "src": "Linked sources", "id": 79}, {"group": "Surgery", "topic": "Vascular", "stem": "Four days after undergoing a craniotomy and evacuation of a subdural hematoma, a 56-year-old man has severe pain and swelling of his right leg. He has chills and nausea. He has type 2 diabetes mellitus and chronic kidney disease, and was started on hemodialysis 2 years ago. Prior to admission, his medications were Humalog, enalapril, atorvastatin, and sevelamer. His temperature is 38.3°C (101°F), pulse is 110/min, and blood pressure is 130/80 mm Hg. Examination shows a swollen, warm, and erythematous right calf. Dorsiflexion of the right foot causes severe pain in the right calf. The peripheral pulses are palpated bilaterally. Cardiopulmonary examination shows no abnormalities. Laboratory studies show: Hemoglobin 10.1 g/dL Leukocyte count11,800/mm3 Platelet count 230,000/mm3 Serum: Glucose 87 mg/dL Creatinine 1.9 mg/dL Which of the following is the most appropriate next step in treatment?", "opts": ["Unfractionated heparin therapy", "Inferior vena cava filter", "Low molecular weight heparin therapy", "Surgical thrombectomy", "Warfarin therapy"], "ans": 1, "exp": "An inferior vena cava filter is indicated for patients with DVT who cannot be anticoagulated because of bleeding risk. This patient had a craniotomy for a subdural haematoma 4 days ago, so anticoagulation risks re-bleeding. Retrievable filters are preferred and anticoagulation resumes once the contraindication resolves.", "why": ["Unfractionated heparin would risk bleeding into the fresh surgical site and subdural space.", "", "LMWH carries the same bleeding risk and also accumulates in renal impairment.", "Surgical thrombectomy is rarely required and would be a major operation in a patient who has just had neurosurgery.", "Warfarin is an anticoagulant and is therefore contraindicated for the same reason, and it is slow to act."], "refs": [["The Hospitalist: when should an IVC filter be used to treat a DVT", "https://www.mdedge.com/content/when-should-ivc-filter-be-used-treat-dvt"]], "note": "The source cites bleeding risk as the indication for a filter. It doesn't specifically list recent neurosurgery, which is an extension of that principle.", "src": "Linked sources", "id": 80}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 73-year-old man comes in to the emergency department because of nausea and severe pain in his upper abdomen and right shoulder blade for the past day. He was able to eat a little for breakfast but vomited up the meal a couple of hours later. He has type 2 diabetes mellitus treated with metformin. He has smoked half a pack of cigarettes daily for 40 years and drinks 4 beers every week. He appears acutely distressed. His temperature is 38.8°C (102°F), pulse is 124/min, and blood pressure is 92/68 mm Hg. Pulse oximetry on room air shows an oxygen saturation of 95%. The abdomen is soft and there is tenderness to palpation of the right upper quadrant with soft crepitus. The remainder of the examination shows no abnormalities. Laboratory studies show: Hemoglobin 14.3 g/dL Leukocyte count 18,100/mm3 Platelet count 216,000/mm3 Serum Aspartate aminotransferase (AST, SGOT)41 U/L Alanine aminotransferase (ALT, SGPT) 19 U/L Alkaline phosphatase 110 U/L Total bilirubin 0.9 mg/dL Direct bilirubin 0.2 mg/dL Albumin 4.1 g/dL Ultrasonography of the right upper quadrant shows a gallbladder with an air-filled, thickened wall and no stones in the lumen. Which of the following is the most likely diagnosis?", "opts": ["Chronic pancreatitis with pseudocyst rupture", "Emphysematous cholecystitis", "Gallstone ileus", "Perforated duodenal ulcer", "Primary sclerosing cholangitis"], "ans": 1, "exp": "Emphysematous cholecystitis is a life-threatening form of acute cholecystitis that mostly affects older adults with diabetes. Gas is seen in the gallbladder lumen or wall, and the usual cause is ischaemic injury with gas-forming organisms. Treatment is emergency cholecystectomy, or percutaneous drainage if surgery is too high-risk. Mortality is about 15%, compared with 4% for ordinary acute cholecystitis.", "why": ["A pseudocyst rupture would not produce an air-filled gallbladder wall.", "", "Gallstone ileus causes small bowel obstruction with pneumobilia, and the stem has no stones in the lumen.", "A perforated duodenal ulcer gives free air under the diaphragm and generalised peritonitis rather than gas within the gallbladder wall.", "PSC is a chronic cholestatic disease and does not cause gas in the gallbladder wall."], "refs": [["CMAJ: emphysematous cholecystitis", "https://www.cmaj.ca/content/184/1/E81"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 81}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 61-year-old man comes to the physician because of fatigue, diarrhea, and crampy abdominal pain for 3 weeks. The abdominal pain is worse after eating. During the past week, he has had up to 4 watery stools daily. He has also had pain in his mouth and gums for 6 days. He has not had nausea, vomiting, or fever. Four months ago, he went on a 1-week trip to the Dominican Republic. He has atrial fibrillation, hypertension, and hypothyroidism. Current medications include levothyroxine, metoprolol, and warfarin. He has smoked one pack of cigarettes daily for 40 years. His temperature is 37.9°C (100.2°F), pulse is 81/min, and blood pressure is 120/75 mm Hg. Examination shows two 1-cm, tender ulcerative lesions in the mouth. Abdominal examination shows mild tenderness to palpation in the right lower quadrant without guarding or rebound. Bowel sounds are normal. His hemoglobin concentration is 11.5 g/dL, mean corpuscular volume is 77 fL, leukocyte count is 11,800 mm3, and platelet count is 360,000 mm3. Colonoscopy with biopsy of the colonic mucosa is performed. Analysis of the specimen shows non- caseating granulomas and neutrophilic inflammation of the crypts. Which of the following is the most likely diagnosis?", "opts": ["Diverticulitis", "Crohn disease", "Ischemic colitis", "Celiac disease", "Ulcerative colitis"], "ans": 1, "exp": "Crohn disease has a bimodal age peak, with a second peak at about 60-80. Smoking roughly doubles the risk, and oral aphthous ulcers are an extra-intestinal feature. Non-caseating granulomas on biopsy support the diagnosis, although they are found in only about 60% of cases.", "why": ["Diverticulitis causes left iliac fossa pain and fever, and does not cause oral ulcers or granulomas.", "", "Ischaemic colitis occurs in vascular disease and shows ischaemic changes on biopsy rather than granulomas.", "Coeliac disease causes villous atrophy of the small bowel and is not associated with granulomatous colitis.", "Ulcerative colitis is mucosal and continuous, with crypt abscesses but no granulomas, and smoking is protective."], "refs": [["iatrox: Crohn's disease", "https://www.iatrox.com/academy/ukmla/crohns-disease"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 82}, {"group": "Surgery", "topic": "Vascular", "stem": "A previously healthy 64-year-old man comes to the physician 3 days after noticing a lump in his right groin while he was bathing. He has no history of trauma to the region. He has hypercholesterolemia and hypertension treated with atorvastatin and labetalol. He has smoked 2 packs of cigarettes daily for 35 years. His vital signs are within normal limits. Examination shows a 4-cm (1.6-in), nontender, pulsatile mass with a palpable thrill at the right midinguinal point. On auscultation, a harsh continuous murmur is heard over the mass. Femoral and pedal pulses are palpable bilaterally. The remainder of the examination shows no abnormalities. Which of the following is the most likely diagnosis?", "opts": ["Femoral hernia", "Arteriovenous fistula of the femoral vessels", "Femoral abscess", "Saphenous varix", "Femoral artery aneurysm"], "ans": 4, "exp": "A pulsatile groin mass with a bruit in an older man with vascular risk factors suggests a femoral artery aneurysm. Pulses distal to it can be normal. A pulsatile mass may also be a pseudoaneurysm (often after catheterisation), and Doppler ultrasound is the preferred first imaging.", "why": ["A femoral hernia is a non-pulsatile lump that has a cough impulse and no bruit.", "An AV fistula would give a thrill and continuous murmur, and is usually iatrogenic, but nothing in the stem suggests a previous puncture.", "An abscess is tender and red with systemic features, not pulsatile with a bruit.", "A saphenous varix disappears on lying down and has no bruit.", ""], "refs": [["The Hospitalist: femoral pseudoaneurysm imaging", "https://mdedge.com/content/emergency-imaging-femoral-pseudoaneurysm"]], "note": "The source describes a pulsatile mass and bruit but doesn't mention a thrill, and discusses pseudoaneurysm in more detail than true aneurysm.", "src": "Linked sources", "id": 83}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 53-year-old woman comes to the emergency department because of weakness and abdominal pain for 24 hours. She has had three bowel movements with dark stool during this period. She has not had vomiting and has never had such episodes in the past. She underwent a tubal ligation 15 years ago. She has chronic lower extremity lymphedema, osteoarthritis, and type 2 diabetes mellitus. Her father died of colon cancer at the age of 72 years. Current medications include metformin, naproxen, and calcium with vit D3. She had a screening colonoscopy at 50 years of age which was normal. She appears pale and diaphoretic. Her temperature is 36°C (96.8°F), pulse is 110/min, respirations are 20/min, and blood pressure is 90/50 mm Hg. Pulse oximetry on room air shows an oxygen saturation of 98%. The abdomen is soft and nondistended with mild epigastric tenderness. Rectal exam shows tarry stool. Two large bore IV lines are placed and fluid resuscitation with normal saline is initiated. Which of the following is the most appropriate next step in management?", "opts": ["Flexible sigmoidoscopy", "Diagnostic laparoscopy", "Colonoscopy", "Intravenous octreotide", "Oesophago-gastro-duodenoscopy"], "ans": 4, "exp": "Melaena with abdominal pain and shock suggests an upper GI bleed. After resuscitation, endoscopy (OGD) is both diagnostic and therapeutic. NICE advises it immediately after resuscitation for unstable patients with severe bleeding, and within 24 hours for others.", "why": ["Sigmoidoscopy examines the distal colon and will not find an upper GI source.", "Laparoscopy is not a first-line investigation for GI bleeding.", "Colonoscopy assesses the lower GI tract, but melaena points to an upper source.", "Octreotide is used for suspected variceal bleeding, and nothing here suggests liver disease.", ""], "refs": [["NICE CG141: acute upper GI bleeding", "https://www.nice.org.uk/guidance/cg141/chapter/1-Guidance"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 84}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 54-year-old man comes to the emergency department because of a 2-day history of increasingly severe abdominal pain, nausea, and bilious vomiting. His last bowel movement was yesterday and he has not passed flatus since then. He underwent appendectomy at the age of 39. He has psoriasis, hypertension, type 2 diabetes mellitus, and chronic back pain. He drinks two beers daily. He takes a topical corticosteroid, ramipril, metformin, and ibuprofen daily. He is 176 cm (5 ft 9 in) tall and weighs 108 kg (240 lb); BMI is 35.4 kg/m2. His temperature is 36.8°C (98.4°F), respirations are 15/min, pulse is 90/min, and blood pressure is 112/67 mm Hg. Examination shows thick, scaly, plaques over both elbows and knees. Abdominal examination shows three well-healed laparoscopic scars. The abdomen is distended and there are frequent, high-pitched bowel sounds on auscultation. Digital rectal examination shows an empty rectum. Laboratory studies show: Hematocrit 44% Leukocyte count 9,000/mm3 3 Platelet count 225,000/mm3 Serum Na+ 139 mEq/L + K 4.1 mEq/L Cl− 101 mEq/L − HCO3 26 mEq/L Glucose 95 mg/dL Creatinine 1.1 mg/dL Alkaline phosphatase 78 U/L Aspartate aminotransferase (AST, GOT)19 U/L Alanine aminotransferase (ALT, GPT) 14 U/L γ-Glutamyltransferase (GGT) 52 U/L (N=5–50 U/L) Hemoglobin A1C 6.4% Abdominal ultrasound shows nonpropulsive peristalsis of the small bowel. Which of the following is the most likely cause of this patient's condition?", "opts": ["Chronic inflammatory bowel disease", "Alcohol", "History of abdominal surgery", "Thromboembolic event", "Obesity"], "ans": 2, "exp": "Adhesions account for about 60-75% of small bowel obstruction and typically follow previous abdominal surgery. Lower abdominal and pelvic operations, including appendicectomy, carry the highest risk. Tumours, hernias and Crohn disease cause fewer cases.", "why": ["IBD is a recognised but much less common cause, at about 5-7%.", "Alcohol is not a cause of mechanical small bowel obstruction.", "", "A thromboembolic event would cause mesenteric ischaemia, with pain out of proportion and not mechanical obstruction.", "Obesity is not a direct cause of small bowel obstruction."], "refs": [["AAFP: intestinal obstruction", "https://www.aafp.org/afp/2018/0915/p362"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 85}, {"group": "Surgery", "topic": "Neurosurgery", "stem": "A 5-year-old boy is brought to the physician because of early morning headaches for the past 6 months. During this period, he has had severe nausea and occasional episodes of vomiting. For the past month, he has had difﬁculty walking and intermittent double vision. He was born at term and has been healthy apart from an episode of sinusitis 8 months ago that resolved spontaneously. He is at the 60th percentile for height and 50th percentile for weight. His temperature is 37.1°C (98.8°F), pulse is 80/min, and blood pressure is 105/64 mm Hg. Examination shows normal muscle strength and 2+ deep tendon reﬂexes bilaterally. He has a broad-based gait and impaired tandem gait. Fundoscopy shows bilateral swelling of the optic disc. There is esotropia of the left eye. Which of the following is the most likely diagnosis?", "opts": ["Meningioma", "Medulloblastoma", "Craniopharyngioma", "Optic glioma", "Pituitary adenoma"], "ans": 1, "exp": "Medulloblastoma is the commonest malignant brain tumour in children. It arises in the cerebellum and presents with morning headache, vomiting, ataxia, double vision and hydrocephalus. It can spread to the spinal cord, so staging includes CSF cytology.", "why": ["Meningiomas are adult tumours and are rare in a 5-year-old.", "", "Craniopharyngioma arises in the suprasellar region, causing bitemporal field loss and endocrine problems rather than ataxia.", "Optic glioma causes visual loss and proptosis, often with neurofibromatosis, rather than cerebellar signs.", "Pituitary adenomas are rare in young children and produce endocrine or field defects."], "refs": [["Johns Hopkins: medulloblastoma", "https://www.hopkinsmedicine.org/health/conditions-and-diseases/medulloblastoma"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 86}, {"group": "Surgery", "topic": "Urology", "stem": "A 70-year-old man comes to the physician for a follow-up evaluation. Eight months ago, he presented with a 6-month history of increased urinary frequency, difficulty to initiate urination, and straining to maintain the urinary stream. Digital rectal examination showed symmetrically enlarged, nontender prostate with rubbery texture. Laboratory studies showed a prostate-specific antigen (PSA) level of 2 ng/mL. Abdominal ultrasound showed a post-void residual urine volume of 250 ml and bladder wall thickening. The patient received appropriate treatment. His vital signs are within normal limits. Laboratory studies now show a PSA level of 1 ng/mL. Which of the following medications was most likely used to treat this patient's symptoms?", "opts": ["Terazosin", "Tadalafil", "Oxybutynin", "Dutasteride", "Flutamide"], "ans": 3, "exp": "Dutasteride is a 5-alpha-reductase inhibitor that blocks conversion of testosterone to DHT. In BPH it shrinks the prostate by about a quarter, roughly halves the PSA after 2 years, and cuts the risk of acute urinary retention. This explains the fall in PSA after months of treatment.", "why": ["Terazosin is an alpha blocker that relaxes smooth muscle and improves flow but does not shrink the gland or lower PSA.", "Tadalafil improves lower urinary tract symptoms but does not lower PSA.", "Oxybutynin treats overactive bladder and may worsen retention in obstruction.", "", "Flutamide is an anti-androgen used for prostate cancer, not for BPH."], "refs": [["Drugs (2008): dutasteride", "https://link.springer.com/article/10.2165/00003495-200868040-00008"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 87}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "46-year-old woman is brought to the emergency department because of pain and swelling in her right ankle after falling from her horse. She did not lose consciousness. She has type 2 diabetes mellitus. Her only medication is metformin. 9 She appears to be in acute distress. Her temperature is 36.7°C (98°F), pulse is 80/min, and blood pressure is 138/76 mm Hg. She is oriented to person, place, and time. The pupils are equal and reactive to light. Examination shows an abrasion at the left knee. The right ankle is swollen and tender; range of motion is limited by pain. Pulses and sensation are intact over the right foot. An x- ray of the right ankle is shown. Which of the following is the most appropriate long-term management for this patient?", "opts": ["Rest, ice, and elevation", "Open reduction and internal fixation", "Closed reduction and percutaneous pinning", "Splint placement", "Closed reduction and casting"], "ans": 1, "exp": "A trimalleolar ankle fracture is an unstable injury, so it needs open reduction and internal fixation to restore alignment. Casting and crutches follow the operation. Nonoperative care is only a narrow exception for stable, well-aligned fractures.", "why": ["Rest, ice and elevation are supportive and do not realign an unstable fracture.", "", "Percutaneous pinning is not used for this fracture pattern.", "A splint alone is a temporary measure and cannot hold an unstable ankle.", "Closed reduction and casting is only for stable fractures that stay aligned."], "refs": [["IntechOpen: trimalleolar fractures", "https://www.intechopen.com/chapters/1246924"]], "note": "The chapter says instability, not fragment size alone, drives the decision to operate.", "src": "Linked sources", "id": 88}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 35-year-old woman comes to the physician because of intermittent episodes of heart palpitations for 3 weeks. The palpitations are accompanied by chest pain that is sharp and localized to the left 3rd intercostal space. The patient does not smoke. She drinks one to two glasses of wine on the weekends. She appears nervous. Her pulse is 110/min and irregularly irregular, and blood pressure is 135/85 mmHg. Examination shows a fine tremor on both hands and digital swelling. There is retraction of the left upper eyelid. A systolic ejection murmur is heard along the right upper sternal border. The extremities are warm, and pulses are 2+ bilaterally. Which of the following is the most appropriate pharmacotherapy?", "opts": ["Diltiazem", "Propranolol", "Propylthiouracil", "Warfarin", "Amiodarone"], "ans": 1, "exp": "Beta-blockers such as propranolol are the initial symptomatic treatment of thyrotoxicosis, because many symptoms come from beta-adrenergic stimulation. They reduce tachycardia, tremor and anxiety while definitive therapy takes effect.", "why": ["Diltiazem is used for rate control if beta-blockers are contraindicated, and is not the usual first choice.", "", "Propylthiouracil is a definitive antithyroid drug, but does not give immediate symptom control and is reserved for special situations.", "Warfarin treats thromboembolism and is not first-line for symptom control.", "Amiodarone contains iodine and can worsen thyroid dysfunction."], "refs": [["Pharmaceutical Journal: thyrotoxicosis", "https://pharmaceutical-journal.com/article/ld/thyrotoxicosis-and-hyperthyroidism-causes-diagnosis-and-management"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 89}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 50-year-old woman comes to the physician because of palpitations and irritability. Over the past 4 months, she has had several episodes of heart racing and skipping beats that lasted between 30 seconds and several hours. She has also been arguing with her husband more, often about the temperature being too warm. The patient has also lost 8.8-kg (19.4-lb) over the past 4 months, despite being less strict with her diet. She has mild asthma treated with inhaled bronchodilators. Her pulse is 102/min and blood pressure is 148/98 mm Hg. On physical examination, the skin is warm and moist. A mass is palpated in the anterior neck area. On laboratory studies, thyroid stimulating hormone is undetectable and there are antibodies against the thyrotropin- receptor. Thyroid scintigraphy shows diffusely increased iodine uptake. Two weeks later, a single oral dose of radioactive iodine is administered. This patient will most likely require which of the following in the long- term?", "opts": ["Methimazole therapy", "Potassium iodide therapy", "Near-total thyroidectomy", "Estrogen replacement therapy", "L-thyroxine therapy"], "ans": 4, "exp": "Radioactive iodine destroys thyroid tissue, so almost all patients treated for Graves' disease end up hypothyroid and need lifelong levothyroxine. Hypothyroidism usually develops within months of treatment, and levothyroxine is started promptly.", "why": ["Methimazole is used to treat hyperthyroidism before definitive treatment, and is not needed once the gland is ablated.", "Potassium iodide is used for thyroid storm and pre-operative preparation, not long-term.", "Thyroidectomy is an alternative to radioiodine, not an addition.", "Oestrogen replacement has no role in thyroid disease.", ""], "refs": [["Pharmaceutical Journal: thyrotoxicosis", "https://pharmaceutical-journal.com/article/ld/thyrotoxicosis-and-hyperthyroidism-causes-diagnosis-and-management"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 90}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 32-year-old woman comes to the physician because of recurrent episodes of abdominal pain, bloating, and loose stools with mucus lasting several days to a couple weeks. She has had these episodes since she was 24 years old but they have worsened over the last 6 weeks. The site of the abdominal pain and the intensity of pain vary. She has around 3–4 bowel movements per day during these episodes. Menses are regular at 31 day intervals with moderate flow; she has moderate pain in her lower abdomen during menstruation. She moved from a different city 2 months ago to start a new demanding job. Her mother has been suffering from depression for 10 years. She does not smoke or drink alcohol. Her own medications include multivitamins and occasionally naproxen for pain. Temperature is 37.4°C (99.3°F), pulse is 88/min, and blood pressure is 110/82 mm Hg. Abdominal examination shows no abnormalities. Laboratory studies show: Hemoglobin 14.1 g/dL Leukocyte count 8100/mm3 Erythrocyte sedimentation rate 15 mm/h Serum Glucose 96 mg/dL Creatinine 1.1 mg/dL IgA anti-tissue transglutaminase antibodynegative Urinalysis shows no abnormalities. Further evaluation is most likely to show which of the following in this patient?", "opts": ["Cutaneous flushing", "Pruritic vesicles on both elbows and knees", "Relief of abdominal pain after defecation", "Bright red blood in the stool", "Weight loss"], "ans": 2, "exp": "In irritable bowel syndrome, recurrent abdominal pain is linked to defecation and changes in stool frequency or form, and it is often relieved by opening the bowels. Diagnosis is clinical (Rome IV), and a negative coeliac serology and normal inflammatory markers make an organic cause less likely.", "why": ["Flushing suggests carcinoid syndrome, which is rare and does not fit this long-standing pattern.", "Itchy vesicles on elbows and knees are dermatitis herpetiformis, linked with coeliac disease, and her serology is negative.", "", "Bright red blood in the stool is a red flag for organic disease, and would not be expected in IBS.", "Weight loss is a red flag for organic disease, and is not expected in IBS."], "refs": [["Pulse Reference: irritable bowel syndrome", "https://pulsereference.com/diagnoses/irritable-bowel-syndrome/"]], "note": "The source lists pain 'related to defecation' as the criterion. It doesn't say the pain is relieved by defecation, which is standard teaching.", "src": "Linked sources", "id": 91}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 73-year-old man comes to the physician because of a 4-kg (9-lb) weight loss over the last month. During this time he has not been able to eat more than one bite without coughing immediately and sometimes he regurgitates food through his nose. His symptoms are worse with liquids. One month ago he had a stroke in the right middle cerebral artery. He has a history of hypertension, type 2 diabetes mellitus, and hyperlipidemia. Current medications include aspirin, amlodipine, metformin, and simvastatin. Examination of the oropharynx, chest, and abdomen shows no abnormalities. Neurological examination shows facial drooping on the left and decreased strength in the left upper and lower extremities. Which of the following is the most appropriate next step in management?", "opts": ["Videofluoroscopy", "CT scan of the neck", "Barium swallow", "Esophageal manometry", "Upper endoscopy"], "ans": 0, "exp": "Dysphagia with coughing on swallowing after a stroke suggests oropharyngeal dysphagia. A videofluoroscopic swallow study (modified barium swallow) shows the oral, pharyngeal and upper oesophageal phases in real time and detects aspiration.", "why": ["", "CT of the neck shows structure but not the dynamics of swallowing.", "A standard barium swallow assesses the oesophagus and does not examine the pharyngeal phase as closely.", "Oesophageal manometry assesses oesophageal motility, which is not the problem here.", "Endoscopy looks for structural oesophageal disease, and the problem here is neurological."], "refs": [["Radiopaedia: modified barium swallow", "https://www.radiopaedia.org/articles/modified-barium-swallow?lang=us"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 92}, {"group": "Surgery", "topic": "Urology", "stem": "A 74-year-old man is brought to the emergency department because of lower abdominal pain for 3 hours. The pain is sharp, constant, and does not radiate. He has not urinated for 24 hours and he has not passed stool for over 3 days. He was diagnosed with herpes zoster 3 weeks ago and has been taking amitriptyline for post- herpetic neuralgia for 1 week. Last year he was diagnosed with nephrolithiasis and was treated with lithotripsy. He has a history of hypertension, benign prostatic hyperplasia, and coronary artery disease. His other medications include amlodipine, metoprolol, tamsulosin, aspirin, and simvastatin. He appears uncomfortable. His temperature is 37.3°C (99.1°F), pulse is 102/min, and blood pressure is 140/90 mm Hg. Abdominal examination shows a palpable lower midline abdominal mass that is tender to palpation. Bowel sounds are hypoactive. The remainder of the examination shows no abnormalities. A pelvic ultrasound shows an anechoic mass in the lower abdomen. Which of the following is the most appropriate next step in the management of this patient?", "opts": ["Transurethral catheterization", "Ultrasound of the prostate", "Ultrasound of the kidneys", "CT scan of the abdomen and pelvis", "Digital rectal examination"], "ans": 0, "exp": "Acute urinary retention with a large anechoic (full) bladder is treated by decompressing the bladder with catheterisation. Anticholinergic drugs such as amitriptyline and constipation are recognised contributors. Continue draining the bladder and start an alpha blocker before a trial without catheter.", "why": ["", "Prostate ultrasound can follow later, but does not relieve the painful retention.", "Kidney ultrasound can check for hydronephrosis later, but relief comes first.", "CT adds nothing to emergency management of a bladder already shown to be full.", "A rectal examination can be done, but does not relieve the retention."], "refs": [["AAFP: urinary retention in adults", "https://www.aafp.org/pubs/afp/issues/2018/1015/p496.html"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 93}, {"group": "Surgery", "topic": "Urology", "stem": "A 68-year-old man is brought to the emergency department because of progressive weakness of his lower extremities and urinary incontinence for the past 2 weeks. Over the past 2 months, he has had increasing back pain. His temperature is 37.1°C (98.8°F), pulse is 88/min, and blood pressure is 106/60 mm Hg. Examination shows an ataxic gait. Muscle strength is decreased in bilateral lower extremities. Sensation to pain, temperature, and position sense is absent in the buttocks, perineum, and lower extremities. Ankle clonus is present. Digital rectal examination is unremarkable. An x- ray of the spine shows multiple sclerotic lesions in the thoracic and lumbar vertebrae. Further evaluation of this patient is most likely to show which of the following?", "opts": ["Elevated prostate-specific antigen", "Left testicular mass", "Bence Jones protein in the urine", "Irregular, asymmetric mole", "Elevated carcinoembryonic antigen"], "ans": 0, "exp": "In an older man with back pain, sclerotic (blastic) vertebral lesions and cord compression, prostate cancer is the most likely primary. Prostate metastases to bone are usually sclerotic, and PSA is the most useful marker. Work-up begins with a raised PSA and an abnormal digital rectal examination.", "why": ["", "A testicular mass suggests germ-cell tumour, which mostly affects younger men and typically metastasises to lungs and nodes.", "Bence Jones protein indicates myeloma, which causes lytic lesions.", "An irregular mole would suggest melanoma, which usually causes lytic or mixed lesions.", "CEA is a colorectal marker, and colorectal bone metastases are less likely to be sclerotic."], "refs": [["BoneTumor.org: metastatic prostate cancer", "https://www.bonetumor.org/node/991"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 94}, {"group": "Surgery", "topic": "Vascular", "stem": "A 67-year-old man comes to the physician for a routine medical check-up prior to a scheduled elective femoropopliteal bypass surgery of his left leg. He feels well but reports occasional episodes of weakness and numbness in his left hand. He has a history of peripheral arterial disease, type 2 diabetes mellitus, hypertension, hypercholesterolemia, and gout. The patient has smoked 1 pack of cigarettes daily for the past 50 years. He drinks 3 cans of beer daily. His current medications include aspirin, metformin, enalapril, simvastatin, and febuxostat. His temperature is 37.3°C (99.1°F), pulse is 86/min, and blood pressure is 122/76 mm Hg. The lungs are clear to auscultation. Cardiac examination shows no murmurs, rubs, or gallops. Auscultation of the right side of the neck shows a bruit. There is a right-sided reducible inguinal hernia. Neurological examination shows no abnormalities. A complete blood count and serum concentrations of electrolytes, creatinine, and glucose are within the reference ranges. An electrocardiogram shows signs of mild left ventricular hypertrophy. An x-ray of the chest shows no abnormalities. Which of the following is the most appropriate next step in management?", "opts": ["Echocardiography", "Digital subtraction angiography of the neck", "CT angiography of the head", "Warfarin therapy", "Ultrasonography of the neck"], "ans": 4, "exp": "In symptomatic carotid stenosis (TIA with a bruit), duplex ultrasound of the neck is the first-line imaging test. It is non-invasive, and its sensitivity and specificity for significant stenosis are about 86-87%. CT or MR angiography can then confirm, and catheter angiography is reserved for confirmation.", "why": ["Echocardiography looks for a cardiac embolic source, which is secondary here.", "Digital subtraction angiography is invasive and is only for confirming non-invasive results.", "CT angiography of the head does not assess the extracranial carotid as the first test.", "Warfarin is not indicated for carotid atherosclerotic disease.", ""], "refs": [["GPnotebook: investigation of carotid artery stenosis", "https://gpnotebook.com/en-AU/pages/cardiovascular-medicine/carotid-artery-stenosis/investigation"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 95}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 22-year-old woman comes to the physician because of a 1-month history of persistent abdominal cramping, diarrhea, and rectal pain. During the past 2 weeks, she has had up to 4 small volumed, blood- tinged stools with mucus daily. She has also had intermittent fevers and a 4.5-kg (10-lb) weight loss during this time. She traveled to Southeast Asia 3 months ago and received all appropriate vaccinations and medications beforehand. She has no history of serious illness and takes no medications. Her temperature is 37.2°C (99°F), pulse is 90/min, respirations are 16/min, and blood pressure is 125/80 mm Hg. The abdomen is soft, and there is tenderness to palpation of the left lower quadrant with guarding but no rebound. Bowel sounds are normal. The stool is brown, and a test for occult blood is positive. Flexible sigmoidoscopy shows a granular, hyperemic, and friable rectal mucosa that bleeds easily on contact. Which of the following is this patient at greatest risk of developing?", "opts": ["Hemolytic uremic syndrome", "Colonic granulomas", "Gastric cancer", "Oral ulcers", "Colorectal cancer"], "ans": 4, "exp": "Ulcerative colitis, with bloody diarrhoea, tenesmus and a friable inflamed rectal mucosa, increases the risk of colorectal cancer. Risk depends on duration and extent, being highest in extensive colitis and not raised in proctitis alone. Surveillance colonoscopy starts about 8-10 years after onset.", "why": ["HUS follows Shiga-toxin E. coli infection and is not a long-term risk of UC.", "Granulomas are a feature of Crohn disease, not UC.", "Gastric cancer is not a recognised complication of UC.", "Oral ulcers can occur with IBD, but they are not a long-term risk of the disease.", ""], "refs": [["GPnotebook: cancer surveillance in ulcerative colitis", "https://gpnotebook.com/pages/gastroenterology/cancer-surveillance-in-ulcerative-colitis"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 96}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 66-year-old woman comes to the emergency department because of a 1-day history of severe abdominal pain, nausea, and vomiting. She has also had profuse watery diarrhea with streaks of blood for the past 5 days. She had a urinary tract infection 3 weeks ago and was treated with a 14-day course of ciprofloxacin. She appears in severe distress. Her temperature is 39.3°C (102.7°F), pulse is 110/min, and blood pressure is 100/60 mm Hg. Examination shows a distended abdomen, tenderness in the lower quadrants, and hypoactive bowel sounds; rebound tenderness and abdominal rigidity are absent. Cardiopulmonary examination shows no abnormalities. Test of the stool for occult blood is positive. Laboratory studies show: Hemoglobin 10.2 g/dL Leukocyte count28,000/mm3 Serum Na+ 133 mEq/L K+ 3.3 mEq/L - Cl 97 mEq/L Glucose 98 mg/dL Creatinine 1.3 mg/dL Two wide bore needles are inserted and intravenous fluids are administered. An abdominal x-ray of the patient would be most likely to show which of the following?", "opts": ["Large volume of gas under the right diaphragm", "String-like appearance of a bowel loop", "Dilated sigmoid colon resembling a coffee bean", "Dilated transverse colon and cut-off sign at splenic flexure", "Dilation of the colon with loss of haustration"], "ans": 4, "exp": "Toxic megacolon is non-obstructive colonic dilatation (usually of the transverse colon to at least 6 cm) with systemic toxicity, which can follow severe colitis such as C. difficile after antibiotics. Plain abdominal radiography shows the dilatation and may show lost haustral markings. Avoid colonoscopy and barium studies because of perforation risk.", "why": ["Gas under the right diaphragm indicates perforation, which is a complication rather than the expected finding here.", "A string-like loop is the 'string sign' of narrowing, as in Crohn disease.", "A dilated sigmoid resembling a coffee bean is sigmoid volvulus.", "A dilated transverse colon with a cut-off suggests an obstructing lesion at the splenic flexure.", ""], "refs": [["Radiopaedia: toxic megacolon", "https://radiopaedia.org/articles/24380"]], "note": "The source describes the dilatation on plain film but attributes loss of haustral markings to CT, so the haustration item is from your course explanation.", "src": "Linked sources", "id": 97}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 36-year-old man comes to the emergency department for the evaluation of recurrent bloody diarrhea for 4 weeks. During this time, he has also had intermittent abdominal pain. His symptoms have worsened over the past 2 days and he has also had fever and several episodes of nonbloody vomiting. He was diagnosed with ulcerative colitis three years ago but has had difficulty complying with his drug regimen. His temperature is 38.3°C (100.9°F), pulse is 112/min and regular, and blood pressure is 90/50 mm Hg. Abdominal examination shows a distended abdomen with no guarding or rebound; bowel sounds are hypoactive. Hemoglobin concentration is 10.1 g/dL, leukocyte count is 15,000/mm3, and erythrocyte sedimentation rate is 50 mm/h. Fluid resuscitation is initiated. In addition to complete bowel rest, which of the following is the most appropriate next step in the management of this patient?", "opts": ["Topical sulfasalazine and oral prednisolone", "Abdominal x-ray", "Exploratory laparotomy", "Abdominal CT scan with contrast", "Colonoscopy"], "ans": 1, "exp": "In a patient with known ulcerative colitis and a severe flare, with abdominal distension and signs of sepsis, suspect toxic megacolon. A plain abdominal X-ray is the first investigation, and shows colonic dilatation of at least 6 cm. Colonoscopy is avoided because of perforation risk.", "why": ["Topical sulfasalazine and prednisolone are treatments, but the complication should be confirmed first.", "", "Surgery is for perforation or failed medical therapy and does not come before imaging.", "CT adds information but isn't the preferred first test, and delays treatment.", "Colonoscopy risks perforating a dilated, inflamed colon."], "refs": [["Radiopaedia: toxic megacolon", "https://radiopaedia.org/articles/24380"]], "note": "The source notes that colonoscopy and barium studies should be avoided and describes plain-film dilatation. It doesn't give the full sequence of treatment.", "src": "Linked sources", "id": 98}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 55-year-old man with a 12-year history of type 2 diabetes attends his annual review. He has no urinary symptoms and normal renal function on blood tests. You are concerned about early renal involvement related to his diabetes. Blood pressure is mildly elevated. Which investigation is most appropriate to screen for early diabetic kidney disease?", "opts": ["Renal ultrasound", "Serum urea and electrolytes", "Urinary albumin-to-creatinine ratio", "Renal biopsy", "24-hour urine protein collection"], "ans": 2, "exp": "Early diabetic kidney disease shows up first as small amounts of albumin in the urine, before eGFR falls. The NICE quality indicator for diabetes is an annual urinary albumin-to-creatinine ratio (ACR), measured at diagnosis and usually yearly, alongside eGFR. It is a simple spot urine test, so it is the screening tool of choice.", "why": ["Ultrasound shows kidney size and structure but is insensitive for early diabetic damage, so it is not a screening test.", "Urea and electrolytes (and eGFR) can look normal while albuminuria is already present, so they miss early disease.", "", "Biopsy is invasive and reserved for atypical presentations, not screening.", "A 24-hour collection is cumbersome and unnecessary because a spot ACR is as useful for screening."], "refs": [["NICE indicator IND111: annual albumin-creatinine ratio in diabetes", "https://www.nice.org.uk/indicators/ind111-diabetes-annual-albumin-creatinine-test/chapter/indicator"]], "note": "", "src": "NICE", "id": 99}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 49-year-old woman presents with progressive weakness affecting her thighs and shoulders. She reports recent weight gain, easy bruising, and mood changes over several months. On examination, she has central obesity and proximal muscle weakness. Blood pressure is elevated. What is the most appropriate initial investigation?", "opts": ["Serum ACTH concentration", "Low-dose dexamethasone suppression test", "MRI of the pituitary gland", "Short Synacthen test", "24-hour urinary catecholamines"], "ans": 1, "exp": "The picture suggests Cushing syndrome (excess cortisol). Before looking for the cause, you first confirm that cortisol excess exists using a screening test: the low-dose (1 mg overnight) dexamethasone suppression test, late-night salivary cortisol or 24-hour urinary free cortisol. In a normal person dexamethasone suppresses cortisol; in Cushing syndrome it does not.", "why": ["ACTH is measured after hypercortisolism is confirmed, to separate pituitary/ectopic from adrenal causes.", "", "Pituitary MRI comes only after biochemical confirmation and a raised or normal ACTH, because incidental pituitary lesions are common.", "The short Synacthen test checks for adrenal insufficiency (too little cortisol), the opposite problem.", "Urinary catecholamines screen for phaeochromocytoma, which causes episodic sweating, palpitations and hypertension, not this picture."], "refs": [["Screening tests for Cushing syndrome (PMC9387700)", "https://pmc.ncbi.nlm.nih.gov/articles/PMC9387700/"]], "note": "Heads-up: the source lists the low-dose dexamethasone suppression test among the standard screening tests rather than calling it uniquely 'first-line'. It is the best answer here because the other options are not screening tests.", "src": "Review article on Cushing screening", "id": 100}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 34-year-old woman presents with fatigue, nausea, and unintentional weight loss. She reports increased skin darkening despite minimal sun exposure. Examination reveals postural hypotension. Blood tests show hyponatraemia and hyperkalaemia. What is the most appropriate immediate management?", "opts": ["Oral fludrocortisone", "IV hydrocortisone", "Oral prednisolone", "IV insulin and glucose", "IV normal saline only"], "ans": 1, "exp": "Pigmentation, postural hypotension, low sodium and high potassium point to primary adrenal insufficiency (Addison disease) with impending adrenal crisis. The Society for Endocrinology says to give hydrocortisone 100 mg IV or IM straight away together with rapid IV saline, without waiting for test results. Mineralocorticoid replacement comes later.", "why": ["Fludrocortisone is long-term replacement; it will not treat the life-threatening cortisol deficiency fast enough.", "", "Oral steroid is too slow in a patient who is hypotensive and vomiting; the route should be parenteral.", "Insulin and glucose treat severe hyperkalaemia, but here the potassium rise is from aldosterone deficiency and corrects with steroid and fluid.", "Saline is needed too, but fluids alone without hydrocortisone leave the cortisol deficiency untreated."], "refs": [["Society for Endocrinology: management of adrenal crisis", "https://www.endocrinology.org/media/3716/management-of-adrenal-crisis.pdf"]], "note": "", "src": "Society for E
