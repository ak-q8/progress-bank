ymphoma. The alcohol pain is rare but very specific.", "why": ["", "Reactive nodes are tender and follow an infection, and are not painful with alcohol.", "Glandular fever gives sore throat, fever and fatigue with tender nodes.", "Metastatic SCC occurs in older smokers with a hard fixed node.", "TB nodes are matted and may form a cold abscess or sinus."], "refs": [["MD Anderson: Hodgkin lymphoma symptoms", "https://www.mdanderson.org/cancer-types/hodgkin-lymphoma/hodgkin-lymphoma-symptoms.html"]], "note": "The source confirms painless rubbery nodes and alcohol-related node pain as rare but very specific. The comparison conditions are standard teaching.", "src": "Linked sources", "id": 213}, {"group": "Surgery", "topic": "ENT", "stem": "A 64-year-old smoker has a persistent, non-tender, hard, tethered lump in his upper neck. What is the most likely diagnosis?", "opts": ["Metastatic squamous cell carcinoma from the upper aerodigestive tract", "Reactive lymph node", "Lipoma", "Branchial cyst", "Lymphoma"], "ans": 0, "exp": "A solitary, firm, painless upper neck lump in a smoker should be treated as metastatic squamous cell carcinoma until proven otherwise, and the upper aerodigestive tract needs examining.", "why": ["", "Reactive nodes are usually tender, follow an infection and settle.", "A lipoma is soft and mobile, usually present for years.", "A branchial cyst is soft and fluctuant in a younger patient.", "Lymphoma nodes more often feel rubbery and may be multiple, and the smoking history points toward SCC."], "refs": [["Pulse Today: neck lumps in the head and neck clinic", "https://www.pulsetoday.co.uk/clinical-feature/clinical-areas/ear-nose-and-throat/head-and-neck-clinic-neck-lumps/"]], "note": "The source calls metastatic SCC the key diagnosis to exclude in a solitary upper neck lump and says smoking should raise suspicion. It does not mention 'tethered' or 'hard' as features of malignancy.", "src": "Linked sources", "id": 214}, {"group": "Surgery", "topic": "ENT", "stem": "A 30-year-old has ear pain, fever and a bulging, red, inflamed tympanic membrane. Which organism is the most likely cause?", "opts": ["Streptococcus pneumoniae", "Pseudomonas aeruginosa", "Staphylococcus epidermidis", "Mycobacterium tuberculosis", "Candida albicans"], "ans": 0, "exp": "A bulging, erythematous drum with fever and otalgia is acute otitis media, and Streptococcus pneumoniae (with Moraxella catarrhalis and non-typeable Haemophilus influenzae) is the commonest bacterial cause.", "why": ["", "Pseudomonas is the leading cause of otitis externa, not of middle ear infection.", "S. epidermidis is a skin commensal and not a typical cause.", "TB otitis is rare and painless with chronic discharge.", "Candida can cause otomycosis in the ear canal, not an acute bulging drum."], "refs": [["MSD Manual: acute otitis media", "https://msdmanuals.com/professional/ear-nose-and-throat-disorders/middle-ear-and-tympanic-membrane-disorders/otitis-media-acute"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 215}, {"group": "Surgery", "topic": "ENT", "stem": "A 28-year-old keen swimmer has ear pain, discharge and an inflamed external ear canal. Which organism is the most likely cause?", "opts": ["Pseudomonas aeruginosa", "Streptococcus pneumoniae", "Streptococcus pyogenes", "Mycobacterium tuberculosis", "Epstein-Barr virus"], "ans": 0, "exp": "Acute otitis externa is most often caused by Pseudomonas, and water in the ear canal and swimming are predisposing factors.", "why": ["", "Pneumococcus is the leading cause of otitis media.", "Group A streptococcus causes tonsillitis and occasional otitis media.", "TB is a rare cause of chronic ear disease.", "EBV causes glandular fever, not ear canal infection."], "refs": [["MSD Manual: acute external otitis", "https://www.msdmanuals.com/professional/ear,-nose,-and-throat-disorders/external-ear-disorders/external-otitis-acute"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 216}, {"group": "Surgery", "topic": "ENT", "stem": "A 24-year-old has bilateral swelling and tenderness of the parotid glands with low-grade fever. What is the most likely cause?", "opts": ["Mumps", "Staphylococcus aureus parotitis", "Salivary duct stone", "Sjögren's syndrome", "Parotid pleomorphic adenoma"], "ans": 0, "exp": "Tender parotid swelling, often bilateral, with fever and malaise suggests mumps. Orchitis occurs in about 30% of unvaccinated post-pubertal males.", "why": ["", "Bacterial parotitis is usually unilateral with pus from the duct, in dehydrated or elderly patients.", "A stone causes pain and swelling that worsens with eating, usually in the submandibular gland.", "Sjögren's gives chronic dry eyes and mouth with slow gland enlargement.", "A pleomorphic adenoma is a slow-growing painless unilateral lump."], "refs": [["MSD Manual: mumps", "https://www.msdmanuals.com/professional/pediatrics/viral-exanthems-in-infants-and-children/mumps"]], "note": "The source confirms parotitis (unilateral or bilateral) and the orchitis risk. The other conditions are standard teaching.", "src": "Linked sources", "id": 217}, {"group": "Surgery", "topic": "ENT", "stem": "A 17-year-old with sore throat, lymphadenopathy, fatigue and fever is given amoxicillin and develops an intensely itchy maculopapular rash. What is the most likely cause of the illness?", "opts": ["Epstein-Barr virus", "Streptococcus pyogenes", "Cytomegalovirus", "Adenovirus", "Neisseria gonorrhoeae"], "ans": 0, "exp": "Glandular fever (EBV) causes sore throat, fever and lymphadenopathy, and 80 to 90% of patients given ampicillin or amoxicillin develop a rash.", "why": ["", "Group A strep tonsillitis responds to penicillin and does not usually cause an amoxicillin rash.", "CMV can cause a similar illness but the amoxicillin rash is the classic clue for EBV.", "Adenovirus causes sore throat and conjunctivitis without this reaction.", "Gonococcal pharyngitis is rare and not associated with an amoxicillin rash."], "refs": [["Patient Care Online: infectious mononucleosis", "https://www.patientcareonline.com/view/infectious-mononucleosis"]], "note": "The source confirms EBV as the cause, fever, sore throat and lymphadenopathy as classic symptoms, and a rash in 80-90% given ampicillin/amoxicillin. It does not mention fatigue.", "src": "Linked sources", "id": 218}, {"group": "Surgery", "topic": "ENT", "stem": "A 58-year-old with poor oral hygiene has rapid-onset painful, bleeding gums with ulcerated interdental tissue. Which organisms are most likely responsible?", "opts": ["Anaerobic bacteria", "Streptococcus pyogenes", "Candida albicans", "Herpes simplex virus", "Staphylococcus aureus"], "ans": 0, "exp": "This is necrotising gingivitis, a mixed infection by anaerobes such as Prevotella and Fusobacterium with spirochetes. Poor oral hygiene, smoking, stress and poor nutrition are risk factors.", "why": ["", "Group A strep causes pharyngitis rather than necrotic gum disease.", "Candida causes white plaques that wipe off, not painful necrotic gums.", "HSV gingivostomatitis gives vesicles and is mainly in children.", "Staph aureus is not the key organism in necrotising gingivitis."], "refs": [["Wikipedia: necrotizing gingivitis", "https://en.wikipedia.org/wiki/Trench_mouth"]], "note": "This is a general encyclopedia source, not a guideline. It confirms the pain and bleeding, risk factors and anaerobic organisms.", "src": "Linked sources", "id": 219}, {"group": "Surgery", "topic": "ENT", "stem": "A 32-year-old has acute-onset vertigo and hearing loss after a recent viral upper respiratory tract infection. What is the most likely diagnosis?", "opts": ["Labyrinthitis", "Vestibular neuronitis", "Ménière's disease", "Benign paroxysmal positional vertigo", "Acoustic neuroma"], "ans": 0, "exp": "Vertigo with hearing loss or tinnitus after a viral illness is viral labyrinthitis. Vestibular neuronitis causes vertigo without hearing symptoms.", "why": ["", "Neuronitis causes vertigo only, with no hearing loss or tinnitus.", "Ménière's causes recurrent episodes with fluctuating hearing loss, not a single post-viral attack.", "BPPV causes brief episodes triggered by head position and no hearing loss.", "Acoustic neuroma causes slowly progressive unilateral hearing loss."], "refs": [["MSD Manual: vestibular neuronitis", "https://www.msdmanuals.com/professional/ear-nose-and-throat-disorders/inner-ear-disorders/vestibular-neuronitis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 220}, {"group": "Surgery", "topic": "ENT", "stem": "A 28-year-old has acute vertigo and vomiting after a recent viral upper respiratory infection, with no hearing loss, tinnitus or other symptoms. What is the most likely diagnosis?", "opts": ["Vestibular neuronitis", "Labyrinthitis", "Ménière's disease", "Posterior circulation stroke", "Vestibular migraine"], "ans": 0, "exp": "A single episode of isolated vertigo after a viral illness without hearing symptoms is vestibular neuronitis. It is usually due to viral or post-viral inflammation of the vestibular nerve.", "why": ["", "Labyrinthitis would include hearing loss, tinnitus or both.", "Ménière's disease is recurrent and includes hearing loss and tinnitus.", "A stroke is more likely with older age, vascular risk factors and other brainstem signs.", "Vestibular migraine needs a migraine history and recurrent episodes."], "refs": [["MSD Manual: vestibular neuronitis", "https://www.msdmanuals.com/professional/ear-nose-and-throat-disorders/inner-ear-disorders/vestibular-neuronitis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 221}, {"group": "Surgery", "topic": "ENT", "stem": "A 78-year-old has recurrent short episodes of vertigo triggered by rolling over in bed. What is the most likely diagnosis, and what test confirms it?", "opts": ["Benign paroxysmal positional vertigo; Dix-Hallpike test", "Ménière's disease; audiometry", "Vestibular neuronitis; head impulse test", "Posterior circulation stroke; CT head", "Acoustic neuroma; MRI"], "ans": 0, "exp": "Brief vertigo triggered by changes in head position, such as rolling over in bed, is BPPV. The Dix-Hallpike test, which produces torsional nystagmus, is diagnostic, and the Epley manoeuvre treats posterior canal BPPV.", "why": ["", "Ménière's disease gives spontaneous episodes lasting minutes to hours with hearing loss.", "Neuronitis gives continuous vertigo for days, not position-triggered bursts.", "A stroke causes persistent symptoms with other neurological signs.", "Acoustic neuroma causes slowly progressive hearing loss rather than position-triggered vertigo."], "refs": [["Pulse Reference: benign positional vertigo", "https://pulsereference.com/diagnoses/benign-positional-vertigo/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 222}, {"group": "Surgery", "topic": "ENT", "stem": "A 45-year-old has recurrent attacks of vertigo with unilateral hearing loss, tinnitus and a feeling of fullness in the ear. What is the most likely diagnosis?", "opts": ["Ménière's disease", "Benign paroxysmal positional vertigo", "Vestibular neuronitis", "Acoustic neuroma", "Vestibular migraine"], "ans": 0, "exp": "The triad of episodic vertigo, fluctuating sensorineural hearing loss and tinnitus, with aural fullness, is Ménière's disease.", "why": ["", "BPPV has no hearing symptoms.", "Neuronitis is a single prolonged episode without hearing loss.", "Acoustic neuroma gives slowly progressive unilateral hearing loss without discrete attacks.", "Vestibular migraine has migrainous features and usually no progressive hearing loss."], "refs": [["LITFL: Ménière's disease", "https://litfl.com/menieres-disease/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 223}, {"group": "Surgery", "topic": "ENT", "stem": "A 50-year-old has gradual, persistent vertigo, unilateral hearing loss, tinnitus and facial nerve palsy. What is the most likely diagnosis, and which test is best for it?", "opts": ["Vestibular schwannoma; gadolinium-enhanced MRI", "Ménière's disease; audiometry only", "Labyrinthitis; CT head", "BPPV; Dix-Hallpike", "Otosclerosis; tympanometry"], "ans": 0, "exp": "Slowly progressive unilateral sensorineural hearing loss with tinnitus and later facial nerve involvement suggests a vestibular schwannoma (acoustic neuroma). Gadolinium-enhanced MRI is the preferred test.", "why": ["", "Ménière's disease is episodic and does not cause facial palsy; audiometry alone would not exclude a tumour.", "Labyrinthitis is acute and not progressive.", "BPPV is position-triggered and has no hearing loss or facial weakness.", "Otosclerosis causes conductive hearing loss and no facial palsy."], "refs": [["MSD Manual: vestibular schwannoma", "https://msdmanuals.com/professional/ear-nose-and-throat-disorders/inner-ear-disorders/vestibular-schwannoma"]], "note": "The source describes slowly progressive unilateral hearing loss, tinnitus, facial nerve involvement and MRI with gadolinium. The comparison conditions are standard teaching.", "src": "Linked sources", "id": 224}, {"group": "Surgery", "topic": "ENT", "stem": "A 70-year-old hypertensive man has sudden-onset vertigo, double vision and a wide-based, unsteady gait. What is the most likely diagnosis?", "opts": ["Posterior circulation infarction", "Vestibular neuronitis", "BPPV", "Ménière's disease", "Labyrinthitis"], "ans": 0, "exp": "Sudden vertigo with gait ataxia and other brainstem or cerebellar symptoms in an older patient with vascular risk factors suggests a posterior circulation stroke, which can mimic a peripheral vestibular problem.", "why": ["", "Neuronitis does not cause double vision and the patient can usually walk with support.", "BPPV is triggered by head position and lasts seconds.", "Ménière's has hearing loss and tinnitus, with no diplopia.", "Labyrinthitis has hearing loss and no brainstem signs."], "refs": [["emDocs: posterior circulation strokes and dizziness", "https://www.emdocs.net/posterior-circulation-strokes-dizziness-pearls-pitfalls/"]], "note": "The source confirms vertigo, ataxia, vision changes and the importance of vascular risk factors. It does not name diplopia or a wide-based gait specifically.", "src": "Linked sources", "id": 225}, {"group": "Surgery", "topic": "ENT", "stem": "A 40-year-old woman has episodes of vertigo lasting several hours with flashing lights in both eyes. She has a history of migraine. What is the most likely diagnosis?", "opts": ["Vestibular migraine", "Ménière's disease", "BPPV", "Posterior circulation transient ischaemic attack", "Vestibular neuronitis"], "ans": 0, "exp": "Recurrent vestibular symptoms lasting 5 minutes to 72 hours with migrainous features (such as visual aura, photophobia or headache) in someone with a migraine history is vestibular migraine.", "why": ["", "Ménière's disease includes fluctuating hearing loss and tinnitus, and no visual aura.", "BPPV lasts seconds and is triggered by head position.", "A TIA would be a sudden event in a patient with vascular risk factors and does not recur with visual aura in a migraine patient.", "Neuronitis is a single prolonged attack after a viral illness."], "refs": [["ICHD-3: vestibular migraine", "https://ichd-3.org/appendix/a1-migraine/a1-6-episodic-syndromes-that-may-be-associated-with-migraine/a1-6-6-vestibular-migraine/"]], "note": "The criteria confirm episodes of 5 minutes to 72 hours, a migraine history and migrainous features including visual aura. The comparison conditions are standard teaching.", "src": "Linked sources", "id": 226}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 32-year-old breastfeeding woman has a firm, mobile, painless lump near the areola. What is the most likely diagnosis?", "opts": ["Galactocele", "Fibroadenoma", "Breast abscess", "Phyllodes tumour", "Breast cancer"], "ans": 0, "exp": "A painless, round, mobile, soft-to-firm breast lump during or shortly after lactation is a galactocele, a milk-retention cyst caused by obstruction of a lactiferous duct.", "why": ["", "A fibroadenoma is also painless and mobile, but the lactation setting points to a galactocele.", "An abscess is painful and fluctuant with fever and erythema.", "A phyllodes tumour is a rapidly growing, usually large mass.", "Cancer is usually hard and irregular, with tethering or nipple changes."], "refs": [["Osmosis: galactocele", "https://www.osmosis.org/answers/galactocele"]], "note": "The source confirms the painless mobile lump after lactation and the duct obstruction cause. It does not give a position under the areola.", "src": "Linked sources", "id": 227}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 50-year-old perimenopausal smoker has a dirty, blood-stained nipple discharge from several ducts and a newly inverted nipple. What is the most likely diagnosis?", "opts": ["Mammary duct ectasia", "Intraductal papilloma", "Galactocele", "Paget's disease of the nipple", "Fibroadenosis"], "ans": 0, "exp": "Mammary duct ectasia typically occurs around age 45 to 55 with a dirty white, yellow, green, black or bloody discharge, and smoking increases the risk. A newly inverted nipple still needs checking to exclude cancer.", "why": ["", "A papilloma usually gives a bloody discharge from a single duct.", "A galactocele is a lump during lactation.", "Paget's disease gives an eczematous, scaly nipple.", "Fibroadenosis causes cyclical pain and lumpiness, without a nipple discharge."], "refs": [["Mayo Clinic: mammary duct ectasia", "https://www.mayoclinic.org/health/medical/IM01880"]], "note": "The source confirms age 45-55, the discharge colours, smoking and the need to check a newly inverted nipple. It does not mention papilloma or Paget's disease; those contrasts are standard teaching.", "src": "Linked sources", "id": 228}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 45-year-old woman has a large, fast-growing breast lump. What is the most likely diagnosis?", "opts": ["Phyllodes tumour", "Fibroadenoma", "Fat necrosis", "Galactocele", "Mammary duct ectasia"], "ans": 0, "exp": "A rapidly growing breast mass in a woman in her 40s suggests a phyllodes tumour, which most often arises in the fifth decade.", "why": ["", "Fibroadenomas are small and slow-growing in women under 35.", "Fat necrosis follows trauma and is usually a small, hard lump.", "A galactocele relates to lactation.", "Duct ectasia causes discharge and nipple changes rather than a fast-growing mass."], "refs": [["PMC: phyllodes tumour (BMC Cancer case report)", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4690405"]], "note": "The source confirms the fifth decade and rapid growth. It does not describe fibroadenoma features, so those contrasts are standard teaching.", "src": "Linked sources", "id": 229}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 30-year-old woman has generalised lumpiness and tenderness in both breasts that fluctuates with her menstrual cycle. What is the most likely diagnosis?", "opts": ["Fibrocystic breast changes", "Breast cancer", "Mammary duct ectasia", "Breast abscess", "Phyllodes tumour"], "ans": 0, "exp": "Cyclical lumpy, tender breasts in a premenopausal woman are fibrocystic changes, related to cyclical hormonal fluctuation (especially oestrogen).", "why": ["", "Cancer typically causes a single hard lump that does not vary with the cycle.", "Duct ectasia occurs in perimenopausal women with nipple discharge.", "An abscess is a single, painful, fluctuant mass with fever.", "A phyllodes tumour is a single, rapidly growing mass."], "refs": [["Cleveland Clinic: fibrocystic breasts", "https://my.clevelandclinic.org/health/diseases/22080-fibrocystic-breasts"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 230}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 48-year-old has a painless breast lump, nipple inversion and skin puckering. What is the most likely diagnosis?", "opts": ["Breast cancer", "Fat necrosis", "Fibrocystic change", "Breast abscess", "Galactocele"], "ans": 0, "exp": "A hard lump tethered to surrounding tissue, with recent nipple inversion and skin dimpling or peau d'orange, is breast cancer until proven otherwise.", "why": ["", "Fat necrosis follows trauma and the history would say so.", "Fibrocystic change is bilateral and cyclical, with no skin tethering.", "An abscess is painful and fluctuant with fever.", "A galactocele is a soft, mobile cyst linked to lactation."], "refs": [["GPnotebook: breast cancer clinical presentation", "https://gpnotebook.com/en-GB/pages/oncology/breast-cancer/clinical-presentation"]], "note": "The source lists hard, tethered lumps, recent nipple inversion, dimpling and peau d'orange. It does not state that the lump is painless or irregular.", "src": "Linked sources", "id": 231}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 43-year-old woman has a painful, fluctuant breast lump with skin erythema and fever. What is the usual first-line approach?", "opts": ["Needle aspiration (guided by ultrasound) with appropriate antibiotics", "Immediate mastectomy", "Wide local excision", "Reassurance only", "Radiotherapy"], "ans": 0, "exp": "This is a breast abscess, usually caused by Staphylococcus aureus. Ultrasound confirms a collection, and needle aspiration with antibiotics is first-line, with surgical drainage if it persists or the skin is ischaemic.", "why": ["", "Mastectomy is for cancer, not for infection.", "Excision is not needed for an acute abscess.", "An untreated abscess can spread and needs drainage plus antibiotics.", "Radiotherapy has no role in an infective collection."], "refs": [["WikEM: breast abscess", "https://wikem.org/wiki/Breast_abscess"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 232}, {"group": "Surgery", "topic": "Respiratory", "stem": "Which type of lung cancer is most associated with hypercalcaemia due to ectopic parathyroid hormone-related peptide release?", "opts": ["Squamous cell carcinoma", "Small cell carcinoma", "Adenocarcinoma", "Large cell carcinoma", "Carcinoid tumour"], "ans": 0, "exp": "Squamous cell carcinoma, typically central, releases PTHrP and causes hypercalcaemia.", "why": ["", "Small cell carcinoma causes SIADH, ectopic ACTH and Lambert-Eaton syndrome.", "Adenocarcinoma, typically peripheral, is associated with clubbing.", "Large cell carcinoma is not the classic cause of PTHrP release.", "Carcinoid tumours cause flushing and diarrhoea via serotonin."], "refs": [["Medibuddy: presentation of lung cancer", "https://medibuddy.co.uk/mrcp-2-explanations/general-oncology/lung-cancer/presentation-of-lung-cancer/"]], "note": "The source confirms PTHrP in squamous cell carcinoma and the SCLC features. Large cell and carcinoid points are standard teaching.", "src": "Linked sources", "id": 233}, {"group": "Surgery", "topic": "Respiratory", "stem": "A 60-year-old smoker with a central lung mass has hyponatraemia with concentrated urine and no oedema. Which tumour type is most likely?", "opts": ["Small cell lung cancer", "Squamous cell carcinoma", "Adenocarcinoma", "Mesothelioma", "Pancoast tumour"], "ans": 0, "exp": "Small cell lung cancer causes SIADH through ectopic ADH, giving hyponatraemia with inappropriately concentrated urine.", "why": ["", "Squamous cell carcinoma is linked with hypercalcaemia.", "Adenocarcinoma is peripheral and linked with clubbing.", "Mesothelioma arises from the pleura after asbestos exposure.", "A Pancoast tumour presents with shoulder pain and Horner's syndrome."], "refs": [["Medibuddy: presentation of lung cancer", "https://medibuddy.co.uk/mrcp-2-explanations/general-oncology/lung-cancer/presentation-of-lung-cancer/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 234}, {"group": "Surgery", "topic": "Respiratory", "stem": "A smoker with lung cancer has proximal muscle weakness that improves with repeated use, dry mouth and absent reflexes. Which tumour is the most likely cause?", "opts": ["Small cell lung cancer", "Squamous cell carcinoma", "Adenocarcinoma", "Bronchial carcinoid", "Mesothelioma"], "ans": 0, "exp": "Lambert-Eaton myasthenic syndrome is a paraneoplastic condition seen with small cell lung cancer, and weakness improves with repeated use, unlike myasthenia gravis.", "why": ["", "Squamous cell carcinoma is linked with PTHrP-mediated hypercalcaemia.", "Adenocarcinoma is linked with clubbing.", "Carcinoid causes flushing and diarrhoea.", "Mesothelioma is not associated with LEMS."], "refs": [["Medibuddy: presentation of lung cancer", "https://medibuddy.co.uk/mrcp-2-explanations/general-oncology/lung-cancer/presentation-of-lung-cancer/"]], "note": "The source lists LEMS with small cell lung cancer. The 'improves with use' detail is standard neurology teaching.", "src": "Linked sources", "id": 235}, {"group": "Surgery", "topic": "Respiratory", "stem": "A man with lung cancer develops Cushing's syndrome with hypokalaemia and rapid onset. Which tumour is the most likely cause?", "opts": ["Small cell lung cancer", "Squamous cell carcinoma", "Adenocarcinoma", "Pituitary adenoma", "Adrenal adenoma"], "ans": 0, "exp": "Small cell lung cancer can secrete ACTH ectopically, producing Cushing's syndrome.", "why": ["", "Squamous cell carcinoma is linked to hypercalcaemia.", "Adenocarcinoma is linked to clubbing.", "The question states the patient has lung cancer, and a pituitary adenoma would not be the paraneoplastic cause.", "An adrenal adenoma would not give a lung cancer association."], "refs": [["Medibuddy: presentation of lung cancer", "https://medibuddy.co.uk/mrcp-2-explanations/general-oncology/lung-cancer/presentation-of-lung-cancer/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 236}, {"group": "Surgery", "topic": "Respiratory", "stem": "A man has shoulder pain spreading down the ulnar border of his arm, with hand muscle wasting and a ptosis and miosis on the same side. What is the most likely diagnosis?", "opts": ["Pancoast tumour", "Cervical rib", "Brachial neuritis", "Thoracic outlet syndrome", "Rotator cuff tear"], "ans": 0, "exp": "An apical lung (superior sulcus) tumour invades the brachial plexus and sympathetic chain, causing shoulder and ulnar-distribution pain, hand wasting and Horner syndrome.", "why": ["", "A cervical rib can cause thoracic outlet symptoms but not Horner syndrome with a lung mass.", "Brachial neuritis causes acute shoulder pain followed by weakness without Horner syndrome.", "Thoracic outlet syndrome does not cause Horner syndrome from tumour invasion.", "A rotator cuff tear does not cause nerve and sympathetic findings."], "refs": [["LITFL: Pancoast syndrome", "https://litfl.com/pancoast-syndrome"]], "note": "The source confirms apical tumour, shoulder pain spreading along the ulnar nerve with wasting, and Horner syndrome (in about 25%). It describes Horner's features only generally, not as ptosis and miosis.", "src": "Linked sources", "id": 237}, {"group": "Surgery", "topic": "Respiratory", "stem": "Which tumour is most associated with asbestos exposure and has a median latency of about 40 years?", "opts": ["Mesothelioma", "Small cell lung cancer", "Adenocarcinoma of the lung", "Pulmonary carcinoid", "Squamous cell carcinoma of the lung"], "ans": 0, "exp": "Mesothelioma is a malignant tumour of the pleura or peritoneum, mostly caused by asbestos exposure, with a median latency of about 40 years.", "why": ["", "Small cell lung cancer is strongly linked to smoking.", "Asbestos increases lung cancer risk, but mesothelioma is the characteristic tumour.", "Carcinoids are neuroendocrine tumours unrelated to asbestos.", "Squamous cell carcinoma is mainly linked to smoking."], "refs": [["MSD Manual: asbestos-related disorders", "https://www.msdmanuals.com/professional/pulmonary-disorders/environmental-pulmonary-diseases/overview-of-asbestos-related-disorders"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 238}, {"group": "Surgery", "topic": "Cardiology", "stem": "A child has a widely split, fixed second heart sound and a mid-systolic ejection murmur at the upper left sternal border. What is the most likely diagnosis?", "opts": ["Atrial septal defect", "Ventricular septal defect", "Aortic stenosis", "Mitral regurgitation", "Patent ductus arteriosus"], "ans": 0, "exp": "A fixed, widely split S2 with a systolic ejection murmur at the upper left sternal border is an atrial septal defect.", "why": ["", "A VSD gives a harsh pansystolic murmur at the lower left sternal edge.", "Aortic stenosis radiates to the carotids and has a normal or soft S2.", "Mitral regurgitation gives a pansystolic apical murmur radiating to the axilla.", "A PDA gives a continuous 'machinery' murmur."], "refs": [["MSD Manual: atrial septal defect", "https://www.msdmanuals.com/professional/pediatrics/congenital-cardiovascular-anomalies/atrial-septal-defect-asd"]], "note": "The source confirms the fixed split S2 and the murmur at the upper left sternal border. The contrasts with other lesions are standard teaching.", "src": "Linked sources", "id": 239}, {"group": "Surgery", "topic": "Cardiology", "stem": "An ejection-systolic, crescendo-decrescendo murmur radiates to the carotid arteries. What is the most likely valve lesion?", "opts": ["Aortic stenosis", "Mitral regurgitation", "Ventricular septal defect", "Mitral stenosis", "Pulmonary stenosis"], "ans": 0, "exp": "A crescendo-decrescendo ejection systolic murmur that radiates to the carotids is aortic stenosis.", "why": ["", "Mitral regurgitation is pansystolic and radiates to the axilla.", "A VSD is pansystolic at the left sternal edge.", "Mitral stenosis gives a mid-diastolic rumbling murmur.", "Pulmonary stenosis is best heard at the upper left sternal edge and does not radiate to the carotids."], "refs": [["PulseNotes: murmurs", "https://app.pulsenotes.com/medicine/cardiology/notes/murmurs"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 240}, {"group": "Surgery", "topic": "Cardiology", "stem": "A pansystolic, high-pitched blowing murmur is heard at the apex and radiates to the axilla. What is the most likely diagnosis?", "opts": ["Mitral regurgitation", "Aortic stenosis", "Aortic regurgitation", "Mitral stenosis", "Ventricular septal defect"], "ans": 0, "exp": "A pansystolic murmur at the apex that may radiate to the axilla is mitral regurgitation.", "why": ["", "Aortic stenosis is an ejection systolic murmur radiating to the carotids.", "Aortic regurgitation causes an early diastolic murmur.", "Mitral stenosis causes a mid-diastolic rumble.", "A VSD is heard at the left sternal edge, not the apex."], "refs": [["PulseNotes: murmurs", "https://app.pulsenotes.com/medicine/cardiology/notes/murmurs"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 241}, {"group": "Surgery", "topic": "Cardiology", "stem": "A pansystolic murmur is heard most prominently at the lower left sternal border. What is the most likely diagnosis?", "opts": ["Ventricular septal defect", "Atrial septal defect", "Mitral regurgitation", "Aortic stenosis", "Coarctation of the aorta"], "ans": 0, "exp": "A harsh pansystolic murmur at the lower left sternal border is the hallmark of a ventricular septal defect.", "why": ["", "An ASD gives a fixed split S2 and an ejection murmur at the upper left sternal border.", "Mitral regurgitation is loudest at the apex.", "Aortic stenosis is an ejection systolic murmur radiating to the carotids.", "Coarctation gives a continuous interscapular murmur in this source and differences in pulses."], "refs": [["Pediatric Education: acyanotic congenital heart disease", "https://pediatriceducation.org/2020/08/17/what-are-the-main-acyanotic-congenital-heart-diseases/"]], "note": "The source describes a harsh pansystolic murmur at the lower left sternal border. The ASD, mitral and aortic contrasts are standard teaching.", "src": "Linked sources", "id": 242}, {"group": "Surgery", "topic": "Urology", "stem": "A 38-year-old man has an uncomplicated lower urinary tract infection. Which regimen is a NICE first-choice oral option?", "opts": ["Trimethoprim 200 mg twice daily for 7 days", "Nitrofurantoin for 3 days", "Ciprofloxacin for 14 days", "Gentamicin for 7 days", "Cefalexin for 14 days"], "ans": 0, "exp": "For men with a lower UTI, NICE first-choice options are trimethoprim 200 mg twice daily or nitrofurantoin (if eGFR 45 or above) for 7 days. Nitrofurantoin is not used if prostate involvement is suspected.", "why": ["", "The 3-day course is for non-pregnant women; men need 7 days.", "Fluoroquinolones are reserved for when other first-choice antibiotics are unsuitable, and 14 days is a prostatitis-length course.", "Gentamicin is an IV option for severe upper tract infection.", "Cefalexin is not first-choice for a lower UTI in men."], "refs": [["NICE NG109: lower UTI antimicrobial prescribing", "https://www.nice.org.uk/guidance/NG109/chapter/recommendations"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 243}, {"group": "Surgery", "topic": "Urology", "stem": "A 21-year-old woman has an uncomplicated lower urinary tract infection. What is the recommended first-choice treatment duration with nitrofurantoin?", "opts": ["3 days", "1 day", "7 days", "14 days", "28 days"], "ans": 0, "exp": "For non-pregnant women aged 16 and over, nitrofurantoin (if eGFR is 45 or above) is given for 3 days, as is trimethoprim 200 mg twice daily if resistance risk is low.", "why": ["", "A single-day course is not the NICE regimen for nitrofurantoin.", "Seven days is for men and pregnant women.", "Fourteen days is a prostatitis or upper tract regimen, not for simple cystitis.", "Four weeks is far too long and is not used for simple cystitis."], "refs": [["NICE NG109: lower UTI antimicrobial prescribing", "https://www.nice.org.uk/guidance/NG109/chapter/recommendations"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 244}, {"group": "Surgery", "topic": "Urology", "stem": "A 32-year-old woman has pyelonephritis and is systemically well. Which oral antibiotic regimen is a NICE first-choice option?", "opts": ["Cefalexin for 7 to 10 days", "Nitrofurantoin for 3 days", "Trimethoprim for 3 days", "Fosfomycin as a single dose", "Amoxicillin for 3 days"], "ans": 0, "exp": "For non-pregnant adults with acute pyelonephritis, first-choice oral options are cefalexin or co-amoxiclav for 7 to 10 days, or trimethoprim for 14 days if susceptible.", "why": ["", "Nitrofurantoin only reaches useful levels in the bladder and is licensed for lower UTI only.", "A 3-day trimethoprim course is for uncomplicated cystitis, not for kidney infection.", "A single dose is not adequate for an upper tract infection.", "Short amoxicillin courses are not recommended for pyelonephritis."], "refs": [["NICE NG111: acute pyelonephritis antimicrobial prescribing", "https://www.nice.org.uk/guidance/NG111/chapter/recommendations"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 245}, {"group": "Surgery", "topic": "Urology", "stem": "A 30-year-old woman has pyelonephritis with signs of sepsis and cannot take oral medication. Which of the following is an appropriate intravenous option?", "opts": ["Gentamicin", "Oral nitrofurantoin", "Oral trimethoprim 3 days", "Oral amoxicillin", "No antibiotics, just fluids"], "ans": 0, "exp": "NICE lists IV options for severe pyelonephritis, including gentamicin, ceftriaxone, cefuroxime and co-amoxiclav, reviewed at 48 hours with a step-down to oral therapy. Refer to hospital if there are signs of sepsis.", "why": ["", "Nitrofurantoin is oral and not suitable for upper tract or septic infection.", "An oral drug is inappropriate when she cannot take oral medication and is septic.", "Oral amoxicillin cannot be used when she cannot take oral medication.", "Sepsis needs prompt antibiotics."], "refs": [["NICE NG111: acute pyelonephritis antimicrobial prescribing", "https://www.nice.org.uk/guidance/NG111/chapter/recommendations"]], "note": "The source lists gentamicin among the IV options and the 48-hour review. The 7-day duration in your course key is not in the guidance, which gives 7-10 days for oral therapy, with IV reviewed at 48 hours.", "src": "Linked sources", "id": 246}, {"group": "Surgery", "topic": "Urology", "stem": "A 57-year-old man has acute bacterial prostatitis. Which of the following is a recommended first-line oral antibiotic?", "opts": ["Ofloxacin (or ciprofloxacin) for 14 days", "Nitrofurantoin for 3 days", "Amoxicillin for 3 days", "Cefalexin for 3 days", "Trimethoprim for 3 days"], "ans": 0, "exp": "For acute prostatitis, first-line oral therapy is ciprofloxacin or ofloxacin for 14 days, or trimethoprim for 14 days if a fluoroquinolone cannot be used. Treatment is reviewed at 14 days.", "why": ["", "Nitrofurantoin does not penetrate the prostate well and is not used for prostatitis.", "Amoxicillin is not recommended and 3 days is too short.", "Cefalexin is not a first-line choice for prostatitis.", "Trimethoprim is a second option and needs a 14-day course, not 3 days."], "refs": [["GPnotebook: management of acute prostatitis", "https://gpnotebook.com/en-AU/pages/infectious-disease/acute-prostatitis/management-of-acute-prostatitis"]], "note": "The source gives the 14-day fluoroquinolone first choice and trimethoprim alternative. Fluoroquinolones carry MHRA restrictions, so check current local guidance.", "src": "Linked sources", "id": 247}, {"group": "Surgery", "topic": "Urology", "stem": "A 67-year-old woman with a long-term catheter has a catheter-associated urinary tract infection and is systemically well. Which NICE first-choice oral options apply, and what duration?", "opts": ["Nitrofurantoin, trimethoprim or amoxicillin for 7 days", "Ciprofloxacin for 3 days", "Gentamicin for 3 days", "Nitrofurantoin for 1 day", "No treatment and no catheter change"], "ans": 0, "exp": "For catheter-associated UTI with lower tract symptoms, NICE advises nitrofurantoin, trimethoprim, or amoxicillin (if susceptible) for 7 days. If the catheter has been in place for more than 7 days, consider removing or changing it, but do not delay antibiotics for this.", "why": ["", "Fluoroquinolones are reserved for when first-choice antibiotics are unsuitable, and 3 days is too short.", "Gentamicin is IV and for severe infection.", "A single day is not an adequate course.", "She is symptomatic, so treatment is needed, and the catheter should be reviewed."], "refs": [["NICE NG113: catheter-associated UTI antimicrobial prescribing", "https://www.nice.org.uk/guidance/ng113/chapter/recommendations"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 248}, {"group": "Surgery", "topic": "Vascular", "stem": "A 60-year-old man with hypertension presents with 'ripping' chest pain. Which classification is used to describe the extent of his condition (aortic dissection)?", "opts": ["Stanford classification", "Wells score", "Glasgow score", "Rutherford classification", "Fontaine classification"], "ans": 0, "exp": "Aortic dissection is classified using the Stanford system. Type A involves the ascending aorta and usually needs surgery, and type B lies distal to the left subclavian and is usually managed medically.", "why": ["", "The Wells score estimates the probability of DVT or PE.", "The Glasgow scores grade coma (GCS) or pancreatitis severity.", "The Rutherford classification grades chronic limb ischaemia.", "The Fontaine classification stages peripheral arterial disease."], "refs": [["LITFL: acute aortic dissection", "https://litfl.com/?p=190176"]], "note": "The source confirms the Stanford types A and B and the ripping or tearing pain. The Wells, Rutherford and Fontaine descriptions are standard teaching.", "src": "Linked sources", "id": 249}, {"group": "Surgery", "topic": "Vascular", "stem": "Which antiplatelet drug is recommended for secondary prevention of occlusive vascular events in patients with peripheral arterial disease?", "opts": ["Clopidogrel", "Warfarin", "Enoxaparin", "Pentoxifylline", "Naftidrofuryl oxalate"], "ans": 0, "exp": "NICE recommends clopidogrel as the antiplatelet of choice to prevent occlusive vascular events in people with peripheral arterial disease.", "why": ["", "Warfarin is an anticoagulant and is not the standard secondary prevention.", "Enoxaparin is a low molecular weight heparin used for VTE prophylaxis and treatment.", "Pentoxifylline is a haemorheological agent, not recommended for this purpose.", "Naftidrofuryl treats claudication symptoms but does not prevent vascular events."], "refs": [["GPnotebook: mild to moderate claudication management", "https://gpnotebook.com/en-IE/pages/cardiovascular-medicine/management-of-peripheral-arterial-disease/mild-to-moderate-claudication"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 250}, {"group": "Surgery", "topic": "Vascular", "stem": "In which situation is naftidrofuryl oxalate considered for intermittent claudication?", "opts": ["After supervised exercise has not given satisfactory improvement, when the patient declines angioplasty or bypass", "As first-line treatment before any exercise programme", "For all patients with rest pain", "To prevent myocardial infarction", "To heal venous ulcers"], "ans": 0, "exp": "NICE advises considering naftidrofuryl only when supervised exercise has not produced satisfactory improvement and the person prefers not to have angioplasty or bypass. Review after 3 to 6 months and stop if there is no symptomatic benefit.", "why": ["", "A supervised exercise programme is offered to all people with claudication first.", "Rest pain suggests critical limb ischaemia, which needs revascularisation assessment.", "It treats symptoms and does not reduce cardiovascular events.", "It is not used for venous ulcers."], "refs": [["GPnotebook: mild to moderate claudication management", "https://gpnotebook.com/en-IE/pages/cardiovascular-medicine/management-of-peripheral-arterial-disease/mild-to-moderate-claudication"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 251}, {"group": "Surgery", "topic": "Vascular", "stem": "Before applying compression bandaging to a venous leg ulcer, which test should be done if arterial insufficiency is suspected?", "opts": ["Ankle-brachial pressure index", "Duplex of the portal vein", "D-dimer", "Perthes test", "Serum albumin"], "ans": 0, "exp": "If any warning sign of arterial disease is present, arterial insufficiency should be excluded by measuring the ankle-brachial pressure index with a Doppler before compression. It is also advised before higher-strength hosiery.", "why": ["", "Portal vein imaging has no role in leg ulcer assessment.", "D-dimer screens for venous thromboembolism, not arterial supply.", "The Perthes test assesses deep venous patency in varicose veins and doesn't exclude arterial disease.", "Albumin is a nutritional marker, not a test of arterial supply."], "refs": [["GPnotebook: compression bandaging", "https://gpnotebook.com/en-IE/pages/surgery/compression-bandaging"]], "note": "The source says ABPI is needed when arterial disease is suspected, rather than in every case. It gives no numeric thresholds in text.", "src": "Linked sources", "id": 252}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 22-year-old woman with asthma reports using her SABA inhaler daily despite already being on low-dose inhaled corticosteroid-formoterol combination therapy. She continues to have nocturnal symptoms and exercise limitation. She has no history of hospital admission. Peak flow monitoring shows frequent variability. What is the next step in her asthma management?", "opts": ["Add a leukotriene receptor antagonist", "Increase the inhaled corticosteroid dose", "Add oral corticosteroids", "Start long-acting muscarinic antagonist", "Switch to SABA-only therapy"], "ans": 1, "exp": "Poor control on low-dose maintenance and reliever therapy (ICS-formoterol) is managed by stepping up to moderate-dose ICS-formoterol, after checking adherence, inhaler technique and triggers such as smoking. That is why the answer is to increase the inhaled corticosteroid dose.", "why": ["An LTRA or LAMA is added only if control is still poor on moderate-dose therapy and FeNO and blood eosinophils are not raised.", "", "Oral steroids are for exacerbations or specialist care, not a routine step-up.", "A LAMA is a later add-on after moderate-dose therapy, not before it.", "SABA-only treatment is outdated and would reduce control, as it leaves the inflammation untreated."], "refs": [["SIGN/NICE NG245: adult asthma pathway", "https://sign.ac.uk/media/2275/ng245-algorithm-c-20241127.pdf"]], "note": "Heads-up: in current NICE/SIGN guidance, 'increase the ICS dose' means moving to moderate-dose MART (maintenance and reliever therapy).", "src": "NICE NG245 / SIGN pathway", "id": 253}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 28-year-old woman presents with severe asthma exacerbation. She is using accessory muscles to breathe and has a respiratory rate of 32/min. Arterial blood gas shows PaCO2 of 8.5 kPa despite supplemental oxygen. She is speaking in short sentences and appears exhausted. What is the most concerning near-fatal feature in this patient?", "opts": ["Hypoxaemia", "Tachypnoea", "Hypercapnia", "Wheezing", "Use of accessory muscles"], "ans": 2, "exp": "In asthma the near-fatal category is defined by a raised PaCO2 (and/or need for mechanical ventilation with high inflation pressures). A patient who is exhausted and retaining CO2 is tiring and heading for respiratory failure; a 'normal' PaCO2 (4.6-6.0 kPa) is already worrying in a patient who is hyperventilating.", "why": ["Hypoxaemia is serious (SpO2 below 92% is part of life-threatening asthma) but it does not define near-fatal asthma.", "A high respiratory rate is a feature of acute severe asthma, not the near-fatal category.", "", "Wheeze is common in asthma and is a poor marker of severity; a silent chest is more worrying.", "Accessory muscle use shows increased effort and does not define near-fatal asthma."], "refs": [["BTS/NICE/SIGN: recognition of acute asthma in adults", "https://rightdecisions.scot.nhs.uk/asthma-pathway-bts-nice-sign-sign-244/managing-acute-asthma/management-of-acute-asthma-in-adults/acute-asthma-in-adults"]], "note": "", "src": "BTS/NICE/SIGN asthma guideline", "id": 254}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 24-year-old woman presents with acute severe asthma. She is speaking in words rather than sentences and has absent breath sounds on auscultation. She is tachypnoeic and using accessory muscles. Oxygen saturation is 90% on high-flow oxygen. Which feature indicates life-threatening asthma?", "opts": ["Tachypnoea", "Use of accessory muscles", "Absent breath sounds", "Mild hypoxaemia", "Wheezing"], "ans": 2, "exp": "Absent breath sounds (a silent chest) means so little air is moving that there is no wheeze to hear. It is one of the life-threatening features in BTS/NICE/SIGN guidance, alongside cyanosis, poor respiratory effort, altered consciousness, exhaustion, arrhythmia, hypotension and SpO2 below 92%.", "why": ["A rate of 25/min or more is an acute severe feature.", "Accessory muscle use is a sign of effort, not a life-threatening marker in the guideline.", "", "Mild hypoxaemia alone is not the life-threatening sign (SpO2 below 92% is a criterion, but the question asks for a clinical feature), so silent chest is the stronger answer.", "Wheeze can be absent in the worst attacks, and its presence does not signal life-threatening disease."], "refs": [["BTS/NICE/SIGN: recognition of acute asthma in adults", "https://rightdecisions.scot.nhs.uk/asthma-pathway-bts-nice-sign-sign-244/managing-acute-asthma/management-of-acute-asthma-in-adults/acute-asthma-in-adults"]], "note": "Heads-up: the guideline's life-threatening list also includes SpO2 below 92% with a clinical sign. The stem's 90% would also qualify, but 'Mild hypoxaemia' is worded as an option to be less specific, so the silent chest is the intended answer.", "src": "BTS/NICE/SIGN asthma guideline", "id": 255}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 59-year-old man with diabetes, ischaemic heart disease, and chronic kidney disease on thrice-weekly dialysis reports feeling unwell and missed his last session. Blood tests show hyperglycaemia and mild hyperkalaemia. He is alert and haemodynamically stable. ECG shows peaked T waves. What is the most appropriate immediate management?", "opts": ["Give 1 L 0.9% saline with 40 mmol KCl", "Immediate haemodialysis", "IV insulin and glucose", "Oral potassium binders only", "Observation and repeat labs"], "ans": 2, "exp": "With ECG changes, hyperkalaemia needs emergency treatment. The UK Kidney Association algorithm protects the heart with IV calcium, then removes potassium from the circulation using nebulised salbutamol and binders, and shifts it into cells with insulin-glucose, with dialysis considered as a further option. Of the options listed, IV insulin and glucose is the one that acts quickly to lower the potassium.", "why": ["Potassium chloride would worsen hyperkalaemia.", "Dialysis removes potassium but takes time to arrange; it is not the immediate step in a stable patient.", "", "Binders work too slowly to be the only treatment when the ECG is abnormal.", "Peaked T waves mean he is at risk of arrhythmia, so observation alone is unsafe."], "refs": [["UK Kidney Association: hospital hyperkalaemia algorithm (2022)", "https://www.ukkidney.org/sites/default/files/APPENDIX%206%20-%20HYPERKALAEMIA%20ALGORITHM%20-%20HOSPITAL%20-%20REVISED%20-%20JULY%202022%20-%20V2.pdf"]], "note": "Heads-up: the algorithm lists IV calcium first, which isn't among these options. Insulin-glucose is the best of what is offered; also give glucose with insulin to avoid hypoglycaemia (his glucose is raised here).", "src": "UK Kidney Association", "id": 256}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 68-year-old man with chronic heart failure presents with generalised weakness and palpitations. ECG shows peaked T waves and widened QRS complexes. Serum potassium is 6.8 mmol/L. He is on furosemide, ramipril, and spironolactone. What is the most appropriate immediate management?", "opts": ["IV insulin with glucose", "IV calcium gluconate", "Oral potassium binders only", "Increase furosemide dose", "Observation"], "ans": 1, "exp": "A severe rise in potassium with a wide QRS is an emergency. The first step is to protect the heart membrane with IV calcium (gluconate or chloride), then repeat the ECG. Calcium doesn't lower the potassium, so treatment that moves or removes potassium follows (insulin-glucose, salbutamol, binders, dialysis), and the ramipril and spironolactone should be stopped.", "why": ["Insulin-glucose lowers potassium, but cardiac protection with calcium comes first when the ECG is abnormal.", "", "Binders are slow and are not enough alone.", "Diuretics eliminate potassium slowly and are not an emergency treatment.", "Observation is dangerous with a QRS this wide."], "refs": [["UK Kidney Association: hospital hyperkalaemia algorithm (2022)", "https://www.ukkidney.org/sites/default/files/APPENDIX%206%20-%20HYPERKALAEMIA%20ALGORITHM%20-%20HOSPITAL%20-%20REVISED%20-%20JULY%202022%20-%20V2.pdf"]], "note": "", "src": "UK Kidney Association", "id": 257}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 45-year-old woman presents with paroxysmal headaches, palpitations, and sweating. Blood pressure readings show persistent hypertension. 24-hour urinary catecholamines are elevated. MRI of the abdomen shows an adrenal mass. Which investigation is most appropriate to confirm the diagnosis?", "opts": ["Plasma metanephrines", "24-hour urine vanillylmandelic acid", "Serum cortisol", "DHEAS", "Aldosterone-renin ratio"], "ans": 0, "exp": "Episodic headache, palpitations and sweating with hypertension suggest a phaeochromocytoma. Plasma free or urinary fractionated metanephrines are the recommended first-line biochemical tests, because tumour cells make metanephrines continuously, unlike catecholamines, which are released in bursts.", "why": ["", "VMA is less sensitive and less specific, and has been replaced by metanephrines.", "Cortisol would be used for Cushing syndrome.", "DHEAS is a marker of adrenal androgen excess, such as in adrenal carcinoma.", "The aldosterone-renin ratio screens for primary hyperaldosteronism, which doesn't cause episodes of palpitations or sweating."], "refs": [["Phaeochromocytoma diagnosis (PMC6215794)", "https://pmc.ncbi.nlm.nih.gov/articles/PMC6215794"]], "note": "The source says plasma free or urinary fractionated metanephrines are first-line, and does not mention VMA; why VMA is inferior is standard teaching.", "src": "Review citing Endocrine Society guidance", "id": 258}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 14-year-old boy presents with progressive hearing loss and haematuria. His mother reports that he has always had difficulty with hearing. Urinalysis shows proteinuria and microscopic haematuria. Family history reveals multiple male members with similar problems. What is the most likely diagnosis?", "opts": ["Alport syndrome", "IgA nephropathy", "Post-streptococcal glomerulonephritis", "Thin basement membrane disease", "Fabry disease"], "ans": 0, "exp": "Alport syndrome is a type IV collagen disorder, most often X-linked (COL4A5). It causes microscopic haematuria from early life, later proteinuria and progressive kidney failure, with sensorineural deafness and eye changes. Affected males in the family fit X-linked inheritance.", "why": ["", "IgA nephropathy causes haematuria but not deafness, and it isn't typically X-linked.", "PSGN follows a streptococcal infection and recovers; it isn't familial and doesn't cause hearing loss.", "Thin basement membrane disease is a mild, benign familial haematuria without deafness or progressive kidney failure.", "Fabry disease is X-linked too, but features pain in the hands and feet, angiokeratomas and corneal changes; hearing loss is not typical here."], "refs": [["Genomics Education Programme: Alport syndrome and thin basement membrane nephropathy", "https://www.genomicseducation.hee.nhs.uk/genotes/knowledge-hub/alport-syndrome-and-thin-basement-membrane-nephropathy/"]], "note": "The Fabry contrast is standard teaching, not from the source.", "src": "NHS Genomics Education Programme", "id": 259}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 33-year-old woman with systemic lupus erythematosus presents with recurrent miscarriages and deep vein thrombosis. Laboratory tests show positive anticardiolipin antibodies. She is currently on low-dose aspirin. Which antibody is most relevant to her presentation?", "opts": ["Anti-dsDNA", "Anti-Smith", "Anti-cardiolipin", "Anti-Ro/SSA", "Anti-La/SSB"], "ans": 2, "exp": "Recurrent pregnancy loss and venous thrombosis in a patient with SLE point to secondary antiphospholipid syndrome. It is diagnosed from clinical events plus antiphospholipid antibodies: anticardiolipin, anti-beta-2 glycoprotein I or lupus anticoagulant.", "why": ["Anti-dsDNA is specific for SLE and tracks disease activity, particularly nephritis, but does not explain thrombosis or miscarriage.", "Anti-Smith is highly specific for SLE but doesn't cause clots or pregnancy loss.", "", "Anti-Ro is linked to neonatal lupus and congenital heart block, not thrombosis.", "Anti-La is also linked to neonatal lupus and Sjögren syndrome."], "refs": [["DermNet: antiphospholipid syndrome", "https://www.Dermnetnz.Org/topics/antiphospholipid-syndrome"]], "note": "The contrasts with anti-dsDNA, Smith, Ro and La are standard teaching; DermNet covers APS itself.", "src": "DermNet", "id": 260}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 71-year-old man presents with fever, cough, and shortness of breath. Chest X-ray shows left lower lobe consolidation. He is hypotensive with a systolic blood pressure of 85 mmHg. What is the most appropriate immediate management?", "opts": ["Oral antibiotics at home", "IV antibiotics", "Oxygen only", "Fluid restriction", "Bronchoscopy"], "ans": 1, "exp": "Pneumonia with hypotension is severe, and potentially septic. He needs urgent hospital treatment with IV antibiotics. NICE recommends IV co-amoxiclav with clarithromycin for high-severity CAP, started as soon as possible and within 4 hours of presentation, and fluids and oxygen are given alongside.", "why": ["Home oral antibiotics are only for low-severity pneumonia; hypotension indicates severe illness.", "", "Oxygen helps hypoxia but treats neither the infection nor the circulatory failure.", "Fluid restriction is the opposite of what a hypotensive septic patient needs.", "Bronchoscopy is not part of routine pneumonia management."], "refs": [["NICE NG250: community-acquired pneumonia", "https://www.nice.org.uk/guidance/NG250/chapter/recommendations"]], "note": "The 'fluids and oxygen alongside' part is standard sepsis teaching; the NICE page I read covers the antibiotic choice and timing.", "src": "NICE NG250", "id": 261}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 72-year-old man presents with fever, productive cough, and shortness of breath. He is confused on examination and his blood pressure is 85/55 mmHg. Chest X-ray shows right lower lobe consolidation. CURB-65 score is calculated as 3. What is the most appropriate empiric antibiotic therapy?", "opts": ["Oral amoxicillin", "IV co-amoxiclav and oral clarithromycin", "IV ceftriaxone alone", "Oral doxycycline", "Observation only"], "ans": 1, "exp": "CURB-65 of 3 is high-severity community-acquired pneumonia. NICE's first-line regimen is IV co-amoxiclav 1.2 g three times daily plus clarithromycin 500 mg twice daily, each for 5 days, with levofloxacin for penicillin allergy. Antibiotics should start within 4 hours and be reviewed at 48 hours.", "why": ["Oral amoxicillin is for low-severity pneumonia.", "", "Ceftriaxone alone doesn't cover atypical organisms, and it isn't the NICE first-line regimen.", "Doxycycline is an oral option for low-severity disease and for penicillin allergy at lower severity.", "Observation alone would be dangerous in this severely ill patient."], "refs": [["NICE NG250: community-acquired pneumonia", "https://www.nice.org.uk/guidance/NG250/chapter/recommendations"]], "note": "", "src": "NICE NG250", "id": 262}, {"group": "Medicine", "topic": "Haematology", "stem": "A 62-year-old woman presents 7 days post-chemotherapy for breast cancer with fever of 39.2°C. Blood tests reveal neutropenia, anaemia, and mild thrombocytopenia. She is pale and slightly hypotensive. What is the most appropriate immediate investigation?", "opts": ["Chest X-ray", "Blood cultures", "Urinalysis", "Stool cultures", "Echocardiography"], "ans": 1, "exp": "This is neutropenic sepsis, an emergency. Take blood cultures (two sets, peripheral and from any central line) and culture likely sources, but never delay empirical IV antibiotics, such as piperacillin-tazobactam, beyond 1 hour.", "why": ["A chest X-ray is useful to look for a source but comes after cultures.", "", "Urinalysis may find a source but is lower priority.", "Stool cultures are only for diarrhoea.", "Echocardiography is not part of the initial assessment."], "refs": [["LITFL: neutropenic fever and sepsis", "https://litfl.com/neutropaenic-sepsis/"]], "note": "Practical point: antibiotics must not wait for the other tests.", "src": "Life in the Fast Lane", "id": 263}, {"group": "Medicine", "topic": "Infectious Disease", "stem": "A 72-year-old man presents with his third urinary tract infection this year. He reports dysuria, fever, and flank tenderness. He has a history of recurrent UTIs. Urinalysis is positive for nitrites and leukocytes. What is the most appropriate management?", "opts": ["Wait for culture results only", "Oral antibiotics", "Admit and start IV co-amoxiclav plus gentamicin", "Start meropenem and vancomycin", "Catheterise and observe"], "ans": 2, "exp": "Fever and flank tenderness suggest pyelonephritis, here in an older man with recurrent infections. NICE advises sending a urine culture before antibiotics, referring to hospital when there are features of serious illness, and using IV co-amoxiclav, gentamicin or other listed first-choice IV agents with review at 48 hours.", "why": ["Waiting for cultures leaves a febrile upper-tract infection untreated.", "Oral treatment is for mild lower UTI; fever with loin tenderness in an older man needs closer assessment and IV treatment.", "", "Meropenem and vancomycin are overly broad for a first presentation and are reserved for resistant organisms.", "Catheterising is not treatment, and it adds infection risk."], "refs": [["NICE NG111: pyelonephritis (acute)", "https://nice.org.uk/guidance/NG111/chapter/recommendations"]], "note": "Heads-up: NICE lists co-amoxiclav, gentamicin, amikacin or ciprofloxacin as options. It does not say to combine co-amoxiclav with gentamicin, so the combination in this answer is exam convention.", "src": "NICE NG111", "id": 264}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 28-year-old man with ulcerative colitis presents with more than six bloody bowel movements per day, abdominal pain, and fever. Examination shows tenderness over the left lower quadrant. Laboratory results reveal elevated CRP and leukocytosis. What is the most appropriate initial management?", "opts": ["Oral mesalazine", "IV hydrocortisone", "Oral corticosteroids", "Antibiotics only", "Biologic therapy immediately"], "ans": 1, "exp": "More than six bowel motions a day plus systemic features (fever, raised inflammatory markers) fulfils Truelove and Witts criteria for severe ulcerative colitis. He should be admitted for IV corticosteroids, with VTE prophylaxis, and assessed again at day 3, when non-responders are considered for rescue therapy (infliximab or ciclosporin) or colectomy.", "why": ["Mesalazine is for mild to moderate disease.", "", "Oral steroids are for moderate flares managed at home, not for a severe, systemically unwell patient.", "Antibiotics are not routine in UC and are reserved for suspected infection or toxic dilatation.", "Biologics are a rescue option if IV steroids fail."], "refs": [["NHS Borders: acute severe colitis guideline", "https://www.rightdecisions.scot.nhs.uk/nhs-borders-clinical-guidelines/gastroenterology/acute-severe-colitis"]], "note": "Heads-up: this local guideline names IV methylprednisolone 30 mg BD as its steroid. Many UK units use IV hydrocortisone 100 mg QDS; both are acceptable IV steroids.", "src": "NHS Borders guideline", "id": 265}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 75-year-old woman presents with a fragility fracture of the femur. Blood tests reveal low vitamin D levels and normal renal function. She has no previous history of osteoporosis treatment. She reports difficulty adhering to oral medication regimens. What is the most appropriate acute treatment?", "opts": ["Oral vitamin D supplementation only", "IV zoledronic acid", "Oral risedronate", "Subcutaneous denosumab", "Raloxifene"], "ans": 1, "exp": "Once-yearly IV zoledronic acid avoids the adherence problem of oral bisphosphonates. In the HORIZON Recurrent Fracture Trial, giving it within 90 days of a hip fracture repair reduced new clinical fractures by about 35% and death by about 28%. Vitamin D should be corrected before the infusion.", "why": ["Vitamin D alone doesn't treat osteoporosis after a fragility fracture.", "", "Oral risedronate is a reasonable drug, but adherence is the problem.", "Denosumab is an alternative, but it needs 6-monthly injections and stopping it carries rebound fracture risk; zoledronate is the usual choice when oral treatment is a problem.", "Raloxifene mainly reduces vertebral fractures, not hip fractures."], "refs": [["MDedge: annual zoledronic acid after hip fracture (HORIZON-RFT)", "https://mdedge.com/content/annual-zoledronic-acid-infusion-lowers-risk-fracture-death"]], "note": "The vitamin D and denosumab points are standard teaching, not from the source. Hypocalcaemia should be excluded before infusion.", "src": "HORIZON Recurrent Fracture Trial report", "id": 266}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 71-year-old man with heart failure is on bisoprolol, ramipril, and furosemide. Recent labs show serum sodium of 128 mmol/L. He is euvolaemic on examination and otherwise asymptomatic. What is the most appropriate next step in management?", "opts": ["Fluid restriction and check serum and urine osmolality", "Increase furosemide dose", "Administer IV saline rapidly", "Start hypertonic saline immediately", "Observation only"], "ans": 0, "exp": "In asymptomatic hyponatraemia the next step is to work out the cause: confirm that plasma osmolality is low, assess volume status and check urine osmolality and sodium. Fluid restriction (under 1-1.5 L a day) is the main treatment for euvolaemic cases such as SIADH, and you should review the drugs that can cause it.", "why": ["", "More diuretic would not help a euvolaemic patient and might worsen sodium loss.", "Rapid saline is for hypovolaemia and risks overload in heart failure.", "Hypertonic saline is for severe symptoms such as seizures or reduced consciousness; correcting too fast risks osmotic demyelination.", "Sodium of 128 with a possible drug cause needs investigation."], "refs": [["AAFP: management of hyponatremia", "https://www.aafp.org/pubs/afp/issues/2004/0515/p2387.html"]], "note": "The AAFP article says diuretic-induced hyponatraemia is usually hypovolaemic, so a euvolaemic patient on furosemide needs the cause worked out.", "src": "American Family Physician", "id": 267}, {"group": "Medicine", "topic": "Dermatology", "stem": "A 38-year-old man presents with a long-standing history of an itchy scalp with thick scaling. He reports worsening flaking that extends beyond the hairline and occasional involvement of his elbows and knees. Examination shows erythematous plaques with overlying silvery scale on the scalp. There are no signs of infection. What is the most appropriate treatment for his scalp condition?", "opts": ["Oral methotrexate", "Topical antifungal shampoo alone", "Topical corticosteroid", "Oral acitretin", "Phototherapy"], "ans": 2, "exp": "This is plaque psoriasis with scalp involvement. NICE recommends a potent topical corticosteroid (lotion, solution or gel) once daily for 4 weeks as first line. If it fails, switch formulation, then try a combined calcipotriol and betamethasone product.", "why": ["Methotrexate is a systemic drug for extensive or resistant disease.", "An antifungal shampoo treats seborrhoeic dermatitis or tinea, and not psoriasis.", "", "Acitretin is a systemic retinoid reserved for severe disease under dermatology.", "Phototherapy is not used for the scalp, because hair blocks the light, and is for widespread disease."], "refs": [["NIHR Evidence: topical steroids for scalp psoriasis", "https://evidence.nihr.ac.uk/alert/topical-steroids-better-than-vitamin-d-for-treating-scalp-psoriasis"]], "note": "The page summarises NICE 2012 guidance; the reasons for rejecting systemic and light treatments are standard teaching.", "src": "NIHR Evidence summarising a Cochrane review and NICE", "id": 268}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 35-year-old woman presents with proteinuria following a recent respiratory infection. She has mild oedema but no haematuria. Renal function is normal. There is no past history of kidney disease or systemic illness. What is the most likely cause of her kidney findings?", "opts": ["Minimal change disease", "Focal segmental glomerulosclerosis", "Membranous nephropathy", "Diabetic nephropathy", "IgA nephropathy"], "ans": 0, "exp": "Oedema and proteinuria without haematuria, with normal renal function and a recent infection, fit nephrotic syndrome from minimal change disease. It is the commonest cause in children and causes about 20% of adult nephrotic syndrome. The only biopsy finding is foot process fusion on electron microscopy, and it usually responds to steroids.", "why": ["", "FSGS is a common adult cause but usually presents with hypertension, a slower course and poorer steroid response.", "Membranous nephropathy is an insidious nephrotic syndrome of older adults, associated with malignancy and anti-PLA2R.", "Diabetic nephropathy needs long-standing diabetes.", "IgA nephropathy typically gives haematuria, often straight after an infection."], "refs": [["GPnotebook: minimal change disease", "https://gpnotebook.com/pages/renal-medicine/minimal-change-disease"]], "note": "Heads-up: the source covers what MCD is and its prevalence, but not infection triggers or the absence of haematuria. The contrasts with FSGS, membranous and IgA are standard teaching.", "src": "GPnotebook", "id": 269}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 52-year-old man presents six months after a kidney transplant with rising creatinine and tenderness over the transplant site. He is otherwise stable and compliant with immunosuppressive medications. Urine output is reduced. Ultrasound shows normal perfusion of the transplant kidney. What is the most appropriate next step?", "opts": ["Start empirical antibiotics", "Repeat ultrasound in one week", "Kidney biopsy", "Adjust immunosuppression", "CT abdomen"], "ans": 2, "exp": "Rising creatinine with graft tenderness and reduced urine output suggests graft dysfunction, possibly rejection. Once vascular and obstructive causes are excluded by ultrasound, a renal allograft biopsy is the standard test: it confirms rejection, identifies the type, and grades severity, which guides treatment.", "why": ["Nothing here points to infection, and antibiotics would delay the diagnosis.", "Waiting a week risks irreversible damage to the graft.", "", "Immunosuppression should be adjusted after biopsy shows what type of rejection or injury is present.", "CT adds contrast risk to a failing graft and doesn't give a tissue diagnosis."], "refs": [["StatPearls: renal transplant rejection", "https://statpearls.com/point-of-care/17170"]], "note": "", "src": "StatPearls", "id": 270}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 65-year-old man with a history of chronic liver disease presents with progressive dyspnoea and abdominal distension. Examination reveals ascites and reduced breath sounds at the lung bases. Thoracentesis shows pleural fluid with protein 0.45 g/dL and LDH 0.55 times the serum level. The patient is unsure whether diuretics or drainage is appropriate. What is the most likely nature of the pleural effusion, and what is the first step in management?", "opts": ["Exudative; insert chest drain", "Transudative; manage underlying liver disease with diuretics", "Exudative; start IV antibiotics", "Transudative; perform thoracoscopy", "Exudative; start corticosteroids"], "ans": 1, "exp": "Light's criteria call an effusion exudative if pleural/serum protein is above 0.5, pleural/serum LDH is above 0.6, or pleural LDH is above two-thirds of the upper limit of the serum normal. This fluid meets none of them, so it is a transudate, as expected with cirrhosis. Transudates are treated by managing the cause, for example with diuretics, rather than drainage.", "why": ["It's not exudative, and uncomplicated transudates shouldn't be drained.", "", "There is no sign of infection, and antibiotics treat parapneumonic effusions.", "Thoracoscopy is for undiagnosed exudates, not for a transudate of known cause.", "Steroids don't treat a hepatic transudate."], "refs": [["iatrox: pleural effusion", "https://www.iatrox.com/academy/ukmla/pleural-effusion"]], "note": "The protein value (0.45 g/dL) in the stem is unusually low; the answer relies on the LDH ratio (0.55, below 0.6) and the clinical context.", "src": "iatrox UKMLA revision", "id": 271}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 59-year-old woman with type 2 diabetes has persistently elevated HbA1c despite treatment with metformin, sulfonylurea, and basal insulin. She is overweight, exercises regularly, and has no history of heart failure. Which additional therapy is most appropriate for improving glycaemic control?", "opts": ["Digoxin", "Semaglutide (GLP-1 receptor agonist)", "Thiazolidinedione", "DPP-4 inhibitor", "SGLT2 inhibitor"], "ans": 1, "exp": "When HbA1c stays above target despite triple therapy or insulin, NICE allows a GLP-1 receptor agonist (including subcutaneous semaglutide) to be considered. It lowers HbA1c and helps weight, which suits an overweight patient.", "why": ["Digoxin is an antiarrhythmic and has no role in diabetes.", "", "Pioglitazone is an option in NICE's algorithm but causes weight gain, and is avoided in heart failure, which this patient does not have, so it is less suitable for an overweight woman.", "DPP-4 inhibitors lower HbA1c only modestly, and are not combined with a GLP-1 RA; a stronger option is preferred.", "SGLT2 inhibitors are normally started early, alongside metformin; they would be added here only if not already used."], "refs": [["NG28 type 2 diabetes algorithm (Diabetes on the Net)", "https://diabetesonthenet.com/wp-content/uploads/AAG_NG28_Algorithm.pdf"]], "note": "Heads-up: the NICE algorithm also lists a sulfonylurea, pioglitazone or insulin at this step, and has no weight criteria. Semaglutide is the best answer because it fits her overweight status; the SGLT2 and DPP-4 reasoning is partly standard teaching.", "src": "NICE NG28 algorithm", "id": 272}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 33-year-old woman comes to the physician because of a 4- month history of intermittent lower abdominal cramps associated with diarrhea, bloating, and mild nausea. During this period, she has had a 5-kg (11-lb) weight loss. She feels like she cannot fully empty her bowels. She has no history of serious illness. She has a high-fiber diet. Her father is of Ashkenazi Jewish descent. She has smoked 2 packs of cigarettes daily for 15 years. She appears well. Her temperature is 36.9°C (98.5°F), pulse is 90/min, and blood pressure is 130/90 mm Hg. The lungs are clear to auscultation. Cardiac examination shows no murmurs, rubs, or gallops. Abdominal examination shows mild tenderness to palpation in the right lower quadrant without guarding or rebound. Bowel sounds are normal. Test of the stool for occult blood is negative. Her hemoglobin concentration is 10.5 g/dL, leukocyte count is 12,000/mm3, platelet count is 480,000/mm3, and erythrocyte sedimentation rate is 129 mm/h. A barium enema shows ulceration and narrowing of the right colon. Which of the following is the most likely diagnosis?", "opts": ["Irritable bowel syndrome", "Celiac disease", "Ulcerative colitis", "Intestinal carcinoid tumor", "Crohn disease"], "ans": 4, "exp": "Crohn disease presents in young adults with abdominal pain, prolonged (sometimes bloody) diarrhoea and weight loss. Smoking and Ashkenazi Jewish ancestry are recognised risk factors.", "why": ["IBS does not cause weight loss in this way, and the risk factors point elsewhere.", "Coeliac disease would show malabsorption features and is not linked to Ashkenazi descent or smoking in the same way.", "Ulcerative colitis causes bloody diarrhoea with urgency, and smoking is protective rather than a risk factor.", "Carcinoid causes flushing and diarrhoea, and is rare.", ""], "refs": [["BMJ Best Practice: Crohn's disease, history and exam", "https://bestpractice-bmj-com.bibliotheek.ehb.be/topics/en-gb/42/history-exam"]], "note": "The source confirms that smoking and Ashkenazi ancestry raise Crohn's risk, and the pain and diarrhoea presentation. Smoking being protective in UC is standard teaching.", "src": "Linked sources", "id": 273}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 26-year-old male comes to the physician because of increasing generalized fatigue for 6 months. He has been unable to work out at the gym during this period. He has also had cramping lower abdominal pain and diarrhea for the past 5 weeks that is occasionally bloody. His father was diagnosed with colon cancer at the age of 65. He has smoked half a pack of cigarettes daily for the past 10 years. He drinks 1–2 beers on social occasions. His temperature is 37.3°C (99.1°F), pulse is 88/min, and blood pressure is 116/74 mm Hg. Physical examination shows dry mucous membranes. The abdomen is soft and nondistended with slight tenderness to palpation over the lower quadrants bilaterally. Rectal examination shows stool mixed with blood. His hemoglobin concentration is 13.5 g/dL, leukocyte count is 7,500/mm3, and platelet count is 480,000/mm3. Urinalysis is within normal limits. Which of the following is the most appropriate next step in management?", "opts": ["Flexible sigmoidoscopy", "D-xylose absorption test", "Capsule endooscopy", "Colonoscopy", "CT scan of the abdomen and pelvis with contrast"], "ans": 3, "exp": "Bloody diarrhoea in a young adult suggests ulcerative colitis, and the diagnosis rests on colonoscopy or sigmoidoscopy with biopsy. Colonoscopy with biopsies is generally the first-line investigation because it defines disease extent.", "why": ["Flexible sigmoidoscopy is safer in moderate to severe disease, but here a full colonoscopy defines the extent.", "The D-xylose test assesses carbohydrate malabsorption and has no role in colitis.", "Capsule endoscopy is for small bowel disease and carries retention risk in strictures.", "", "CT is not the diagnostic test for colitis and does not give histology."], "refs": [["Patient.info (Professional): ulcerative colitis", "https://patient.info/doctor/ulcerative-colitis"]], "note": "The source says colonoscopy with biopsies is generally first-line, while sigmoidoscopy is safer in moderate-to-severe disease, so a very sick patient would be handled differently.", "src": "Linked sources", "id": 274}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 68-year-old man comes to the physician for a routine health maintenance examination. Over the past six months, he has had an increase in the frequency of his bowel movements and occasional bloody stools. He has hypertension, coronary artery disease, and chronic obstructive pulmonary disease. He has smoked one pack of cigarettes daily for 40 years. His current medications include aspirin, lisinopril, and salmeterol. His temperature is 37°C (98.6°F), pulse is 75/min, and blood pressure is 128/75 mm Hg. The lungs are clear to auscultation. Cardiac examination shows no murmurs, rubs, or gallops. The abdomen is soft with no organomegaly. Digital rectal examination shows a large internal hemorrhoid. Test of the stool for occult blood is positive. Which of the following is the most appropriate next step in the management of this patient?", "opts": ["Colonoscopy", "Barium enema", "Dietary counseling", "Stool softeners", "Rubber band ligation"], "ans": 0, "exp": "A change in bowel habit with rectal bleeding in a 68-year-old smoker is colorectal cancer until proven otherwise, and colonoscopy is the gold-standard test to examine the colon and take biopsies.", "why": ["", "Barium enema is less sensitive than colonoscopy and does not allow biopsy.", "Dietary advice would delay a diagnosis in a patient with alarm features.", "Stool softeners treat constipation and would miss a cancer.", "Rubber band ligation treats haemorrhoids, and bl
