ndocrinology", "id": 101}, {"group": "Medicine", "topic": "Haematology", "stem": "A 67-year-old man presents with persistent lower back pain, fatigue, and recurrent infections. Blood tests reveal normocytic anaemia and raised total protein. Serum calcium is mildly elevated. You suspect a plasma cell disorder. Which investigation is required to confirm the diagnosis?", "opts": ["Serum beta-2 microglobulin", "Skeletal survey", "Bone marrow biopsy", "Serum calcium", "ESR"], "ans": 2, "exp": "Back pain, anaemia, high calcium and infections suggest multiple myeloma. Diagnosis requires showing clonal plasma cells: clonal bone marrow plasma cells above 10% (or a biopsy-proven plasmacytoma) plus myeloma-defining features such as CRAB (calcium, renal, anaemia, bone lesions). Bone marrow biopsy is therefore the confirmatory test.", "why": ["Beta-2 microglobulin is a prognostic marker used for staging, not a diagnostic test.", "Imaging shows bone lesions, a myeloma-defining feature, but it cannot prove a clonal plasma cell population.", "", "Calcium is part of the CRAB criteria, but hypercalcaemia has many causes.", "ESR is often raised in myeloma but is non-specific."], "refs": [["IMWG diagnostic criteria for multiple myeloma", "https://www.myeloma.org/international-myeloma-working-group-imwg-criteria-diagnosis-multiple-myeloma"]], "note": "The IMWG page shows that a few newer biomarkers can also define myeloma without CRAB, but marrow plasma-cell clonality remains the core requirement.", "src": "International Myeloma Working Group", "id": 102}, {"group": "Medicine", "topic": "Infectious Disease", "stem": "A 29-year-old man with a history of intravenous drug use presents with fever, sore throat, and a widespread rash. The rash involves the trunk and extremities and is non-pruritic. He reports recent high-risk sexual exposure. Examination shows generalized lymphadenopathy. What is the most appropriate initial test to confirm the suspected diagnosis?", "opts": ["HIV RNA PCR", "HIV combined antigen-antibody ELISA", "Rapid plasma reagin", "VDRL", "CD4 lymphocyte count"], "ans": 1, "exp": "Fever, pharyngitis, rash and lymphadenopathy after a risk exposure suggest acute HIV seroconversion. The standard initial test is a fourth-generation combined p24 antigen and antibody assay, which detects infection earlier than antibody-only tests.", "why": ["RNA PCR turns positive earliest and is added when acute infection is suspected, but it is not the standard first screening test, and it is used alongside the combined assay.", "", "RPR tests for syphilis, which is a differential for rash, but the question asks about the suspected HIV.", "VDRL is another syphilis test.", "CD4 count assesses immune status once HIV is confirmed; it is not diagnostic."], "refs": [["UCSF Hospital Handbook: acute HIV infection", "https://hospitalhandbook.ucsf.edu/node/2121"]], "note": "Heads-up: the UCSF source advises sending an HIV viral load (the earliest test to turn positive) together with the fourth-generation antigen/antibody test when acute HIV is suspected. The exam answer is the combined test; in real life both would be sent.", "src": "UCSF Hospital Handbook", "id": 103}, {"group": "Medicine", "topic": "Neurology", "stem": "A 60-year-old man presents with gradually progressive weakness over several months. He reports muscle wasting and frequent muscle twitching. Examination shows weakness in multiple muscle groups with brisk reflexes but no sensory loss. Cranial nerve examination is normal. What is the most likely diagnosis?", "opts": ["Myasthenia gravis", "Guillain-Barré syndrome", "Motor neurone disease", "Polymyositis", "Chronic inflammatory demyelinating polyneuropathy"], "ans": 2, "exp": "Motor neurone disease combines lower motor neurone signs (wasting, fasciculations) with upper motor neurone signs (brisk reflexes) and no sensory loss. That mixed pattern, over months, in an older adult is the classic description.", "why": ["Myasthenia gives fatigable weakness that worsens with use, usually with ocular or bulbar symptoms; it does not cause wasting, fasciculations or brisk reflexes.", "GBS is an acute (days) ascending weakness with reduced or absent reflexes and often sensory symptoms.", "", "Polymyositis causes proximal weakness with muscle pain/raised CK, without fasciculations or upper motor neurone signs.", "CIDP is a slowly progressive demyelinating neuropathy with reduced reflexes and sensory involvement."], "refs": [["GPnotebook: motor neurone disease", "https://gpnotebook.com/pages/neurology/motor-neurone-disease"]], "note": "Heads-up: the GPnotebook page doesn't discuss sensory sparing or the diagnostic method in detail.", "src": "GPnotebook", "id": 104}, {"group": "Medicine", "topic": "Neurology", "stem": "A 35-year-old man presents with progressive weakness beginning in the lower limbs following a flu-like illness two weeks earlier. He now has difficulty walking and reports tingling in his feet. Examination shows symmetrical ascending weakness and absent reflexes. Sensory examination is mildly reduced. What is the most likely diagnosis?", "opts": ["Acute transverse myelitis", "Myasthenia gravis", "Guillain-Barré syndrome", "Motor neurone disease", "Botulism"], "ans": 2, "exp": "Guillain-Barré syndrome (GBS) is an acute inflammatory polyneuropathy that often follows an infection by 1-3 weeks. It causes rapidly progressive symmetric ascending weakness with reduced or absent reflexes and mild sensory symptoms.", "why": ["Transverse myelitis causes a spinal sensory level and bladder involvement, with brisk reflexes below the lesion after the initial spinal shock phase.", "Myasthenia causes fatigable weakness with preserved reflexes and no sensory symptoms.", "", "Motor neurone disease is slowly progressive and does not cause sensory symptoms or absent reflexes.", "Botulism causes a descending paralysis that starts in the cranial nerves, with dilated pupils."], "refs": [["MSD Manual: Guillain-Barré syndrome", "https://www.msdmanuals.com/professional/neurologic-disorders/peripheral-nervous-system-and-motor-unit-disorders/guillain-barré-syndrome-gbs"]], "note": "", "src": "MSD Manual", "id": 105}, {"group": "Medicine", "topic": "Neurology", "stem": "A 24-year-old woman has experienced two unprovoked generalized tonic-clonic seizures over the past year. Neurological examination is normal between episodes. MRI brain and routine blood tests show no abnormalities. She is concerned about future seizure prevention. What is the most appropriate long-term management?", "opts": ["Carbamazepine", "Sodium valproate", "Levetiracetam", "Phenytoin", "Diazepam"], "ans": 2, "exp": "Two unprovoked seizures means epilepsy, and she should start an anti-seizure medicine. For generalised tonic-clonic seizures NICE NG217 advises sodium valproate first-line in males, but in women and girls who could become pregnant valproate should be avoided because of the high risk of fetal malformations and neurodevelopmental harm, so levetiracetam or lamotrigine is used.", "why": ["Carbamazepine is for focal seizures and can worsen some generalised seizure types.", "Valproate is the most effective for generalised seizures, but it should be avoided in women of childbearing potential because of its teratogenicity.", "", "Phenytoin is not recommended for first-line use because of its side effects and interactions.", "Diazepam is a rescue medicine for prolonged seizures, not long-term prevention."], "refs": [["NICE NG217: treating epileptic seizures", "https://nice.org.uk/guidance/ng217/chapter/treating-epileptic-seizures-in-children-young-people-and-adults"]], "note": "Lamotrigine is also a first-line choice in NICE guidance but was not offered here.", "src": "NICE", "id": 106}, {"group": "Medicine", "topic": "Neurology", "stem": "A 63-year-old man presents with a long-standing tremor affecting both hands. The tremor is most noticeable when holding objects and improves at rest. His father had a similar condition. Neurological examination is otherwise normal.", "opts": ["Parkinson disease", "Essential tremor", "Cerebellar disease", "Drug-induced tremor", "Huntington disease"], "ans": 1, "exp": "Essential tremor is a bilateral postural/action tremor, often with a family history, that is typically absent or reduced at rest. The neurological examination is otherwise normal.", "why": ["Parkinson tremor is a rest tremor that improves with movement, and it is accompanied by bradykinesia and rigidity.", "", "Cerebellar tremor is an intention tremor, worse near the target, with other cerebellar signs.", "Drug-induced tremor needs a culprit medicine and a temporal relationship, neither of which is given.", "Huntington disease causes chorea with cognitive and psychiatric changes rather than an isolated tremor."], "refs": [["AAFP: essential tremor", "https://www.aafp.org/pubs/afp/issues/2003/1015/p1545.html"]], "note": "", "src": "American Family Physician", "id": 107}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 74-year-old man presents to the emergency department with acute urinary retention. He has had progressively worsening lower urinary tract symptoms over the past year, including poor stream and nocturia. On examination, his bladder is palpable and uncomfortable. He is otherwise haemodynamically stable. What is the most appropriate immediate management?", "opts": ["Start an alpha-blocker", "Start a 5-alpha-reductase inhibitor", "Insert a urethral catheter", "Arrange urgent TURP", "Insert a suprapubic catheter under ultrasound guidance"], "ans": 2, "exp": "Acute retention is first relieved by draining the bladder with a urethral catheter. A suprapubic catheter is used if urethral catheterisation fails. An alpha-blocker such as tamsulosin is then started to improve the chance of a successful trial without catheter 1-3 days later.", "why": ["An alpha-blocker is added after catheterisation to improve the success of the trial without catheter; it does not relieve a painful full bladder immediately.", "5-ARIs shrink the prostate over months, so they are no help in the acute episode.", "", "TURP is definitive surgery considered after the acute episode, not an immediate step.", "Suprapubic catheterisation is the second-line route if a urethral catheter cannot be passed."], "refs": [["iatrox: acute urinary retention", "https://www.iatrox.com/academy/ukmla/urinary-retention"]], "note": "The source gives catheter sizes and tamsulosin dosing; the iatrox site is a revision platform rather than a guideline body, so cross-check with your local urology guidance.", "src": "iatrox UKMLA revision", "id": 108}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 22-year-old man presents with facial puffiness and dark-coloured urine. He reports a sore throat and fever two weeks earlier that resolved without antibiotics. Examination reveals mild hypertension and periorbital oedema. Urinalysis shows haematuria and proteinuria. What is the most likely diagnosis?", "opts": ["IgA nephropathy", "Post-streptococcal glomerulonephritis", "Minimal change disease", "Membranous nephropathy", "Lupus nephritis"], "ans": 1, "exp": "Post-streptococcal glomerulonephritis typically appears 2-4 weeks after a group A streptococcal throat or skin infection with haematuria, oedema and hypertension. Complement C3 is typically low at presentation and recovers over about 8 weeks.", "why": ["IgA nephropathy produces haematuria 1-3 days after the infection (synpharyngitic), not after a 2-week gap.", "", "Minimal change disease causes nephrotic syndrome with heavy proteinuria and no haematuria or hypertension.", "Membranous nephropathy is a nephrotic syndrome of adults with insidious onset.", "Lupus nephritis needs other systemic lupus features such as rash, arthritis or positive ANA."], "refs": [["Royal Children's Hospital Melbourne: post-streptococcal glomerulonephritis", "https://www.rch.org.au/clinicalguide/guideline_index/post-streptococcal_glomerulonephritis_(psgn)"]], "note": "The RCH page covers children; the timeline and findings apply to adults too. The IgA nephropathy contrast (1-3 days) is standard teaching rather than from this page.", "src": "RCH Melbourne", "id": 109}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 69-year-old man with severe COPD is admitted with increasing drowsiness and involuntary muscle jerks. He is receiving high-flow oxygen via a non-rebreather mask. Arterial blood gas shows respiratory acidosis with elevated bicarbonate levels. Chest examination reveals reduced air entry bilaterally. What is the most appropriate management?", "opts": ["Increase oxygen delivery", "Administer IV sodium bicarbonate", "Start non-invasive ventilation", "Immediate intubation", "Give IV benzodiazepines"], "ans": 2, "exp": "He has hypercapnic (type 2) respiratory failure with acidosis in COPD. The oxygen should be reduced to a controlled target of 88-92%, and NIV is indicated when pH stays below 7.35 with PaCO2 above 6.5 kPa despite optimal medical therapy.", "why": ["More oxygen can worsen CO2 retention in COPD and does nothing for ventilation.", "Bicarbonate treats a metabolic acidosis; here the acid load is respiratory and is corrected by improving ventilation.", "", "Intubation is for patients who fail NIV or have pH below about 7.25.", "Benzodiazepines would suppress respiratory drive further."], "refs": [["NICE QS10: non-invasive ventilation", "https://www.nice.org.uk/guidance/QS10/chapter/quality-statement-7-non-invasive-ventilation"]], "note": "Heads-up: in practice the first move is also to step the oxygen down to a 88-92% target, but NIV is the best of the listed options.", "src": "NICE", "id": 110}, {"group": "Medicine", "topic": "Haematology", "stem": "A 34-year-old woman presents with fever, purpuric rash, confusion, and reduced urine output. She had a flu-like illness one week earlier. Blood tests show anaemia, thrombocytopenia, raised LDH, and schistocytes on blood film. Neurological symptoms fluctuate during admission. What is the most likely diagnosis?", "opts": ["Immune thrombocytopenic purpura", "Disseminated intravascular coagulation", "Thrombotic thrombocytopenic purpura", "Haemolytic uraemic syndrome", "Acute leukaemia"], "ans": 2, "exp": "Fever, microangiopathic haemolytic anaemia (schistocytes, raised LDH), thrombocytopenia, renal impairment and fluctuating neurology form the TTP pentad. It results from ADAMTS13 deficiency (usually autoantibodies), and treatment is urgent plasma exchange with corticosteroids.", "why": ["ITP has isolated thrombocytopenia without haemolysis, schistocytes, or neurological or renal involvement.", "DIC causes a prolonged PT/APTT and low fibrinogen, which are not described here.", "", "HUS is dominated by renal failure, often after diarrhoea with E. coli O157; neurological features are less prominent.", "Leukaemia would typically show abnormal cells on the film and other cytopenias, not schistocytes."], "refs": [["LITFL: thrombotic thrombocytopenic purpura", "https://litfl.com/thrombocytopaenic-thrombotic-purpura-ttp/"]], "note": "", "src": "Life in the Fast Lane", "id": 111}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 46-year-old woman presents with persistent vomiting, hypotension, and confusion following several days of illness. Blood tests reveal hyponatraemia, hyperkalaemia, and hypoglycaemia. She has a history of autoimmune disease affecting her endocrine glands. On examination, she is drowsy but arousable, with low blood pressure and tachycardia. What is the most appropriate immediate treatment?", "opts": ["IV normal saline only", "IV hydrocortisone", "Oral fludrocortisone", "IV dexamethasone", "Insulin infusion"], "ans": 1, "exp": "This is adrenal crisis in a patient with autoimmune adrenal failure. Treatment is immediate IV or IM hydrocortisone 100 mg plus IV saline; do not delay for results.", "why": ["Saline alone leaves the cortisol deficiency untreated.", "", "Oral fludrocortisone is slow and is not for the acute phase.", "Dexamethasone is not preferred because hydrocortisone also gives the mineralocorticoid effect needed at high doses.", "Insulin would worsen the hypoglycaemia that is already present."], "refs": [["Society for Endocrinology: management of adrenal crisis", "https://www.endocrinology.org/media/3716/management-of-adrenal-crisis.pdf"]], "note": "The dexamethasone reasoning is standard teaching and not quoted from the source.", "src": "Society for Endocrinology", "id": 112}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 40-year-old man, recently arrived from Ukraine, reports a 2-week history of cough, night sweats, and weight loss. Chest X-ray shows an upper-lobe cavitating lesion. He has no known immunodeficiency. Physical examination reveals mild finger clubbing and decreased breath sounds in the affected area. Which is the most appropriate initial investigation?", "opts": ["Sputum acid-fast bacilli smear", "Interferon-gamma release assay", "CT chest with contrast", "Blood cultures", "Bronchoscopy"], "ans": 0, "exp": "Cavitating upper-lobe disease with night sweats and weight loss suggests reactivation pulmonary TB. Active TB is diagnosed on sputum: typically three samples, including an early-morning sample, for acid-fast bacilli smear and culture.", "why": ["", "IGRA and Mantoux are used mainly for latent TB and cannot distinguish latent from active disease.", "CT can add detail but does not give a microbiological diagnosis.", "Blood cultures are low yield for pulmonary TB.", "Bronchoscopy is used only if sputum cannot be produced or samples are negative."], "refs": [["iatrox: tuberculosis", "https://www.iatrox.com/academy/ukmla/tuberculosis"]], "note": "Culture is needed too; smear is the quick first result.", "src": "iatrox UKMLA revision", "id": 113}, {"group": "Medicine", "topic": "Infectious Disease", "stem": "A 6-year-old child presents with fever, neck stiffness, and photophobia. Examination reveals positive Brudzinski sign. The child has not been immunised against Haemophilus influenzae type b. CSF analysis shows neutrophilic pleocytosis and low glucose. What is the most likely diagnosis?", "opts": ["Viral meningitis", "Bacterial meningitis", "Tuberculous meningitis", "Fungal meningitis", "Encephalitis"], "ans": 1, "exp": "Bacterial meningitis typically gives a neutrophil-predominant CSF pleocytosis, low glucose and raised protein, in a febrile child with meningism. Missing Hib vaccination raises the risk.", "why": ["Viral meningitis usually has a lymphocytic pleocytosis, normal glucose and lower protein.", "", "TB meningitis is subacute with lymphocytes, very high protein and low glucose.", "Fungal meningitis mostly affects immunocompromised patients and presents subacutely.", "Encephalitis is dominated by altered consciousness, seizures or behavioural change, with a lymphocytic CSF."], "refs": [["University of Hawaii PedText: meningitis", "https://pediatrics.jabsom.hawaii.edu/educational-resources/pedtext/s06c14.html"]], "note": "The source doesn't describe TB or fungal CSF findings; those contrasts are standard teaching.", "src": "PedText, University of Hawaii", "id": 114}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 71-year-old woman presents with new-onset headache, jaw claudication, and scalp tenderness. She also reports fatigue and weight loss over the past month. ESR and CRP are elevated. Temporal artery biopsy is pending. What is the most appropriate initial treatment?", "opts": ["Methotrexate", "Low-dose aspirin", "High-dose oral corticosteroids", "Tocilizumab", "NSAIDs"], "ans": 2, "exp": "This is giant cell arteritis. The risk is sudden permanent sight loss, so high-dose prednisolone (40-60 mg daily if no visual symptoms) is started immediately on clinical suspicion, without waiting for the biopsy, which should ideally be done within 2 weeks of starting steroid.", "why": ["Methotrexate is a steroid-sparing add-on, not the initial treatment.", "Aspirin is not the treatment for the vasculitis.", "", "Tocilizumab is used as a steroid-sparing agent for relapsing disease.", "NSAIDs do not prevent the ischaemic complications."], "refs": [["NHS Highland: giant cell arteritis guideline", "https://www.rightdecisions.scot.nhs.uk/tam-treatments-and-medicines-nhs-highland/therapeutic-guidelines/rheumatology/giant-cell-arteritis-gca-guidelines"]], "note": "", "src": "NHS Highland guideline", "id": 115}, {"group": "Medicine", "topic": "Emergency", "stem": "A 6-year-old boy presents to the emergency department with facial swelling, hives, and difficulty breathing after eating peanuts. He has a history of atopy. On examination, he is hypotensive, tachycardic, and has stridor. What is the most appropriate immediate management?", "opts": ["IV antihistamines", "IM adrenaline", "Oral corticosteroids", "Oxygen only", "Nebulised salbutamol"], "ans": 1, "exp": "This is anaphylaxis (airway and circulation compromise after an allergen). The first-line treatment is intramuscular adrenaline 1 mg/mL into the anterolateral thigh; 300 micrograms for ages 6-12, repeated after 5 minutes if there is no response. Oxygen, fluids and monitoring follow.", "why": ["Antihistamines treat skin symptoms but don't reverse airway or circulatory compromise, and they should never delay adrenaline.", "", "Steroids act slowly and are an adjunct at most.", "Oxygen helps but does not treat the underlying anaphylaxis.", "Salbutamol treats bronchospasm only and would not treat stridor or shock."], "refs": [["Resuscitation Council UK: emergency treatment of anaphylaxis", "https://resus.org.uk/media/333/download"]], "note": "The source doesn't comment on antihistamines or steroids; the reasoning for why they are not first-line is standard teaching.", "src": "Resuscitation Council UK", "id": 116}, {"group": "Medicine", "topic": "Neurology", "stem": "A 45-year-old man presents with difficulty releasing his grip, muscle weakness, and early balding. He reports difficulty climbing stairs and lifting objects. On examination, grip myotonia is observed, and cardiac auscultation reveals an irregular pulse. Which complication is he most at risk of developing?", "opts": ["Respiratory failure", "Cardiac conduction abnormalities", "Rhabdomyolysis", "Peripheral neuropathy", "Cerebral infarction"], "ans": 1, "exp": "Grip myotonia, frontal balding and weakness are the features of myotonic dystrophy. It is a multisystem disease, and cardiac conduction block and arrhythmias are a leading problem, causing dizzy or faint spells.", "why": ["Respiratory muscle weakness can occur in later disease, but conduction disease is the better-known serious risk.", "", "Rhabdomyolysis is not a characteristic complication.", "Peripheral neuropathy is not a main feature.", "Stroke is not a typical complication, although arrhythmia could increase the risk."], "refs": [["MDA: myotonic dystrophy", "https://mda.org/node/231"]], "note": "Heads-up: the MDA page says conduction block is common but doesn't compare the risk with respiratory failure. The ranking comes from standard teaching.", "src": "Muscular Dystrophy Association", "id": 117}, {"group": "Medicine", "topic": "Neurology", "stem": "A 34-year-old man presents with recurrent severe unilateral headaches accompanied by lacrimation, nasal congestion, and restlessness. Each episode lasts approximately 30-60 minutes and occurs multiple times per day, predominantly at night. He has no neurological deficits between attacks.", "opts": ["Migraine", "Tension-type headache", "Cluster headache", "Trigeminal neuralgia", "Temporal arteritis"], "ans": 2, "exp": "Cluster headache gives short, excruciating unilateral attacks around the eye with ipsilateral autonomic features (tearing, nasal congestion) and restlessness, often several times a day and at night.", "why": ["Migraine attacks last hours, with nausea, photophobia, and the patient prefers to lie still.", "Tension-type headache is bilateral, pressing and without autonomic features.", "", "Trigeminal neuralgia causes brief electric-shock pains in the face lasting seconds.", "Temporal arteritis occurs over age 50 with jaw claudication and a raised ESR."], "refs": [["Pulse Reference: cluster headache", "https://pulsereference.com/diagnoses/cluster-headache/"]], "note": "The source doesn't mention the nocturnal timing; the migraine and trigeminal contrasts are standard teaching.", "src": "Pulse Reference", "id": 118}, {"group": "Medicine", "topic": "Neurology", "stem": "A 56-year-old woman presents with a sudden severe headache described as \"the worst of her life.\" Neurological examination is unremarkable. Non-contrast CT brain shows subarachnoid blood. You want to identify the source of bleeding. Which imaging modality is most appropriate to determine the aetiology?", "opts": ["MRI brain", "CT angiography of cerebral vessels", "Conventional angiography", "Contrast-enhanced CT brain only", "Carotid Doppler"], "ans": 1, "exp": "After CT confirms subarachnoid haemorrhage, NICE advises CT angiography to look for an aneurysm. It is quick, widely available and less invasive than catheter angiography, which is kept for when CTA is inconclusive or endovascular treatment is planned.", "why": ["MRI is not the standard test to identify the bleeding source.", "", "Digital subtraction angiography is invasive and is reserved for cases where CTA fails or for treatment planning.", "Contrast CT of the brain parenchyma does not show vessels adequately.", "Carotid Doppler looks at the neck vessels and cannot reveal an intracranial aneurysm."], "refs": [["NICE NG228: subarachnoid haemorrhage", "https://www.nice.org.uk/guidance/NG228/chapter/recommendations"]], "note": "", "src": "NICE", "id": 119}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 62-year-old man with type 2 diabetes treated with metformin presents with an episode of hypoglycaemia. He reports no change in diet or exercise. Examination is unremarkable. His current medications include metformin, gliclazide, and atorvastatin. Which of his medications is most likely responsible?", "opts": ["Metformin", "Gliclazide", "Sitagliptin", "Acarbose", "Liraglutide"], "ans": 1, "exp": "Sulfonylureas such as gliclazide stimulate insulin release regardless of glucose level and are a well-known cause of hypoglycaemia. A BMJ study found sulfonylureas carried roughly 2.5 times the hypoglycaemia risk of metformin.", "why": ["Metformin does not stimulate insulin secretion, so hypoglycaemia alone is rare.", "", "Sitagliptin (DPP-4 inhibitor) acts glucose-dependently and rarely causes hypoglycaemia alone.", "Acarbose delays carbohydrate absorption and rarely causes hypoglycaemia alone.", "Liraglutide acts glucose-dependently, so hypoglycaemia is uncommon by itself."], "refs": [["BMJ 2016: sulfonylurea hypoglycaemia risk", "https://www.bmj.com/content/354/bmj.i3625.long"]], "note": "Heads-up: the BMJ study compares sulfonylureas with metformin; it doesn't compare them with DPP-4 inhibitors. Sitagliptin is not in his drug list in the stem anyway.", "src": "BMJ", "id": 120}, {"group": "Medicine", "topic": "Neurology", "stem": "A 68-year-old man presents with bradykinesia, rigidity, and resting tremor. He reports difficulty initiating movements and shuffling gait. No cognitive deficits are present. Family history is negative for neurological disease. What is the most appropriate first-line treatment?", "opts": ["Levodopa/carbidopa", "Dopamine agonist", "MAO-B inhibitor", "Anticholinergic", "COMT inhibitor"], "ans": 0, "exp": "This is Parkinson disease. NICE NG71 recommends levodopa for people whose motor symptoms affect quality of life, and in older patients it is often the preferred first-line option. Dopamine agonists and MAO-B inhibitors are alternatives for people with less disabling symptoms.", "why": ["", "Agonists are an option for early disease but cause more hallucinations, impulse-control disorders and sleepiness, which matters in a 68-year-old.", "MAO-B inhibitors are suitable for mild symptoms but are less effective for motor symptoms than levodopa.", "Anticholinergics are mainly for tremor and cause confusion in older adults.", "COMT inhibitors are adjuncts to levodopa, not first line."], "refs": [["GPnotebook: medical treatment of parkinsonism", "https://gpnotebook.com/pages/neurology/management-of-parkinsons-disease/medical-treatment-of-parkinsonism"]], "note": "Heads-up: guidance allows levodopa, dopamine agonist or MAO-B inhibitor as initial options depending on symptoms; levodopa is the best answer for a symptomatic patient of this age.", "src": "GPnotebook", "id": 121}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 58-year-old man presents with severe, central chest pain radiating to his left arm and jaw. ECG shows ST-segment elevations in the anterior leads. Troponin levels are significantly elevated. He has a history of hypertension and smoking. What is the most likely diagnosis?", "opts": ["Unstable angina", "NSTEMI", "STEMI", "Pericarditis", "Pulmonary embolism"], "ans": 2, "exp": "Ischaemic chest pain with new ST elevation in contiguous leads and raised troponin indicates a ST-elevation myocardial infarction caused by acute occlusion of a coronary artery, here in the anterior (LAD) territory.", "why": ["Unstable angina has no troponin rise.", "NSTEMI has a troponin rise without persistent ST elevation.", "", "Pericarditis gives pleuritic, positional pain with widespread saddle-shaped ST elevation.", "PE causes pleuritic pain and breathlessness with tachycardia, not localised ST elevation."], "refs": [["StatPearls: ST-elevation myocardial infarction", "https://statpearls.com/point-of-care/17173"]], "note": "", "src": "StatPearls", "id": 122}, {"group": "Medicine", "topic": "Infectious Disease", "stem": "A 28-year-old man returns from Bali with sudden high-grade fever, myalgia, and headache. He reports retro-orbital pain and mild bleeding from the gums. Blood pressure is stable initially but he is tachycardic. Laboratory results show thrombocytopenia and mild haemoconcentration. What is the most appropriate immediate management?", "opts": ["IV antibiotics", "IV fluids and supportive care", "Antivirals", "Immediate platelet transfusion", "Corticosteroids"], "ans": 1, "exp": "Fever, retro-orbital pain, thrombocytopenia and haemoconcentration after tropical travel indicate dengue with warning signs. There is no specific antiviral, so fluid replacement and monitoring (haematocrit, platelets) are the treatment.", "why": ["It is a viral infection, so antibiotics do not help.", "", "No antiviral is effective against dengue.", "Platelets are not transfused for a low count alone because the problem is plasma leakage, not just platelet number.", "Steroids have no proven benefit."], "refs": [["GPnotebook: dengue fever management", "https://gpnotebook.com/pages/general-information/dengue-fever/management"]], "note": "Heads-up: the source supports supportive fluid care but doesn't discuss platelet transfusion or steroids, so those reasons come from standard teaching.", "src": "GPnotebook", "id": 123}, {"group": "Medicine", "topic": "Infectious Disease", "stem": "A 35-year-old woman presents with fever, chills, and malaise after returning from Nigeria. She reports rigors and intermittent sweats over the past 48 hours. Physical examination is unremarkable. You suspect a tropical infection. What is the most appropriate initial diagnostic step?", "opts": ["Blood culture", "Rapid malaria antigen test", "Serology for dengue", "Stool culture", "Chest X-ray"], "ans": 1, "exp": "Fever after travel to a malaria-endemic area is malaria until proven otherwise. UK guidance requires an urgent blood film (with a rapid antigen test); a single negative result does not exclude malaria, so films are repeated over 3 days.", "why": ["Cultures may be needed later but would delay malaria testing.", "", "Dengue serology is not the immediate priority from West Africa with rigors.", "No diarrhoea is described.", "There are no respiratory symptoms."], "refs": [["UK Health Security Agency: malaria diagnosis", "https://www.gov.uk/government/publications/malaria-prevention-guidelines-for-travellers-from-the-uk-2026/diagnosis"]], "note": "Heads-up: the guideline emphasises the urgent thick and thin blood film as the diagnostic cornerstone; the RDT is its companion test.", "src": "UKHSA", "id": 124}, {"group": "Medicine", "topic": "Infectious Disease", "stem": "A 42-year-old man presents with persistent cough, weight loss, and night sweats. He has a history of close contact with a relative with tuberculosis. Tuberculin skin testing is being considered to evaluate latent infection. Which test is most appropriate to confirm active pulmonary tuberculosis?", "opts": ["Tuberculin skin test", "Sputum acid-fast bacilli smear and culture", "Chest X-ray alone", "Interferon-gamma release assay", "Bronchoscopy only"], "ans": 1, "exp": "Active TB is confirmed by finding the organism: three sputum samples (including an early-morning one) for acid-fast bacilli smear and culture.", "why": ["Tuberculin tests only show past exposure and can't distinguish latent from active disease.", "", "X-ray patterns suggest TB but do not confirm it.", "IGRA is also for latent infection and does not confirm active disease.", "Bronchoscopy is used if sputum can't be obtained."], "refs": [["iatrox: tuberculosis", "https://www.iatrox.com/academy/ukmla/tuberculosis"]], "note": "", "src": "iatrox UKMLA revision", "id": 125}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 10-year-old boy presents with palpable purpura on the lower limbs and abdominal pain. He recently had an upper respiratory tract infection. Urinalysis shows microscopic haematuria and mild proteinuria. No other organ involvement is noted. What is the most likely diagnosis?", "opts": ["Henoch-Schönlein purpura (IgA vasculitis)", "Immune thrombocytopenic purpura", "Thrombotic thrombocytopenic purpura", "Kawasaki disease", "Lupus vasculitis"], "ans": 0, "exp": "IgA vasculitis (HSP) classically gives palpable purpura on the legs, abdominal pain, joint pain and kidney involvement in a child after a viral URTI. Diagnosis is mostly clinical in children.", "why": ["", "ITP gives non-palpable petechiae and a low platelet count without abdominal pain or nephritis.", "TTP is rare in a child and causes haemolysis, fever and neurological signs.", "Kawasaki disease has prolonged fever, conjunctivitis, rash and mucosal changes in younger children.", "Lupus vasculitis is unlikely in a 10-year-old boy without other lupus features."], "refs": [["MSD Manual: IgA-associated vasculitis", "https://www.msdmanuals.com/professional/musculoskeletal-and-connective-tissue-disorders/vasculitis/immunoglobulin-a–associated-vasculitis-igav"]], "note": "The source doesn't discuss ITP, TTP or Kawasaki; those contrasts are standard teaching.", "src": "MSD Manual", "id": 126}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 59-year-old man presents with melaena and fatigue. Laboratory investigations reveal haemoglobin of 6.8 g/dL. He has a history of NSAID use but no known liver disease. Vital signs are stable but show tachycardia. What is the most appropriate next step in management?", "opts": ["Endoscopic intervention immediately", "IV fluids only", "Packed red blood cell transfusion", "Oral proton pump inhibitor only", "Observe and repeat labs in 24 hours"], "ans": 2, "exp": "He has an upper GI bleed with a haemoglobin below 70 g/L. With a restrictive transfusion strategy, red cells are given when Hb is below 70 g/L (target 70-100 g/L). Endoscopy should follow within 24 hours of admission, after resuscitation.", "why": ["Endoscopy is urgent but follows resuscitation, and the patient is currently stable apart from tachycardia.", "Fluids alone do not fix severe anaemia.", "", "Oral PPI alone is inadequate for an active bleed.", "Observation is unsafe with a haemoglobin this low."], "refs": [["Upper GI bleeding bundle (PMC7307267)", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7307267"]], "note": "", "src": "PMC review", "id": 127}, {"group": "Medicine", "topic": "Haematology", "stem": "A 42-year-old man presents with fatigue and recurrent infections. Blood tests reveal circulating myeloblasts. Bone marrow biopsy shows cells with Auer rods. Cytogenetics reveal t(8;21). What is the most likely diagnosis?", "opts": ["Acute lymphoblastic leukaemia", "Acute myeloid leukaemia", "Chronic myeloid leukaemia", "Myelodysplastic syndrome", "Aplastic anaemia"], "ans": 1, "exp": "Myeloblasts with Auer rods and t(8;21) (RUNX1-RUNX1T1) define a subtype of acute myeloid leukaemia with a relatively favourable prognosis.", "why": ["ALL has lymphoblasts without Auer rods.", "", "CML is defined by t(9;22) and shows mature granulocytes.", "MDS has less than 20% blasts and dysplasia.", "Aplastic anaemia is a hypocellular marrow without blasts."], "refs": [["CCGA: AML with t(8;21)", "https://www.ccga.io/index.php/HAEM4:Acute_Myeloid_Leukemia_(AML)_with_t(8;21)(q22;q22.1);_RUNX1-RUNX1T1"]], "note": "", "src": "Cancer Cytogenetics", "id": 128}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 72-year-old man is admitted with profuse watery diarrhoea. He has had two similar episodes in the past six months, both treated with standard oral therapy. Stool testing again confirms Clostridioides difficile infection. He has completed a full course of oral vancomycin previously. What is the most appropriate next treatment?", "opts": ["Oral metronidazole", "IV vancomycin", "Oral fidaxomicin", "Probiotic therapy", "Faecal calprotectin testing"], "ans": 2, "exp": "Recurrent C. difficile infection is treated with oral fidaxomicin. Scottish guidance recommends fidaxomicin for relapse within 12 weeks and oral vancomycin for later recurrences; oral vancomycin is first line for a first episode.", "why": ["Metronidazole is no longer first-line and was only a temporary option when vancomycin was unavailable.", "IV vancomycin does not reach the colon, so it is ineffective.", "", "The source doesn't support probiotics as treatment.", "Calprotectin measures gut inflammation and does not treat anything."], "refs": [["SAPG: adult C. difficile infection treatment (2022)", "https://rightdecisions.scot.nhs.uk/media/32ylfs2b/202202sapg_adults_cdiff.pdf"]], "note": "Heads-up: Scottish rules say relapse within 12 weeks gets fidaxomicin, and later recurrence goes back to vancomycin. The stem says episodes within 6 months, so fidaxomicin is the best fit here.", "src": "Scottish Antimicrobial Prescribing Group", "id": 129}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 42-year-old woman presents with painful red nodules on her shins, ankle swelling, and joint pain. She also reports shortness of breath. Chest X-ray shows bilateral hilar lymphadenopathy. There is no history of tuberculosis exposure. What is the most likely diagnosis?", "opts": ["Tuberculosis", "Lymphoma", "Sarcoidosis", "Rheumatoid arthritis", "Pulmonary embolism"], "ans": 2, "exp": "Erythema nodosum, ankle periarthritis and bilateral hilar lymphadenopathy form Löfgren syndrome, an acute form of sarcoidosis. Most patients recover spontaneously within months.", "why": ["TB could cause hilar nodes, but without exposure and with this triad, sarcoidosis fits better.", "Lymphoma gives B symptoms and does not produce this triad.", "", "RA causes a symmetrical small-joint arthritis, not hilar nodes.", "PE does not cause nodules, ankle periarthritis or hilar nodes."], "refs": [["Löfgren syndrome review (PMC10789483)", "https://pmc.ncbi.nlm.nih.gov/articles/PMC10789483"]], "note": "", "src": "PMC review", "id": 130}, {"group": "Medicine", "topic": "Neurology", "stem": "A 79-year-old woman is brought in by her family because of progressive cognitive decline over the past two years. She has difficulty with short-term memory and struggles with daily tasks. There is no prominent personality change or visual hallucinations. Neurological examination is otherwise unremarkable. Which medication is most appropriate for symptomatic treatment?", "opts": ["Haloperidol", "Memantine", "Donepezil", "Fluoxetine", "Diazepam"], "ans": 2, "exp": "This is probable Alzheimer disease. Acetylcholinesterase inhibitors (donepezil, galantamine, rivastigmine) are the recommended symptomatic treatment for mild to moderate disease, started by a specialist. Memantine is for moderate disease when these are not tolerated, or for severe disease.", "why": ["Antipsychotics are for severe distress or risk, and increase mortality and stroke risk in dementia.", "Memantine is second line for moderate disease or used in severe disease.", "", "An antidepressant would be for depression, which is not described.", "Benzodiazepines worsen confusion and falls."], "refs": [["NICE TA217 appraisal document: Alzheimer's drugs", "https://nice.org.uk/guidance/ta217/documents/alzheimers-disease-donepezil-galantamine-rivastigmine-and-memantine-review-appraisal-consultation-document"]], "note": "Heads-up: the page I read is NICE's draft appraisal consultation document, so check the final TA217/NG97 wording. The antipsychotic and benzodiazepine reasons are standard teaching.", "src": "NICE", "id": 131}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 52-year-old man with autosomal dominant polycystic kidney disease has undergone multiple abdominal surgeries for bowel perforation and diverticulitis. His renal function has now deteriorated to end-stage kidney disease. You are planning renal replacement therapy. Which modality is most appropriate?", "opts": ["Continuous ambulatory peritoneal dialysis", "Automated peritoneal dialysis", "Intermittent haemodialysis", "Pre-emptive renal transplant", "Conservative management"], "ans": 2, "exp": "Repeated abdominal surgery and large polycystic kidneys reduce the space and suitability of the peritoneal cavity for peritoneal dialysis, so haemodialysis is the sensible option. One registry study found that prior upper abdominal surgery raised the risk of catheter failure.", "why": ["Adhesions from multiple operations make PD difficult and risk catheter failure.", "Automated PD has the same peritoneal limitation as CAPD.", "", "Transplant is the best long-term treatment but he is already in ESKD and not described as pre-emptive or assessed for a donor.", "Conservative care is for patients who decline or are unsuitable for dialysis."], "refs": [["AJKD blog: abdominal surgery history and PD catheter failure", "https://ajkdblog.org/2024/09/18/abdominal-surgery-history-and-peritoneal-dialysis-catheter-failure-can-we-really-know-whos-at-risk/"]], "note": "Heads-up: the source shows the association is modest and unclear overall, and it does not recommend haemodialysis directly. The answer is the exam logic. Transplant remains the long-term goal.", "src": "AJKD blog", "id": 132}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 34-year-old woman presents with difficulty climbing stairs and lifting objects. She reports fatigue and muscle weakness over several months. Examination reveals Gottron papules over the knuckles and a heliotrope rash around the eyes. Muscle enzymes are elevated. What is the most likely diagnosis?", "opts": ["Polymyalgia rheumatica", "Dermatomyositis", "Myasthenia gravis", "Inclusion body myositis", "Hypothyroid myopathy"], "ans": 1, "exp": "Gottron papules and a heliotrope rash are relatively specific for dermatomyositis, which also causes symmetric proximal muscle weakness and a raised creatine kinase.", "why": ["PMR causes pain and stiffness of shoulders and hips with a raised ESR, and normal CK and no rash.", "", "Myasthenia gives fatigable weakness with normal CK and no skin changes.", "Inclusion body myositis occurs in older people, is slowly progressive, affects distal muscles and has no rash.", "Hypothyroid myopathy can raise CK but does not cause these skin signs."], "refs": [["MSD Manual: polymyositis and dermatomyositis", "https://www.msdmanuals.com/professional/musculoskeletal-and-connective-tissue-disorders/autoimmune-rheumatic-disorders/polymyositis-and-dermatomyositis"]], "note": "The PMR and hypothyroid contrasts are standard teaching, not from the source.", "src": "MSD Manual", "id": 133}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 65-year-old woman comes to the physician because of a 1-month history of persistent epigastric abdominal pain. She reports dull, aching pain that is worse after meals and wakes her up at night. She is afraid to eat, as it worsens the pain, and has had a 2-kg (4.4-lb) weight loss during this time. She has smoked a pack of cigarettes daily for the past 40 years. Her only medication is a calcium supplement. Her vital signs are within normal limits. She appears thin. Examination shows yellow discoloration of the sclera. The remainder of the examination shows no abnormalities. Laboratory studies show a total bilirubin of 9.8 mg/dL, direct bilirubin of 8.6 mg/dL, and an alkaline phosphatase of 120 IU/L. Abdominal ultrasonography shows dilation of the biliary and pancreatic ducts but no pancreatic or extrahepatic biliary lesions. Which of the following is the most appropriate next step in management?", "opts": ["Colonoscopy", "Plain abdominal CT", "Contrast-enhanced abdominal CT", "EUS scan", "ERCP"], "ans": 2, "exp": "Dual-phase (pancreatic protocol) contrast-enhanced CT is the best initial test for diagnosing and staging suspected pancreatic cancer, about 98% sensitive. Endoscopic ultrasound is used next if CT is indeterminate or negative with high suspicion, and for tissue sampling.", "why": ["Colonoscopy examines the colon and doesn't evaluate a pancreatic mass.", "Without contrast, a pancreatic tumour (poorly vascularised, hypodense) is poorly seen and staging is inadequate.", "", "EUS is the next test if CT is indeterminate or negative, not the first.", "ERCP is invasive with risks such as pancreatitis, so it is not the initial diagnostic test."], "refs": [["AAFP: pancreatic cancer diagnosis and management", "https://www.aafp.org/pubs/afp/issues/2006/0201/p485.html"]], "note": "The source is a 2006 AFP review. Current practice is also pancreatic protocol CT first.", "src": "Linked sources", "id": 134}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 64-year-old man comes to the physician because of a 2-week history of intermittent epigastric discomfort. He reports that his urine has been very dark, and his stools have been pale for the past week. His appetite has decreased, and he has had a 4.5-kg (10-lb) weight loss during this period. He has smoked 1 pack of cigarettes daily for 30 years. He drinks a few shots of vodka daily. He has no history of severe illness. He has chronic left knee pain, for which he takes acetaminophen. Vital signs are within normal limits. Examination shows jaundice of the skin and scleral icterus. There are scratch marks on the extremities. Abdominal examination shows a nontender, palpable mass in the right upper quadrant. The remainder of the examination is normal. Laboratory studies show: Hemoglobin 11.6 g/dL Leukocyte count 8,700/mm3 Platelet count 172,000/mm3 Serum Urea nitrogen 17 mg/dL Creatinine 1.1 mg/dL Bilirubin Total 6 mg/dL Direct 5.2 mg/dL Alkaline phosphatase220 IU/L Ultrasonography shows dilated extrahepatic and pancreatic ducts and a distended gall bladder. Which of the following is the most likely cause of these findings?", "opts": ["Alcoholic liver disease", "Malignant biliary tract obstruction", "Primary sclerosing cholangitis", "Choledocholithiasis", "Chronic pancreatitis"], "ans": 1, "exp": "Painless obstructive jaundice with dark urine, pale stools, weight loss, a distended palpable gallbladder (Courvoisier sign) and dilated biliary and pancreatic ducts suggests malignant obstruction by a pancreatic head tumour. Smoking is a risk factor.", "why": ["Alcoholic liver disease gives hepatocellular jaundice with raised transaminases, not dilated ducts.", "", "PSC causes a beaded, strictured biliary tree and typically occurs with ulcerative colitis in younger people.", "A gallstone in the duct usually causes painful jaundice, and the gallbladder is usually contracted rather than palpable.", "Chronic pancreatitis causes pain and calcification and rarely produces a palpable gallbladder."], "refs": [["AAFP: pancreatic cancer diagnosis and management", "https://www.aafp.org/pubs/afp/issues/2006/0201/p485.html"]], "note": "The source gives Courvoisier sign as 83-90% specific but only 26-55% sensitive, so an absent palpable gallbladder doesn't exclude cancer.", "src": "Linked sources", "id": 135}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A previously healthy 48-year-old man comes to the physician because of a 3-week history of progressively worsening jaundice, generalized itching, and epigastric discomfort. He also complains of nausea and loss of appetite. His stools have looked like clay for the past week. He has returned from a vacation in Thailand one week ago, where he got a new tattoo. He is sexually active with multiple partners and does not use protection. His vital signs are within normal limits. Examination shows jaundice and scleral icterus. Superficial excoriations are seen on all limbs. Abdominal examination shows no abnormalities. Serum studies show a fasting glucose level of 198 mg/dL, total bilirubin concentration of 10.6 mg/dL, direct bilirubin concentration of 9.8 mg/dl, and alkaline phosphatase activity of 450 U/L. Abdominal ultrasonography shows dilation of the biliary and pancreatic ducts and a 3-cm hypoechoic solid mass with irregular margins in the head of the pancreas. An elevation of which of the following serum findings is most specific for this patient's condition?", "opts": ["Alpha-fetoprotein", "Cancer antigen 125", "Glucagon", "Cancer antigen 19-9", "Anti-HBc immunoglobulin M"], "ans": 3, "exp": "CA 19-9 can help confirm pancreatic cancer in a symptomatic patient and predict prognosis and recurrence, but it is raised in some benign hepatobiliary diseases too. Its sensitivity (50-75%) and specificity (83%) are too low for screening.", "why": ["Alpha-fetoprotein is the marker for hepatocellular carcinoma and germ-cell tumours.", "CA-125 is used for ovarian cancer.", "Glucagon is raised in glucagonomas, which are rare.", "", "Anti-HBc IgM indicates acute hepatitis B, and doesn't point to a pancreatic mass."], "refs": [["AAFP: pancreatic cancer diagnosis and management", "https://www.aafp.org/pubs/afp/issues/2006/0201/p485.html"]], "note": "The source says CA 19-9 is helpful in symptomatic patients but it is not very specific. The key's wording 'most specific' is relative to the other options.", "src": "Linked sources", "id": 136}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 72-year-old man is brought to the physician by his son because of gradually progressive yellow discoloration of his skin and generalized pruritus for the past 2 weeks. During this period, his appetite has decreased and he has had a 6.3-kg (14-lb) weight loss. He reports that his stool appears pale and his urine is very dark. Three years ago, he had an episode of acute upper abdominal pain that was treated with IV fluids, NSAIDs, and dietary modification. He has stopped drinking alcohol since then; he used to drink 1–2 beers daily for 40 years. He has smoked a pack of cigarettes daily for the past 50 years. His vital signs are within normal limits. Physical examination shows yellowing of the conjunctivae and skin. The abdomen is soft and nontender; a soft, cystic mass is palpated in the right upper quadrant. Serum studies show: Bilirubin, total 5.6 mg/dL Direct 4.8 mg/dL Alkaline phosphatase 192 U/L AST 32 U/L ALT 34 U/L Abdominal ultrasonography shows an anechoic cystic mass in the subhepatic region and dilation of the intrahepatic and extrahepatic bile ducts. Which of the following is the most likely diagnosis?", "opts": ["Pancreatic cancer", "Pancreatic pseudocyst", "Choledocholithiasis", "Acute cholangitis", "Budd-Chiari syndrome"], "ans": 0, "exp": "Painless jaundice, weight loss, pale stools, dark urine, a distended non-tender gallbladder and dilated intrahepatic and extrahepatic ducts suggest pancreatic cancer, which obstructs the bile duct from the head of the gland.", "why": ["", "A pseudocyst follows pancreatitis and usually causes pain, without progressive jaundice and weight loss.", "A stone in the bile duct usually causes painful jaundice, and the gallbladder is usually not palpable.", "Cholangitis presents with fever, jaundice and rigors (Charcot's triad).", "Budd-Chiari syndrome causes hepatic vein obstruction with ascites and tender hepatomegaly, not biliary dilatation."], "refs": [["AAFP: pancreatic cancer diagnosis and management", "https://www.aafp.org/pubs/afp/issues/2006/0201/p485.html"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 137}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 70-year-old man comes to the physician for the evaluation of abdominal pain over the past month. The patient describes epigastric pain that radiates to the back. He also reports a 10-kg (22-lb) weight loss over the past 6 months. He has a history of untreated type 2 diabetes mellitus. He has not seen a doctor in 15 years. He is retired and spends most of his time at home watching TV. He rarely cooks and mainly eats fast food. He has smoked one pack of cigarettes daily for the past 50 years. He drinks 2–3 cans of beer per day. He appears pale. His temperature is 37°C (98.6°F), pulse is 80/min, and blood pressure is 150/90 mm Hg. Physical examination shows jaundice of the conjunctivae and the skin. The abdomen is soft, with no rebound or guarding. Laboratory studies show a serum glucose concentration of 260 mg/dL. Abdominal sonography shows enlargement of the gallbladder. Which of the following is most likely to have contributed to this patient's condition?", "opts": ["Lack of physical activity", "Smoking History", "Diabetes mellitus", "Poor dietary habits", "History of alcohol use"], "ans": 1, "exp": "Smoking is one of the main modifiable risk factors for pancreatic cancer, along with diabetes and obesity. A 50 pack-year history and unexplained weight loss with epigastric pain radiating to the back should raise suspicion.", "why": ["Inactivity is associated with obesity, but is a weaker influence than smoking.", "", "Diabetes is associated with pancreatic cancer, but here it may also be an effect of the tumour, so smoking is the stronger contributor.", "Poor diet contributes through obesity but is less significant.", "Alcohol is linked to chronic pancreatitis, which is a risk factor, but the direct link to cancer is weaker than for smoking."], "refs": [["AAFP: pancreatic cancer diagnosis and management", "https://www.aafp.org/pubs/afp/issues/2006/0201/p485.html"]], "note": "The source calls smoking one of the main modifiable risks but doesn't state a '25% of cases' figure.", "src": "Linked sources", "id": 138}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A previously healthy 31-year-old woman comes to the emergency department because of sudden, severe epigastric pain and vomiting for the past 4 hours. She reports that the pain radiates to the back and began when she was having dinner and drinks at a local brewpub. Her temperature is 37.9°C (100.2°F), pulse is 98/min, respirations are 19/min, and blood pressure is 110/60 mm Hg. Abdominal examination shows epigastric tenderness and guarding but no rebound. Bowel sounds are decreased. Laboratory studies show: Hematocrit 43% Leukocyte count 9000/mm3 Serum Na+ 140 mEq/L + K 4.5 mEq/L Ca2+ 9.0 mg/dL Lipase 170 U/L (N = < 50 U/L) Amylase 152 U/L Alanine aminotransferase (ALT, GPT)140 U/L Intravenous fluid resuscitation is begun. Which of the following is the most appropriate next step in management?", "opts": ["ERCP", "Plain x-ray of the abdomen", "Contrast-enhanced abdominal CT scan", "Measure serum triglycerides", "Right upper quadrant abdominal ultrasound"], "ans": 4, "exp": "After fluid resuscitation, find the cause. All patients with acute pancreatitis need a transabdominal ultrasound to confirm or exclude gallstones, and raised liver enzymes point to a biliary cause.", "why": ["ERCP is only for cholangitis or persistent obstruction, as it can itself cause pancreatitis.", "A plain abdominal X-ray is not helpful for finding the cause.", "CT is not done early, and for severity it is delayed until 72-96 hours.", "Triglycerides are checked if no other cause is found, but gallstones are far commoner.", ""], "refs": [["GPnotebook: acute pancreatitis investigations and diagnosis", "https://gpnotebook.com/pages/gastroenterology/acute-pancreatitis/investigations-and-diagnosis"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 139}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 50-year-old man comes to the emergency department because of severe lower chest pain for the past hour. The pain radiates to the back and is associated with nausea. He has had two episodes of non- bloody vomiting since the pain started. He has a history of hypertension and type 2 diabetes mellitus. He has smoked one pack of cigarettes daily for 30 years. He drinks five to six beers per day. His medications include enalapril and metformin. His temperature is 38.5°C (101.3°F), pulse is 110/min, and blood pressure is 90/60 mm Hg. The lungs are clear to auscultation. Examination shows a distended abdomen with epigastric tenderness and guarding but no rebound; bowel sounds are decreased. Laboratory studies show: Hemoglobin 14.5 g/dL Leukocyte count5,100/mm3 Platelet count 280,000/mm3 Serum Na+ 133 mEq/L + K 3.5 mEq/L Cl- 98 mEq/L Total bilirubin 1.0 mg/dL Amylase 160 U/L Lipase 880 U/L (N = 14–280) An ECG shows sinus tachycardia. Which of the following is the most likely diagnosis?", "opts": ["Peptic ulcer disease", "Aortic dissection", "Acute pancreatitis", "Pericarditis", "Boerhaave syndrome"], "ans": 2, "exp": "Acute pancreatitis is confirmed when two of three criteria are met: upper abdominal pain, lipase or amylase more than three times the upper limit, or characteristic imaging. Here severe epigastric pain radiates to the back with vomiting and a lipase of 880.", "why": ["A peptic ulcer causes epigastric pain without a markedly raised lipase, unless it penetrates.", "Aortic dissection causes tearing chest or back pain and unequal pulses, and lipase would not be raised.", "", "Pericarditis causes pleuritic chest pain relieved by leaning forward and has ECG changes.", "Boerhaave syndrome follows forceful vomiting with chest pain and surgical emphysema."], "refs": [["GPnotebook: acute pancreatitis investigations and diagnosis", "https://gpnotebook.com/pages/gastroenterology/acute-pancreatitis/investigations-and-diagnosis"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 140}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 42-year-old woman is brought to the emergency department because of intermittent sharp right upper quadrant abdominal pain and nausea for the past 10 hours. She vomited three times. There is no associated fever, chills, diarrhea, or urinary symptoms. She has two children who both attend high school. She appears uncomfortable. She is 165 cm (5 ft 5 in) tall and weighs 86 kg (190 lb); BMI is 32 kg/m2. Her temperature is 37°C (98.6°F), pulse is 100/min, and blood pressure is 140/90 mm Hg. She has mild scleral icterus. The abdomen is soft and nondistended, with tenderness to palpation of the right upper quadrant without guarding or rebound. Bowel sounds are normal. Laboratory studies show: Hemoglobin count 14 g/dL Leukocyte count 9,000 mm3 Platelet count 160,000 mm3 Serum Alkaline phosphatase 238 U/L Aspartate aminotransferase60 U/L Bilirubin Total 2.8 mg/dL Direct 2.1 mg/dL Which of the following is the most appropriate next step in diagnosis?", "opts": ["Transabdominal ultrasonography", "Supine and erect x-rays of the abdomen", "ERCP", "HIDA scan of the biliary tract", "CT scan of the abdomen"], "ans": 0, "exp": "Transabdominal ultrasound is the first-line test for RUQ pain and/or jaundice. It shows gallstones and a dilated bile duct, although it rarely sees the duct stones themselves and cannot reliably exclude choledocholithiasis.", "why": ["", "Plain films are not helpful as most gallstones are not radio-opaque.", "ERCP is diagnostic and therapeutic but invasive, so it is used when likelihood is high.", "A HIDA scan evaluates cystic duct obstruction and gallbladder function.", "CT is less sensitive than ultrasound for gallstones."], "refs": [["AMBOSS: choledocholithiasis", "https://amboss.com/us/knowledge/Choledocholithiasis"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 141}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 44-year-old woman comes to the emergency department because of a 10-hour history of severe nausea and abdominal pain that began 30 minutes after eating dinner. The pain primarily is in her right upper quadrant and occasionally radiates to her back. She has a history of type 2 diabetes mellitus and hypercholesterolemia. Current medications include metformin and atorvastatin. She is 163 cm (5 ft 4 in) tall and weighs 91 kg (200 lb); BMI is 34 kg/m2. Her temperature is 38.8°C (101.8°F), pulse is 100/min, respirations are 14/min, and blood pressure is 150/76 mm Hg. Abdominal examination shows right upper quadrant tenderness with guarding. A bedside ultrasound shows a gall bladder wall measuring 6 mm, pericholecystic fluid, sloughing of the intraluminal membrane, and a 2 x 2-cm stone at the neck of the gallbladder. The common bile duct appears unremarkable. Laboratory studies show leukocytosis and normal liver function tests. Intravenous fluids are started, and she is given ketorolac for pain control. Which of the following is the most appropriate next step in management?", "opts": ["Antibiotic therapy", "CT scan of the abdomen with contrast", "Ursodeoxycholic acid", "ERCP", "Emergent open cholecystectomy"], "ans": 0, "exp": "Acute cholecystitis with fever and a history of diabetes is managed with fluids, analgesia and intravenous antibiotics, followed by early laparoscopic cholecystectomy (ideally within a week). If unfit, percutaneous cholecystostomy is a bridge.", "why": ["", "The ultrasound has already established the diagnosis, so CT is not needed first.", "Ursodeoxycholic acid dissolves cholesterol stones slowly and doesn't treat acute infection.", "ERCP is for suspected duct stones, and her liver tests are normal.", "Emergency open surgery is not first-line, and early laparoscopic surgery is preferred once she is stabilised."], "refs": [["iatrox: acute cholecystitis", "https://www.iatrox.com/academy/ukmla/acute-cholecystitis"]], "note": "The source lists antibiotics alongside fluids, analgesia and surgery. Giving antibiotics first is the course's answer, and the source says 'if septic or while awaiting surgery'.", "src": "Linked sources", "id": 142}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 42-year-old woman is brought to the emergency department because of a 5-day history of epigastric pain, fever, nausea, and malaise. Five weeks ago she had acute biliary pancreatitis and was treated with endoscopic retrograde cholangiopancreatography and subsequent cholecystectomy. Her maternal grandfather died of pancreatic cancer. She does not smoke. She drinks 1–2 beers daily. Her temperature is 38.7°C (101.7°F), respirations are 18/min, pulse is 120/min, and blood pressure is 100/70 mm Hg. Abdominal examination shows epigastric tenderness and three well-healed laparoscopy scars. The remainder of the examination shows no abnormalities. Laboratory studies show: Hemoglobin 10 g/dL Leukocyte count 15,800/mm3 Serum Na+ 140 mEq/L Cl− 103 mEq/L + K 4.5 mEq/L HCO3- 25 mEq/L Urea nitrogen 18 mg/dL Contact Creatinine 1.0 mg/dL Alkaline phosphatase 70 U/L Aspartate aminotransferase (AST, GOT)22 U/L Alanine aminotransferase (ALT, GPT) 19 U/L γ-Glutamyltransferase (GGT) 55 U/L (N = 5–50) Bilirubin 1 mg/dl Glucose 105 mg/dL Amylase 220 U/L Lipase 365 U/L (N = 14–280) Abdominal ultrasound shows a complex cystic fluid collection with irregular walls and septations in the pancreas. Which of the following is the most likely diagnosis?", "opts": ["Acute cholangitis", "Pancreatic pseudocyst", "Pancreatic abscess", "Pancreatic cancer", "ERCP-induced pancreatitis"], "ans": 2, "exp": "A pancreatic abscess is a late complication of acute necrotising pancreatitis, typically more than 4 weeks after the attack, and presents with fever and a tender abdomen. Contrast CT is the most accurate test, and drainage is central.", "why": ["Cholangitis presents with fever, jaundice and rigors, and it would not produce a complex pancreatic collection.", "A pseudocyst is a sterile collection with a fibrous wall and doesn't cause fever unless infected.", "", "Pancreatic cancer would be solid and without fever.", "Post-ERCP pancreatitis occurs within 24 hours of the procedure, and she is 5 weeks out."], "refs": [["Medscape: pancreatic necrosis and abscess", "https://www.emedicine.com/med/topic1711.htm"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 143}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 55-year-old woman comes to the emergency department because of a 24-hour history of severe lower abdominal pain. She has had two episodes of nonbloody vomiting today and has been unable to keep down food or fluids. She has not had a bowel movement since the day before. She has hypertension, hyperlipidemia, and osteoarthritis. She had a cholecystectomy 5 years ago. She has smoked one pack of cigarettes daily for the last 20 years. Current medications include chlorthalidone, atorvastatin, and naproxen. Her temperature is 38.8°C (101.8​°F), pulse is 102/min, respirations are 20/min, and blood pressure is 118/78 mm Hg. She is m (5 ft 6 in) tall and weighs 94.3 kg (207.9 lbs); BMI is 33.4 kg/m2. Abdominal examination shows a soft abdomen with hypoactive bowel sounds. There is moderate left lower quadrant tenderness. A tender mass is palpable on digital rectal examination. There is no guarding or rebound tenderness. Laboratory studies show: Leukocyte count17,000/mm3 Hemoglobin 13.3 g/dl Hematocrit 40% Platelet count 188,000/mm3 Serum Na+ 138 mEq/L + K 4.1 mEq/L - Cl 101 mEq/L HCO3- 22 mEq/L Contact Urea Nitrogen 18.1 mg/dl Creatinine 1.1 mg/dl Which of the following is most appropriate to confirm the diagnosis?", "opts": ["Abdominal ultrasound", "Abdominal x-ray", "Flexible sigmoidoscopy", "CT scan of the abdomen with contrast", "Colonoscopy"], "ans": 3, "exp": "Contrast CT is recognised as the gold standard test for acute diverticulitis and its complications. NICE recommends an early CT (ideally within 24 hours of admission) in suspected acute diverticulitis, and advises against colonoscopy and sigmoidoscopy because of perforation risk.", "why": ["Ultrasound cannot diagnose diverticulitis alone and depends on local expertise.", "A plain film shows only complications such as free air or obstruction.", "Endoscopy risks perforating inflamed bowel.", "", "Colonoscopy is avoided in the acute phase because of perforation risk."], "refs": [["NICE NG147: diverticular disease", "https://www.nice.org.uk/guidance/NG147/chapter/rationale-and-impact"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 144}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 30-year-old woman, gravida 1, para 0, at 30 weeks' gestation is brought to the emergency department because of progressive upper abdominal pain for the past hour. The patient vomited once on her way to the hospital. She states that she initially had dull stomach pain about 6 hours ago, but now the pain is located in the upper abdomen and is more severe. There is no personal or family history of serious illness. She is sexually active with her husband. She does not smoke or drink alcohol. Medications include folic acid and a multivitamin. Her temperature is 38.5°C (101.3°F), pulse is 100/min, and blood pressure is 130/80 mm Hg. Physical examination shows right upper quadrant tenderness. The remainder of the examination shows no abnormalities. Laboratory studies show a leukocyte count of 12,000/mm3. Urinalysis shows mild pyuria. Which of the following is the most likely diagnosis?", "opts": ["HELLP syndrome", "Nephrolithiasis", "Pelvic inflammatory disease", "Pyelonephritis", "Appendicitis"], "ans": 4, "exp": "Appendicitis is the commonest surgical cause of acute abdominal pain in pregnancy. Pain starts periumbilically, but in about 15% the gravid uterus displaces the appendix and causes right upper quadrant pain. Ultrasound is first-line imaging and MRI the preferred second test.", "why": ["HELLP syndrome causes epigastric pain with haemolysis, raised liver enzymes and low platelets, usually with hypertension.", "Stones cause colicky loin pain radiating to the groin with haematuria.", "PID is not a typical cause of acute surgical abdomen in pregnancy.", "Pyelonephritis gives loin pain and fever with significant pyuria, and she has only mild pyuria.", ""], "refs": [["emDocs: non-obstetric abdominal pain in pregnancy", "https://www.emdocs.net/ed-evaluation-and-management-of-non-obstetric-abdominal-pain-in-the-pregnant-patient/"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 145}, {"group": "Surgery", "topic": "Urology", "stem": "A 29-year-old woman, gravida 2, para 1, at 30 weeks' gestation comes to the emergency department because of severe right-sided back pain for the last hour. The pain is colicky and radiates to the right groin. The patient also reports nausea and pain with urination. Pregnancy has been uncomplicated and the patient reports that she has been following up with her gynecologist on a regular basis. There is no personal or family history of serious illness. She does not smoke or drink alcohol. Medications include folic acid and a multivitamin. Temperature is 37°C (98.6°F), pulse is 90/min, and blood pressure is 130/80 mm Hg. Examination of the back shows costovertebral angle tenderness on the right side. Laboratory studies show: Urine Protein negative RBC casts negative RBC 5–7/hpf WBC casts negative WBC 1–2/hpf Which of the following is the most likely diagnosis?", "opts": ["Appendicitis", "Pyelonephritis", "Nephrolithiasis", "Cholecystitis", "Ovarian torsion"], "ans": 2, "exp": "Colicky unilateral flank pain radiating to the groin with nausea and haematuria points to renal colic. Stones affect roughly 1 in 200-500 pregnancies, and renal ultrasound is the diagnostic test of choice in pregnancy because it avoids radiation. Right-sided hydronephrosis can be physiological, so interpret carefully.", "why": ["Appendicitis usually gives migratory right iliac fossa pain without microscopic haematuria.", "Pyelonephritis gives fever and pyuria, and the urine here has few white cells.", "", "Cholecystitis gives right upper quadrant pain with a positive Murphy sign.", "Ovarian torsion gives sudden lower abdominal pain without urinary findings."], "refs": [["emDocs: non-obstetric abdominal pain in pregnancy", "https://www.emdocs.net/ed-evaluation-and-management-of-non-obstetric-abdominal-pain-in-the-pregnant-patient/"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 146}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 71-year-old man comes to the physician accompanied by his wife because of a 6-month history of worsening episodic upper abdominal pain and an 8-kg (17.6-lb) weight loss. The pain is dull, nonradiating, worse after eating, and occasionally associated with bloating and diarrhea. His symptoms have not improved despite 4 weeks of treatment with omeprazole. He attributes his weight loss to recently eating very small portions and avoiding fatty foods. He has hypertension and hypercholesterolemia. He underwent a coronary artery bypass graft operation for coronary artery disease 8 years ago. Current medications include lisinopril, metoprolol, atorvastatin, and aspirin. He has smoked a pack of cigarettes daily for 40 years and drinks 1–2 beers daily. His pulse is 79/min and blood pressure is 138/89 mm Hg. Examination shows a soft abdomen without tenderness to palpation or guarding. Which of the following is most likely to confirm the diagnosis?", "opts": ["ERCP", "Urea breath test", "Serum CA 19-9", "CT angiography of the abdomen", "Right upper quadrant abdominal ultrasound"], "ans": 3, "exp": "Chronic mesenteric ischaemia causes recurrent postprandial pain (about 30 minutes after eating), fear of eating and weight loss, usually from atherosclerotic narrowing of the mesenteric arteries. CT mesenteric angiography is the recommended initial imaging.", "why": ["ERCP evaluates the bile and pancreatic ducts and is not used for vascular disease.", "A urea breath test looks for H. pylori, and he has not improved on PPIs.", "CA 19-9 is a marker for pancreatic cancer and is not diagnostic.", "", "A RUQ ultrasound looks for gallstones, whose pain is episodic rather than daily."], "refs": [["ACP Internist: chronic mesenteric ischemia", "https://immattersacp.org/weekly/archives/2022/05/10/3.htm"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 147}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A previously healthy 57-year-old man comes to the emergency department because of acute retrosternal chest pain that radiates to his back. The pain started suddenly while he was having dinner. A few moments prior to the onset of the pain, he experienced discomfort when trying to eat or drink anything. On the way to the hospital he took a sublingual nitrate tablet that he had at home, which helped relieve the pain. His pulse is 80/min, respirations are 14/min, and blood pressure is 144/88 mm Hg. Examination shows no other abnormalities. An ECG shows a normal sinus rhythm with no ST-segment abnormalities. An esophagogram is done and shows areas of diffuse, uncoordinated spasms in several segments along the length of the esophagus. This patient's condition is most likely to show which of the following findings?", "opts": ["Serology shows elevated CK-MB levels", "Ultrasonography shows a mass at the gastroesophageal junction", "Esophageal manometry shows simultaneous multi-peak contractions", "Exercise stress test shows significant ST depression", "Endoscopy shows multiple mucosal erosions"], "ans": 2, "exp": "Diffuse oesophageal spasm causes chest pain and dysphagia. Manometry shows simultaneous contractions in the distal oesophagus in more than 10% of wet swallows, with normal peristalsis in between. Barium may show corkscrew or rosary-bead appearance.", "why": ["CK-MB would be raised in myocardial injury, and this is a motility disorder.", "A mass at the gastro-oesophageal junction would suggest carcinoma and fixed obstruction.", "", "ST depression on exercise testing indicates ischaemia, not an oesophageal disorder.", "Mucosal erosions suggest reflux oesophagitis, not spasm."], "refs": [["Gastroenterology & Hepatology: diffuse oesophageal spasm", "https://www.gastroenterologyandhepatology.net/archives/february-2014/diffuse-esophageal-spasm-in-the-era-of-high-resolution-manometry/"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 148}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 68-year-old woman comes to the physician because of increasing heartburn for the last few months. During this period, she has taken ranitidine several times a day without relief and has lost 10 kg (22 lbs). She has retrosternal pressure and burning with every meal. She has had heartburn for several years and took ranitidine as needed. She has hypertension. She has smoked one pack of cigarettes daily for the last 40 years and drinks one glass of wine occasionally. Other current medications include amlodipine and hydrochlorothiazide. She appears pale. Her height is 163 cm (5 ft 4 in), her weight is 75 kg (165 lbs), BMI is 27.5 kg/m2. Her temperature is 37.2°C (98.96°F), pulse is 78/min, and blood pressure is 135/80 mm Hg. Cardiovascular examination shows no abnormalities. Abdominal examination shows mild tenderness to palpation in the epigastric region. Bowel sounds are normal. The remainder of the examination shows no abnormalities. Laboratory studies show: Hemoglobin 10.2 g/dL Mean corpuscular volume 78 μm Mean corpuscular hemoglobin23 pg/cell Leukocyte count 9,500/mm3 Contact Platelet count 330,000/mm3 Serum Na+ 137 mEq/L + K 3.8 mEq/L - Cl 100 mEq/L HCO3- 25 mEq/L Creatinine 1.2 mg/dL Lactate dehydrogenase 260 U/L Alanine aminotransferase 18 U/L Aspartate aminotransferase 15 U/L Lipase (N < 280 U/L) 40 U/L Troponin I (N < 0.1 ng/mL) 0.029 ng/mL An ECG shows normal sinus rhythm without ST-T changes. Which of the following is the most appropriate next step in the management of this patient?", "opts": ["24-hour esophageal pH monitoring", "Barium swallow", "Trial of proton-pump inhibitor", "CT scan of the chest", "Oesophagogastroduodenoscopy"], "ans": 4, "exp": "Heartburn with weight loss in a patient aged 55 or over meets the NICE criteria for urgent (2-week) upper GI endoscopy for suspected oesophageal or gastric cancer. Endoscopy is the best initial and confirmatory test, and also classifies reflux oesophagitis and peptic ulcers.", "why": ["pH monitoring assesses acid reflux but doesn't exclude cancer.", "A barium swallow can show a stricture but cannot take a biopsy.", "Continuing a PPI trial would delay diagnosis when alarm features are present.", "CT may stage a tumour but is not the first test for diagnosis.", ""], "refs": [["GPnotebook: referral criteria for upper GI endoscopy (NG12)", "https://gpnotebook.com/pages/gastroenterology/referral-criteria-from-primary-care-endoscopy-ogd"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 149}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 40-year-old woman comes to the physician for right lower abdominal pain for 6 months. She has multiple non-bloody, watery bowel movements daily and experiences abdominal cramping. Sometimes, she feels sudden palpitations, is short of breath, and her face becomes red. She has lost 7 kg over the past 3 months. She went on a 3- week hiking trip to Cambodia 6 months ago. She has smoked a pack of cigarettes daily for 15 years. Her temperature is 37˚C (98.6°F), her pulse is 72/min and her blood pressure is 125/70 mm Hg. On physical examination, tiny blood vessels are noted on her face and arms. Lung auscultation shows bilateral wheezing. The abdomen is soft and nondistended. There is localized tenderness to the right lower quadrant, but no rebound tenderness or guarding. Laboratory studies show: Leukocyte count 4,600 /mm3 Segmented neutrophils 61 % Eosinophils 2% 3 Platelet count 254,000 /mm3 Hemoglobin 13.1 g/dL Serum Aspartate aminotransferase (AST)110 IU/L Alanine aminotransferase (ALT) 128 IU/L C-reactive protein 8 mg/dL (N = 0–10) Which of the following is the most likely diagnosis?", "opts": ["Ascaris lumbricoides infection", "Pheochromocytoma", "Carcinoid tumor", "Infl
