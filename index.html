<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Progress Bank</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap">
<style>
/* Layout: dark instrument rail on the left, one reading column, a lab-values drawer on the right.
   Palette: ink, cool paper, clinical teal, plus green/red/amber for answer state only. */
:root{--bg:#eceff3;--surf:#ffffff;--ink:#0e1a2b;--mu:#586578;--line:#d8dee6;--soft:#f3f5f8;
 --ac:#0b6b74;--acx:#ffffff;--acb:#dff0f1;--ok:#157347;--okb:#e1f3e9;--no:#ad3427;--nob:#fbe8e5;--wn:#7a5200;--wnb:#fff1d1;
 --rail:#0e1a2b;--railtx:#c9d3df;--railmu:#7f8ea3;--railon:#16293f;--hl:#ffe27a;--sh:0 1px 2px rgba(14,26,43,.06),0 8px 24px rgba(14,26,43,.06);
 --serif:"Newsreader",Georgia,"Times New Roman",serif;--sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1016;--surf:#111a23;--ink:#e7edf3;--mu:#92a1b3;--line:#223140;--soft:#0e161e;
 --ac:#4cc3cb;--acx:#07242a;--acb:#10303a;--ok:#5fd18a;--okb:#11291d;--no:#ff8f82;--nob:#341a17;--wn:#f2c15c;--wnb:#2d2410;
 --rail:#070c11;--railtx:#b7c3d1;--railmu:#6f7f93;--railon:#121c26;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1016;--surf:#111a23;--ink:#e7edf3;--mu:#92a1b3;--line:#223140;--soft:#0e161e;
 --ac:#4cc3cb;--acx:#07242a;--acb:#10303a;--ok:#5fd18a;--okb:#11291d;--no:#ff8f82;--nob:#341a17;--wn:#f2c15c;--wnb:#2d2410;
 --rail:#070c11;--railtx:#b7c3d1;--railmu:#6f7f93;--railon:#121c26;--sh:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--sans);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
a{color:var(--ac)}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)}.sm{font-size:13px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;background:var(--rail);color:var(--railtx);padding:26px 14px 20px;display:flex;flex-direction:column;gap:28px}
.brand{display:flex;align-items:center;gap:12px;padding:0 10px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--ac);color:var(--acx);display:grid;place-items:center}
.mark svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.bn{font-family:var(--serif);font-size:20px;font-weight:600;color:#fff;line-height:1.1}.bs{font:500 11px/1.2 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--railmu);margin-top:3px}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;color:var(--railtx);text-align:left;font-weight:500}
.nav button:hover{background:var(--railon)}.nav button.on{background:var(--railon);color:#fff;box-shadow:inset 3px 0 0 var(--ac)}
.railfoot{margin-top:auto;padding:0 12px;font:12px/1.5 var(--mono);color:var(--railmu)}
.railfoot b{color:var(--railtx);font-weight:500}

.main{width:100%;max-width:820px;margin:0 auto;padding-block:30px 40px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px))}
.eyebrow{font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
h1{font:500 30px/1.15 var(--serif);margin:8px 0 6px;text-wrap:balance}
h2{font:600 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--mu);margin:0 0 12px}

.qhead{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:10px;font-size:13px;color:var(--mu)}
.qhead b{font:500 14px var(--mono);color:var(--ink)}
.prog{height:4px;border-radius:4px;background:var(--line);overflow:hidden;margin-bottom:16px}.prog i{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .25s}
.qcard{background:var(--surf);border:1px solid var(--line);border-radius:18px;padding:22px 26px 26px;box-shadow:var(--sh)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:500;padding:7px 12px;border-radius:999px;border:1px solid var(--line);background:var(--soft);color:var(--ink)}
.chip:hover{border-color:var(--ac)}.chip.sel{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.chip.hlb{background:color-mix(in srgb,var(--hl) 22%,var(--surf));border-color:color-mix(in srgb,var(--hl) 70%,var(--line))}
.chip.hlb:active{background:var(--hl);color:#1d1d1b}
.chip.lab{margin-left:auto;color:var(--ac);border-color:color-mix(in srgb,var(--ac) 40%,var(--line))}
.stem{font:400 20px/1.62 var(--serif);margin:0 0 20px;text-wrap:pretty}
mark{background:var(--hl);color:#1d1d1b;border-radius:3px;padding:0 2px;cursor:pointer}

.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;padding:13px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surf);transition:border-color .12s,background .12s}
.opt:hover:not(:disabled){border-color:var(--ac);background:var(--soft)}
.ltr{flex:none;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font:500 13px var(--mono);color:var(--mu);margin-top:-1px}
.otx{padding-top:2px;font-size:15.5px}
.opt:disabled{cursor:default}
.opt.ok{background:var(--okb);border-color:var(--ok)}.opt.ok .ltr{background:var(--ok);border-color:var(--ok);color:var(--surf)}
.opt.no{background:var(--nob);border-color:var(--no)}.opt.no .ltr{background:var(--no);border-color:var(--no);color:var(--surf)}
.why{font-size:14px;color:var(--no);background:var(--nob);border-radius:10px;padding:9px 12px;margin:-2px 0 2px 42px}
.exp{margin-top:22px;padding:18px 20px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.exp .lbl{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.exp .lbl b{font:500 12px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ok)}
.exp .body{font:400 17px/1.65 var(--serif)}
.warn{background:var(--wnb);color:var(--wn);padding:9px 12px;border-radius:10px;font-size:13px;margin-top:12px}
.src{font-size:12.5px;color:var(--mu);margin-top:12px;line-height:1.6}
.notes{margin-top:18px;padding-top:16px;border-top:1px solid var(--line)}
textarea{width:100%;min-height:72px;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px;resize:vertical}

.actions{position:sticky;bottom:16px;z-index:5;display:flex;align-items:center;gap:10px;margin-top:16px;padding:10px;background:var(--surf);border:1px solid var(--line);border-radius:16px;box-shadow:var(--sh)}
.actions .mid{flex:1;display:flex;justify-content:center;align-items:center;gap:10px;min-width:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:42px;padding:0 16px;border-radius:11px;border:1px solid var(--line);background:var(--surf);font-weight:500;white-space:nowrap}
.btn:hover:not(:disabled){border-color:var(--ac)}.btn:disabled{opacity:.4;cursor:default}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx)}.btn.pri:hover:not(:disabled){filter:brightness(1.07)}
.btn.sm{min-height:34px;padding:0 12px;font-size:13px}
.kbd{margin:10px 2px 0;font:12px var(--mono);color:var(--mu);text-align:center}
@media (hover:none){.kbd{display:none}}

.card{background:var(--surf);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--sh)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px;margin-top:22px}
.trow{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;padding:10px 6px;border-radius:10px}
.trow:hover{background:var(--soft)}.trow .n{font-weight:500}.trow .c{font:500 13px var(--mono);color:var(--mu)}
.trow .b{grid-column:1/-1;height:3px;border-radius:3px;background:var(--line);overflow:hidden}.trow .b i{display:block;height:100%;background:var(--ac);opacity:.75}
.rs{padding:4px 6px 8px}.trow.all{border-bottom:1px solid var(--line);border-radius:10px 10px 0 0;margin-bottom:4px}
.stat{display:flex;align-items:baseline;gap:10px}.stat .big{font:500 44px/1 var(--serif)}
.rc{margin-top:12px}.rc p{margin:6px 0;font-family:var(--serif);font-size:16px}
.hlist{margin:6px 0;padding:0;list-style:none}.hlist li{margin:4px 0;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}

.tabbar{display:none}
@media (max-width:860px){
 .app{grid-template-columns:minmax(0,1fr)}.rail{display:none}
 .main{padding-block:18px calc(96px + env(safe-area-inset-bottom,0px))}
 .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--rail);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
 .tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 0;border-radius:10px;font-size:11px;font-weight:500;color:var(--railmu)}
 .tabbar button.on{color:#fff;background:var(--railon)}
 .actions{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
 .qcard{padding:16px 16px 20px;border-radius:16px}.stem{font-size:18px}h1{font-size:25px}
 .exp{padding:14px}.why{margin-left:0}
 .chip.lab{margin-left:0}
}
@media (max-width:420px){.btn span.t2{display:none}.btn{padding:0 14px}}

/* lab values drawer */
.scrim{position:fixed;inset:0;background:rgba(5,10,16,.5);z-index:40}
.drawer{position:fixed;z-index:41;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surf);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.22);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.dh{padding:18px 20px 12px;border-bottom:1px solid var(--line)}
.dh .row{align-items:flex-start}.dh h1{font-size:23px;margin:4px 0 0}
.x{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;border:1px solid var(--line)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:12px}
.seg button{padding:7px 14px;font:500 12px var(--mono);color:var(--mu)}.seg button.on{background:var(--ac);color:var(--acx)}
.sbox{position:relative;margin-top:12px}.sbox svg{position:absolute;left:12px;top:11px;color:var(--mu)}
.sbox input{width:100%;font:inherit;color:var(--ink);background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:9px 12px 9px 38px}
.cats{display:flex;gap:6px;overflow-x:auto;padding:10px 20px;border-bottom:1px solid var(--line);scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}.cats .chip{flex:none;padding:5px 11px;font-size:12px}
.db{flex:1;overflow-y:auto;padding:4px 20px 24px;overscroll-behavior:contain}
.lg{font:600 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ac);margin:20px 0 4px}
.lr{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:10px 0;border-bottom:1px solid var(--line)}
.lr .n{font-weight:500}.lr .v{font:500 13.5px var(--mono);text-align:right;white-space:nowrap}
.lr .f{grid-column:1/-1;font:12px var(--mono);color:var(--mu)}
.lr .f em{font-style:normal;color:var(--no)}.lr .f u{text-decoration:none;color:var(--wn)}
.lr .nt{grid-column:1/-1;font-size:12.5px;color:var(--mu)}
.disc{font-size:12.5px;color:var(--mu);margin-top:22px;line-height:1.6}
@media (max-width:860px){.drawer{top:auto;left:0;right:0;width:auto;height:88vh;border-left:0;border-top:1px solid var(--line);border-radius:18px 18px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.3)}}
@media (prefers-reduced-motion:no-preference){.drawer{animation:in .18s ease-out}@keyframes in{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}@media (max-width:860px){@keyframes in{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}}}
</style></head><body>
<div class="app">
 <aside class="rail">
  <div class="brand"><div class="mark"><svg viewBox="0 0 24 24"><path d="M3 12h4l2.5-6 4 12 2.5-6H21"/></svg></div><div><div class="bn">Progress Bank</div><div class="bs">Final year</div></div></div>
  <nav class="nav" id="nav"></nav>
  <div class="railfoot" id="railfoot"></div>
 </aside>
 <main class="main"><div id="view"></div></main>
</div>
<nav class="tabbar" id="tabbar"></nav>
<div id="scrim" class="scrim" hidden onclick="closeLabs()"></div>
<aside id="labs" class="drawer" hidden role="dialog" aria-label="Lab reference values">
 <div class="dh"><div class="row"><div><div class="eyebrow">Reference</div><h1>Lab values</h1></div><button class="x" onclick="closeLabs()" aria-label="Close"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>

 <div class="cats" id="labcats"></div>

<script>
const Q=[{"group": "Medicine", "topic": "Gastroenterology", "stem": "A 78-year-old man presents to the emergency department with jaundice. His examination was normal. He had been commenced on co-amoxiclav 2 days earlier by his GP for a UTI. The emergency department SHO organised some blood tests. Hb 13 (13-16.5), bilirubin 48 (3-17) ALT 5 (5-35), AST 6 (5-35) alk phos 50 (30-150). What is the most likely underlying diagnosis to explain his jaundice?", "opts": ["Alcoholic Hepatitis", "Co-amoxiclav", "Autoimmune Hepatitis", "Metastatic Disease", "Pancreatic cancer"], "ans": 1, "exp": "Co-amoxiclav is a well-established cause of drug-induced liver injury, usually a cholestatic hepatitis. It typically starts days to weeks after the drug is begun and can appear after the course has finished, so the link is easy to miss. The mechanism is probably immunoallergic, attributed to the clavulanate rather than the amoxicillin. A raised ALP with a comparatively modest ALT fits best, so check that against your stem.", "why": ["No alcohol history and AST/ALT are normal.", "", "Autoimmune hepatitis would raise ALT/AST.", "Metastatic disease would usually show a raised ALP and abnormal examination.", "Pancreatic cancer would give a cholestatic picture with a raised ALP."], "refs": [["LiverTox: amoxicillin-clavulanate", "https://www.ncbi.nlm.nih.gov/books/NBK548517/"], ["MSD Manual: drug-induced liver injury", "https://www.msdmanuals.com/professional/hepatic-and-biliary-disorders/drugs-and-the-liver/liver-injury-caused-by-drugs"]], "note": "", "src": "LiverTox and MSD Manual (summarised by Claude)", "id": 0}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 67 year old man presents to the Emergency Department with a 6 day history of intermittent vomiting and profuse diarrhoea and abdominal cramps. He had been commenced on clindamycin by his GP 10 days earlier. On examination he was pyrexic (T= 38.4C), tachycardic (110/min), hypotensive (BP 92/55 mmHg) with dry mucous membranes. Abdomen was soft with mild generalised abdominal tenderness. Clostridium difficile toxins were sent, Creatinine was 157 (baseline 68) Urea 16 (baseline 4), What is the most appropriate initial management:", "opts": ["IV Fluids", "PO Fluids", "PO Metronidazole", "PO Vancomycin", "Antipyretic Medication"], "ans": 0, "exp": "He is hypotensive with AKI, so the first step is IV fluid resuscitation. For the infection itself, NICE NG199 makes oral vancomycin 125 mg four times daily for 10 days first-line for a first episode, with fidaxomicin second-line if vancomycin fails. Other antibiotics should be stopped if they aren’t essential, and life-threatening disease needs urgent specialist advice.", "why": ["", "He is hypotensive with AKI and needs IV resuscitation; oral fluids can’t correct shock.", "NICE no longer recommends metronidazole first-line (lower cure and higher recurrence than vancomycin), and he needs resuscitation first.", "This is NICE’s first-line drug for the infection, but he is in shock with AKI, so resuscitation comes first.", "Doesn't address the hypotension or AKI."], "refs": [["NICE NG199", "https://www.nice.org.uk/guidance/ng199"], ["NHS Scotland formulary", "https://formulary.nhs.scot/west/infections/gastro-intestinal/clostridioides-difficile-cdiff/"]], "note": "", "src": "NICE NG199 and NHS Scotland formulary (summarised by Claude)", "id": 1}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 46-year-old male smoker presents to the ED with a 4/7 history of dry cough, myalgias and headache after returning from holidays in Spain. On review, HR 52 regular, BP 132/69 mmHg, RR 24/minute, 02 saturations 96% room air, temperature 38.8°C and bi-basal crackles are noted. Blood tests show a Na 125 mmol/L (normal range 135-145 mmol/L) and CRP 108 mg/L (normal range < 5 mg/L). Which of the following will most likely yield the diagnosis?", "opts": ["Blood Cultures", "Bronchoalveolar lavage", "HIV screen", "Legionella urinary antigen", "Sputum for AFB"], "ans": 3, "exp": "Legionnaires’ disease is an atypical pneumonia that often comes with diarrhoea, confusion and hyponatraemia. The urinary antigen test is the most practical diagnostic test: it is rapid and highly specific, but it only detects Legionella pneumophila serogroup 1, which causes most cases. Treatment is usually a fluoroquinolone or a macrolide.", "why": ["Blood cultures are unreliable for Legionella, so they are unlikely to give the diagnosis.", "Culture needs special media and takes days; the urinary antigen test is faster and less invasive.", "Doesn't diagnose the pneumonia.", "", "For TB; this presentation is acute."], "refs": [["MSD Manual: Legionella infections", "https://www.msdmanuals.com/professional/Infectious-diseases/gram-negative-bacilli/legionella-infections"], ["Case series on Legionnaires’ disease", "https://acr.amegroups.org/article/view/12923/html"]], "note": "", "src": "MSD Manual and a published case series (summarised by Claude)", "id": 2}, {"group": "Medicine", "topic": "Neurology", "stem": "A 76-year-old man presents 5 hours after left-sided weakness and dysarthria. CT shows an early right infarct, no haemorrhage, and CT angiogram shows no large-vessel occlusion. Pulse is irregular, BP 172/92. What is the next step?", "opts": ["IV thrombolysis", "High-dose enoxaparin", "Mechanical thrombectomy", "High-dose aspirin", "IV labetalol"], "ans": 3, "exp": "NICE NG128 says IV thrombolysis must start within 4.5 hours of symptom onset, and thrombectomy is for proximal large-vessel occlusion shown on imaging. He meets neither. Once haemorrhage is excluded, aspirin 300 mg should be given as soon as possible and within 24 hours. In AF, anticoagulation is considered only after about 2 weeks of aspirin.", "why": ["NICE gives IV thrombolysis only within 4.5 hours of onset, and he is past that.", "NICE doesn’t recommend routine anticoagulation in acute ischaemic stroke; with AF it is considered after about 2 weeks of aspirin.", "Thrombectomy is for a proximal large-vessel occlusion on imaging, and his CT angiogram shows none.", "", "Permissive hypertension applies."], "refs": [["NICE NG128: stroke and TIA", "https://www.nice.org.uk/guidance/ng128/chapter/Recommendations"]], "note": "", "src": "RCSI slides and NICE NG128 (summarised by Claude)", "id": 3}, {"group": "Medicine", "topic": "Haematology", "stem": "A 73-year-old woman with Factor V Leiden and an IV contrast allergy has pleuritic pain, SpO2 90% and a normal CXR. Suspected PE. Which test is most likely to give the diagnosis?", "opts": ["Arterial blood gas", "CT pulmonary angiogram", "Echocardiogram", "Pulmonary function tests", "Ventilation/perfusion scan"], "ans": 4, "exp": "NICE NG158 makes CTPA the first-line test for suspected PE. For people with a contrast allergy, renal impairment or high radiation risk, it advises a V/Q SPECT scan, or a planar V/Q scan if SPECT isn’t available. If the scan can’t be done straight away, give interim parenteral anticoagulation.", "why": ["Doesn't diagnose PE.", "CTPA is the first-line test, but she has a contrast allergy, so it is unsuitable.", "Supportive but not diagnostic.", "No role in diagnosing PE.", ""], "refs": [["NICE NG158 summary (GPnotebook)", "https://gpnotebook.com/pages/respiratory-and-chest-medicine/pulmonary-embolism/diagnosis-of-pulmonary-embolism"]], "note": "", "src": "NICE NG158 (summarised by Claude)", "id": 4}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 64-year-old man collapses suddenly while waiting in the emergency department. On assessment, he is unresponsive and does not respond to painful stimuli. His airway is patent but there is no palpable central pulse. Cardiac monitoring shows a chaotic, irregular rhythm without identifiable P waves or QRS complexes. What is the most appropriate immediate management?", "opts": ["Synchronized DC cardioversion", "Unsynchronized DC defibrillation", "IV amiodarone", "IV atropine", "Transcutaneous pacing"], "ans": 1, "exp": "A pulseless patient with a chaotic rhythm and no P waves or QRS complexes is in ventricular fibrillation, a shockable cardiac arrest rhythm. The Resuscitation Council ALS algorithm says to deliver the shock without delay, restart CPR straight away for 2 minutes, and only add adrenaline 1 mg and amiodarone 300 mg after the third shock. There are no QRS complexes to time a shock to, so it is an unsynchronised shock.", "why": ["Synchronised shocks are timed to a QRS complex, which VF doesn't have. They are for tachycardia with a pulse.", "", "Amiodarone 300 mg is given only after the third shock, during CPR, so it can't be the first step.", "Atropine is for bradycardia and has no role in VF.", "Pacing is for bradycardia; it doesn't treat VF."], "refs": [["Resuscitation Council UK: ALS algorithm", "https://lms.resus.org.uk/modules/m25-v2-als-algorithm/10346/m25/t05/content/m25_t05_005.htm"]], "note": "", "src": "Resuscitation Council UK ALS algorithm", "id": 5}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 27-year-old woman presents with sudden-onset palpitations associated with dizziness and mild shortness of breath. She has no chest pain and remains alert throughout. Her blood pressure is stable, and oxygen saturations are normal. ECG shows a regular narrow-complex tachycardia at a rate of 190 beats per minute. What is the most appropriate initial management?", "opts": ["Immediate synchronized cardioversion", "IV adenosine", "Vagal manoeuvres", "IV amiodarone", "Oral beta-blocker"], "ans": 2, "exp": "This is a stable regular narrow-complex tachycardia, most likely supraventricular tachycardia (SVT). The Resuscitation Council guidance makes vagal manoeuvres such as the Valsalva manoeuvre the first step, and they terminate a proportion of episodes. Adenosine is used only after they fail, and synchronised cardioversion is kept for adverse features or for failure of drug treatment.", "why": ["Cardioversion is for a patient with adverse features (shock, syncope, ischaemia, heart failure) or after drugs have failed. She is stable.", "Adenosine is the next step, used only after vagal manoeuvres have failed.", "", "Amiodarone isn't a first-line drug for terminating SVT.", "An oral beta-blocker acts too slowly to terminate an acute episode."], "refs": [["Resuscitation Council UK: regular narrow-complex tachycardia", "https://lms.resus.org.uk/modules/m50-v2-tachycardia/10346/m50/t45/content/m50_t45_030sr.htm"]], "note": "", "src": "Resuscitation Council UK tachycardia guidance", "id": 6}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 70-year-old man presents with dizziness and presyncope. ECG shows intermittent dropped QRS complexes, while PR intervals remain constant in other beats. He reports fatigue but denies syncope. Which type of heart block is most likely present?", "opts": ["First-degree AV block", "Mobitz type I (Wenckebach)", "Mobitz type II", "Third-degree AV block", "Bundle branch block"], "ans": 2, "exp": "Mobitz type II shows intermittently non-conducted P waves while the PR interval of the conducted beats stays constant. It reflects sudden conduction failure in the His-Purkinje system, usually from structural disease. Because it can progress abruptly to complete heart block, it needs monitoring, temporary pacing as backup, and usually a permanent pacemaker.", "why": ["First-degree block is a fixed long PR interval with every beat conducted, so there are no dropped beats.", "Mobitz I (Wenckebach) shows progressive PR lengthening before a dropped beat. Here the PR is constant.", "", "In complete heart block, atrial and ventricular activity are completely dissociated, with no consistently conducted beats.", "Bundle branch block widens the QRS but doesn't drop beats."], "refs": [["LITFL: Mobitz II", "https://litfl.com/av-block-2nd-degree-mobitz-ii-hay-block/"]], "note": "", "src": "LITFL (Life in the Fast Lane)", "id": 7}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 28-year-old man, an intravenous drug user, presents with fever, malaise, and a new heart murmur. He reports night sweats and weight loss over the past two weeks. Blood cultures are pending. Transthoracic echocardiography shows a suspicious vegetation on the tricuspid valve. What is the most accurate investigation to confirm the diagnosis?", "opts": ["Cardiac MRI", "Transoesophageal echocardiography", "Repeat transthoracic echocardiography in one week", "CT coronary angiography", "PET-CT"], "ans": 1, "exp": "Right-sided endocarditis in injecting drug users is usually caused by Staphylococcus aureus. Transthoracic echo is the first test, and transoesophageal echo is the more sensitive test when more certainty is needed, which is why 'most accurate' points to TOE. Under the Duke criteria the diagnosis rests on echo findings together with positive blood cultures.", "why": ["Cardiac MRI isn't a standard test for confirming valve vegetations.", "", "Repeating the same, less sensitive test a week later delays diagnosis.", "CT coronary angiography images the coronary arteries, not the valve vegetations.", "PET-CT is used mainly in prosthetic valve or device infection, not as the first confirmatory test."], "refs": [["Consultant360: right-sided endocarditis", "https://www.consultant360.com/content/right-sided-infective-endocarditis"]], "note": "Tricuspid vegetations are often seen well on transthoracic echo. This is an exam-logic answer: 'most accurate' means transoesophageal echo.", "src": "Consultant360 review", "id": 8}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 68-year-old man presents with worsening shortness of breath on exertion and lower limb swelling. He has a history of hypertension and type 2 diabetes. On examination, he has elevated jugular venous pressure, basal crackles, and peripheral oedema. Blood tests show elevated BNP. What is the most appropriate investigation to confirm the diagnosis and guide management?", "opts": ["Chest X-ray", "Electrocardiogram", "Echocardiography", "Cardiac MRI", "Troponin"], "ans": 2, "exp": "NICE NG106 says a raised NT-proBNP isn't enough on its own. Suspected heart failure should be confirmed with specialist assessment and transthoracic echocardiography, which shows ventricular function and valve disease and guides treatment. It should be done within 2 weeks if NT-proBNP is above 2,000 ng/litre, or within 6 weeks if it is 400 to 2,000.", "why": ["A chest X-ray can show congestion but doesn't confirm heart failure or measure ventricular function.", "An ECG is usually abnormal in heart failure but can't confirm it.", "", "Cardiac MRI is considered when echo images are poor.", "Troponin looks for myocardial injury such as ACS and doesn't confirm heart failure."], "refs": [["NICE NG106: chronic heart failure", "https://nice.org.uk/guidance/ng106/chapter/Recommendations"]], "note": "", "src": "NICE NG106", "id": 9}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 76-year-old man presents with exertional breathlessness and several episodes of near-syncope. On cardiovascular examination, a harsh systolic murmur is heard at the right second intercostal space and radiates to the neck. The murmur increases in intensity with exertion. Peripheral pulses are slow rising. What is the most likely diagnosis?", "opts": ["Mitral regurgitation", "Aortic stenosis", "Hypertrophic cardiomyopathy", "Pulmonary stenosis", "Tricuspid regurgitation"], "ans": 1, "exp": "Aortic stenosis causes exertional symptoms such as breathlessness, angina and syncope or near-syncope. The pulse is slow-rising with a small volume, and an ejection systolic murmur is loudest in the aortic area (right second intercostal space) and radiates to the carotids. Symptomatic aortic stenosis is serious, so it needs urgent assessment.", "why": ["Mitral regurgitation gives a pansystolic murmur at the apex radiating to the axilla.", "", "Hypertrophic cardiomyopathy can cause an ejection systolic murmur and syncope, but the pulse is jerky and brisk, not slow-rising.", "Pulmonary stenosis is heard at the left upper sternal edge and doesn't radiate to the carotids.", "Tricuspid regurgitation gives a pansystolic murmur at the left lower sternal edge, often with a raised JVP."], "refs": [["GPnotebook: clinical features of aortic stenosis", "https://gpnotebook.com/en-GB/pages/cardiovascular-medicine/summary-of-signs-of-different-murmurs/clinical-features-of-aortic-stenosis"]], "note": "The source supports the pulse, murmur site and radiation. Its page doesn't describe the murmur changing with exertion.", "src": "GPnotebook", "id": 10}, {"group": "Medicine", "topic": "Cardiology", "stem": "A patient collapses on the ward and is found to have an unstable broad-complex tachycardia on the monitor. The rhythm shows a polymorphic pattern with varying QRS amplitudes. Blood tests reveal low serum magnesium levels. Blood pressure is low. What is the most appropriate immediate management?", "opts": ["IV amiodarone", "Synchronized DC cardioversion", "IV magnesium sulfate", "IV lidocaine", "Oral beta-blocker"], "ans": 2, "exp": "A polymorphic broad-complex tachycardia with varying QRS amplitude and low magnesium is torsades de pointes. The Resuscitation Council algorithm treats polymorphic VT with QT prolongation with magnesium 8 mmol IV over 10 minutes, avoids amiodarone, and considers isoprenaline or pacing to raise the heart rate. Correcting the cause (low magnesium, QT-prolonging drugs) is key.", "why": ["Amiodarone prolongs the QT interval and is avoided in torsades.", "A synchronised shock is for unstable regular broad-complex tachycardia. Torsades is treated by correcting the cause, but a shock is needed if the patient has no pulse.", "", "Lidocaine isn't the treatment for torsades.", "An oral beta-blocker is too slow and doesn't treat the cause."], "refs": [["Resuscitation Council UK: adult tachyarrhythmia algorithm", "https://www.resus.org.uk/sites/default/files/2025-10/Adult%20tachyarrhythmia%20algorithm%202025.pdf"]], "note": "The stem says 'unstable'. If the patient were pulseless or deteriorating, a shock would come first. The question is pointing you to magnesium.", "src": "Resuscitation Council UK tachyarrhythmia algorithm", "id": 11}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 58-year-old man presents with a sudden severe headache, chest pain, and visual changes. Blood pressure is 230/130 mmHg and he has evidence of early retinal changes. There is no history of prior cerebrovascular events. Laboratory tests reveal mild renal impairment. What is the most appropriate initial management?", "opts": ["Oral amlodipine", "IV labetalol", "Sublingual GTN", "Oral ACE inhibitor", "IV furosemide"], "ans": 1, "exp": "Severe hypertension with retinal changes, visual symptoms, chest pain and renal impairment is a hypertensive emergency with end-organ damage. Treatment is a controlled IV infusion, and labetalol is first-line for malignant hypertension. The aim is a fall of no more than about 25% in the first hour, then a gradual reduction over the next 24 to 48 hours.", "why": ["Oral amlodipine acts too slowly and in an uncontrolled way for a hypertensive emergency.", "", "Sublingual GTN gives an unpredictable fall in blood pressure. IV GTN is used for ischaemia or heart failure.", "An oral ACE inhibitor can drop the blood pressure unpredictably and may worsen renal impairment.", "Furosemide is used if there is pulmonary oedema, which isn't described here."], "refs": [["Medibuddy: hypertensive emergency", "https://medibuddy.co.uk/mrcp-2-explanations/hypertension/hypertensive-emergency/"]], "note": "", "src": "Medibuddy MRCP notes", "id": 12}, {"group": "Medicine", "topic": "Neurology", "stem": "A 31-year-old woman presents with headache and new-onset seizures. She has no significant past medical history but recently started the oral contraceptive pill. Neurological examination is unremarkable between seizures. Contrast-enhanced CT brain demonstrates a triangular filling defect within a venous sinus. What is the most likely diagnosis?", "opts": ["Subarachnoid haemorrhage", "Cerebral venous sinus thrombosis", "Brain abscess", "Meningitis", "Intracerebral haemorrhage"], "ans": 1, "exp": "Cerebral venous sinus thrombosis presents with headache and often seizures, and oral contraceptive use is a recognised risk factor. On contrast CT the clot can appear as a triangular filling defect (the empty delta sign). MR venography is the gold standard, and anticoagulation is the mainstay of treatment.", "why": ["Subarachnoid haemorrhage gives a sudden thunderclap headache with blood in the subarachnoid space on non-contrast CT.", "", "A brain abscess appears as a ring-enhancing lesion, usually with fever or a source of infection.", "Meningitis causes fever and neck stiffness, with CT often normal and the diagnosis made on CSF.", "Intracerebral haemorrhage shows a hyperdense bleed within the brain on non-contrast CT."], "refs": [["Deranged Physiology: cerebral venous sinus thrombosis", "https://derangedphysiology.com/main/required-reading/neurological-intensive-care/Chapter-154/cerebral-venous-sinus-thrombosis"]], "note": "", "src": "Deranged Physiology", "id": 13}, {"group": "Medicine", "topic": "Neurology", "stem": "A 71-year-old woman is brought to clinic by her daughter because of gradual cognitive decline over several years. She initially developed short-term memory problems and now struggles with navigation in familiar places. She has become apathetic but has no prominent personality change. Brain imaging shows focal medial temporal lobe atrophy. What is the most likely diagnosis?", "opts": ["Frontotemporal dementia", "Lewy body dementia", "Vascular dementia", "Alzheimer disease", "Normal pressure hydrocephalus"], "ans": 3, "exp": "Alzheimer disease typically begins with early short-term memory loss and spatial disorientation, with atrophy starting in the medial temporal lobes, including the hippocampus and entorhinal cortex. The slow decline over years without a prominent early personality change also fits.", "why": ["Frontotemporal dementia causes frontal and anterior temporal atrophy, with early personality or language change.", "Dementia with Lewy bodies involves the medial temporal lobe much less and features fluctuating cognition, visual hallucinations and parkinsonism.", "Vascular dementia is recognised by white matter changes or lacunes, usually with a stepwise course.", "", "Normal pressure hydrocephalus gives gait disturbance, urinary incontinence and dementia with enlarged ventricles."], "refs": [["Practical Neurology: imaging in dementia", "https://practicalneurology.com/index.php/articles/2019-june/brain-imaging-in-differential-diagnosis-of-dementia"]], "note": "", "src": "Practical Neurology", "id": 14}, {"group": "Medicine", "topic": "Cardiology", "stem": "Which of the following is part of the major Jones criteria for rheumatic fever?", "opts": ["Splenomegaly", "Huntington's chorea", "Dystonia", "Sydenham's chorea", "Hepatomegaly"], "ans": 3, "exp": "The major Jones criteria are carditis, arthritis, chorea (Sydenham's), erythema marginatum and subcutaneous nodules.", "why": ["Splenomegaly is not a Jones criterion.", "Huntington's chorea is a genetic neurodegenerative disease, unrelated to rheumatic fever.", "Dystonia is not a Jones criterion.", "", "Hepatomegaly is not a Jones criterion."], "refs": [["Johns Hopkins ABX Guide: acute rheumatic fever", "https://www.hopkinsguides.com/hopkins/view/Johns_Hopkins_ABX_Guide/540006/all/Acute_Rheumatic_Fever"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 15}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 53-year-old man is admitted for an elective hernia repair. He has had a productive cough for two weeks and becomes breathless, with an irregularly irregular pulse. Which feature on ECG is most supportive of a diagnosis of atrial fibrillation?", "opts": ["Absent P waves", "Heart rate of 130 bpm", "Left axis deviation", "QRS complex width of 4 small boxes", "PR interval of less than 3 small boxes"], "ans": 0, "exp": "AF shows no distinct P waves, fibrillatory waves and irregularly irregular R-R intervals. A fast rate is common but is not specific.", "why": ["", "A rate of 130 can occur in many tachycardias.", "Axis deviation is not a feature of AF.", "A wide QRS suggests bundle branch block or a ventricular rhythm.", "A short PR interval suggests pre-excitation, and AF has no measurable PR interval."], "refs": [["MSD Manual: atrial fibrillation", "https://www.msdmanuals.com/professional/cardiovascular-disorders/arrhythmias-and-conduction-disorders/atrial-fibrillation"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 16}, {"group": "Medicine", "topic": "Neurology", "stem": "A 29-year-old woman presents with a three-day history of painful visual loss in one eye. Examination shows papillitis and disc swelling. What is the most likely diagnosis?", "opts": ["Glaucoma", "Optic neuritis", "Retinal artery thrombosis", "Papilloedema", "Retinal detachment"], "ans": 1, "exp": "Optic neuritis typically affects women in their 20s-30s, with sudden one-sided visual loss and pain on eye movement. The disc is swollen (papillitis) in about a third. MRI confirms it and estimates MS risk.", "why": ["Acute glaucoma causes a red, hard, painful eye with a fixed mid-dilated pupil.", "", "Retinal artery occlusion is painless and sudden, with a pale retina and cherry-red spot.", "Papilloedema is bilateral swelling from raised intracranial pressure, with preserved vision early.", "Retinal detachment gives painless floaters and a curtain-like field loss."], "refs": [["MDedge: optic neuritis and risk of MS", "https://mdedge.com/content/optic-neuritis-and-risk-ms-differential-diagnosis-and-management"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 17}, {"group": "Medicine", "topic": "Cardiology", "stem": "You are counselling a 60-year-old man who is 10 days post aortic metallic valve replacement before discharge. Which of the following would you NOT advise?", "opts": ["Absolute importance of daily compliance with lifelong warfarin therapy", "Importance of regular anticoagulation monitoring", "Use of precautionary antibiotics when attending the dentist", "Seek medical attention for any new symptoms", "Stop warfarin after 3 months"], "ans": 4, "exp": "A mechanical valve needs lifelong warfarin because of the high risk of valve thrombosis. Stopping after 3 months is wrong. DOACs are not recommended for mechanical valves.", "why": ["Lifelong adherence is correct advice.", "Regular INR monitoring is correct.", "Your course lists dental antibiotic prophylaxis as advice you would give (current NICE guidance doesn't recommend it routinely, so check local policy).", "Prompt review of new symptoms is correct.", ""], "refs": [["NHS SPS: warfarin in mechanical heart valves", "https://www.medicinesresources.nhs.uk/warfarin-in-patients-with-mechanical-heart-valves.html"]], "note": "The source supports lifelong anticoagulation. Dental prophylaxis is your course's wording and may differ from current NICE guidance.", "src": "Linked sources", "id": 18}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 64-year-old woman feels generally unwell with arthralgia, low-grade fevers and poor appetite. She is diagnosed with acute kidney injury. Urine dipstick shows blood and protein, and microscopy shows red cell casts. What is the most likely diagnosis?", "opts": ["Acute glomerulonephritis", "Acute interstitial nephritis", "Acute pyelonephritis", "Acute tubular necrosis", "Acute tubular obstruction"], "ans": 0, "exp": "Haematuria with red cell casts and proteinuria define a nephritic picture, so acute glomerulonephritis is the diagnosis. The systemic features (arthralgia, fever) suggest an immune-mediated cause.", "why": ["", "AIN gives white cells and white cell casts, often after a drug exposure.", "Pyelonephritis shows pyuria and white cell casts with loin pain and fever.", "ATN gives muddy brown granular casts.", "Obstruction would not give red cell casts."], "refs": [["MSD Manual: overview of nephritic syndrome", "https://www.msdmanuals.com/professional/nephrology/glomerular-disorders/overview-of-nephritic-syndrome"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 19}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 67-year-old woman with a history of ovarian carcinoma presents with anuria. Which investigation is most likely to reveal the cause of her acute kidney injury?", "opts": ["Fractional excretion of sodium", "MRA renal angiogram", "Plain film of the abdomen", "Renal biopsy", "Renal ultrasound"], "ans": 4, "exp": "Anuria with a pelvic malignancy suggests post-renal obstruction. Renal tract ultrasound is the first-line test for hydronephrosis and should be done urgently when obstruction is possible.", "why": ["FeNa separates pre-renal from ATN but doesn't show an obstruction.", "MR angiography looks for renal artery disease and isn't the first step here.", "A plain film may show stones but cannot show hydronephrosis.", "Biopsy is invasive and reserved for suspected intrinsic renal disease.", ""], "refs": [["iatrox: acute kidney injury", "https://www.iatrox.com/guidelines/acute-kidney-injury"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 20}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 78-year-old man presents with nausea and vomiting and has had no urine output for two days. Urine microscopy shows muddy brown casts. Which of the following findings is most likely in this case?", "opts": ["Fractional excretion of sodium greater than 1%", "Fractional excretion of urea less than 35%", "Urinary osmolality greater than 500", "Urinary sodium less than 20", "Urine to serum osmolality ratio greater than 1.2"], "ans": 0, "exp": "Muddy brown casts mean acute tubular necrosis. Damaged tubules cannot reabsorb sodium, so fractional sodium excretion is high and urinary sodium is raised.", "why": ["", "FEurea under 35% points to a pre-renal cause.", "A concentrated urine (osmolality over 500) means the tubules still work, as in pre-renal disease.", "Urinary sodium under 20 suggests a pre-renal cause.", "A ratio above 1.2 indicates concentrated urine, which is pre-renal."], "refs": [["StatPearls: acute tubular necrosis", "https://www.ncbi.nlm.nih.gov/books/NBK507815/"]], "note": "The source gives FeNa above 2% as favouring ATN and below 1% pre-renal; 'above 1%' is your course's wording, and the other options are all pre-renal findings.", "src": "Linked sources", "id": 21}, {"group": "Medicine", "topic": "Neurology", "stem": "A 55-year-old man is referred with progressively worsening choreiform movements of his limbs and trunk, irritability and low mood. He can no longer work as an accountant. His father died aged 57 after a similar illness. What is the most likely diagnosis?", "opts": ["Parkinson's disease", "Wilson's disease", "Huntington's disease", "Spinocerebellar ataxia", "Multisystem atrophy"], "ans": 2, "exp": "Huntington disease is autosomal dominant, usually starting in the 30s-40s with irritability, low mood and chorea, followed by cognitive decline. A parent with a similar illness fits.", "why": ["Parkinson's disease causes bradykinesia, rigidity and rest tremor, not chorea.", "Wilson disease starts earlier, with liver disease and a low ceruloplasmin.", "", "Spinocerebellar ataxia causes cerebellar signs rather than chorea.", "MSA causes autonomic failure with parkinsonism or cerebellar features."], "refs": [["MedlinePlus: Huntington disease", "https://medlineplus.gov/genetics/condition/huntingtons-disease"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 22}, {"group": "Medicine", "topic": "Neurology", "stem": "A 20-year-old man is referred with progressive mobility problems. He is ataxic with slurred speech and has pes cavus. There is a peripheral neuropathy and bilateral upgoing plantars. His blood glucose is also noted to be raised. What is the most likely diagnosis?", "opts": ["Hereditary spinocerebellar ataxia", "Motor neurone disease", "Charcot-Marie-Tooth syndrome", "Marfan's syndrome", "Friedreich's ataxia"], "ans": 4, "exp": "Friedreich ataxia is the commonest inherited ataxia: onset in youth with ataxia, dysarthria, absent ankle reflexes, upgoing plantars and pes cavus. Diabetes and hypertrophic cardiomyopathy are common. It is autosomal recessive (FXN GAA repeats), so an unaffected sibling is not surprising.", "why": ["Dominant spinocerebellar ataxias seldom cause peripheral neuropathy with pes cavus and diabetes at this age.", "MND has no sensory neuropathy, and doesn't cause cerebellar ataxia or diabetes.", "CMT causes distal weakness and sensory loss but not upgoing plantars or ataxic speech.", "Marfan's syndrome is a connective tissue disease and doesn't cause ataxia.", ""], "refs": [["Genomics Education Programme: Friedreich ataxia", "https://www.genomicseducation.hee.nhs.uk/genotes/knowledge-hub/friedreich-ataxia/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 23}, {"group": "Medicine", "topic": "Neurology", "stem": "A 44-year-old man has distal muscle weakness, frontal baldness and bilateral partial ptosis. On shaking hands, his fingers are delayed in relaxing. Which complication is associated with this condition?", "opts": ["Infertility", "Hypoadrenalism", "Horner's syndrome", "COPD", "Chronic renal failure"], "ans": 0, "exp": "This is myotonic dystrophy. In men, testicular atrophy and low sperm count cause infertility. Cataracts and cardiac conduction disease are also common.", "why": ["", "Adrenal insufficiency is not a feature (though diabetes and thyroid disease can occur).", "Horner's syndrome is a sympathetic chain lesion, not part of this disease.", "COPD is not a feature, though respiratory muscle weakness can reduce ventilation.", "Renal failure is not a feature."], "refs": [["Muscular Dystrophy Association: myotonic dystrophy", "https://mda.org/node/231"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 24}, {"group": "Medicine", "topic": "Neurology", "stem": "A 15-year-old boy is referred with recurrent absence seizures. Which anti-epileptic drug is the most appropriate first-line treatment?", "opts": ["Ethosuximide", "Valproate", "Phenytoin", "Lamotrigine", "Vigabatrin"], "ans": 0, "exp": "NICE advises ethosuximide first for absence seizures. Valproate is second-line, and lamotrigine or levetiracetam third-line.", "why": ["", "Valproate is second-line, mainly for boys and men.", "Phenytoin may worsen absence seizures and is avoided.", "Lamotrigine is a third-line option.", "Vigabatrin can worsen absence seizures and is avoided."], "refs": [["NICE NG217: treating epileptic seizures", "https://nice.org.uk/guidance/ng217/chapter/treating-epileptic-seizures-in-children-young-people-and-adults"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 25}, {"group": "Medicine", "topic": "Neurology", "stem": "A 37-year-old man presents with a sudden headache described as being hit on the back of the head with a bat. It is the first and worst headache of his life. A CT brain is normal. Which feature on lumbar puncture would support a diagnosis of subarachnoid haemorrhage?", "opts": ["An elevated red cell count that drops between bottles", "An elevated white cell count", "Gram stain positivity for red diplococci", "Turbid-looking CSF", "Xanthochromia"], "ans": 4, "exp": "A normal CT does not exclude SAH, especially later than 6 hours. Lumbar puncture is done at least 12 hours after onset to detect blood breakdown products (xanthochromia).", "why": ["A red cell count falling between bottles suggests a traumatic tap.", "A raised white count suggests meningitis.", "Red diplococci would be pneumococcus or meningococcus, which means meningitis.", "Turbid CSF suggests bacterial meningitis.", ""], "refs": [["NICE NG228: subarachnoid haemorrhage, rationale", "https://www.nice.org.uk/guidance/NG228/chapter/rationale-and-impact"]], "note": "NICE source confirms CT timing and LP at 12 hours or more; it doesn't mention xanthochromia, which is standard teaching.", "src": "Linked sources", "id": 26}, {"group": "Medicine", "topic": "Neurology", "stem": "A 37-year-old man presented with a sudden 'thunderclap' headache, the first and worst of his life, and was found to have a subarachnoid haemorrhage. After definitive management he is started on nimodipine. Why?", "opts": ["To lower his cerebral perfusion pressure", "To prevent hydrocephalus", "To prevent seizures", "To prevent stress ulceration", "To prevent vasospasm"], "ans": 4, "exp": "Nimodipine (60 mg orally every 4 hours) reduces the risk of delayed cerebral ischaemia after aneurysmal SAH, which peaks 5-14 days after the bleed.", "why": ["The aim is to maintain perfusion, and keeping cerebral perfusion pressure adequate is better.", "Hydrocephalus is treated with CSF diversion, not nimodipine.", "Nimodipine isn't an anticonvulsant.", "Stress ulcer prevention uses acid suppression.", ""], "refs": [["GPnotebook: prevention of delayed cerebral ischaemia", "https://gpnotebook.com/pages/neurology/management/prevention-of-delayed-cerebral-ischaemia"]], "note": "The source states the purpose and dose; the vasospasm explanation is standard teaching.", "src": "Linked sources", "id": 27}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 45-year-old woman has a 30-minute history of right upper limb weakness and incoordination. She has had 4 months of fevers, fatigue and arthralgia. There is a rash over the face, neck and chest, and a mobile, non-deforming arthritis of the hands with erythema over the joints. Which test is most likely to help determine the underlying aetiology?", "opts": ["Echocardiogram", "Full blood count", "Auto-antibody screen", "Lumbar puncture", "Protein C assay"], "ans": 2, "exp": "Photosensitive rash, arthritis, fever and neurological symptoms suggest SLE. ANA is the sensitive screening test, with anti-dsDNA and anti-Smith as specific antibodies.", "why": ["An echo is not the test that identifies the underlying disease, though it may be done for cardiac involvement.", "A full blood count is non-specific.", "", "Lumbar puncture is not the initial test for suspected SLE.", "A protein C assay looks for a clotting disorder, which does not explain the picture."], "refs": [["iatrox: systemic lupus erythematosus", "https://www.iatrox.com/academy/ukmla/systemic-lupus-erythematosus"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 28}, {"group": "Medicine", "topic": "Neurology", "stem": "A 44-year-old man has weakness in his left hand since an accident at work several weeks ago. There is generalised wasting of the small muscles of the hand, hyperextension at the metacarpophalangeal joints and flexion at the interphalangeal joints of the fourth and fifth fingers, and sensory loss over the medial one and a half fingers. What is the most likely diagnosis?", "opts": ["Radial nerve palsy", "C7/C8 disc compression", "Ulnar nerve palsy", "C6 root lesion", "Cervical myelopathy"], "ans": 2, "exp": "An ulnar nerve lesion gives a claw hand (most marked in the ring and little fingers), wasting of the intrinsic hand muscles and sensory loss over the medial 1½ fingers.", "why": ["Radial nerve palsy causes wrist drop and sensory loss on the dorsal first web space.", "A C7/C8 root lesion would not give this isolated ulnar distribution and claw hand.", "", "A C6 lesion causes weakness of elbow flexion and thumb/lateral forearm sensory loss.", "Myelopathy gives upper motor neuron signs in the legs as well."], "refs": [["LITFL: ulnar nerve lesions", "https://litfl.com/ulnar-nerve-lesions/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 29}, {"group": "Medicine", "topic": "Neurology", "stem": "A 44-year-old woman is referred with muscle weakness and diplopia, both of which worsen over the course of the day. Examination shows objective muscle weakness that is worse on repeated testing. Which of the following will most likely confirm the diagnosis?", "opts": ["MRI spine", "Creatine kinase", "Vitamin B12 levels", "Anti-acetylcholine receptor antibodies", "Visual evoked potentials"], "ans": 3, "exp": "Fatigable weakness with diplopia suggests myasthenia gravis. Anti-AChR antibodies are found in about 85% of generalised cases and are highly specific. A CT thorax then screens for thymoma.", "why": ["MRI of the spine wouldn't explain ocular weakness or fatigability.", "CK is typically normal in myasthenia gravis.", "B12 deficiency causes neuropathy and cognitive change, not fatigable weakness.", "", "Visual evoked potentials test the optic pathway, as in demyelination."], "refs": [["iatrox: myasthenia gravis", "https://www.iatrox.com/academy/ukmla/myasthenia-gravis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 30}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 27-year-old nursing student with type 1 diabetes feels dizzy. She is conscious and her blood glucose is 4.0 mmol/L. What is the most appropriate management?", "opts": ["4-5 Glucotabs", "500 mL normal saline IV", "1-2 Glucotabs", "50 mL 50% dextrose IV", "Glucagon 1 mg IM"], "ans": 0, "exp": "For a conscious patient who can swallow, give 15-20 g of fast-acting carbohydrate by mouth, then recheck glucose after 10-15 minutes and repeat if still low.", "why": ["", "Saline contains no glucose.", "One or two tablets give too little glucose.", "IV dextrose is for patients who are unconscious or cannot swallow.", "IM glucagon is for patients who cannot take oral glucose."], "refs": [["NHS Scotland: hypoglycaemia algorithm for adults with diabetes", "https://rightdecisions.scot.nhs.uk/media/2067/diabetes-algorithm-for-treatment-of-hypoglycaemia-in-adults-with-diabetes.pdf"]], "note": "The source gives 15-20 g of fast-acting carbohydrate; the tablet counts are from your course (check the tablet size on your brand).", "src": "Linked sources", "id": 31}, {"group": "Medicine", "topic": "Endocrinology", "stem": "An 18-year-old man with known type 1 diabetes is brought in with confusion, abdominal pain, nausea, vomiting and fever. Finger prick glucose is 22.4 mmol/L and urinalysis is clear of ketones. Which finding is more consistent with HHS than DKA?", "opts": ["Age 18", "Concomitant UTI", "Finger prick glucose of 22.4", "Type 1 diabetic", "Urinalysis clear of ketones"], "ans": 4, "exp": "HHS is defined by very high glucose (above 30), high osmolality and little or no ketonaemia or acidosis. DKA requires significant ketones and acidosis.", "why": ["HHS typically affects older adults, so age 18 points away from it.", "Infection can trigger either condition.", "A glucose of 22.4 is high in both and below the HHS threshold of 30.", "DKA is characteristic of type 1 diabetes; HHS typically occurs in type 2.", ""], "refs": [["iatrox: hyperosmolar hyperglycaemic state", "https://www.iatrox.com/academy/ukmla/hyperosmolar-hyperglycaemic-state"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 32}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 44-year-old woman with Hashimoto's thyroiditis in the family has confusion, falls and abdominal pain, with 4 months of fatigue, anorexia, 5.5 kg weight loss and new skin pigmentation and vitiligo. Her BP is 98/65 supine, falling to 82/52 sitting. An Addisonian crisis is suspected. What would you expect on her U&E?", "opts": ["Hypokalaemia", "Hyponatraemia", "Low haemoglobin", "Low platelets", "Low urea"], "ans": 1, "exp": "Addison's disease causes low cortisol and aldosterone, so sodium is lost (hyponatraemia) and potassium is retained (hyperkalaemia). Urea is often raised with volume depletion.", "why": ["Aldosterone deficiency causes hyperkalaemia, not hypokalaemia.", "", "Haemoglobin and platelets are not part of a U&E.", "Platelets are not part of a U&E.", "Volume depletion usually raises urea."], "refs": [["iatrox: Addison's disease", "https://www.iatrox.com/academy/ukmla/addisons-disease"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 33}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 48-year-old non-smoking farmer presents with fever, dyspnoea and cough for 2 months. He has a normal respiratory examination, serum calcium of 2.88 mmol/L, and a chest X-ray with upper zone pulmonary infiltrates and bilateral hilar lymphadenopathy. A Mantoux test is negative. What is the most likely diagnosis?", "opts": ["Berylliosis", "Bronchogenic carcinoma", "Farmer's lung", "Sarcoidosis", "Tuberculosis"], "ans": 3, "exp": "Bilateral hilar lymphadenopathy with hypercalcaemia (from vitamin D activation by granuloma macrophages) and a negative Mantoux test points to sarcoidosis. TB is the main differential.", "why": ["Berylliosis requires beryllium exposure, which isn't described.", "Bilateral symmetric hilar nodes with hypercalcaemia is not typical for lung cancer.", "Farmer's lung is a hypersensitivity pneumonitis and doesn't cause hilar lymphadenopathy or hypercalcaemia.", "", "TB is made less likely by the negative Mantoux and the symmetrical hilar nodes."], "refs": [["iatrox: sarcoidosis", "https://www.iatrox.com/academy/ukmla/sarcoidosis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 34}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 49-year-old male smoker has a 1-week history of facial swelling and light-headedness, and a 3-month history of dyspnoea and a 1 stone weight loss. He has facial plethora and distended neck veins. CXR shows an upper mediastinal mass. What is the most likely cause of his presentation?", "opts": ["Ascending aortic aneurysm", "Constrictive pericarditis", "Goitre", "Small cell lung carcinoma", "Tuberculosis"], "ans": 3, "exp": "This is superior vena cava obstruction, most often caused by lung cancer, small cell lung cancer in particular for a central mediastinal mass, with weight loss and facial plethora.", "why": ["An aneurysm could compress the SVC but is a much rarer cause.", "Constrictive pericarditis causes raised JVP without a mediastinal mass.", "A goitre can cause obstruction but doesn't explain weight loss and rapid course.", "", "TB is a rare cause of SVCO."], "refs": [["PulseNotes: superior vena cava obstruction", "https://app.pulsenotes.com/medicine/oncology/notes/svco"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 35}, {"group": "Medicine", "topic": "Haematology", "stem": "A 40-year-old man presents with a stone of weight loss and painless lymphadenopathy. A lymph node biopsy later shows Reed-Sternberg cells. His GP asks about B symptoms. Which of the following is a B symptom?", "opts": ["Alcohol-induced lymph node pain", "Drenching sweats", "Fatigue", "Pruritus", "Rash"], "ans": 1, "exp": "B symptoms in Hodgkin lymphoma are fever above 38°C, drenching night sweats and weight loss of more than 10% over six months.", "why": ["Alcohol-induced node pain is a classic Hodgkin feature but is not a B symptom.", "", "Fatigue is not a B symptom.", "Pruritus is a recognised feature but is not a B symptom.", "Rash is not a B symptom."], "refs": [["Patient.info: Hodgkin lymphoma", "https://patient.info/doctor/oncology/hodgkins-lymphoma-pro"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 36}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 56-year-old man presents to his GP with an acute monoarticular pain, very sudden in onset and 10/10 in severity. What is the most useful diagnostic test for confirming a diagnosis of acute gout?", "opts": ["Evidence of 'cup and pencil' deformity on X-ray of hand joints", "Evidence of 'punched out' peri-articular erosions", "Finding of elevated white cells on joint aspirate", "Finding of negatively birefringent needle-shaped crystals on joint aspirate", "Finding of positively birefringent rhomboid crystals on joint aspirate"], "ans": 3, "exp": "Gout is confirmed by joint aspiration showing needle-shaped, negatively birefringent urate crystals under polarised light.", "why": ["A 'cup and pencil' deformity describes psoriatic arthritis.", "Punched-out erosions are a late sign of chronic tophaceous gout, not a diagnostic test of an acute attack.", "A raised white count is non-specific and also occurs in septic arthritis.", "", "Positively birefringent rhomboid crystals are calcium pyrophosphate (pseudogout)."], "refs": [["iatrox: gout", "https://www.iatrox.com/academy/ukmla/gout"]], "note": "Source confirms the crystal finding; the contrast with other options is standard teaching.", "src": "Linked sources", "id": 37}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 56-year-old man with diabetes mellitus and peptic ulcer disease presents with acute monoarticular pain, very sudden in onset and 10/10 in severity. The presumptive diagnosis is acute gout. What is the best pharmacological treatment for his acute attack?", "opts": ["Allopurinol", "Aspirin", "Colchicine", "Diclofenac", "Methylprednisolone"], "ans": 2, "exp": "NSAIDs are the usual first choice, with colchicine an alternative. With peptic ulcer disease, an NSAID is unsafe, so colchicine is a reasonable choice. A short prednisolone course is another option.", "why": ["Allopurinol is started after the attack has settled and can worsen an acute flare.", "Aspirin is not used to treat gout, and it raises urate at low doses.", "", "Diclofenac is an NSAID and risks bleeding with his ulcer disease.", "Steroids are an alternative but can worsen blood glucose in diabetes."], "refs": [["iatrox: gout", "https://www.iatrox.com/academy/ukmla/gout"]], "note": "Source lists NSAID, colchicine or prednisolone options; it doesn't name peptic ulcer or diabetes. Choosing colchicine here is your course answer and standard reasoning.", "src": "Linked sources", "id": 38}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 65-year-old woman with newly diagnosed type 2 diabetes and hypertension has coarse facial features and a gradual change in her appearance over 10 years. Her GP suspects acromegaly. Which of the following tests best supports the diagnosis?", "opts": ["OGTT with failure to suppress growth hormone levels", "Raised random growth hormone levels", "Raised random IGF-1 levels", "Serial IGF-1 levels", "Suppressed GHRH levels"], "ans": 0, "exp": "IGF-1 is the screening test. Elevated IGF-1 plus failure of growth hormone to suppress during an oral glucose tolerance test confirms acromegaly, and MRI of the pituitary follows.", "why": ["", "GH is pulsatile, so a random level is unreliable.", "A raised IGF-1 is the screening step, but confirmation needs the OGTT.", "Repeating IGF-1 doesn't add the dynamic suppression test.", "GHRH isn't a test for acromegaly."], "refs": [["ARUP Consult: acromegaly", "https://arupconsult.com/content/acromegaly"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 39}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 42-year-old man with refractory hypertension, intermittent sweating and palpitations is diagnosed with a phaeochromocytoma. He is due for surgery in one week. On which antihypertensive regime should he be commenced?", "opts": ["Alpha blocker followed by beta blocker", "ACE inhibitor followed by calcium channel blocker", "Beta blocker followed by alpha blocker", "ACE inhibitor followed by beta blocker", "Calcium channel blocker followed by alpha blocker"], "ans": 0, "exp": "Alpha-blockade (phenoxybenzamine or doxazosin) is started first, ideally 10-14 days before surgery. A beta blocker is only added afterwards, because blocking beta receptors first leaves alpha-mediated vasoconstriction unopposed and can cause a hypertensive crisis.", "why": ["", "This regime doesn't provide alpha blockade.", "Starting a beta blocker first risks a hypertensive crisis.", "An ACE inhibitor does not provide the alpha blockade needed.", "A calcium channel blocker can be added but alpha-blockade comes first."], "refs": [["iatrox: phaeochromocytoma", "https://www.iatrox.com/academy/ukmla/phaeochromocytoma"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 40}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 40-year-old woman complains of intermittent palpitations and a feeling of impending doom. She is found to have refractory hypertension at 190/95 mmHg. Which test would you perform to support a diagnosis of phaeochromocytoma?", "opts": ["24-hour urinary porphobilinogens", "24-hour urinary protein collection", "24-hour urinary free cortisol collection", "24-hour urinary catecholamines", "24-hour urinary calcium"], "ans": 3, "exp": "Phaeochromocytoma is confirmed by measuring catecholamines or metanephrines. Plasma free metanephrines are the most sensitive test, and 24-hour urinary metanephrines and catecholamines are an alternative.", "why": ["Porphobilinogen is for acute porphyria.", "Protein excretion assesses renal disease.", "Urinary free cortisol screens for Cushing syndrome.", "", "Urinary calcium assesses hypercalciuria and calcium disorders."], "refs": [["iatrox: phaeochromocytoma", "https://www.iatrox.com/academy/ukmla/phaeochromocytoma"]], "note": "The source calls plasma free metanephrines most sensitive, so that test would normally be preferred if offered.", "src": "Linked sources", "id": 41}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 55-year-old woman with a history of sarcoidosis presents with polydipsia and polyuria. Fasting blood glucose is 5.5 mmol/L. Diabetes insipidus is considered. Which urine and blood osmolality results best support the diagnosis?", "opts": ["Raised plasma osmolality and low urine osmolality", "Raised plasma osmolality and raised urine osmolality", "Normal plasma osmolality and low urine osmolality", "Low plasma osmolality and high urine osmolality", "Low plasma osmolality and normal urine osmolality"], "ans": 0, "exp": "In diabetes insipidus the body loses water, so plasma osmolality is raised while the urine is inappropriately dilute. Sarcoidosis is an infiltrative cause of central DI.", "why": ["", "A concentrated urine with raised plasma osmolality is the normal response to dehydration.", "Normal plasma osmolality with dilute urine suggests primary polydipsia.", "Low plasma osmolality with high urine osmolality suggests SIADH.", "Low plasma osmolality with normal urine osmolality does not fit DI."], "refs": [["PulseNotes: diabetes insipidus", "https://app.pulsenotes.com/medicine/endocrinology/notes/diabetes-insipidus"]], "note": "Source supports raised plasma and low urine osmolality; the SIADH and primary polydipsia contrasts are standard teaching.", "src": "Linked sources", "id": 42}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 63-year-old man is being investigated in the endocrine day ward for fatigue and hypotension, with disturbed electrolytes (raised potassium, low sodium). Which of the following tests would confirm the suspected diagnosis?", "opts": ["Random cortisol", "Synacthen test", "Midnight cortisol", "24-hour urinary cortisol excretion", "Renin:aldosterone ratio"], "ans": 1, "exp": "Fatigue, hypotension, hyponatraemia and hyperkalaemia suggest primary adrenal insufficiency (Addison's disease). It is confirmed with a 9 am cortisol and a short Synacthen test (a peak cortisol below about 450 nmol/L at 30 minutes).", "why": ["A random cortisol varies with time of day and stress, so a single value cannot confirm or exclude it.", "", "A midnight cortisol is used to screen for Cushing syndrome.", "Urinary free cortisol screens for cortisol excess (Cushing syndrome).", "An aldosterone:renin ratio screens for primary hyperaldosteronism, not Addison's disease."], "refs": [["iatrox: Addison's disease", "https://www.iatrox.com/academy/ukmla/addisons-disease"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 43}, {"group": "Medicine", "topic": "Rheumatology", "stem": "A 34-year-old woman with known lupus presents with 3 weeks of flu-like symptoms and fatigue, and you suspect an acute flare. Which antibody titre is used to detect disease activity?", "opts": ["Anti-cardiolipin antibody", "Anti-centromere antibody", "Anti-dsDNA antibody", "Anti-nuclear antibody", "Anti-phospholipid antibody"], "ans": 2, "exp": "Anti-dsDNA is specific for SLE and its titre tracks disease activity, particularly nephritis. Complement (C3, C4) falls in active disease.", "why": ["Anti-cardiolipin antibodies relate to antiphospholipid syndrome (thrombosis and miscarriage).", "Anti-centromere antibodies are associated with limited systemic sclerosis.", "", "ANA is the sensitive screening test but is not used to follow disease activity.", "Antiphospholipid antibodies indicate thrombotic risk rather than lupus activity."], "refs": [["iatrox: systemic lupus erythematosus", "https://www.iatrox.com/academy/ukmla/systemic-lupus-erythematosus"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 44}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 39-year-old woman has difficult-to-treat severe hypertension and feels weak at times with muscle cramps. Her potassium is 2.9 mmol/L (normal 3.5-5). Plasma aldosterone is raised and renin is low. What is the most likely diagnosis?", "opts": ["Conn's syndrome", "Cushing's disease", "Cushing's syndrome", "Phaeochromocytoma", "Addison's disease"], "ans": 0, "exp": "Primary hyperaldosteronism (Conn's syndrome) causes hypertension with hypokalaemia and alkalosis, high aldosterone and suppressed renin. The aldosterone-to-renin ratio is the preferred screening test.", "why": ["", "Cushing's disease gives cortisol excess with central obesity and striae, and aldosterone is normal.", "Cushing's syndrome likewise shows features of cortisol excess.", "Phaeochromocytoma causes episodic symptoms and raised metanephrines, with normal aldosterone and renin.", "Addison's disease causes hypotension and hyperkalaemia."], "refs": [["GPnotebook: Conn's syndrome", "https://gpnotebook.com/pages/cardiovascular-medicine/conns-syndrome"]], "note": "The source doesn't mention muscle weakness, which is standard teaching for hypokalaemia.", "src": "Linked sources", "id": 45}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 28-year-old woman who is 6 months postpartum has weight loss, heat intolerance and palpitations, with a fine tremor, diaphoresis and notable exophthalmos. Which of the following most likely represents her thyroid function test results?", "opts": ["Elevated T4, normal TSH", "Elevated T4, elevated TSH", "Low T4, elevated TSH", "Elevated T4, low TSH", "Low T4, low TSH"], "ans": 3, "exp": "Hyperthyroidism (here likely Graves disease, given the eye signs) shows raised free T4 with a suppressed TSH.", "why": ["A normal TSH with high T4 would be unusual, such as in a TSH-secreting tumour.", "High T4 with high TSH would suggest a TSH-secreting pituitary adenoma or thyroid hormone resistance.", "Low T4 with high TSH is primary hypothyroidism.", "", "Low T4 with low TSH points to central (pituitary) hypothyroidism."], "refs": [["StatPearls/NCBI: Graves disease", "https://www.ncbi.nlm.nih.gov/books/NBK285548/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 46}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 45-year-old woman presented with a 4-month history of palpitations and weight loss and was found to be hyperthyroid. She was started on carbimazole 20 mg once daily 3 weeks ago. She returns today complaining of a sore throat. Which test should be performed immediately?", "opts": ["Free T4", "Full blood count", "TSH", "Monospot", "Throat swab"], "ans": 1, "exp": "Carbimazole can cause neutropenia and agranulocytosis. A sore throat, fever or mouth ulcers means stop the drug and check a white cell count immediately.", "why": ["Thyroid function does not explain a sore throat and should not delay checking for agranulocytosis.", "", "TSH does not assess marrow suppression.", "A monospot would test for glandular fever, which isn't the urgent concern.", "A throat swab can follow, but the white cell count comes first."], "refs": [["EMC: carbimazole SmPC", "https://www.medicines.org.uk/emc/product/4266/smpc"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 47}, {"group": "Medicine", "topic": "Respiratory", "stem": "Complications of asbestos exposure include all of the following EXCEPT:", "opts": ["Pleural plaques", "Asbestosis", "Lung cancer", "Asthma", "Diffuse pleural thickening"], "ans": 3, "exp": "Asbestos causes pleural plaques, diffuse pleural thickening, benign effusion, asbestosis, lung cancer and mesothelioma. Asthma is not a recognised complication.", "why": ["Pleural plaques are the commonest manifestation of asbestos exposure.", "Asbestosis is basal pulmonary fibrosis caused by asbestos.", "Lung cancer risk is increased, especially in smokers.", "", "Diffuse pleural thickening is a recognised non-malignant effect."], "refs": [["MSD Manual: asbestos-related disorders", "https://www.msdmanuals.com/professional/pulmonary-disorders/environmental-and-occupational-pulmonary-diseases/overview-of-asbestos-related-disorders"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 48}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 64-year-old man has a 5-month history of exertional dyspnoea, wheeze and productive cough. He smokes 20 cigarettes a day for 40 years. There is no clubbing, and he has diminished breath sounds with a generalised expiratory wheeze. Which investigation will most likely yield the underlying diagnosis?", "opts": ["Arterial blood gas", "CT thorax", "Six-minute walk test", "Spirometry", "Sputum culture"], "ans": 3, "exp": "This presentation suggests COPD. Post-bronchodilator spirometry with an FEV1/FVC ratio below 0.7 confirms persistent airflow obstruction.", "why": ["An ABG assesses gas exchange but doesn't make the diagnosis.", "CT may show emphysema or exclude cancer but is not needed to diagnose COPD.", "A walk test measures functional capacity.", "", "Sputum culture is for exacerbations with infection."], "refs": [["GPnotebook: spirometry in diagnosis of COPD", "https://gpnotebook.com/pages/respiratory-and-chest-medicine/spirometry-in-diagnosis-of-copd"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 49}, {"group": "Medicine", "topic": "Haematology", "stem": "A 45-year-old man with acute pancreatitis develops epistaxis, bleeding gums, haematuria, purpura and cold mottled fingertips. Platelets are 45 x10^9/L with prolonged aPTT and PT. A coagulation screen shows decreased fibrinogen and raised D-dimers and fibrin degradation products. He is oliguric and dyspnoeic. What is the most likely diagnosis?", "opts": ["Haemolytic-uraemic syndrome", "Heparin-induced thrombocytopenia", "von Willebrand disease", "Systemic inflammatory response syndrome", "Disseminated intravascular coagulation"], "ans": 4, "exp": "Low platelets, low fibrinogen, raised D-dimers and prolonged PT and aPTT in a patient with a trigger (here pancreatitis) is DIC. Bleeding and microvascular thrombosis (cold mottled fingers, oliguria) occur together.", "why": ["HUS shows normal clotting times and fibrinogen.", "HIT follows heparin exposure and has normal PT/aPTT.", "vWD causes mucosal bleeding with a prolonged aPTT but normal fibrinogen and platelets.", "SIRS can accompany pancreatitis but does not explain the clotting abnormalities.", ""], "refs": [["ARUP Consult: DIC", "https://arupconsult.com/content/disseminated-intravascular-coagulation"]], "note": "The source doesn't mention pancreatitis as a trigger or FDPs by name.", "src": "Linked sources", "id": 50}, {"group": "Medicine", "topic": "Nephrology", "stem": "A 64-year-old man presents with frank haematuria. He has ANCA-associated vasculitis for which he recently received cyclophosphamide induction therapy. What is the most likely cause of his current presentation?", "opts": ["Haemorrhagic cystitis", "Prostate cancer", "Prostatitis", "Renal stones", "Urinary Schistosomiasis"], "ans": 0, "exp": "Cyclophosphamide is metabolised to acrolein, which irritates the bladder lining and causes haemorrhagic cystitis. Hydration and mesna help prevent it.", "why": ["", "Prostate cancer is possible but less likely with this exposure and sudden onset.", "Prostatitis causes pain and urinary symptoms with fever.", "Stones cause colicky pain, which is not described.", "Schistosomiasis would need travel to an endemic area."], "refs": [["eviQ: haemorrhagic cystitis", "https://eviq.org.au/clinical-resources/side-effect-management/genitourinary/1297-haemorrhagic-cystitis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 51}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 78-year-old man attends the ED with 5 days of progressive dyspnoea and haemoptysis. He had his third cycle of chemotherapy for non-Hodgkin's lymphoma one week ago. HR 124 bpm regular, BP 128/76, SpO2 96% on 2 L/min oxygen, and he has a swollen, tender left calf. PE is the most likely diagnosis. What is his Wells score?", "opts": ["4.5", "5.5", "6.5", "9.5", "10.5"], "ans": 3, "exp": "Wells points: clinical signs of DVT 3, PE the most likely diagnosis 3, heart rate over 100 1.5, haemoptysis 1, active malignancy on treatment 1. Total 9.5.", "why": ["This
