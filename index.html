ammatory bowel disease", "VIPoma"], "ans": 2, "exp": "Carcinoid syndrome causes flushing, watery diarrhoea, abdominal pain, wheeze and palpitations. It arises when a neuroendocrine tumour (most often small bowel) with liver metastases releases serotonin into the systemic circulation.", "why": ["Ascaris infection causes cough and abdominal pain with eosinophilia, not flushing.", "Phaeochromocytoma causes episodic hypertension, sweating and headache.", "", "IBD causes bloody diarrhoea and doesn't cause flushing and palpitations.", "VIPoma causes profuse watery diarrhoea with low potassium, and doesn't usually cause flushing."], "refs": [["Cancer Research UK: carcinoid syndrome", "https://cancerresearchuk.org/about-cancer/neuroendocrine-tumours-nets/carcinoid-syndrome/what"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 150}, {"group": "Surgery", "topic": "Vascular", "stem": "Three days after delivery of a male newborn, a 36-year-old gravida 1, para 1 woman has fever and pain in her left leg. Pregnancy was complicated by premature rupture of membranes; the child was delivered at 35 weeks' gestation by lower segment transverse cesarean section because of a nonreassuring fetal heart rate. The patient has smoked half a pack of cigarettes daily for 5 years and continued to smoke during her pregnancy. Her temperature is 38.9°C (102°F), pulse is 110/min, and blood pressure is 110/80 mm Hg. Examination shows an edematous, erythematous, and warm left leg. Passive dorsiﬂexion of the left foot elicits pain in the calf. The peripheral pulses are palpated bilaterally. The uterus is nontender and palpated at the umbilicus. Ultrasonography of the left leg shows an incompressible left popliteal vein. Which of the following is the most appropriate initial step in management?", "opts": ["Low molecular weight heparin", "Embolectomy", "Urokinase", "Graduated compression stockings", "Warfarin"], "ans": 0, "exp": "Postpartum leg pain, swelling and fever with an incompressible popliteal vein on ultrasound is a DVT. Compression ultrasound is the test of choice, and LMWH is first-line treatment in pregnancy and the postpartum period. Warfarin can be used postpartum, but heparin is the initial step.", "why": ["", "Embolectomy is for arterial occlusion, not venous thrombosis.", "Thrombolysis is reserved for limb-threatening or massive disease because of bleeding risk after delivery.", "Compression stockings help symptoms but don't treat the clot.", "Warfarin takes days to work and needs heparin cover."], "refs": [["AAFP: VTE during pregnancy", "https://www.aafp.org/pubs/afp/issues/2008/0615/p1709.html"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 151}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 56-year-old man has a two-week history of drenching night sweats, malaise and severe fatigue. He has a bioprosthetic aortic valve replacement, hypertension, type 2 diabetes, and benign prostatic hypertrophy diagnosed 5 weeks ago after cystoscopy and biopsy. He has a diastolic murmur at the left sternal edge. What is the next most appropriate diagnostic investigation?", "opts": ["C-reactive protein", "Chest X-ray", "Blood cultures", "Electrocardiogram", "Cardiac CT"], "ans": 2, "exp": "Fever-type symptoms with a prosthetic valve, a new regurgitant murmur and a recent instrumentation suggest infective endocarditis. At least three sets of blood cultures should be taken before antibiotics, followed by echocardiography as soon as possible.", "why": ["A CRP will be raised but is non-specific and not diagnostic.", "A chest X-ray may be done but would not help diagnose endocarditis.", "", "An ECG may show conduction abnormalities from root abscess but is not diagnostic.", "Cardiac CT can show lesions but comes after blood cultures and echocardiography."], "refs": [["Doncaster and Bassetlaw NHS: infective endocarditis guideline", "https://www.dbth.nhs.uk/wp-content/uploads/2023/10/Infective-Endocarditis.pdf"]], "note": "The source lists recent dental or surgical procedures and prosthetic valves as risk factors but doesn't mention urological procedures.", "src": "Linked sources", "id": 152}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 76-year-old man is admitted after an NSTEMI. Later that night he is light-headed and short of breath, with GCS 14/15 and pallor. Heart rate is 170/min and BP 76/30 mmHg. Telemetry shows a broad-complex tachycardia (ventricular tachycardia). What is the most appropriate immediate management?", "opts": ["Transcutaneous pacing", "Defibrillation", "Amiodarone infusion", "Percutaneous coronary intervention (PCI)", "Synchronised cardioversion"], "ans": 4, "exp": "A broad-complex tachycardia with adverse features (shock, reduced consciousness) is treated with synchronised DC cardioversion, with sedation if conscious. Amiodarone 300 mg IV is given if the shocks fail, and then another shock follows.", "why": ["Pacing is for unstable bradycardia.", "Unsynchronised defibrillation risks triggering VF in a patient with a pulse.", "Amiodarone is used after failed cardioversion in an unstable patient.", "Repeat PCI may be needed later, but the unstable rhythm comes first.", ""], "refs": [["Resuscitation Council UK: tachycardia algorithm 2021", "https://www.resus.org.uk/sites/default/files/2021-04/Tachycardia Algorithm 2021.pdf"]], "note": "The rhythm strip in the original slide wasn't reproducible, so the stem states the rhythm.", "src": "Linked sources", "id": 153}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 55-year-old man has a week of jaundice, pale stools and several months of itch with vague abdominal pain. He has well-controlled ulcerative colitis and does not drink alcohol. Bloods show raised bilirubin, ALP and GGT. Which investigation is most likely to confirm the diagnosis?", "opts": ["Viral hepatitis B serology", "Magnetic resonance cholangiopancreatography (MRCP)", "Caeruloplasmin", "Fibroscan", "Antimitochondrial antibodies"], "ans": 1, "exp": "A cholestatic picture with ulcerative colitis suggests primary sclerosing cholangitis. MRCP is the diagnostic imaging test of choice, showing multifocal strictures in a beaded pattern. About 60-80% of PSC patients have IBD, most often UC.", "why": ["Viral serology can be part of a screen for other causes but does not diagnose PSC.", "", "Caeruloplasmin is for Wilson disease, which presents in younger people.", "Fibroscan stages fibrosis but doesn't confirm PSC.", "AMA is the marker for primary biliary cholangitis, not PSC."], "refs": [["AASLD: diagnosis and management of PSC", "https://www.aasld.org/sites/default/files/2022-07/Diagnosis%20and%20Management%20of%20Primary%20Sclerosing%20Cholangitis.pdf"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 154}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 33-year-old man with known ulcerative colitis has 14 loose stools a day for 2 weeks, wakes at night to open his bowels, and has bright red blood in the motions. He has diffuse abdominal tenderness and a CRP of 136. What is the most appropriate medication to prescribe?", "opts": ["5-ASA", "Hydrocortisone", "Azathioprine", "Methotrexate", "Ciprofloxacin"], "ans": 1, "exp": "This is an acute severe flare (frequent bloody stools, systemic upset, raised CRP), which is admitted for intravenous corticosteroids. Ciclosporin or surgery is considered if there is no response within 72 hours.", "why": ["Aminosalicylates are used for mild-to-moderate flares and maintenance, not for a severe flare.", "", "Azathioprine is a maintenance immunomodulator with a slow onset.", "Methotrexate isn't used for ulcerative colitis in this setting.", "Antibiotics are used if infection is suspected or the diagnosis is uncertain."], "refs": [["GPnotebook: management of acute ulcerative colitis (NICE NG130)", "https://gpnotebook.com/en-AU/pages/gastroenterology/medical-management-of-ulcerative-colitis/management-of-acute-ulcerative-colitis"]], "note": "The source says 'intravenous corticosteroids' without naming hydrocortisone. The course answer is hydrocortisone.", "src": "Linked sources", "id": 155}, {"group": "Medicine", "topic": "Neurology", "stem": "A 60-year-old man has an 8-month history of muscle stiffness and falls. He feels light-headed on standing and has urinary urgency and incontinence. He has marked upper limb rigidity, a very unsteady gait and slowed movements. What is the most likely diagnosis?", "opts": ["Progressive supranuclear palsy", "Idiopathic Parkinson's disease", "Lewy body dementia", "Multiple system atrophy", "Corticobasal degeneration"], "ans": 3, "exp": "Parkinsonism with early autonomic failure (urinary symptoms, postural hypotension) and early falls points to multiple system atrophy. In Parkinson's disease, falls and bladder symptoms are usually late features.", "why": ["PSP (progressive supranuclear palsy) causes vertical gaze palsy and early backward falls, without prominent autonomic failure.", "Idiopathic Parkinson's disease would not typically show early autonomic failure and falls.", "Lewy body dementia is defined by early dementia, hallucinations and fluctuating cognition.", "", "Corticobasal degeneration causes asymmetric rigidity, apraxia and alien limb."], "refs": [["MSA Trust: guide for GPs", "https://www.msatrust.org.uk/professionals/information-about-msa/factsheets/a-guide-for-general-practitioners/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 156}, {"group": "Medicine", "topic": "Neurology", "stem": "A 53-year-old man has 6 months of worsening upper limb weakness. He cannot brush his hair or reach up to cupboards, and his legs are stiff with falls. There are small flickering movements in the upper limb muscles, with reduced power, decreased tone and wasting. The lower limbs have increased tone and brisk reflexes. Which investigation is most likely to be abnormal?", "opts": ["MRI brain with gadolinium enhancement", "CSF analysis", "Electromyography", "Acetylcholine receptor antibodies", "CT angiography"], "ans": 2, "exp": "Upper and lower motor neurone signs with fasciculations suggest motor neurone disease. EMG and nerve conduction studies show widespread denervation with normal sensory conduction, while MRI is mainly used to exclude mimics.", "why": ["MRI is usually normal in MND and is used to exclude structural mimics.", "CSF is usually normal and is used to exclude inflammatory mimics.", "", "AChR antibodies are for myasthenia gravis, which causes fatigable weakness without UMN signs.", "CT angiography assesses vascular lesions, which don't explain this picture."], "refs": [["iatrox: motor neurone disease", "https://www.iatrox.com/academy/ukmla/motor-neurone-disease"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 157}, {"group": "Medicine", "topic": "Neurology", "stem": "A 76-year-old man is admitted 5 hours after the onset of left-sided weakness and dysarthria. He has hypertension and hypercholesterolaemia. Power is 1/5 on the left with a left facial droop. His pulse is irregular and BP is 172/92. CT brain shows an early right infarct without haemorrhage, and CT angiography shows no acute abnormalities. Bloods are normal. What is the most appropriate next step?", "opts": ["IV thrombolysis", "High-dose enoxaparin", "Mechanical thrombectomy", "High-dose aspirin", "IV labetalol"], "ans": 3, "exp": "Once haemorrhage is excluded, aspirin 300 mg is given as soon as possible (within 24 hours) and continued for 2 weeks. Thrombolysis is licensed within 4.5 hours, and thrombectomy needs a proximal occlusion on angiography.", "why": ["He is outside the 4.5-hour thrombolysis window.", "Routine anticoagulation is not recommended in acute stroke, and AF isn't confirmed.", "Thrombectomy requires a proximal large-vessel occlusion, and the CT angiogram shows none.", "", "Blood pressure is usually allowed to run high when not thrombolysing, to maintain cerebral perfusion."], "refs": [["NICE NG128: stroke and TIA", "https://www.nice.org.uk/guidance/NG128/chapter/recommendations"]], "note": "NICE advises aspirin 300 mg for all acute stroke once haemorrhage is excluded. The point about permissive hypertension is from the course explanation.", "src": "Linked sources", "id": 158}, {"group": "Medicine", "topic": "Geriatrics", "stem": "A 77-year-old man has declined in memory over a couple of years. His family first noticed forgetfulness a few months after a stroke. He stayed stable for some time but has had a couple of episodes of sudden marked deterioration over the last year, with difficulty following directions and getting lost while driving. MMSE is 20/30. What is the most likely diagnosis?", "opts": ["Alzheimer's dementia", "Dementia with Lewy bodies", "Delirium", "Vascular dementia", "Frontotemporal dementia"], "ans": 3, "exp": "Cognitive decline after a stroke with a stepwise pattern and executive dysfunction is vascular dementia. Dementia onset within about three months of a recognised stroke supports a vascular cause.", "why": ["Alzheimer's disease causes slow, progressive decline with early memory loss.", "DLB features parkinsonism, fluctuating cognition and visual hallucinations.", "Delirium is acute and fluctuating with impaired attention, not a stepwise course over years.", "", "Frontotemporal dementia presents with behavioural change or language problems."], "refs": [["Patient.info: vascular dementia", "https://patient.info/doctor/vascular-dementia"]], "note": "The source lists executive function as a domain to test but does not call it specific to vascular dementia.", "src": "Linked sources", "id": 159}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 70-year-old man with an 8-year history of type 2 diabetes takes metformin 1 g twice daily plus a new medication started 3 months ago. His HbA1c at the last visit was 75 mmol/mol. He has had a number of hypoglycaemic episodes since starting the new medication. Which medication is most likely to have been started?", "opts": ["Pioglitazone", "Liraglutide", "Gliclazide", "Sitagliptin", "Dapagliflozin"], "ans": 2, "exp": "Sulfonylureas such as gliclazide carry the highest risk of hypoglycaemia among oral diabetes drugs, even with metformin. Pioglitazone, DPP-4 inhibitors and SGLT2 inhibitors have a lower risk, and are mainly a problem when combined with a sulfonylurea or insulin.", "why": ["Pioglitazone has a lower hypoglycaemia risk than a sulfonylurea.", "Liraglutide (GLP-1 agonist) mainly causes hypoglycaemia when combined with a sulfonylurea or insulin.", "", "Sitagliptin (DPP-4 inhibitor) has a low hypoglycaemia risk on its own.", "Dapagliflozin (SGLT2 inhibitor) has a low risk on its own."], "refs": [["GPnotebook: type 2 diabetes treatment options", "https://gpnotebook.com/pages/diabetes-and-endocrinology/management-if-patient-intolerant-of-metformin-in-type-2-diabetes"]], "note": "The source doesn't discuss GLP-1 agonists' hypoglycaemia risk. That point is from your course explanation.", "src": "Linked sources", "id": 160}, {"group": "Medicine", "topic": "Endocrinology", "stem": "An 88-year-old man with multiple myeloma has malaise, aches and pains, abdominal pain, nausea and constipation for weeks. He is very thirsty and passing large volumes of urine, and is intermittently confused and irritable. He has mild non-specific abdominal tenderness and diminished deep tendon reflexes. Urinalysis is clear. A specific electrolyte disturbance is suspected. What is the most appropriate initial management step?", "opts": ["IV calcium gluconate", "IV magnesium sulphate", "Oral calcium supplementation", "IV fluids", "SC denosumab"], "ans": 3, "exp": "This is hypercalcaemia of malignancy (bones, stones, groans and psychic moans). The first step is intravenous 0.9% saline rehydration, before a bisphosphonate such as zoledronic acid. Denosumab is not first line.", "why": ["IV calcium would worsen hypercalcaemia.", "Magnesium is not the disturbance suspected here.", "Calcium supplements would worsen hypercalcaemia.", "", "Denosumab is reserved for special situations and comes after fluids and a bisphosphonate."], "refs": [["NHS Lanarkshire: management of malignant hypercalcaemia", "https://rightdecisions.scot.nhs.uk/media/11tdu4xg/management-of-malignant-hypercalcaemia.pdf"]], "note": "The stem gives no calcium value, so hypercalcaemia is inferred from the symptoms.", "src": "Linked sources", "id": 161}, {"group": "Medicine", "topic": "Endocrinology", "stem": "A 30-year-old woman has dizziness, vomiting and a syncopal episode after months of fatigue, anorexia and weakness. She had Graves' disease with thyroidectomy 4 years ago and takes levothyroxine. HR is 112, BP 78/44, GCS 14/15, and she looks cachectic. Bloods show potassium 6.1 and urea 11.6. What medication should be given first line for the most likely diagnosis?", "opts": ["Oral fludrocortisone", "Intravenous hydrocortisone", "Intravenous 0.9% NaCl", "Nebulised salbutamol", "Intravenous insulin"], "ans": 1, "exp": "Hypotension with hyperkalaemia and a background of autoimmune thyroid disease suggests an adrenal crisis. Give hydrocortisone 100 mg IV or IM immediately, along with IV 0.9% saline, and don't delay treatment for tests.", "why": ["Fludrocortisone is a long-term mineralocorticoid replacement and has no role in an emergency.", "", "Saline is part of the resuscitation, but the diagnosis is not treated without hydrocortisone.", "Salbutamol lowers potassium temporarily and doesn't treat the cause.", "Insulin and dextrose lower potassium but don't treat the cause, and may cause hypoglycaemia."], "refs": [["Society for Endocrinology: management of adrenal crisis", "https://www.endocrinology.org/media/3716/management-of-adrenal-crisis.pdf"]], "note": "The source gives hydrocortisone and IV saline together as the immediate treatment, so the key (hydrocortisone) and saline are both needed.", "src": "Linked sources", "id": 162}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 77-year-old woman has a day of increasing breathlessness and has been unable to lie flat for 3 months, with tighter shoes. She had an NSTEMI 5 years ago. She has an S3 and bilateral midzone crepitations. HR is 102, BP 155/95 and SpO2 95% on air. Which medication should be commenced?", "opts": ["Ramipril", "Digoxin", "Furosemide", "Bisoprolol", "Spironolactone"], "ans": 2, "exp": "This is an acute exacerbation of chronic heart failure with pulmonary congestion. An IV loop diuretic (furosemide) relieves fluid overload and symptoms. Prognostic drugs such as ACE inhibitors and beta-blockers are started or optimised afterwards.", "why": ["An ACE inhibitor is an important long-term prognostic drug but doesn't relieve acute congestion.", "Digoxin is for rate control in AF or symptomatic refractory failure and isn't the acute treatment.", "", "Beta-blockers are started once the patient is euvolaemic, not during acute decompensation.", "Spironolactone is added later in HFrEF and has a slow onset."], "refs": [["RCEM Learning: cardiogenic pulmonary oedema", "https://www.rcemlearning.co.uk/modules/cardiogenic-pulmonary-oedema/lessons/clinical-management/"]], "note": "The source notes evidence for diuretic benefit is limited, but it is standard for fluid overload.", "src": "Linked sources", "id": 163}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 55-year-old man with alcoholic cirrhosis presents with haematemesis. He is drowsy, HR 110, BP 72/50, with an episode of melaena. Hb is 6.5 g/dL. Fluids and vitamin K have been started. What is the next most important treatment?", "opts": ["Variceal banding", "Red cell concentrate", "Cefotaxime", "Propranolol", "Terlipressin"], "ans": 1, "exp": "He is shocked with a suspected variceal bleed and a very low Hb, so he needs blood. A restrictive transfusion trigger of Hb below 70 g/L is used, with a higher threshold for instability. Terlipressin, antibiotics and endoscopy follow.", "why": ["Banding is done at endoscopy once he is resuscitated.", "", "Antibiotic prophylaxis is recommended in suspected variceal bleeding but doesn't treat shock.", "Propranolol is for long-term prevention, not for an actively bleeding hypotensive patient.", "Terlipressin is given in suspected variceal bleeding but doesn't replace the lost red cells in an unstable patient."], "refs": [["PMC: management of acute upper GI bleeding", "https://pmc.ncbi.nlm.nih.gov/articles/PMC7307267"]], "note": "The source covers restrictive transfusion, terlipressin and antibiotics, and doesn't discuss band ligation.", "src": "Linked sources", "id": 164}, {"group": "Surgery", "topic": "Trauma", "stem": "An 80-year-old woman is 2 days after a dynamic hip screw for a neck of femur fracture. She is acutely short of breath with a respiratory rate of 28, saturations 96% on 5 L/min oxygen, pulse 120, blood pressure 110/70 and a normal chest examination. Which acid-base disturbance would you expect on her arterial blood gas?", "opts": ["Metabolic acidosis", "Respiratory acidosis", "Metabolic alkalosis", "Respiratory alkalosis", "Lactic acidosis"], "ans": 3, "exp": "The picture is a post-operative pulmonary embolism: sudden breathlessness, tachycardia and a clear chest. Hypoxia and breathlessness drive hyperventilation, so she blows off CO2, giving a low pCO2 and a respiratory alkalosis.", "why": ["There is no shock, renal failure or ketosis here to produce a primary metabolic acidosis.", "A raised pCO2 needs hypoventilation, and she is breathing fast (rate 28), which lowers pCO2.", "Metabolic alkalosis comes from vomiting, diuretics or hypokalaemia, none of which is described.", "", "Lactic acidosis needs established tissue hypoperfusion; her blood pressure is maintained."], "refs": [["MSD Manual: respiratory alkalosis", "https://www.msdmanuals.com/professional/nephrology/acid-base-regulation-and-disorders/respiratory-alkalosis"]], "note": "The source says hyperventilation is most often a response to hypoxia and that PE must be considered in a hyperventilating patient. It does not state that PE gives a respiratory alkalosis on ABG in so many words; that link is from your course explanation.", "src": "Linked sources", "id": 165}, {"group": "Surgery", "topic": "Trauma", "stem": "A 39-year-old woman develops sudden breathlessness, tachycardia and hypotension in recovery after a laparoscopy and is found to have a tension pneumothorax. Which of the following is NOT a feature of tension pneumothorax?", "opts": ["Tracheal deviation away from the affected side", "Increased expansion on the affected side", "Decreased breath sounds on the affected side", "Hyper-resonance on the affected side", "Distended neck veins"], "ans": 1, "exp": "In tension pneumothorax the affected hemithorax is hyper-expanded but moves poorly, so chest expansion is reduced or absent on that side, not increased.", "why": ["The mediastinum is pushed away from the side of the tension, so the trachea deviates away.", "", "Air in the pleural space reduces breath sounds on the affected side.", "Air gives a hyper-resonant percussion note.", "Raised intrathoracic pressure impairs venous return, so the neck veins distend."], "refs": [["GPnotebook: tension pneumothorax, clinical features", "https://gpnotebook.com/pages/general-information/pneumothoraxtension/clinical-features"]], "note": "The source confirms reduced or absent expansion, hyper-resonance, reduced breath sounds and tracheal deviation away; it does not mention neck veins, which are standard teaching.", "src": "Linked sources", "id": 166}, {"group": "Surgery", "topic": "Burns", "stem": "A 25-year-old, 70 kg man has hot cooking oil burns to half of his back and both legs. Using the Parkland formula and the Wallace rule of nines, how much crystalloid does he need in the first 8 hours from the time of the burn?", "opts": ["250 mL", "3,150 mL", "6,300 mL", "12,600 mL", "None, only burns above 15% need fluids"], "ans": 2, "exp": "Half the back is 9% and each leg is 18%, so the burn is 9 + 36 = 45%. Parkland: 4 mL x 70 kg x 45 = 12,600 mL over 24 hours, with half (6,300 mL) in the first 8 hours from the time of injury.", "why": ["This is far below the calculated requirement and has no basis in the formula.", "3,150 mL would be the amount for roughly 22-23% burns, or a quarter of the 24-hour volume, not half.", "", "12,600 mL is the whole 24-hour volume; only half is given in the first 8 hours.", "Adults with burns above about 15% of body surface area need formal fluid resuscitation, and this burn is much larger."], "refs": [["Mount Sinai EM: Parkland formula and burn assessment", "https://sinaiem.org/?p=2344"]], "note": "The source confirms the formula (4 mL x kg x %TBSA), half in the first 8 hours, and the rule-of-nines values. The 15% threshold comes from general burns teaching.", "src": "Linked sources", "id": 167}, {"group": "Surgery", "topic": "Neurosurgery", "stem": "A 31-year-old man is hit on the side of the head with a blunt object. His Glasgow Coma Scale falls from 12 to 8 during assessment, and CT shows a lens-shaped space-occupying lesion in the cranial vault. What is the diagnosis?", "opts": ["Extradural haematoma", "Subdural haematoma", "Subarachnoid haemorrhage", "Cerebral contusion", "Intracerebral haemorrhage"], "ans": 0, "exp": "A biconvex (lentiform) collection after a blow to the temporal region, with deterioration after the injury, is an extradural haematoma, usually from a torn middle meningeal artery.", "why": ["", "A subdural bleed spreads as a crescent over the brain surface rather than a lens shape.", "Subarachnoid blood lies in the sulci and cisterns and typically gives a thunderclap headache.", "A contusion appears as patchy areas of bruising within the brain tissue, not a lens-shaped collection.", "An intracerebral haemorrhage is blood within the brain substance and has a rounded or irregular shape."], "refs": [["Radiopaedia: extradural haematoma", "https://radiopaedia.org/articles/1309"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 168}, {"group": "Surgery", "topic": "Burns", "stem": "A man is admitted after a house fire with partial and full thickness burns to his arms, upper torso and neck. There is soot around his nostrils and oropharynx. What is the immediate priority?", "opts": ["Adequate analgesia", "Sterile water irrigation", "Intubation", "Fluid resuscitation", "Immediate transfer to a specialist burns centre"], "ans": 2, "exp": "Soot in the nose and mouth with neck burns means an inhalation injury, and the supraglottic airway can swell rapidly. Securing the airway early with a low threshold for intubation comes first, before it becomes impossible.", "why": ["Analgesia matters but does not protect the airway.", "Water irrigation is for chemical burns, which this is not.", "", "Fluids are needed, but airway comes before circulation in the ABCDE approach.", "Transfer follows stabilisation; a swelling airway cannot be left unsecured."], "refs": [["LITFL: inhalation injury", "https://litfl.com/inhalation-injury/"]], "note": "The source lists soot, singed nasal hair and carbonaceous sputum and advises a low threshold for intubation; the ABCDE ordering is from standard trauma teaching.", "src": "Linked sources", "id": 169}, {"group": "Surgery", "topic": "Hepatobiliary & Pancreas", "stem": "The severity of acute pancreatitis can be assessed with the Glasgow criteria. Which of the following is NOT used in the score?", "opts": ["Serum amylase", "White cell count", "Serum calcium", "Alanine aminotransferase", "Serum urea"], "ans": 0, "exp": "The Glasgow (Imrie) score uses PaO2, age, white cell count, calcium, urea, LDH/AST or ALT, albumin and glucose (the PANCREAS mnemonic). Amylase only helps diagnose pancreatitis and does not predict severity.", "why": ["", "A white cell count above 15 is one of the criteria.", "Calcium below 2 mmol/L scores a point.", "ALT (or AST) above 100 is one of the criteria in the version used in the UK.", "A raised urea (above 16 mmol/L) is one of the criteria."], "refs": [["fpnotebook: modified Glasgow criteria for pancreatitis", "https://mobile.fpnotebook.com/GI/Exam/MdfdGlsgwSvrtyCrtrFrPncrts.htm"]], "note": "The source lists PaO2, age, WBC, calcium, urea, glucose, albumin and LDH and does not include amylase. It lists LDH, where the UK version your course gives uses ALT/AST, so ALT is from your course explanation.", "src": "Linked sources", "id": 170}, {"group": "Surgery", "topic": "Upper GI", "stem": "A 45-year-old man presents in shock with sudden-onset generalised upper abdominal pain radiating to the right iliac fossa and the tip of the right shoulder. He vomited once. His abdomen is rigid and bowel sounds are absent. What is the diagnosis?", "opts": ["Caecal volvulus", "Pancreatitis", "Perforated duodenal ulcer", "Ascending cholangitis", "Appendicitis"], "ans": 2, "exp": "Sudden catastrophic epigastric pain, generalised peritonitis (rigid, silent abdomen), shock and shoulder-tip pain from diaphragmatic irritation fit a perforated duodenal ulcer. Gastric contents track down the right paracolic gutter, which explains the right iliac fossa pain.", "why": ["Volvulus presents with colicky pain, distension and absolute constipation, not a sudden rigid abdomen.", "Pancreatitis gives severe epigastric pain radiating to the back, with repeated vomiting, and the abdomen is usually less rigid.", "", "Cholangitis needs fever, jaundice and right upper quadrant pain (Charcot's triad).", "Appendicitis begins gradually with central pain moving to the right iliac fossa."], "refs": [["MSD Manual: acute perforation of the GI tract", "https://www.merckmanuals.com/professional/gastrointestinal-disorders/acute-abdomen-and-surgical-gastroenterology/acute-perforation-of-the-gastrointestinal-tract"]], "note": "The source confirms sudden catastrophic onset, shoulder radiation and free air under the diaphragm; the other differentials are standard teaching.", "src": "Linked sources", "id": 171}, {"group": "Surgery", "topic": "Colorectal", "stem": "A post-operative patient develops diarrhoea after starting antibiotics and C. difficile toxin is positive. Metronidazole is given for 10 days, and the antibiotics are stopped. A repeat toxin assay on a formed stool sample is still positive. What is the most appropriate next step?", "opts": ["No further action required", "Continue metronidazole for a further 10 days", "Start intravenous vancomycin", "Start oral vancomycin", "Urgent colonoscopy to exclude pseudomembranous colitis"], "ans": 0, "exp": "He has recovered (formed stool), so a repeat test is not needed. Toxin tests can remain positive for weeks after the infection has cleared, so repeat testing to prove cure is not recommended.", "why": ["", "Extending treatment is not indicated once the diarrhoea has resolved.", "IV vancomycin is not effective for C. difficile because it does not reach the colonic lumen.", "Oral vancomycin is for treating active infection, which he no longer has.", "Colonoscopy is for diagnostic uncertainty and carries risk; there are no signs of ongoing colitis."], "refs": [["CDC: C. difficile clinical guidance", "https://cdc.gov/c-diff/hcp/clinical-guidance/index.html"]], "note": "The CDC page says not to repeat testing to detect cure because tests may stay positive for six weeks or longer. This is a US source, not NICE; the logic is the same as UK teaching.", "src": "Linked sources", "id": 172}, {"group": "Surgery", "topic": "Urology", "stem": "Which segment of the male urethra is the narrowest?", "opts": ["Pre-prostatic", "Prostatic", "Membranous", "Bulbar", "Penile"], "ans": 2, "exp": "The membranous urethra, which passes through the external urethral sphincter in the deep perineal pouch, is the narrowest and least dilatable part. (The external meatus is the narrowest point of the whole urethral tract in some descriptions, but of these segments it is the membranous.)", "why": ["The pre-prostatic (intramural) segment is short and is surrounded by the bladder neck.", "The prostatic urethra is the widest and most dilatable part.", "", "The bulbar urethra is dilated within the bulb of the penis.", "The penile urethra is wider, with a further dilatation at the navicular fossa."], "refs": [["Kenhub: male urethra", "https://kenhub.com/en/library/anatomy/the-male-urethra"]], "note": "The source confirms the membranous urethra is the narrowest and least dilatable part. The statement about the prostatic urethra being widest is standard anatomy teaching and was not confirmed by the page.", "src": "Linked sources", "id": 173}, {"group": "Surgery", "topic": "Urology", "stem": "A 65-year-old man on furosemide for hypertension has a potassium of 2.7 mmol/L before TURP. All of the following are characteristic ECG changes of hypokalaemia EXCEPT:", "opts": ["Left bundle branch block", "Flattened T waves", "U waves", "ST segment depression", "Prolonged QT interval"], "ans": 0, "exp": "Hypokalaemia causes flat T waves, ST depression, prominent U waves and a long QT, and can lead to arrhythmias such as torsades de pointes. Left bundle branch block is not a feature.", "why": ["", "Flattened or inverted T waves are an early feature.", "Prominent U waves are characteristic.", "ST depression is a recognised change.", "A prolonged QT (really QU) interval is seen and predisposes to torsades de pointes."], "refs": [["GPnotebook: ECG changes in hypokalaemia", "https://gpnotebook.com/en-GB/pages/neurology/ecg-changes-in-hypokalemia"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 174}, {"group": "Surgery", "topic": "Vascular", "stem": "A patient is diagnosed with a popliteal aneurysm. Which other aneurysm are they more likely to have?", "opts": ["A berry aneurysm", "A femoral aneurysm", "An aortic aneurysm", "A carotid artery aneurysm", "None of the above"], "ans": 2, "exp": "Popliteal aneurysms are often bilateral and are associated with abdominal aortic aneurysm, so the aorta should be imaged when one is found.", "why": ["Berry aneurysms are intracranial and are linked to conditions such as polycystic kidney disease rather than to peripheral aneurysms.", "Femoral aneurysms can co-exist, but the association with the aorta is the stronger one.", "", "Carotid aneurysms are rare and not specifically linked to popliteal aneurysm.", "There is a recognised association, so this is wrong."], "refs": [["MSD Manual: peripheral arterial aneurysms", "https://msdmanuals.com/professional/cardiovascular-disorders/peripheral-arterial-disorders/peripheral-arterial-aneurysms"]], "note": "The source says popliteal aneurysms may accompany abdominal aortic aneurysms and that more than half are bilateral. It does not give the exact 40% figure or rank femoral against aortic.", "src": "Linked sources", "id": 175}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 25-year-old woman has a 1.5 cm palpable area of fat necrosis in the left breast, confirmed on core biopsy, after a traumatic injury 14 days ago. She has slight bruising and moderate tenderness. What is the most appropriate management?", "opts": ["Reassurance and discharge", "Follow-up ultrasound in 3 months", "Wide local excision", "Left mastectomy", "Follow-up ultrasound in 6 months"], "ans": 0, "exp": "Traumatic fat necrosis is benign and the diagnosis is already proven on biopsy, so she needs reassurance. These lesions usually need no treatment and often settle or leave a scar-like lump.", "why": ["", "Routine imaging follow-up adds nothing once a benign diagnosis is confirmed and the history fits.", "Excision is only considered if the lump grows or causes problems.", "Mastectomy is treatment for cancer, not for benign fat necrosis.", "Surveillance imaging is not needed for biopsy-proven fat necrosis after trauma."], "refs": [["American Cancer Society: fat necrosis and oil cysts", "https://www.cancer.org/cancer/types/breast-cancer/non-cancerous-breast-conditions/fat-necrosis-and-oil-cysts-in-the-breast.html"]], "note": "The source says that once the diagnosis is confident these lesions usually need no treatment. The explicit 'discharge' and the follow-up options come from your course explanation.", "src": "Linked sources", "id": 176}, {"group": "Surgery", "topic": "Colorectal", "stem": "An elderly man with chronic constipation has acute left iliac fossa pain and tenderness. He is febrile and slightly tachycardic, with marked tenderness and guarding in the left iliac fossa, and a raised white cell count. What is the most likely diagnosis?", "opts": ["Diverticular disease", "Diverticulitis", "Diverticulosis", "Perforated diverticulitis", "None of the above"], "ans": 1, "exp": "Left iliac fossa pain with fever and raised inflammatory markers in an older person is acute (sigmoid) diverticulitis, which is inflammation of one or more diverticula.", "why": ["Diverticular disease means symptomatic diverticula without acute inflammation, so there would be no fever or raised white cells.", "", "Diverticulosis means diverticula are present but silent, and would not cause an acutely tender, febrile abdomen.", "Perforation would give generalised peritonitis and a more unwell patient; here the signs are localised.", "A diagnosis fits the findings, so this is incorrect."], "refs": [["BJMP: diagnosis and management of diverticulitis", "https://bjmp.org/content/latest-diagnosis-and-management-diverticulitis"]], "note": "The source defines diverticulosis (and diverticular disease) as diverticula without inflammation and describes the typical LIF pain, fever and raised markers. It uses 'diverticular disease' like 'diverticulosis', whereas your course separates symptomatic disease; that split is from the course explanation.", "src": "Linked sources", "id": 177}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 23-year-old woman has 11 months of abdominal pain, bloating, diarrhoea, 10 kg weight loss and recurrent mouth ulcers. She has tender nodules on both shins and a small draining perianal lesion. What is most likely to be seen on biopsy of the colonic mucosa?", "opts": ["Villous atrophy", "Continuous inflammation", "Transmural inflammation", "Adenomatous dysplasia", "Neuroendocrine tumour cells"], "ans": 2, "exp": "Mouth ulcers, erythema nodosum and a perianal fistula point to Crohn's disease, which causes transmural inflammation that can lead to fistulas.", "why": ["Villous atrophy is the small bowel lesion of coeliac disease and does not explain a fistula.", "Continuous inflammation limited to the mucosa is characteristic of ulcerative colitis.", "", "Dysplasia is a long-term cancer risk in colitis, not the typical finding in this presentation.", "Neuroendocrine tumour cells would be expected in carcinoid, which causes flushing and diarrhoea rather than fistulas."], "refs": [["Ditki: Crohn's disease and ulcerative colitis", "https://ditki.com/course/pathology/glossary/term/inflammatory-bowel-disease-crohn-s-dis-ulcerative-colitis"]], "note": "The source confirms transmural inflammation and fistulas in Crohn's and continuous mucosal lesions in UC. The links to mouth ulcers and erythema nodosum come from your course explanation.", "src": "Linked sources", "id": 178}, {"group": "Surgery", "topic": "Neurology", "stem": "An 18-year-old man has 1 day of headache, neck stiffness and vomiting, with a temperature of 38.5 and no focal neurology. Blood glucose is 9 mmol/L. CSF shows protein 0.29 g/L (normal), glucose 6 mmol/L (about two thirds of serum), and a raised white cell count of 160 cells/uL that is predominantly lymphocytes. What is the most likely cause?", "opts": ["Group B coxsackievirus", "Neisseria meningitidis", "Streptococcus pneumoniae", "Haemophilus influenzae", "Cryptococcus neoformans"], "ans": 0, "exp": "A lymphocytic pleocytosis with normal protein and a normal CSF:serum glucose ratio is viral meningitis. Enteroviruses, including coxsackieviruses, are the commonest cause.", "why": ["", "Bacterial meningitis gives a neutrophilic pleocytosis, high protein and low glucose.", "Pneumococcus would also give a neutrophil-predominant CSF with low glucose and high protein.", "Haemophilus is bacterial and would give the same neutrophilic, low-glucose picture.", "Cryptococcus is a fungal infection of immunocompromised patients, usually with a more subacute course."], "refs": [["MSD Manual: viral meningitis", "https://www.msdmanuals.com/professional/neurologic-disorders/meningitis/viral-meningitis"]], "note": "The source confirms enteroviruses (including coxsackievirus) as the commonest cause and a lymphocytic pleocytosis with normal or slightly low glucose and only slightly raised protein. It notes these findings cannot rule out bacterial meningitis, so treat as bacterial if he is seriously ill.", "src": "Linked sources", "id": 179}, {"group": "Surgery", "topic": "Endocrinology", "stem": "A 30-year-old woman with a previous thyroidectomy for Graves' disease presents with dizziness, vomiting and syncope after months of fatigue, anorexia and weakness. Her BP is 78/44, HR 112 and she looks cachectic. Potassium is 6.1 and urea and creatinine are raised. Which medication is the first-line treatment for the most likely diagnosis?", "opts": ["Oral fludrocortisone", "Intravenous hydrocortisone", "Intravenous 0.9% sodium chloride", "Nebulised salbutamol", "Intravenous insulin"], "ans": 1, "exp": "This is an adrenal crisis (hypotension, hyperkalaemia, vomiting and weakness on a background of probable adrenal insufficiency). Treatment is immediate IV (or IM) hydrocortisone 100 mg, followed by rapid fluid resuscitation.", "why": ["Fludrocortisone is a long-term mineralocorticoid replacement and is not the emergency drug.", "", "Saline is needed urgently, but the guidance gives hydrocortisone first, as it treats the underlying cortisol deficiency.", "Salbutamol lowers potassium temporarily but does not treat the cause of the shock.", "Insulin with glucose treats severe hyperkalaemia, but correcting the cortisol deficiency and volume depletion should come first and usually corrects potassium."], "refs": [["Society for Endocrinology: adrenal crisis", "https://endocrinology.org/adrenal-crisis"]], "note": "The explanation slide for this question was blank in your PDF, so the key (IV hydrocortisone) is from the guidance rather than your course. The guidance does not mention fludrocortisone, and its comments on salbutamol and insulin are standard teaching.", "src": "Linked sources", "id": 180}, {"group": "Surgery", "topic": "Hernias", "stem": "A thin 82-year-old multiparous woman has small bowel obstruction and pain in the medial thigh that spreads to the knee, worse on extending and medially rotating the hip (Howship-Romberg sign). What is the most likely cause?", "opts": ["Femoral hernia", "Obturator hernia", "Direct inguinal hernia", "Spigelian hernia", "Richter's hernia"], "ans": 1, "exp": "Howship-Romberg sign is pain along the inner thigh from obturator nerve compression, and it points to an obturator hernia, which is seen most often in elderly, thin, multiparous women.", "why": ["A femoral hernia is a lump below and lateral to the pubic tubercle and does not cause obturator nerve pain.", "", "A direct inguinal hernia bulges through Hesselbach's triangle and gives a groin lump.", "A Spigelian hernia lies in the anterior abdominal wall at the lateral border of rectus, not the thigh.", "Richter's hernia describes what part of the bowel is trapped and does not cause thigh pain."], "refs": [["LITFL: Howship-Romberg sign", "https://litfl.com/howship-romberg-sign/"]], "note": "The source confirms the link with obturator nerve compression and elderly, thin, multiparous women. The bowel obstruction in the stem is from your course.", "src": "Linked sources", "id": 181}, {"group": "Surgery", "topic": "Hernias", "stem": "Which hernia occurs at the lateral border of the rectus abdominis along the linea semilunaris?", "opts": ["Direct inguinal hernia", "Femoral hernia", "Spigelian hernia", "Obturator hernia", "Hiatus hernia"], "ans": 2, "exp": "A Spigelian hernia protrudes through the Spigelian fascia, lateral to rectus abdominis along the linea semilunaris, usually at or below the arcuate line.", "why": ["Direct inguinal hernias occur through Hesselbach's triangle in the groin.", "Femoral hernias pass below the inguinal ligament through the femoral canal.", "", "Obturator hernias pass through the obturator canal in the pelvis.", "A hiatus hernia is herniation of the stomach through the diaphragm."], "refs": [["StatPearls: Spigelian hernia", "https://statpearls.com/point-of-care/29301"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 182}, {"group": "Surgery", "topic": "Hernias", "stem": "In which hernia does only part of the circumference of the bowel wall become trapped, so that obstruction may not occur despite strangulation?", "opts": ["Maydl's hernia", "Richter's hernia", "Incarcerated femoral hernia", "Sliding hernia", "Spigelian hernia"], "ans": 1, "exp": "In Richter's hernia only the antimesenteric wall of the bowel herniates, so the lumen stays open and obstruction can be absent while the trapped wall can still become gangrenous.", "why": ["In Maydl's hernia two loops of bowel lie within the hernia sac (a W-shaped loop).", "", "Femoral hernias can strangulate but the term does not describe partial-wall involvement.", "A sliding hernia contains a retroperitoneal organ forming part of the sac wall.", "Spigelian refers to the site, not to how much bowel is trapped."], "refs": [["Radiopaedia: Richter's hernia", "https://images.radiopaedia.org/articles/richters-hernia?lang=us"]], "note": "The source confirms partial-wall herniation and the risk of gangrene. The descriptions of Maydl's and sliding hernias are standard teaching and were not checked.", "src": "Linked sources", "id": 183}, {"group": "Surgery", "topic": "Hepatobiliary & Pancreas", "stem": "Which tumour marker is most associated with pancreatic and biliary tract cancer?", "opts": ["CA 125", "CA 19-9", "Alpha-fetoprotein", "Carcinoembryonic antigen", "Beta-hCG"], "ans": 1, "exp": "CA 19-9 is the tumour marker linked with pancreatic and biliary tract cancers, used mainly for monitoring rather than screening.", "why": ["CA 125 is associated with ovarian cancer.", "", "AFP is associated with hepatocellular carcinoma and non-seminomatous germ cell tumours.", "CEA is associated with colorectal cancer.", "Beta-hCG is associated with germ cell tumours and trophoblastic disease."], "refs": [["Patient.info (Professional): tumour markers", "https://patient.info/doctor/oncology/tumour-markers"]], "note": "The source confirms each pairing. The 'monitoring rather than screening' comment is general teaching.", "src": "Linked sources", "id": 184}, {"group": "Surgery", "topic": "Hepatobiliary & Pancreas", "stem": "A cirrhotic patient has a new liver lesion on ultrasound. Which serum tumour marker is most useful to support a diagnosis of hepatocellular carcinoma?", "opts": ["CA 19-9", "CA 125", "Alpha-fetoprotein", "CEA", "CA 15-3"], "ans": 2, "exp": "Alpha-fetoprotein is the marker associated with hepatocellular carcinoma (and non-seminomatous germ cell tumours).", "why": ["CA 19-9 relates to pancreatic and biliary cancers.", "CA 125 relates to ovarian cancer.", "", "CEA relates to colorectal cancer.", "CA 15-3 is used in monitoring breast cancer."], "refs": [["Patient.info (Professional): tumour markers", "https://patient.info/doctor/oncology/tumour-markers"]], "note": "The source confirms the AFP pairing and that CA 15-3 is used for breast cancer monitoring. The cirrhosis setting is from your question stem.", "src": "Linked sources", "id": 185}, {"group": "Surgery", "topic": "Colorectal", "stem": "Which tumour marker is most associated with colorectal cancer and is used to monitor for recurrence?", "opts": ["Carcinoembryonic antigen", "CA 125", "CA 19-9", "Alpha-fetoprotein", "PSA"], "ans": 0, "exp": "CEA is associated with colorectal cancer and is used to monitor treatment response and recurrence rather than to diagnose it.", "why": ["", "CA 125 is associated with ovarian cancer.", "CA 19-9 is associated with pancreatic and biliary cancers.", "AFP is associated with hepatocellular carcinoma and germ cell tumours.", "PSA is associated with prostate cancer."], "refs": [["Patient.info (Professional): tumour markers", "https://patient.info/doctor/oncology/tumour-markers"]], "note": "The source confirms CEA is the colorectal marker. The monitoring role is general teaching.", "src": "Linked sources", "id": 186}, {"group": "Surgery", "topic": "Urology", "stem": "A 40-year-old man has a soft, non-tender swelling around the testicle that you can transilluminate. What is the most likely diagnosis?", "opts": ["Hydrocele", "Testicular cancer", "Varicocele", "Inguinal hernia", "Epididymo-orchitis"], "ans": 0, "exp": "A soft, fluctuant, non-tender scrotal swelling that transilluminates is a hydrocele.", "why": ["", "Testicular cancer is a firm, non-tender mass that does not transilluminate.", "A varicocele feels like a bag of worms and becomes more prominent on standing.", "An inguinal hernia does not transilluminate and the examiner cannot get above it.", "Epididymo-orchitis is hot and tender and gives pain with fever."], "refs": [["GPnotebook: scrotal lump, clinical features", "https://gpnotebook.com/en-IE/pages/general-practice/lump-scrotal/clinical-features"]], "note": "The source confirms hydrocele transilluminates and cancer is firm and does not transilluminate. It does not cover the inguinal-hernia or epididymo-orchitis points, which are standard teaching.", "src": "Linked sources", "id": 187}, {"group": "Surgery", "topic": "Urology", "stem": "A young man has a mildly tender, soft, irregular lump separate from the testis that feels like a bag of worms and becomes more prominent on standing. What is the diagnosis?", "opts": ["Hydrocele", "Epididymal cyst", "Varicocele", "Testicular cancer", "Inguinal hernia"], "ans": 2, "exp": "A varicocele is a dilated pampiniform venous plexus that feels like a bag of worms, becomes evident on standing and settles when lying down.", "why": ["A hydrocele is fluctuant and transilluminates.", "An epididymal cyst is a smooth, soft, fluctuant lump at the epididymis and transilluminates.", "", "Testicular cancer is a firm, non-tender mass within the testis.", "A hernia would have a cough impulse and extend into the inguinal canal."], "refs": [["GPnotebook: scrotal lump, clinical features", "https://gpnotebook.com/en-IE/pages/general-practice/lump-scrotal/clinical-features"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 188}, {"group": "Surgery", "topic": "Urology", "stem": "Which of the following is a recognised occupational risk factor for bladder cancer?", "opts": ["Aromatic amine exposure in dye manufacture", "Asbestos exposure", "Silica exposure", "Wood dust exposure", "Vinyl chloride exposure"], "ans": 0, "exp": "Aromatic amines such as benzidine and beta-naphthylamine, used in dye manufacturing, cause bladder cancer. Smoking is the biggest overall risk factor.", "why": ["", "Asbestos is linked to mesothelioma and lung cancer.", "Silica is linked to silicosis and lung cancer.", "Wood dust is linked to nasal adenocarcinoma.", "Vinyl chloride is linked to hepatic angiosarcoma."], "refs": [["American Cancer Society: bladder cancer risk factors", "https://www.cancer.org/cancer/bladder-cancer/causes-risks-prevention/risk-factors.html"]], "note": "The source confirms aromatic amines and smoking. The other exposure-cancer pairings are standard teaching and were not checked on this page.", "src": "Linked sources", "id": 189}, {"group": "Surgery", "topic": "Urology", "stem": "A 45-year-old man from the Nile delta has painless haematuria. Past infection with which organism most increases his risk of squamous cell carcinoma of the bladder?", "opts": ["Schistosoma haematobium", "Escherichia coli", "Helicobacter pylori", "Human papillomavirus", "Chlamydia trachomatis"], "ans": 0, "exp": "Chronic Schistosoma haematobium infection of the bladder is a risk factor for bladder cancer, particularly squamous cell carcinoma, in endemic regions such as Africa and the Middle East.", "why": ["", "E. coli causes UTIs but is not a recognised cause of squamous bladder cancer.", "H. pylori is linked to gastric cancer.", "HPV is linked to cervical and anogenital cancers.", "Chlamydia causes urethritis and PID, not bladder cancer."], "refs": [["American Cancer Society: bladder cancer risk factors", "https://www.cancer.org/cancer/bladder-cancer/causes-risks-prevention/risk-factors.html"]], "note": "The source ties schistosomiasis to squamous cell bladder cancer in areas where it is common. It names the parasite but not the species; S. haematobium is the urinary species in standard teaching.", "src": "Linked sources", "id": 190}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 50-year-old woman has numbness and tingling in the thumb, index and middle fingers, worse at night and eased by shaking the hand. What is the most likely diagnosis?", "opts": ["Carpal tunnel syndrome", "Cervical radiculopathy (C8)", "Cubital tunnel syndrome", "De Quervain's tenosynovitis", "Raynaud's phenomenon"], "ans": 0, "exp": "Night-time paraesthesia in the thumb, index, middle and ring fingers (median nerve) relieved by shaking the hand is classic for carpal tunnel syndrome.", "why": ["", "C8 radiculopathy affects the little and ring fingers and is usually linked to neck movement, not hand shaking.", "Cubital tunnel (ulnar nerve) affects the little finger and the ulnar half of the ring finger.", "De Quervain's causes pain at the radial wrist, not finger paraesthesia.", "Raynaud's gives colour changes in the fingers on cold exposure, not nocturnal median-nerve symptoms."], "refs": [["Pulse Reference: carpal tunnel syndrome", "https://pulsereference.com/diagnoses/carpal-tunnel-syndrome/"]], "note": "The source lists the thumb, index, middle and ring fingers and night symptoms relieved by shaking. The comparison conditions are standard teaching.", "src": "Linked sources", "id": 191}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "Which investigation can confirm the diagnosis of carpal tunnel syndrome and assess its severity?", "opts": ["Nerve conduction studies", "Plain X-ray of the wrist", "Ultrasound of the carpal tunnel only", "Serum CK", "Bone scan"], "ans": 0, "exp": "Carpal tunnel syndrome is mainly a clinical diagnosis, and nerve conduction studies confirm it and assess severity. Thenar wasting suggests severe compression.", "why": ["", "An X-ray shows bone and does not show median nerve compression.", "Ultrasound can support the diagnosis, but nerve conduction studies are the confirmatory test named in the source.", "CK is a muscle enzyme and is not used here.", "A bone scan looks for bone pathology and has no role in diagnosing this."], "refs": [["Pulse Reference: carpal tunnel syndrome", "https://pulsereference.com/diagnoses/carpal-tunnel-syndrome/"]], "note": "The source confirms nerve conduction studies; it does not discuss ultrasound or the other options, so those reasons are standard teaching.", "src": "Linked sources", "id": 192}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 45-year-old footballer felt a pop and had knee pain and swelling after twisting. Since then the knee has episodes of locking. What is the most likely diagnosis?", "opts": ["Meniscal tear", "Anterior cruciate ligament rupture alone", "Patellar tendinopathy", "Osgood-Schlatter disease", "Baker's cyst rupture"], "ans": 0, "exp": "A twisting injury with a pop, delayed swelling (over 2 to 3 days) and later catching or locking suggests a meniscal tear. McMurray's test supports it and MRI is the preferred imaging.", "why": ["", "An ACL rupture gives a pop with rapid swelling (haemarthrosis) and giving way, rather than mechanical locking.", "Patellar tendinopathy is an overuse pain below the patella without a pop or locking.", "Osgood-Schlatter occurs in adolescents with pain at the tibial tuberosity.", "A ruptured Baker's cyst causes calf pain and swelling and does not explain locking."], "refs": [["OrthoInfo (AAOS): meniscus tears", "https://www.orthoinfo.org/diseases--conditions/meniscus-tears/"]], "note": "The source confirms the pop, delayed swelling, locking, McMurray's test and MRI. The contrast with ACL rupture is standard teaching.", "src": "Linked sources", "id": 193}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 55-year-old woman has gradual lateral hip pain that aches down the outer thigh and is worse when lying on that side and after activity. There is tenderness over the greater trochanter. What is the most likely diagnosis?", "opts": ["Greater trochanteric pain syndrome (trochanteric bursitis)", "Fractured neck of femur", "Meralgia paraesthetica", "Osteoarthritis of the hip with groin pain", "Lumbar spinal stenosis"], "ans": 0, "exp": "Lateral hip pain with tenderness over the greater trochanter, worse lying on the affected side, is greater trochanteric pain syndrome. It is commoner in women aged 40 to 60.", "why": ["", "A hip fracture follows trauma with inability to bear weight, a shortened and externally rotated leg.", "Meralgia paraesthetica is burning or numbness without tenderness over the trochanter.", "Hip osteoarthritis typically causes groin pain, with reduced internal rotation.", "Spinal stenosis causes leg pain on walking that eases on sitting or bending forward."], "refs": [["NHS Borders RightDecisions: greater trochanteric pain syndrome", "https://rightdecisions.scot.nhs.uk/borders-ref-help-toolkit/orthopaedic/hip/greater-trochanteric-pain-syndrome-gtps"]], "note": "The source says pain spreads across the hip, thigh and buttock and is worse on lying on the side, more common in women aged 40-60. It does not say 'down the outer thigh' specifically.", "src": "Linked sources", "id": 194}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 40-year-old man has disproportionate pain and a tense, swollen leg shortly after a tibial shaft fracture. Which sign is the most sensitive for the diagnosis?", "opts": ["Pain on passive stretch of the muscles", "Absent distal pulses", "Pallor of the limb", "Complete paralysis", "Crepitus over the fracture"], "ans": 0, "exp": "Pain out of proportion to the injury, and pain on passive stretching of the muscles in the compartment, are the earliest and most sensitive signs of acute compartment syndrome.", "why": ["", "Absent pulses are a late sign, and palpable pulses do not exclude compartment syndrome.", "Pallor is a late finding.", "Paralysis is a late sign of established muscle and nerve damage.", "Crepitus indicates a fracture but not compartment syndrome."], "refs": [["LITFL: compartment syndrome", "https://litfl.com/compartment-syndrome/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 195}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "In a patient with suspected compartment syndrome after a tibial fracture who is drowsy and cannot report pain, how can the diagnosis be confirmed?", "opts": ["Measuring compartment pressure", "Plain X-ray of the leg", "Serum D-dimer", "Doppler of the arteries only", "Bone scan"], "ans": 0, "exp": "Compartment syndrome is mainly clinical, but compartment pressure measurement confirms it, especially when the patient cannot be examined reliably. Urgent surgical referral for fasciotomy follows.", "why": ["", "X-ray shows the fracture but cannot diagnose compartment syndrome.", "D-dimer is a clot screening test and is not relevant.", "Pulses and Doppler flow are often preserved, so they do not exclude it.", "A bone scan has no role in an acute limb emergency."], "refs": [["LITFL: compartment syndrome", "https://litfl.com/compartment-syndrome/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 196}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 27-year-old new mother has pain at the radial side of the wrist near the base of the thumb, worse on lifting her baby. What is the most likely diagnosis?", "opts": ["De Quervain's tenosynovitis", "Carpal tunnel syndrome", "Dupuytren's contracture", "Scaphoid fracture", "Trigger finger"], "ans": 0, "exp": "Radial-sided wrist pain in a mother of a newborn, from repeatedly lifting with the thumb abducted, is de Quervain's tenosynovitis. It affects the abductor pollicis longus and extensor pollicis brevis tendons, and Finkelstein's test is positive.", "why": ["", "Carpal tunnel causes median-nerve paraesthesia, not pain at the radial styloid.", "Dupuytren's contracture is a palmar fibrosis that bends the ring and little fingers.", "A scaphoid fracture follows a fall on the outstretched hand with snuffbox tenderness.", "Trigger finger causes catching of a finger flexor tendon at the A1 pulley."], "refs": [["Physiopedia: de Quervain's tenosynovitis", "https://www.physio-pedia.com/De_Quervains_Tenosynovitis"]], "note": "The source confirms mothers of newborns, radial wrist pain and the two tendons. The comparison conditions are standard teaching.", "src": "Linked sources", "id": 197}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 60-year-old with knee osteoarthritis develops a swelling in the popliteal fossa that feels firm in full extension and softer when the knee is flexed. What is the most likely diagnosis, and which investigation is usually used first?", "opts": ["Baker's cyst; ultrasound", "Popliteal aneurysm; ultrasound", "Deep vein thrombosis; D-dimer only", "Lipoma; MRI", "Meniscal cyst; arthroscopy"], "ans": 0, "exp": "A popliteal swelling that is firmer in extension and softer in flexion (Foucher's sign) is a Baker's cyst, usually linked to intra-articular disease such as osteoarthritis or a meniscal tear. Ultrasound has largely replaced arthrography as the first test.", "why": ["", "A popliteal aneurysm is pulsatile and its feel does not change with knee position.", "DVT causes a swollen, tender calf, and D-dimer alone would not identify a cyst.", "A lipoma is soft and unaffected by knee position.", "A meniscal cyst lies at the joint line and ultrasound is not replaced by arthroscopy as the first test."], "refs": [["PMC: popliteal (Baker's) cyst", "https://pmc.ncbi.nlm.nih.gov/articles/PMC4481672"]], "note": "The source describes Foucher's sign (firm in extension, soft in flexion), the association with intra-articular disease and ultrasound as first-line. It says aneurysms are unaffected by knee position, but the clinical feature list for the other options is general teaching.", "src": "Linked sources", "id": 198}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 70-year-old has low back pain with buttock and leg pain and weakness on walking, which improves when he sits or leans forward. What is the most likely diagnosis?", "opts": ["Lumbar spinal stenosis", "Peripheral arterial disease", "Cauda equina syndrome", "Sciatica from a disc prolapse", "Trochanteric bursitis"], "ans": 0, "exp": "Pain and weakness on walking that is relieved by sitting or flexing the spine is neurogenic claudication from lumbar spinal stenosis. Standing still does not relieve it, but flexion does.", "why": ["", "Vascular claudication is relieved by standing still, not by sitting or leaning forward, and pulses are reduced.", "Cauda equina syndrome presents with saddle anaesthesia and bladder or bowel dysfunction.", "A disc prolapse typically causes unilateral sciatica aggravated by sitting.", "Trochanteric bursitis gives lateral hip tenderness, not neurogenic leg symptoms on walking."], "refs": [["MSD Manual: lumbar spinal stenosis", "https://www.msdmanuals.com/professional/musculoskeletal-and-connective-tissue-disorders/neck-and-back-pain/lumbar-spinal-stenosis"]], "note": "The source confirms neurogenic claudication relieved by sitting or flexion and that imaging (MRI or CT) confirms the diagnosis. The comparison with vascular claudication is standard teaching.", "src": "Linked sources", "id": 199}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 68-year-old has new back pain, saddle anaesthesia and urinary incontinence. What is the most likely diagnosis?", "opts": ["Cauda equina syndrome", "Lumbar spinal stenosis", "Mechanical back pain", "Osteoporotic vertebral fracture", "Ankylosing spondylitis"], "ans": 0, "exp": "Saddle anaesthesia with bladder or bowel dysfunction and back pain is cauda equina syndrome, a surgical emergency.", "why": ["", "Spinal stenosis gives pain on walking relieved by sitting, usually without saddle anaesthesia.", "Mechanical back pain does not cause sphincter dysfunction or saddle numbness.", "A vertebral fracture can cause pain but not typically saddle sensory loss with incontinence.", "Ankylosing spondylitis causes morning stiffness in younger patients."], "refs": [["BAUS: cauda equina syndrome", "https://www.baus.org.uk/trainees/cauda_equina_syndrome.aspx"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 200}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A patient with back pain, bilateral sciatica, saddle anaesthesia and urinary retention is suspected of cauda equina syndrome. What is the investigation of choice and how quickly should it be done?", "opts": ["Emergency MRI of the lumbar spine, ideally within 4 hours", "Plain lumbar spine X-ray, then review next week", "Blood tests first, then MRI the next day", "Nerve conduction studies within a week", "Bone scan within 48 hours"], "ans": 0, "exp": "Emergency MRI is the test of choice and should not be delayed for blood tests. Decompression is ideally within 24 hours and no later than 48 hours.", "why": ["", "X-ray cannot show neural compression and a week's delay would risk permanent damage.", "The source explicitly says not to delay imaging for blood tests.", "Nerve conduction studies do not identify an acute compressive lesion.", "A bone scan does not show neural compression and is too slow."], "refs": [["BAUS: cauda equina syndrome", "https://www.baus.org.uk/trainees/cauda_equina_syndrome.aspx"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 201}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 70-year-old has a painless, well-circumscribed 3 cm lump on the dorsum of the wrist that transilluminates. What is the most likely diagnosis?", "opts": ["Ganglion cyst", "Lipoma", "Giant cell tumour of tendon sheath", "Rheumatoid nodule", "Osteosarcoma"], "ans": 0, "exp": "A smooth, fluctuant, transilluminating lump on the back of the wrist is a ganglion cyst, most often arising from the scapholunate ligament or dorsal capsule. On ultrasound it is anechoic or hypoechoic with smooth walls.", "why": ["", "A lipoma is soft and does not transilluminate.", "A giant cell tumour is solid and does not transilluminate.", "Rheumatoid nodules are firm and occur over extensor surfaces in rheumatoid arthritis.", "Osteosarcoma is a bony tumour in adolescents and does not transilluminate."], "refs": [["Radiopaedia: ganglion cysts of the hand and wrist", "https://radiopaedia.org/articles/ganglion-cysts-of-the-hand-and-wrist"]], "note": "The source confirms the dorsal wrist site (scapholunate origin) and ultrasound appearance. It does not mention transillumination, which is from your course.", "src": "Linked sources", "id": 202}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 14-year-old athlete has a painful, tender lump at the tibial tuberosity that is worse with running and eases with rest. What is the most likely diagnosis?", "opts": ["Osgood-Schlatter disease", "Osteosarcoma", "Septic arthritis", "Slipped upper femoral epiphysis", "Patellar dislocation"], "ans": 0, "exp": "Anterior knee pain with a tender prominence at the tibial tuberosity, worse with activity, in a growing adolescent athlete is Osgood-Schlatter disease. It is self-limiting and treated with rest from aggravating activity, with NSAIDs and ice for symptoms.", "why": ["", "Osteosarcoma gives persistent bone pain that is worse at night and is usually around the knee metaphysis.", "Septic arthritis gives a hot, swollen, very painful joint with fever.", "SUFE causes hip or knee pain with a limp and external rotation of the leg.", "Patellar dislocation follows a twisting injury with a visibly displaced patella."], "refs": [["WikEM: Osgood-Schlatter disease", "https://wikem.org/wiki/Osgood-Schlatter_disease"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 203}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 22-year-old woman has persistent localised pain in the distal femur that wakes her at night. What is the most likely diagnosis?", "opts": ["Osteosarcoma", "Osgood-Schlatter disease", "Stress fracture of the tibia", "Septic arthritis", "Growing pains"], "ans": 0, "exp": "Persistent bone pain around the knee that is worse at night, with a mass or swelling, suggests osteosarcoma. The distal femur is the commonest site.", "why": ["", "Osgood-Schlatter involves the tibial tuberosity and eases with rest.", "A stress fracture follows repetitive loading and the pain eases with rest.", "Septic arthritis causes a hot, swollen joint with fever, not isolated metaphyseal pain.", "Growing pains are bilateral, nocturnal, and are not localised to one bone with persistent pain."], "refs": [["WikEM: osteosarcoma", "https://wikem.org/wiki/Osteosarcoma"]], "note": "The source says bone pain for months, worse with activity and at night, and the distal femur is the commonest site. 'Growing pains' is not covered.", "src": "Linked sources", "id": 204}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "For a suspected osteosarcoma, what is the first investigation, and which finding may be seen?", "opts": ["Plain X-ray; sunburst periosteal reaction", "Bone scan; hot joint", "CT head; lytic lesion", "Ultrasound; anechoic mass", "Blood culture; bacteraemia"], "ans": 0, "exp": "A plain X-ray is the first imaging, and may show a lytic or sclerotic metaphyseal lesion with periosteal reaction (sunburst pattern, Codman triangle). MRI and biopsy confirm the diagnosis.", "why": ["", "A bone scan is not first-line and 'hot joint' is not the described finding.", "CT of the head is irrelevant to a limb lesion.", "Ultrasound does not assess bone tumours well.", "Blood cultures are for infection, not a bone tumour."], "refs": [["WikEM: osteosarcoma", "https://wikem.org/wiki/Osteosarcoma"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 205}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 70-year-old woman falls and cannot weight-bear. Her right leg is shortened and externally rotated. What is the most likely diagnosis?", "opts": ["Fractured neck of femur", "Anterior hip dislocation", "Pubic ramus fracture", "Femoral shaft fracture", "Trochanteric bursitis"], "ans": 0, "exp": "A shortened, externally rotated leg after a fall in an older woman is a fractured neck of femur. The rotation reflects the femoral shaft moving independently of the hip, with the iliopsoas and gravity turning the limb outward.", "why": ["", "An anterior dislocation usually follows high-energy trauma, and the limb is abducted and externally rotated, not typically shortened.", "A pubic ramus fracture usually allows the leg to look normal and gives groin pain.", "A femoral shaft fracture gives a deformed, swollen thigh and needs high energy in most patients.", "Bursitis does not cause shortening or inability to weight-bear after a fall."], "refs": [["GPnotebook: femoral neck fracture, clinical features", "https://gpnotebook.com/pages/orthopaedics/femoral-neck-fracture/clinical-features"]], "note": "The source confirms shortened and externally rotated. The dislocation and pubic ramus comparisons are standard teaching. The original question said abducted, which the source doesn't mention, so it is left out here.", "src": "Linked sources", "id": 206}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 21-year-old student has a warm, fluctuant swelling over the back of the elbow. What is the most appropriate step to differentiate septic from non-septic causes?", "opts": ["Aspirate the bursa and send fluid for Gram stain and culture", "Immediate surgical excision", "MRI of the elbow", "Oral steroids", "Plain X-ray only"], "ans": 0, "exp": "This is olecranon bursitis. When history and examination cannot separate septic from non-septic bursitis, aspiration helps: purulent fluid suggests sepsis, and the sample is sent for Gram stain, culture and microscopy.", "why": ["", "Excision is reserved for chronic or recurrent cases and not for the initial diagnostic step.", "MRI is not needed for a superficial bursa.", "Steroids should not be given while infection is possible.", "An X-ray may show a fracture or foreign body but will not distinguish septic from aseptic bursitis."], "refs": [["GPnotebook: aspiration of olecranon bursitis", "https://gpnotebook.com/pages/musculoskeletal-medicine/aspiration-of-olecranon-bursitis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 207}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 60-year-old man has burning and numbness over the anterolateral thigh that is worse on standing and walking and eased by lying with the hip flexed. What is the most likely diagnosis?", "opts": ["Meralgia paraesthetica", "Femoral nerve palsy", "L5 radiculopathy", "Greater trochanteric pain syndrome", "Obturator neuropathy"], "ans": 0, "exp": "Burning or numbness over the anterolateral thigh is meralgia paraesthetica, entrapment of the lateral cutaneous nerve of the thigh. It is associated with obesity, tight clothing, belts, pregnancy and diabetes.", "why": ["", "Femoral nerve palsy causes quadriceps weakness and loss of knee jerk, plus medial sensory loss.", "L5 radiculopathy gives pain in the lower leg and weak dorsiflexion.", "GTPS causes tenderness over the trochanter rather than sensory symptoms.", "Obturator neuropathy causes medial thigh sensory loss and adductor weakness."], "refs": [["GPnotebook: meralgia paraesthetica", "https://gpnotebook.com/en-IE/pages/musculoskeletal-medicine/meralgia-paraesthetica"]], "note": "The source confirms the nerve, the burning anterolateral distribution and the risk factors. The other nerve territories are standard anatomy teaching.", "src": "Linked sources", "id": 208}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 30-year-old man has respiratory distress, a petechial rash and confusion 48 hours after a fractured femoral shaft. What is the most likely diagnosis?", "opts": ["Fat embolism syndrome", "Pulmonary embolism", "Septic shock", "Acute respiratory distress from aspiration", "Meningococcal septicaemia"], "ans": 0, "exp": "Respiratory compromise, neurological change and a petechial rash (conjunctivae, anterior chest, axillae) typically develop 24 to 72 hours after a long bone or pelvic fracture, which is fat embolism syndrome.", "why": ["", "PE causes sudden breathlessness and pleuritic pain but not a petechial rash with confusion.", "Sepsis would show fever and a source, and there is none given.", "Aspiration has no link to the fracture and does not cause a petechial rash.", "Meningococcal disease causes fever, a non-blanching rash and meningism, with no long-bone injury trigger."], "refs": [["LITFL: fat embolism syndrome", "https://litfl.com/fat-embolism-syndrome/"]], "note": "The source confirms the classic triad and the 24-72 hour timing. The comparison diagnoses are standard teaching.", "src": "Linked sources", "id": 209}, {"group": "Surgery", "topic": "ENT", "stem": "A 4-year-old boy has a midline neck lump that moves upwards when he sticks out his tongue. What is the most likely diagnosis?", "opts": ["Thyroglossal duct cyst", "Branchial cyst", "Cystic hygroma", "Reactive lymph node", "Dermoid cyst of the thyroid"], "ans": 0, "exp": "A painless, rounded midline anterior neck swelling that rises on tongue protrusion and swallowing is a thyroglossal duct cyst. About 90% present before the age of 10.", "why": ["", "A branchial cyst lies laterally, in front of the sternocleidomastoid, and does not move with the tongue.", "A cystic hygroma is a soft, transilluminating swelling in the posterior triangle, usually in infancy.", "A reactive node is usually lateral, tender and follows an infection.", "A thyroid lump moves with swallowing but not with tongue protrusion, and the stem describes a duct remnant."], "refs": [["Radiopaedia: thyroglossal duct cyst", "https://radiopaedia.org/articles/thyroglossal-duct-cyst?lang=gb"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 210}, {"group": "Surgery", "topic": "ENT", "stem": "A 19-year-old has a round, soft, non-tender swelling in front of the upper sternocleidomastoid, which enlarged during a recent cold. It does not move on swallowing and there are no other lumps. What is the most likely diagnosis?", "opts": ["Branchial cyst", "Thyroglossal cyst", "Lymphoma", "Cystic hygroma", "Lipoma"], "ans": 0, "exp": "A smooth, fluctuant swelling in front of the anterior border of the sternocleidomastoid in a young adult, which may enlarge during an upper respiratory infection, is a branchial cyst.", "why": ["", "A thyroglossal cyst is in the midline and moves with swallowing and tongue protrusion.", "Lymphoma gives firm, rubbery, usually multiple nodes.", "A cystic hygroma is in the posterior triangle and presents in infancy.", "A lipoma is solid, usually over the neck or back, and does not enlarge with infections."], "refs": [["GPnotebook: branchial cyst", "https://gpnotebook.com/pages/musculoskeletal-medicine/branchial-cyst"]], "note": "The source says anterior to the sternomastoid, young adults, may enlarge during an upper respiratory infection and does not move on swallowing. It does not mention the angle of the mandible.", "src": "Linked sources", "id": 211}, {"group": "Surgery", "topic": "ENT", "stem": "A neonate has a large, soft left-sided posterior triangle neck lump that transilluminates with a pen torch. What is the most likely diagnosis?", "opts": ["Cystic hygroma", "Branchial cyst", "Thyroglossal cyst", "Lymphadenopathy", "Sternocleidomastoid tumour"], "ans": 0, "exp": "A compressible, transilluminating swelling in the posterior triangle of a newborn is a cystic hygroma (lymphatic malformation), and most present before the age of 2. Antenatal cases can be associated with chromosomal abnormalities such as Turner syndrome.", "why": ["", "A branchial cyst is anterior to the sternocleidomastoid and does not usually present in neonates.", "A thyroglossal cyst is in the midline.", "Reactive nodes are firm, not transilluminating.", "A sternocleidomastoid 'tumour' is a firm mass within the muscle in infants and does not transilluminate."], "refs": [["Radiopaedia: cystic hygroma", "https://radiopaedia.org/articles/cystic-hygroma-1?lang=us"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 212}, {"group": "Surgery", "topic": "ENT", "stem": "A 20-year-old has an enlarged, non-tender, rubbery neck lump that becomes painful when he drinks alcohol. What is the most likely diagnosis?", "opts": ["Hodgkin lymphoma", "Reactive lymphadenopathy", "Infectious mononucleosis", "Metastatic squamous cell carcinoma", "Tuberculous lymphadenitis"], "ans": 0, "exp": "Painless, firm or rubbery cervical nodes in a young adult with pain in the node after alcohol point to Hodgkin l
