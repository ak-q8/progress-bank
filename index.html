eeding with a bowel habit change needs cancer excluded first."], "refs": [["GPnotebook: NICE NG12 urgent referral for suspected lower GI cancer", "https://gpnotebook.com/pages/gastroenterology/lower-gi-cancer-nice-guidance-urgent-referral-for-suspected-cancer"]], "note": "The source confirms that age over 50 with rectal bleeding, or over 60 with a bowel habit change, meets NICE criteria for a suspected cancer pathway referral. It doesn't name colonoscopy as the test; that comes from your course explanation.", "src": "Linked sources", "id": 275}, {"group": "Surgery", "topic": "Skin", "stem": "A 65-year-old Asian woman comes to the physician for a routine health maintenance examination. On questioning, she has had occasional night sweats during the past 2 months. She has not had fevers or weight loss. Seven months ago, she had an acute myocardial infarction and was treated with percutaneous coronary intervention. She has hypertension, hyperlipidemia, and gastroesophageal reflux disease. She has smoked one pack of cigarettes daily for 37 years. Current medications include aspirin, atorvastatin, ramipril, metoprolol, and esomeprazole. She is 178 cm (5 ft 10 in) tall and weighs 89 kg (207 lbs); BMI is 29.7 kg/m2. Her temperature is 37.4°C (99.3°F), pulse is 84/min, respirations are 18/min, and blood pressure is 145/80 mm Hg. The lungs are clear to auscultation. Cardiac examination shows an S4. There is a nontender skin lesion near the right large toenail. A photograph of the lesion is shown. The remainder of the examination shows no abnormalities. Which of the following is the most likely diagnosis?", "opts": ["Squamous cell cancer", "Traumatic subungual haemorrhage", "Onychomycosis", "Malignant melanoma", "Cholesterol embolism"], "ans": 3, "exp": "A painless, irregular, brown-black pigmented lesion of the toe and nail bed in an Asian patient suggests acral lentiginous (nail unit) melanoma, the commonest melanoma type in deeply pigmented people.", "why": ["Squamous cell carcinoma of the nail bed is rarer and typically appears as a non-healing, scaly or ulcerated lesion.", "A subungual haemorrhage follows trauma and grows out with the nail, rather than persisting.", "Onychomycosis causes thickened, yellow, crumbly nails, not pigmented irregular lesions.", "", "Cholesterol emboli cause livedo and painful blue toes with a vascular history, not a pigmented nail lesion."], "refs": [["DermNet: melanoma of the nail unit", "https://dermnetnz.org/topics/melanoma-of-the-nail-unit"]], "note": "The source confirms melanoma of the nail unit is the most common melanoma in deeply pigmented people and mainly affects the great toe and thumb. Cholesterol embolism and squamous carcinoma comparisons are standard teaching.", "src": "Linked sources", "id": 276}, {"group": "Surgery", "topic": "Vascular", "stem": "A 69-year-old man is brought to the emergency department for severe tearing lower back pain for 12 hours. The pain radiates to the ﬂank and he describes it as 8 out of 10 in intensity. He has nausea and has vomited several times. He has no fever, diarrhea, or urinary symptoms. When he stands up suddenly, he becomes light-headed and has to steady himself for approximately 1 to 2 minutes before he is able to walk. He has hypertension and hyperlipidemia. Two years ago, he had a myocardial infarction and underwent coronary artery bypass grafting of his right coronary artery. He has smoked one and a half packs of cigarettes daily for 40 years and drinks 1 to 2 beers daily. His current medications include chlorthalidone, atorvastatin, lisinopril, and aspirin. He appears acutely ill. His temperature is 37.2°C (98.9°F), pulse is 130/min and regular, respirations are 35/min, and blood pressure is 80/55 mm Hg. Pulse oximetry on room air shows an oxygen saturation of 85%. Examination shows a pulsatile mass in the abdomen. Intravenous ﬂuids and high-ﬂow oxygen are started. Thirty minutes later, the patient dies. Which of the following was the strongest predisposing factor for the condition leading to this patient's death?", "opts": ["Hyperlipidemia", "Smoking", "Male sex", "Hypertension", "Advanced age"], "ans": 1, "exp": "Smoking is the most important modifiable risk factor for developing and rupturing an abdominal aortic aneurysm, with aneurysmal dilatation about seven times more likely in smokers.", "why": ["Hyperlipidaemia is a recognised but weaker contributor.", "", "Male sex raises risk about fourfold, but it is not modifiable, and smoking is the strongest modifiable factor.", "Hypertension contributes but is a less prominent factor.", "Age raises risk, but it is not modifiable."], "refs": [["GPnotebook: AAA risk factors", "https://gpnotebook.com/en-IE/pages/general-practice/abdominal-aortic-aneurysm/risk-factors"]], "note": "The source calls smoking the most important modifiable risk factor and gives male sex and age as other risks. It does not rank 'strongest overall', only 'strongest modifiable'.", "src": "Linked sources", "id": 277}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 54-year-old man with alcoholism comes to the emergency department because of vomiting blood for 6 hours. He has had 3–4 episodes in which he has vomited dark red blood during this period. He has had no epigastric pain or tarry stools. On arrival, his temperature is 37.3°C (99.1°F), pulse is 134/min, and blood pressure is 80/50 mm Hg. He is resuscitated with 0.9% saline and intravenous treatment with octreotide and ceftriaxone is begun. He undergoes an emergency upper endoscopy, which shows numerous dilated veins and two actively bleeding varices. Band ligation of the bleeding varices is performed and hemostasis is achieved. He is diagnosed with Child class B cirrhosis. He is concerned about the possibility of recurrence of such an episode. He is asked to abstain from alcohol, to which he readily agrees. In addition to nonselective beta blocker therapy, which of the following is the most appropriate recommendation to prevent future morbidity and mortality from this patient's condition?", "opts": ["Isosorbide mononitrate therapy", "Variceal ligation", "Transjugular intrahepatic portosystemic shunt", "Terlipressin", "Variceal sclerotherapy"], "ans": 1, "exp": "In acute variceal bleeding, vasoactive therapy and antibiotics are started with resuscitation, and endoscopic band ligation of oesophageal varices is the definitive endoscopic treatment. TIPS is considered if bleeding is not controlled.", "why": ["Isosorbide mononitrate is used with a beta-blocker for prevention when banding isn't suitable, not for acute control.", "", "TIPS is a rescue option when endoscopic and drug therapy fail.", "Terlipressin has already been given (octreotide is the vasoactive in this stem), so the next step is endoscopic ligation.", "Sclerotherapy is inferior to banding for oesophageal varices."], "refs": [["GPnotebook: management of bleeding oesophageal varices", "https://gpnotebook.com/en-GB/pages/gastroenterology/bleeding-oesophageal-varices-management"]], "note": "The source confirms band ligation for oesophageal varices, terlipressin and antibiotics at presentation, and TIPS if uncontrolled. The comparison with sclerotherapy is standard teaching.", "src": "Linked sources", "id": 278}, {"group": "Surgery", "topic": "Hernias", "stem": "Which inguinal hernia passes through the deep inguinal ring and along the inguinal canal, lateral to the inferior epigastric vessels?", "opts": ["Indirect inguinal hernia", "Direct inguinal hernia", "Femoral hernia", "Spigelian hernia", "Obturator hernia"], "ans": 0, "exp": "An indirect inguinal hernia runs from the deep ring through the inguinal canal, lateral to the inferior epigastric vessels, usually due to an incompletely closed processus vaginalis.", "why": ["", "A direct hernia is medial to the inferior epigastric vessels and pushes through the posterior wall of the canal (Hesselbach's triangle), not through the deep ring.", "A femoral hernia emerges below the inguinal ligament.", "A Spigelian hernia is in the lateral abdominal wall.", "An obturator hernia passes through the obturator canal."], "refs": [["AMBOSS: inguinal hernia", "https://www.amboss.com/us/knowledge/inguinal-hernia"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 279}, {"group": "Surgery", "topic": "Hernias", "stem": "A hernia that arises through Hesselbach's triangle, medial to the inferior epigastric vessels, due to weakness of the transversalis fascia, is called:", "opts": ["Direct inguinal hernia", "Indirect inguinal hernia", "Femoral hernia", "Richter's hernia", "Hiatus hernia"], "ans": 0, "exp": "Hesselbach's triangle is bounded by the rectus abdominis medially, the inferior epigastric vessels laterally and the inguinal ligament inferiorly. Direct hernias lie within it and result from weakness of the transversalis fascia.", "why": ["", "An indirect hernia lies lateral to the inferior epigastric vessels, outside the triangle.", "A femoral hernia lies below the inguinal ligament.", "Richter's hernia describes partial-wall bowel entrapment.", "A hiatus hernia is through the diaphragm."], "refs": [["AMBOSS: inguinal hernia", "https://www.amboss.com/us/knowledge/inguinal-hernia"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 280}, {"group": "Surgery", "topic": "Hernias", "stem": "A groin bulge lies below the inguinal ligament and lateral to the pubic tubercle. What is the most likely diagnosis?", "opts": ["Femoral hernia", "Direct inguinal hernia", "Indirect inguinal hernia", "Saphenous varix", "Lipoma of the cord"], "ans": 0, "exp": "A femoral hernia presents as a groin bulge below the inguinal ligament and lateral to the pubic tubercle, and it is more common in women and prone to strangulation.", "why": ["", "A direct inguinal hernia lies above the inguinal ligament.", "An indirect inguinal hernia also lies above the inguinal ligament and medial or at the pubic tubercle.", "A saphenous varix is soft, compressible and disappears when lying flat, with a cough impulse and a thrill.", "A lipoma of the cord lies in the inguinal canal above the ligament."], "refs": [["AMBOSS: inguinal hernia (femoral hernia section)", "https://www.amboss.com/us/knowledge/inguinal-hernia"]], "note": "The source confirms the position below the inguinal ligament and lateral to the pubic tubercle. The notes on women and strangulation risk and on the saphenous varix come from standard teaching.", "src": "Linked sources", "id": 281}, {"group": "Surgery", "topic": "Hernias", "stem": "What is a hiatus hernia?", "opts": ["Bulging of part of the stomach through the diaphragm", "Herniation of bowel through the obturator canal", "Herniation of bowel through the linea semilunaris", "A groin hernia below the inguinal ligament", "Herniation of only part of the bowel wall"], "ans": 0, "exp": "A hiatus hernia is an abnormal bulging of a portion of the stomach through the diaphragm at the oesophageal hiatus. Sliding hernias are commonest and may cause reflux, whereas paraoesophageal hernias can strangulate and need urgent surgery.", "why": ["", "That describes an obturator hernia.", "That describes a Spigelian hernia.", "That describes a femoral hernia.", "That describes a Richter's hernia."], "refs": [["MSD Manual (home): hiatus hernia", "https://www.merckmanuals.com/home/digestive-disorders/esophageal-and-swallowing-disorders/hiatus-hernia"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 282}, {"group": "Surgery", "topic": "Urology", "stem": "A 45-year-old man at low risk of sexually transmitted infection has acute epididymo-orchitis. Which of the following is an appropriate antibiotic and duration?", "opts": ["Ofloxacin for 14 days", "Trimethoprim for 3 days", "Nitrofurantoin for 3 days", "Cefalexin for 3 days", "Gentamicin for 3 days"], "ans": 0, "exp": "In older men or those likely to have an enteric (UTI-type) organism, ofloxacin for 14 days is the preferred regimen. In younger men or those at high risk of STI, ceftriaxone plus doxycycline is used.", "why": ["", "A 3-day course is too short for epididymo-orchitis.", "Nitrofurantoin has poor tissue penetration and a short course would be inadequate.", "Cefalexin and a 3-day course are not recommended.", "Gentamicin is IV, for severe sepsis, and not a 3-day oral option."], "refs": [["Pulse Reference: epididymo-orchitis", "https://pulsereference.com/diagnoses/epididymo-orchitis-eo/"]], "note": "The source gives ofloxacin for 14 days for older men or likely UTI, and ceftriaxone plus doxycycline for younger men or high STI risk. Fluoroquinolones have MHRA restrictions, so check current local guidance.", "src": "Linked sources", "id": 283}, {"group": "Surgery", "topic": "Vascular", "stem": "A 56-year-old homeless man has a 12-hour history of severe leg pain. The leg is pale and cold with fixed mottling, no sensation and no ability to move the toes, and no pulses or Doppler signals. What is the most appropriate treatment?", "opts": ["Amputation", "Percutaneous angioplasty", "Endarterectomy", "Bypass grafting", "Endoluminal stent grafting"], "ans": 0, "exp": "Profound sensory loss, paralysis and inaudible arterial signals mean irreversible ischaemia, with major tissue loss and permanent nerve damage inevitable. A non-viable limb needs amputation, not revascularisation.", "why": ["", "Angioplasty restores flow to a salvageable limb and would not help a dead limb.", "Endarterectomy is a reconstructive option for viable limbs.", "Bypass is for a salvageable limb, not for one with irreversible damage.", "Stenting does not treat established gangrene."], "refs": [["NSW ECI: acute limb ischaemia", "https://aci.health.nsw.gov.au/networks/eci/clinical/tools/acute-limb-ischaemia"]], "note": "The source confirms that irreversible ischaemia (paralysis, profound sensory loss, no Doppler signal) means amputation. It doesn't mention fixed mottling.", "src": "Linked sources", "id": 284}, {"group": "Surgery", "topic": "Vascular", "stem": "Which list gives the classic features of acute limb ischaemia?", "opts": ["Pain, pallor, pulselessness, perishing cold, paraesthesia, paralysis", "Pain, redness, swelling, warmth, loss of function, fever", "Pain, pallor, bruising, weakness, tremor, swelling", "Claudication, hair loss, ulceration, atrophy, cyanosis, rest pain", "Pain, pulsatile mass, hypotension, tachycardia, collapse, back pain"], "ans": 0, "exp": "The six Ps of acute limb ischaemia are pain, pallor, pulselessness, perishing cold, paraesthesia and paralysis. Paraesthesia or paralysis means the limb is threatened and needs urgent vascular review.", "why": ["", "These are the signs of inflammation, not ischaemia.", "This list is not the recognised description.", "These are signs of chronic limb ischaemia.", "These are features of a ruptured abdominal aortic aneurysm."], "refs": [["NSW ECI: acute limb ischaemia", "https://aci.health.nsw.gov.au/networks/eci/clinical/tools/acute-limb-ischaemia"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 285}, {"group": "Surgery", "topic": "Hepatobiliary & Pancreas", "stem": "Murphy's sign is a bedside test associated with which condition?", "opts": ["Acute cholecystitis", "Acute appendicitis", "Acute pancreatitis", "Diverticulitis", "Peptic ulcer perforation"], "ans": 0, "exp": "Murphy's sign is pain and inspiratory arrest when the examiner palpates under the right costal margin as the patient inhales, caused by an inflamed gallbladder touching the hand. It indicates acute cholecystitis.", "why": ["", "Appendicitis is associated with Rovsing's, psoas and obturator signs.", "Pancreatitis may show Cullen's and Grey Turner's signs.", "Diverticulitis gives left iliac fossa tenderness.", "Perforation causes a rigid abdomen and free air."], "refs": [["LITFL: Murphy's sign", "https://litfl.com/murphys-sign/"]], "note": "The source confirms the association with acute cholecystitis. The comparison signs for other conditions are standard teaching.", "src": "Linked sources", "id": 286}, {"group": "Surgery", "topic": "Trauma", "stem": "A man with a pelvic fracture after a road traffic accident has blood at the urethral meatus. What should happen before any urethral catheter is passed?", "opts": ["Retrograde urethrography", "Rectal examination alone", "Immediate catheter insertion", "Intravenous pyelogram", "Cystoscopy under local anaesthetic"], "ans": 0, "exp": "Blood at the meatus is the most important sign of urethral injury, and posterior urethral injuries almost always accompany pelvic fractures. Retrograde urethrography should always precede catheterisation, because a blind catheter can worsen an undetected injury.", "why": ["", "The source describes a high-riding prostate as an inaccurate indicator, so rectal examination alone is not enough.", "A catheter placed first may potentiate urethral disruption.", "An IVP images the upper tracts and doesn't show the urethra.", "Cystoscopy is not the initial emergency assessment."], "refs": [["MSD Manual: urethral trauma", "https://www.msdmanuals.com/professional/injuries-poisoning/genitourinary-tract-trauma/urethral-trauma"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 287}, {"group": "Surgery", "topic": "Trauma", "stem": "A construction worker with a crush injury has multiple rib fractures, paradoxical chest wall movement, pO2 7.5 kPa and pCO2 8.2 kPa. What is the life-saving intervention?", "opts": ["Endotracheal intubation and mechanical ventilation", "High-flow oxygen alone", "Cricothyroidotomy", "Aggressive fluid resuscitation", "Analgesia alone"], "ans": 0, "exp": "This is a flail chest with respiratory failure (hypoxia and hypercapnia). He needs intubation with mechanical ventilation, together with analgesia and oxygen, because the segment impairs ventilation and gas exchange.", "why": ["", "High-flow oxygen is given, but it does not fix the ventilatory failure and rising CO2.", "A surgical airway is for failed intubation or an obstructed upper airway, which isn't described.", "Fluids must be given cautiously because of the underlying pulmonary contusion.", "Analgesia helps but does not reverse established respiratory failure."], "refs": [["LITFL: thoracic trauma, flail chest", "https://litfl.com/?p=190714"]], "note": "The source says patients may deteriorate and require intubation and mechanical ventilation, with oxygen and analgesia as part of care. It doesn't state that intubation is the single life-saving step; that comes from your course key.", "src": "Linked sources", "id": 288}, {"group": "Surgery", "topic": "Anaesthetics", "stem": "Suxamethonium belongs to which drug class?", "opts": ["Depolarising neuromuscular blocking agent", "Non-depolarising neuromuscular blocking agent", "Volatile anaesthetic", "Local anaesthetic", "Cholinesterase inhibitor"], "ans": 0, "exp": "Suxamethonium is a depolarising muscle relaxant that mimics acetylcholine, so fasciculations precede paralysis. It acts quickly (45 to 60 seconds) and wears off in about 10 minutes through hydrolysis by pseudocholinesterase.", "why": ["", "Rocuronium is the non-depolarising agent.", "Sevoflurane is a volatile agent.", "Lidocaine is a local anaesthetic.", "Neostigmine is a cholinesterase inhibitor, used to reverse non-depolarising block."], "refs": [["LITFL: Does Roc rock? Does Sux suck?", "https://litfl.com/does-roc-rock-does-sux-suck/"]], "note": "The source confirms suxamethonium is depolarising and rocuronium non-depolarising. It does not cover neostigmine, which is standard teaching.", "src": "Linked sources", "id": 289}, {"group": "Surgery", "topic": "Anaesthetics", "stem": "Which drug rapidly reverses rocuronium-induced neuromuscular blockade?", "opts": ["Sugammadex", "Suxamethonium", "Propofol", "Naloxone", "Atropine alone"], "ans": 0, "exp": "Sugammadex encapsulates rocuronium; a 16 mg/kg IV dose reverses profound paralysis in about 2 minutes.", "why": ["", "Suxamethonium is itself a muscle relaxant.", "Propofol is an IV induction agent.", "Naloxone reverses opioids.", "Atropine is given with neostigmine to block muscarinic effects and doesn't reverse paralysis by itself."], "refs": [["LITFL: Does Roc rock? Does Sux suck?", "https://litfl.com/does-roc-rock-does-sux-suck/"]], "note": "The source confirms sugammadex reverses rocuronium. The roles of naloxone and atropine are standard teaching.", "src": "Linked sources", "id": 290}, {"group": "Surgery", "topic": "Anaesthetics", "stem": "In which of these patients should suxamethonium be avoided because of the risk of dangerous hyperkalaemia?", "opts": ["A patient with extensive burns", "A fasted healthy adult for elective surgery", "A patient needing rapid sequence intubation with no risk factors", "A patient with hypokalaemia", "A patient with asthma"], "ans": 0, "exp": "Suxamethonium can raise potassium and is avoided in conditions that increase hyperkalaemia risk, such as burns, crush injury, renal failure, severe sepsis and neuromuscular disorders. It can also trigger malignant hyperthermia.", "why": ["", "A healthy fasted adult has no added risk.", "Without risk factors, suxamethonium is commonly used for rapid sequence induction.", "Hypokalaemia does not add to the hyperkalaemic risk from suxamethonium.", "Asthma is not a contraindication to suxamethonium."], "refs": [["LITFL: Does Roc rock? Does Sux suck?", "https://litfl.com/does-roc-rock-does-sux-suck/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 291}, {"group": "Surgery", "topic": "Trauma", "stem": "Where is a chest drain normally inserted?", "opts": ["Within the safe triangle, at the level of the nipple, between the lateral border of pectoralis major and the mid-axillary line", "The second intercostal space in the mid-clavicular line only", "The sixth intercostal space posteriorly", "Through the sternum", "Below the costal margin in the midline"], "ans": 0, "exp": "The safe triangle is bounded by the lateral border of pectoralis major anteriorly, the mid-axillary line posteriorly, and the level of the nipple (about the 5th intercostal space) inferiorly. Insertion is in the 4th or 5th intercostal space.", "why": ["", "The 2nd intercostal space mid-clavicular line is a site for needle decompression, not the standard drain site.", "A posterior insertion at the 6th space is outside the safe triangle and risks the diaphragm.", "The sternum is not a drain site.", "Below the costal margin would enter the abdomen."], "refs": [["NHS Education for Scotland: chest drains", "https://learn.nes.nhs.scot/SCORM/Courses/Module0002353File0002550/chestdrains_10.htm"]], "note": "The source gives the boundaries and the 4th or 5th space. It places the lateral limit at the mid-axillary line; the 2nd intercostal needle site is standard teaching.", "src": "Linked sources", "id": 292}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 23-year-old woman, taking the combined pill for 3 months, has a slightly mobile, discrete, well-defined, firm 1 cm painless breast lump. What is the most likely diagnosis?", "opts": ["Fibroadenoma", "Breast cyst", "Lipoma", "Sebaceous cyst", "Breast carcinoma"], "ans": 0, "exp": "A firm, mobile, well-defined, painless lump in a woman aged 14 to 35 is a fibroadenoma, the commonest benign breast tumour in young women.", "why": ["", "Cysts are tense, fluctuant and more frequent after age 35.", "A lipoma is soft and irregularly defined.", "A sebaceous cyst is attached to the skin with a punctum.", "Carcinoma is rare under 35 and is usually irregular and fixed."], "refs": [["PulseNotes: fibroadenoma", "https://app.pulsenotes.com/surgery/breast-surgery/notes/fibroadenoma"]], "note": "The source confirms the age range (14 to 35) and a painless, firm, movable lump. It does not use the word 'rubbery'. The contrast with cysts and carcinoma is standard teaching.", "src": "Linked sources", "id": 293}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 24-year-old has a biopsy-proven, small, asymptomatic fibroadenoma. What is the most appropriate management?", "opts": ["Conservative management with reassurance", "Mastectomy", "Wide local excision for all fibroadenomas", "Chemotherapy", "Radiotherapy"], "ans": 0, "exp": "Most fibroadenomas can be managed conservatively. Simple, small, asymptomatic, biopsy-proven lesions need no further treatment, and the patient should return if the lump changes.", "why": ["", "Mastectomy treats cancer, not benign fibroadenoma.", "Excision is considered for rapid growth, a cellular fibroepithelial lesion or persistent pain, not for every case.", "Chemotherapy treats malignancy.", "Radiotherapy has no role in benign fibroadenoma."], "refs": [["PulseNotes: fibroadenoma", "https://app.pulsenotes.com/surgery/breast-surgery/notes/fibroadenoma"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 294}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "A 36-year-old woman presents 7 days after a car accident with a hard, irregular, tender 3 cm breast lump with bruising and skin tethering. Ultrasound suggests a benign process. What is the most likely diagnosis?", "opts": ["Fat necrosis", "Breast cyst", "Mammary duct ectasia", "Breast abscess", "Fibroadenosis"], "ans": 0, "exp": "Trauma with bruising and a tender lump points to fat necrosis, a benign condition that can mimic cancer, with thickened or tethered skin. Core biopsy is used to confirm it when imaging cannot exclude another diagnosis.", "why": ["", "A cyst is smooth and fluctuant, and wouldn't follow trauma with bruising.", "Duct ectasia occurs in perimenopausal women with nipple discharge.", "An abscess has fever, redness and a fluctuant lump.", "Fibroadenosis causes cyclical bilateral lumpiness."], "refs": [["American Cancer Society: fat necrosis and oil cysts", "https://www.cancer.org/cancer/types/breast-cancer/non-cancerous-breast-conditions/fat-necrosis-and-oil-cysts-in-the-breast.html"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 295}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 40-year-old man feels a sudden 'snap' at the back of his ankle while playing squash and cannot push off. On lying prone and squeezing his calf, his foot does not plantarflex. Which diagnosis does this positive Simmonds-Thompson test indicate?", "opts": ["Achilles tendon rupture", "Ankle sprain", "Plantar fasciitis", "Gastrocnemius strain", "Tibial stress fracture"], "ans": 0, "exp": "In the Simmonds-Thompson (calf squeeze) test, absence of foot plantarflexion on squeezing the calf is a positive result and indicates Achilles tendon rupture.", "why": ["", "A sprain does not interrupt the calf-to-tendon connection, so plantarflexion persists.", "Plantar fasciitis causes heel pain on first steps, with a normal calf squeeze test.", "A strain would cause calf pain but the tendon remains intact, so the foot still plantarflexes.", "A stress fracture gives gradual pain with activity, not a sudden snap."], "refs": [["LITFL: Simmonds-Thompson test", "https://litfl.com/simmonds-thompson-test/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 296}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A young rugby player's shoulder dislocated anteriorly last year. When his arm is abducted to 90 degrees and externally rotated, he looks fearful, and the fear eases when the examiner pushes the humeral head backwards. What does this test indicate?", "opts": ["Anterior shoulder instability", "Supraspinatus tendinopathy", "Acromioclavicular joint arthritis", "Frozen shoulder", "Rotator cuff full-thickness tear"], "ans": 0, "exp": "Apprehension at 90 degrees of abduction with external rotation, relieved by posteriorly directed pressure on the humeral head (relocation), indicates anterior glenohumeral instability.", "why": ["", "Supraspinatus problems are tested with the Jobe (empty can) test and cause painful arc rather than fear of dislocation.", "AC joint arthritis gives pain across the top of the shoulder with a positive scarf test.", "A frozen shoulder causes global restricted movement without apprehension.", "A large rotator cuff tear causes weakness with the drop arm sign, not apprehension."], "refs": [["Physiotutors: shoulder relocation test", "https://www.physiotutors.com/wiki/relocation-test"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 297}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A footballer twisted his knee, heard a pop and developed rapid swelling. On examination, the tibia moves forward excessively with the knee at 20 degrees of flexion and has a soft endpoint. Which structure is injured?", "opts": ["Anterior cruciate ligament", "Medial collateral ligament", "Posterior cruciate ligament", "Lateral meniscus", "Patellar tendon"], "ans": 0, "exp": "Anterior translation of the tibia with a soft endpoint on the Lachman test, or increased anterior displacement on the anterior drawer test, indicates ACL rupture.", "why": ["", "MCL injury is tested with valgus stress, not anterior tibial translation.", "PCL injury allows posterior tibial sag and a positive posterior drawer.", "A meniscal tear causes locking and joint-line tenderness, tested with McMurray.", "A patellar tendon rupture prevents active knee extension."], "refs": [["Primary Care Notebook: ACL function tests", "https://primarycarenotebook.com/pages/musculoskeletal-medicine/anterior-cruciate-ligament-acl-function-tests"]], "note": "The source confirms the tests and what a positive result means. The pop and rapid swelling in the stem are standard teaching for ACL tears.", "src": "Linked sources", "id": 298}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 45-year-old woman has burning pain in the ball of her foot that worsens in tight shoes and eases when she takes the shoe off and massages the foot. Squeezing the metatarsal heads together reproduces the pain. What is the most likely diagnosis?", "opts": ["Morton's neuroma", "Plantar fasciitis", "Achilles tendinopathy", "Gout of the first MTP joint", "Tarsal tunnel syndrome"], "ans": 0, "exp": "Burning forefoot pain, worse in tight shoes and eased by removing them, with a positive metatarsal squeeze (Mulder) test, is Morton's neuroma, most often in the third intermetatarsal space.", "why": ["", "Plantar fasciitis gives heel pain, worst with the first steps in the morning.", "Achilles tendinopathy causes pain and thickening above the heel.", "Gout causes a hot, red, swollen first MTP joint.", "Tarsal tunnel syndrome causes sole paraesthesia behind the medial malleolus."], "refs": [["LITFL: Morton neuroma", "https://litfl.com/morton-neuroma/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 299}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A patient stands on his right leg and his left side of the pelvis drops. Which muscle and nerve are most likely involved?", "opts": ["Right gluteus medius, superior gluteal nerve", "Left gluteus maximus, inferior gluteal nerve", "Right iliopsoas, femoral nerve", "Right adductor longus, obturator nerve", "Left piriformis, sciatic nerve"], "ans": 0, "exp": "A positive Trendelenburg sign is a contralateral pelvic drop in single-leg stance. It reflects weakness of the hip abductors (gluteus medius and minimus) on the stance side, supplied by the superior gluteal nerve.", "why": ["", "Gluteus maximus is an extensor, supplied by the inferior gluteal nerve, and its weakness doesn't cause this sign.", "Iliopsoas flexes the hip, and femoral nerve problems affect knee extension.", "Adductors pull the leg inward and are supplied by the obturator nerve.", "Piriformis laterally rotates the hip and isn't the abductor tested here."], "refs": [["StatPearls: Trendelenburg test", "https://www.statpearls.com/sp/al/48/30568/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 300}, {"group": "Surgery", "topic": "Respiratory", "stem": "Which is the most common type of lung cancer in the non-small cell group?", "opts": ["Adenocarcinoma", "Squamous cell carcinoma", "Small cell carcinoma", "Large cell carcinoma", "Mesothelioma"], "ans": 0, "exp": "Adenocarcinoma is the most common type of non-small cell lung cancer, arising from mucus-producing gland cells lining the airways. Non-small cell cancers make up about 80 to 85% of lung cancers.", "why": ["", "Squamous cell carcinoma is the second most common non-small cell type.", "Small cell is a separate group of lung cancers and is not part of non-small cell.", "Large cell is less common.", "Mesothelioma is a pleural tumour, not a lung cancer type."], "refs": [["Cancer Research UK: types of lung cancer", "https://www.cancerresearchuk.org/about-cancer/lung-cancer/stages-types-grades/types"]], "note": "The source names adenocarcinoma as the most common non-small cell type and gives the 80-85% figure for non-small cell. The ranking of squamous second and large cell as less common is standard teaching.", "src": "Linked sources", "id": 301}, {"group": "Surgery", "topic": "ENT", "stem": "A 47-year-old man from Zambia has a slowly enlarging, painless neck swelling in the posterior triangle with night sweats and weight loss. What is the most likely cause?", "opts": ["Mycobacterium tuberculosis", "Streptococcus pyogenes", "Epstein-Barr virus", "Staphylococcus aureus", "Mumps virus"], "ans": 0, "exp": "A slowly enlarging, painless neck mass with systemic symptoms (weight loss, fever, night sweats) in someone from an endemic area suggests tuberculous cervical lymphadenitis, over 90% of which is caused by M. tuberculosis. Diagnosis is by needle aspiration or biopsy with culture.", "why": ["", "Group A strep causes acute painful tonsillitis and tender nodes over days.", "EBV gives a sore throat and tender nodes with fatigue, resolving over weeks.", "S. aureus causes acute painful abscesses, not slow painless enlargement.", "Mumps causes acute painful parotid swelling."], "refs": [["StatPearls: tuberculous lymphadenitis", "https://www.statpearls.com/sp/md/112/28792/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 302}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A patient has pain and tingling in the thumb, index and middle fingers when holding both wrists fully flexed for a minute. Which test is positive?", "opts": ["Phalen's test", "Finkelstein's test", "McMurray's test", "Foucher's sign", "Trendelenburg test"], "ans": 0, "exp": "Phalen's test provokes numbness or tingling in the fingers after holding the wrists in flexion, and supports carpal tunnel syndrome. Tinel's sign (tapping over the median nerve) is the other bedside test.", "why": ["", "Finkelstein's test assesses de Quervain's tenosynovitis at the radial wrist.", "McMurray's test assesses meniscal tears.", "Foucher's sign relates to a Baker's cyst.", "The Trendelenburg test assesses hip abductor strength."], "refs": [["Pulse Reference: carpal tunnel syndrome", "https://pulsereference.com/diagnoses/carpal-tunnel-syndrome/"]], "note": "The source confirms Phalen's and Tinel's tests. The other tests' targets are from the other sources linked in this bank and standard teaching.", "src": "Linked sources", "id": 303}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A clinician flexes, extends and rotates a patient's knee, producing a clunk and pain along the joint line. Which injury does McMurray's test suggest?", "opts": ["Meniscal tear", "Anterior cruciate ligament tear", "Patellar dislocation", "Baker's cyst", "Osgood-Schlatter disease"], "ans": 0, "exp": "McMurray's test (flexing, extending and twisting the knee) provokes pain, clicking or a clunk in a meniscal tear. MRI is the preferred imaging for acute tears.", "why": ["", "ACL tears are tested with the Lachman or anterior drawer tests.", "Patellar dislocation shows apprehension on moving the patella laterally.", "A Baker's cyst is a popliteal swelling that is firm in extension and soft in flexion.", "Osgood-Schlatter disease causes tibial tuberosity pain in adolescents."], "refs": [["OrthoInfo (AAOS): meniscus tears", "https://www.orthoinfo.org/diseases--conditions/meniscus-tears/"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 304}, {"group": "Surgery", "topic": "Breast & Endocrine", "stem": "Which tumour marker is used in monitoring the response of breast cancer to treatment?", "opts": ["CA 15-3", "CA 125", "CA 19-9", "Alpha-fetoprotein", "PSA"], "ans": 0, "exp": "CA 15-3 (and CA 27.29) are markers used in monitoring breast cancer therapy. They are not used for diagnosis or screening.", "why": ["", "CA 125 is associated with ovarian cancer.", "CA 19-9 is associated with pancreatic and biliary cancers.", "AFP is associated with hepatocellular carcinoma and germ cell tumours.", "PSA is associated with prostate cancer."], "refs": [["Patient.info (Professional): tumour markers", "https://patient.info/doctor/oncology/tumour-markers"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 305}, {"group": "Surgery", "topic": "Gynaecology", "stem": "Which tumour marker is most associated with ovarian cancer?", "opts": ["CA 125", "CA 19-9", "Carcinoembryonic antigen", "Alpha-fetoprotein", "Beta-hCG"], "ans": 0, "exp": "CA 125 is the tumour marker associated with ovarian cancer.", "why": ["", "CA 19-9 relates to pancreatic and biliary cancers.", "CEA relates to colorectal cancer.", "AFP relates to hepatocellular carcinoma and non-seminomatous germ cell tumours.", "Beta-hCG relates to non-seminomatous germ cell tumours and gestational trophoblastic disease."], "refs": [["Patient.info (Professional): tumour markers", "https://patient.info/doctor/oncology/tumour-markers"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 306}, {"group": "Surgery", "topic": "Urology", "stem": "Which tumour marker is associated with prostate cancer?", "opts": ["PSA", "CA 125", "CA 15-3", "CEA", "AFP"], "ans": 0, "exp": "Prostate-specific antigen (PSA) is the marker associated with prostate cancer.", "why": ["", "CA 125 is associated with ovarian cancer.", "CA 15-3 is used to monitor breast cancer.", "CEA is associated with colorectal cancer.", "AFP is associated with hepatocellular carcinoma and germ cell tumours."], "refs": [["Patient.info (Professional): tumour markers", "https://patient.info/doctor/oncology/tumour-markers"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 307}, {"group": "Surgery", "topic": "Urology", "stem": "Which tumour marker is associated with non-seminomatous germ cell tumours of the testis, alongside AFP?", "opts": ["Beta-hCG", "CA 19-9", "CA 125", "PSA", "CEA"], "ans": 0, "exp": "Beta-hCG (and AFP) are tumour markers associated with non-seminomatous germ cell tumours and, for hCG, gestational trophoblastic disease.", "why": ["", "CA 19-9 relates to pancreatic and biliary cancers.", "CA 125 relates to ovarian cancer.", "PSA relates to prostate cancer.", "CEA relates to colorectal cancer."], "refs": [["Patient.info (Professional): tumour markers", "https://patient.info/doctor/oncology/tumour-markers"]], "note": "The source lists beta-hCG for non-seminomatous germ cell tumours. Your course lists it for seminoma; the source ties it to non-seminomatous tumours, so check which your exam expects.", "src": "Linked sources", "id": 308}, {"group": "Surgery", "topic": "ENT", "stem": "Which complication of mumps affects roughly 30% of unvaccinated post-pubertal males?", "opts": ["Orchitis", "Appendicitis", "Nephritis", "Hepatitis", "Cardiomyopathy"], "ans": 0, "exp": "Orchitis, usually unilateral, develops in about 30% of unvaccinated (and 6% of vaccinated) infected post-pubertal males. Fertility is usually preserved, though some testicular atrophy can occur.", "why": ["", "Appendicitis is not a mumps complication, although oophoritis can mimic it.", "Nephritis is very rare in mumps.", "Hepatitis is very rare in mumps.", "Myocarditis is very rare, not a common complication."], "refs": [["MSD Manual: mumps", "https://www.msdmanuals.com/professional/pediatrics/viral-exanthems-in-infants-and-children/mumps"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 309}, {"group": "Surgery", "topic": "Trauma", "stem": "After pelvic trauma, which finding is the most important sign of a urethral injury?", "opts": ["Blood at the urethral meatus", "A high-riding prostate on rectal examination", "Haematuria on dipstick only", "Suprapubic tenderness alone", "Normal voiding"], "ans": 0, "exp": "Blood at the urethral meatus is the most important sign of urethral injury. Other signs are pain or inability to void and perineal, scrotal or penile bruising.", "why": ["", "A high-riding prostate is described as an inaccurate indicator.", "Haematuria on dipstick can arise from bladder or renal injury and is less specific.", "Suprapubic tenderness is not specific for urethral injury.", "Normal voiding does not exclude injury, but inability to void would raise concern."], "refs": [["MSD Manual: urethral trauma", "https://www.msdmanuals.com/professional/injuries-poisoning/genitourinary-tract-trauma/urethral-trauma"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 310}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 62-year-old man with a history of mechanical mitral valve replacement presents for routine follow-up. He has no active bleeding or clotting events. He asks which long-term anticoagulant therapy is appropriate. He mentions he has heard of options like enoxaparin and warfarin. Which anticoagulant is most appropriate for long-term use in this patient?", "opts": ["Dabigatran", "Warfarin", "Apixaban", "Low-molecular-weight heparin indefinitely", "Aspirin alone"], "ans": 1, "exp": "Patients with a mechanical heart valve need lifelong anticoagulation, and warfarin is the standard drug. Low-dose aspirin may be added if the clot risk is higher.", "why": ["DOACs such as dabigatran are not recommended with mechanical valves, because their safety there is unproven (and trial data have shown worse outcomes).", "", "Apixaban is a DOAC, and DOACs are not recommended with mechanical valves.", "LMWH is used as a bridge when warfarin is interrupted; long-term use is impractical.", "Aspirin alone is not enough protection against valve thrombosis and stroke."], "refs": [["NHS Specialist Pharmacy Service: warfarin in mechanical heart valves", "https://www.medicinesresources.nhs.uk/warfarin-in-patients-with-mechanical-heart-valves.html"]], "note": "The source says DOACs are not recommended because their safety is unproven. The 'worse outcomes in trials' remark is standard teaching and not from this page.", "src": "NHS Specialist Pharmacy Service", "id": 311}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 58-year-old man presents with acute chest pain and ST-segment elevation in leads II, III, and aVF on ECG. Blood pressure is 85/60 mmHg. You suspect inferior myocardial infarction. A concurrent ECG shows changes in V1-V2. Which complication should be considered based on these ECG findings?", "opts": ["Left ventricular aneurysm", "Right ventricular involvement", "Posterior MI only", "Anterior MI", "Pericarditis"], "ans": 1, "exp": "Right ventricular infarction complicates up to 40% of inferior STEMIs. ST elevation in V1 (and in right-sided V4R) with hypotension and clear lungs suggests it. The right ventricle depends on preload, so fluid boluses are favoured and nitrates are avoided.", "why": ["An LV aneurysm is a late complication, weeks after infarction.", "", "Posterior infarction shows ST depression in V1-V3, rather than elevation, and doesn't explain the hypotension.", "Anterior infarction would show ST elevation in V2-V4 and not predominantly in the inferior leads.", "Pericarditis gives widespread saddle-shaped ST elevation and PR depression, not a regional inferior pattern."], "refs": [["LITFL: right ventricular infarction", "https://litfl.com/right-ventricular-infarction/"]], "note": "The contrasts with posterior MI, aneurysm and pericarditis are standard teaching.", "src": "Life in the Fast Lane", "id": 312}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 55-year-old man, a coal miner, presents with chronic cough. Imaging shows upper lobe fibrosis with small nodules. Pulmonary function tests demonstrate a restrictive pattern. Which occupational lung disease is most consistent with these findings?", "opts": ["Silicosis", "Coal worker pneumoconiosis", "Asbestosis", "Idiopathic pulmonary fibrosis", "Sarcoidosis"], "ans": 1, "exp": "Coal workers' pneumoconiosis follows at least 10 years of coal dust exposure and causes small (2-5 mm) nodules with an upper lobe predominance. A coal miner with this pattern is the typical case.", "why": ["Silicosis looks the same on X-ray, and many miners have mixed disease, but the exposure here is coal.", "", "Asbestosis causes lower zone fibrosis and pleural plaques after asbestos exposure.", "IPF causes basal, subpleural fibrosis and has no occupational cause.", "Sarcoidosis has hilar adenopathy and is not tied to an exposure."], "refs": [["AuntMinnie: coalworkers' pneumoconiosis", "https://www.auntminnie.com/15560595"]], "note": "Heads-up: the source says coal workers' pneumoconiosis is radiographically indistinguishable from silicosis, so the exposure (coal) is what decides the answer. The source doesn't say whether the PFT pattern is restrictive.", "src": "AuntMinnie radiology review", "id": 313}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 68-year-old man presents with sudden shortness of breath, hypotension, and mild confusion. He has no chest pain. ECG shows sinus tachycardia. CT pulmonary angiography confirms a large pulmonary embolism. Which intervention is appropriate given the haemodynamic instability?", "opts": ["Observation", "Low-molecular-weight heparin only", "Thrombolysis", "Oral anticoagulation only", "Supplemental oxygen"], "ans": 2, "exp": "A PE with persistent hypotension is high-risk (massive) PE. Guidance is to start unfractionated heparin without delay and give systemic thrombolysis. Surgical embolectomy or catheter-directed treatment is considered if thrombolysis is contraindicated or fails.", "why": ["Observation is unsafe with shock.", "LMWH alone is for stable PE; here the clot burden needs to be removed.", "", "Oral anticoagulants act too slowly for an unstable patient and are used for maintenance.", "Oxygen is supportive but does not treat the clot."], "refs": [["GPnotebook: treatment of pulmonary embolism", "https://gpnotebook.com/en-IE/pages/cardiovascular-medicine/multiple-small-pulmonary-emboli/treatment-of-pulmonary-embolism"]], "note": "The page doesn't mention oxygen, so that point is standard teaching.", "src": "GPnotebook", "id": 314}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 55-year-old man with community-acquired pneumonia presents with pleuritic chest pain and fever. Chest X-ray shows blunting of the costophrenic angle. Sputum culture grows Staphylococcus aureus. Pleural fluid pH is 6.5. What is the most appropriate next step?", "opts": ["Observation", "IV antibiotics only", "Chest tube drainage (empyema)", "Thoracoscopic biopsy", "Oral antibiotics"], "ans": 2, "exp": "A pleural fluid pH below 7.2 (here 6.5) in a patient with pneumonia indicates a complicated parapneumonic effusion or empyema. These need urgent chest drainage together with antibiotics, because antibiotics alone do not clear infected pleural fluid.", "why": ["An infected effusion won't resolve on its own.", "Antibiotics are needed but are not enough without drainage.", "", "Biopsy is for undiagnosed exudates, not a known infection.", "Oral antibiotics are too weak for an empyema."], "refs": [["iatrox: pleural effusion", "https://www.iatrox.com/academy/ukmla/pleural-effusion"]], "note": "", "src": "iatrox UKMLA revision", "id": 315}, {"group": "Medicine", "topic": "Respiratory", "stem": "A 68-year-old woman with COPD presents with worsening dyspnoea. Blood gas shows pH 7.21, PaO2 7.2 kPa, PaCO2 8.5 kPa, and HCO3 29 mmol/L. She is alert but using accessory muscles. What is the most appropriate next step in management?", "opts": ["Intubation immediately", "Oxygen only", "Non-invasive ventilation (BiPAP)", "IV steroids alone", "Observation"], "ans": 2, "exp": "She has acute hypercapnic respiratory failure with respiratory acidosis. NIV is indicated when pH is below 7.35 and PaCO2 above 6.5 kPa persist after initial medical treatment. A pH below 7.25 is the severe range at which invasive ventilation is considered, but she is alert, so a trial of NIV with close monitoring is the right next step.", "why": ["Intubation is for patients who fail NIV, are drowsy or cannot protect their airway.", "Uncontrolled oxygen can worsen CO2 retention; the problem is ventilation.", "", "Steroids are part of treating the exacerbation but do not fix the acidosis alone.", "Observation risks respiratory arrest with a pH of 7.21."], "refs": [["NICE QS10: non-invasive ventilation", "https://www.nice.org.uk/guidance/QS10/chapter/quality-statement-7-non-invasive-ventilation"]], "note": "This is similar to an earlier COPD NIV question in the bank, but the pH here is in the severe range, so it is worth seeing both.", "src": "NICE", "id": 316}, {"group": "Medicine", "topic": "Neurology", "stem": "An 8-month history of progressive muscle stiffness, frequent falls, and urinary incontinence is reported in a 64-year-old man. Examination shows bradykinesia and rigidity. Autonomic dysfunction is noted. Which diagnosis is most consistent with these features?", "opts": ["Parkinson's disease", "Multiple system atrophy (MSA)", "Amyotrophic lateral sclerosis", "Progressive supranuclear palsy", "Huntington's disease"], "ans": 1, "exp": "Parkinsonism with prominent early autonomic failure (urinary symptoms, orthostatic hypotension) points to multiple system atrophy, especially the parkinsonian type (MSA-P). Levodopa response is poor and brief, and progression is faster than in Parkinson's disease.", "why": ["Parkinson's disease can have autonomic features but rarely early and severe, and it usually responds well to levodopa.", "", "ALS causes motor neuron signs and doesn't cause rigidity with bradykinesia or autonomic failure.", "PSP causes early falls and vertical gaze palsy, not prominent autonomic failure.", "Huntington's disease causes chorea and cognitive/psychiatric change."], "refs": [["MSD Manual: multiple system atrophy", "https://www.msdmanuals.com/professional/neurologic-disorders/autonomic-nervous-system/multiple-system-atrophy"]], "note": "The PSP, ALS and Huntington's contrasts are standard teaching.", "src": "MSD Manual", "id": 317}, {"group": "Medicine", "topic": "Neurology", "stem": "A 58-year-old man presents with progressive asymmetric muscle weakness, fasciculations, and muscle wasting. Reflexes are brisk in the upper limbs. Sensory examination is normal. Which investigation will help confirm the diagnosis?", "opts": ["Muscle biopsy", "Electromyography", "Nerve conduction study", "MRI spine", "Creatine kinase levels"], "ans": 1, "exp": "This is motor neurone disease (ALS), diagnosed clinically. Needle EMG supports the diagnosis by showing widespread active denervation (fibrillations, fasciculations) with chronic reinnervation (large polyphasic units), while sensory nerve conduction stays normal.", "why": ["A muscle biopsy is for myopathies, not for denervation.", "", "Nerve conduction studies help exclude mimics such as conduction block but don't show the characteristic denervation.", "MRI of the spine excludes compressive causes but doesn't confirm ALS.", "CK is often mildly raised in ALS but is not diagnostic."], "refs": [["StatPearls: electrodiagnostic evaluation of motor neuron disease", "https://www.statpearls.com/point-of-care/115848"]], "note": "", "src": "StatPearls", "id": 318}, {"group": "Medicine", "topic": "Neurology", "stem": "A 70-year-old woman presents 10 hours after acute right-sided weakness. CT angiography shows no large vessel occlusion. Blood pressure is 172/92 mmHg. What is the most appropriate immediate pharmacologic intervention?", "opts": ["IV thrombolysis", "High-dose aspirin", "IV heparin", "Oral clopidogrel", "Observation"], "ans": 1, "exp": "She is outside the 4.5-hour window for thrombolysis and has no large vessel occlusion for thrombectomy. For ischaemic stroke, NICE says to give aspirin 300 mg as soon as possible once haemorrhage is excluded (within 24 hours), continued until 2 weeks after onset.", "why": ["Thrombolysis is only within 4.5 hours of onset.", "", "Heparin is not recommended for acute stroke and increases bleeding risk.", "Clopidogrel is used for long-term secondary prevention or after minor stroke, not as the immediate drug here.", "Observation would leave the stroke untreated."], "refs": [["NICE NG128: stroke and TIA", "https://www.nice.org.uk/guidance/NG128/chapter/recommendations"]], "note": "Heads-up: this assumes haemorrhage has been excluded by imaging. The reasoning on heparin and clopidogrel is standard teaching.", "src": "NICE NG128", "id": 319}, {"group": "Medicine", "topic": "Neurology", "stem": "A 75-year-old man presents with progressive memory loss and executive dysfunction over two years. Cognitive decline is stepwise, with intermittent focal neurological deficits. MRI shows multiple infarcts in cortical and subcortical regions. What is the most likely cause of his cognitive decline?", "opts": ["Alzheimer's disease", "Frontotemporal dementia", "Vascular dementia", "Lewy body dementia", "Parkinson's disease dementia"], "ans": 2, "exp": "Vascular dementia causes stepwise decline after vascular events, with executive dysfunction, focal neurological signs and MRI evidence of infarcts or white matter disease. Memory loss is often less prominent than in Alzheimer's.", "why": ["Alzheimer's is insidious and gradual with early memory loss, no early focal signs and medial temporal atrophy.", "Frontotemporal dementia causes early personality or language change with frontal/temporal atrophy.", "", "Lewy body dementia has fluctuating cognition, visual hallucinations and parkinsonism.", "Parkinson's disease dementia follows a long-established parkinsonian illness."], "refs": [["iatrox: vascular dementia", "https://www.iatrox.com/academy/ukmla/vascular-dementia"]], "note": "The source doesn't compare vascular dementia with Lewy body or frontotemporal dementia; those contrasts are standard teaching.", "src": "iatrox UKMLA revision", "id": 320}, {"group": "Medicine", "topic": "Haematology", "stem": "A 68-year-old man with multiple myeloma presents with confusion, constipation, and abdominal pain. Labs reveal hypercalcaemia. Deep tendon reflexes are diminished. Urinalysis is unremarkable. What is the most appropriate initial management?", "opts": ["Oral bisphosphonates", "IV fluids", "Haemodialysis", "Corticosteroids", "Observation"], "ans": 1, "exp": "Symptomatic hypercalcaemia (confusion, constipation, abdominal pain, thirst, polyuria) is treated first with IV 0.9% saline rehydration (about 1-3 litres over 24 hours), because patients are dehydrated. IV zoledronic acid follows after rehydration, and calcium is rechecked after about 5 days.", "why": ["Oral bisphosphonates are poorly absorbed and slow, so they're not used for acute hypercalcaemia.", "", "Dialysis is a rescue option for severe, resistant cases or renal failure, not the initial step.", "Steroids help in some malignancies (for example, myeloma or lymphoma) but are not the first measure.", "Confusion from hypercalcaemia is an emergency that needs treatment."], "refs": [["NHS Scotland: management of malignant hypercalcaemia", "https://rightdecisions.scot.nhs.uk/media/11tdu4xg/management-of-malignant-hypercalcaemia.pdf"]], "note": "The source doesn't mention oral bisphosphonates, steroids or dialysis; those points are standard teaching.", "src": "NHS Scotland guideline", "id": 321}, {"group": "Surgery", "topic": "Paediatric surgery", "stem": "A 10-year-old girl is brought to the emergency department because of lower abdominal pain for the past 12 hours. The pain has progressively worsened and was accompanied by occasional episodes of diarrhea. She has vomited twice. Her mother has Crohn disease. Her temperature is 38.1°C (100.6°F), pulse is 95/min, respirations are 20/min, and blood pressure is 110/70 mm Hg. The abdomen is soft, and there is mild tenderness to palpation in the right lower quadrant without rebound or guarding. Bowel sounds are normal. Her hemoglobin concentration is 13.0 g/dL, leukocyte count is 12,800/mm3, and platelet count is 345,000/mm3. Urine dipstick is negative for nitrites and leukocyte esterase. Urinalysis shows 3 WBC/hpf and no RBCs. Which of the following is the most appropriate next step in management?", "opts": ["Ultrasound of the abdomen", "Colonoscopy", "CT scan of the abdomen", "X-ray of the abdomen", "Emergency laparoscopy"], "ans": 0, "exp": "In a child with suspected appendicitis, ultrasound is the first imaging test because it uses no radiation. A non-compressible appendix over 6 mm is diagnostic. If it is inconclusive, CT or MRI follows.", "why": ["", "Colonoscopy is not used in acute abdominal pain and carries perforation risk.", "CT is second-line in children because of radiation, used if ultrasound is inconclusive.", "A plain X-ray is rarely diagnostic for appendicitis.", "Surgery is not justified before imaging when the picture is unclear (mild tenderness, no peritonism)."], "refs": [["StatPearls: paediatric appendicitis", "https://www.statpearls.com/ArticleLibrary/viewarticle/26820"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 322}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 46-year-old man is brought to the emergency department because of severe epigastric pain and vomiting for the past 4 hours. The pain is constant, radiates to his back, and is worse on lying down. He has had 3–4 episodes of greenish-colored vomit. He was treated for H. pylori infection around 2 months ago with triple-regimen therapy. He has atrial fibrillation and hypertension. He owns a distillery on the outskirts of a town. The patient drinks 4–5 alcoholic beverages daily. Current medications include dabigatran and metoprolol. He appears uncomfortable. His temperature is 37.8°C (100°F), pulse is 102/min, and blood pressure is 138/86 mm Hg. Examination shows severe epigastric tenderness to palpation with guarding but no rebound. Bowel sounds are hypoactive. Rectal examination shows no abnormalities. Laboratory studies show: Hematocrit 53% Leukocyte count 11,300/mm3 Serum Na+ 133 mEq/L Cl- 98 mEq/L + K 3.1 mEq/L Calcium 7.8 mg/dL Urea nitrogen 43 mg/dL Glucose 271 mg/dL Creatinine 2.0 mg/dL Total bilirubin 0.7 mg/dL Alkaline phosphatase 61 U/L AST 19 U/L ALT 17 U/L γ-glutamyl transferase (GGT)88 u/L (N=5–50 U/L) Lipase 900 U/L (N=14–280 U/L) Which of the following is the most appropriate next step in management?", "opts": ["CT angiography", "Calcium gluconate therapy", "Laparotomy", "ERCP", "Crystalloid fluid infusion"], "ans": 4, "exp": "Acute pancreatitis with signs of volume depletion needs early fluid resuscitation first. The ACG guideline prefers lactated Ringer's, given moderately aggressively early on, with extra boluses if hypovolaemic.", "why": ["CT angiography is not the first step and the contrast load adds renal risk in a dehydrated patient.", "Calcium is only given for symptomatic hypocalcaemia, which is not described.", "Surgery has no role in uncomplicated acute pancreatitis.", "ERCP is reserved for cholangitis or persistent biliary obstruction, and this cause looks alcohol-related.", ""], "refs": [["Healio: ACG guideline on hydration in acute pancreatitis", "https://www.healio.com/news/gastroenterology/20240411/acg-early-aggressive-hydration-essential-to-avoid-complications-in-acute-pancreatitis"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 323}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A previously healthy 37-year-old man comes to the physician for the evaluation of an 8-week history of intermittent burning epigastric pain. During this period, he has also felt bloated and uncomfortable after meals. He has not had weight loss or a change in bowel habits. He has no personal or family history of serious illness. He takes no medications. He does not smoke. He drinks 1–3 beers per week. Vital signs are within normal limits. Abdominal examination shows mild epigastric tenderness on palpation without guarding or rebound tenderness. Bowel sounds are normal. The remainder of the examination shows no abnormalities. Which of the following is the most appropriate next step in management?", "opts": ["Urea breath test", "H. pylori eradication therapy", "H. pylori serum IgG", "Proton pump inhibitors", "Upper gastrointestinal gastroscopy"], "ans": 0, "exp": "For uncomplicated dyspepsia with no alarm features, NICE advises 'test and treat' for H. pylori using a carbon-13 urea breath test or stool antigen test, after stopping PPIs for two weeks.", "why": ["", "Treating without confirming infection is not recommended.", "Serum IgG cannot separate current from past infection, and NICE does not recommend office-based serology.", "A PPI alone treats symptoms but would also make later testing falsely negative.", "Endoscopy is for alarm features or age-related thresholds, none of which apply here."], "refs": [["NICE CG184: dyspepsia and GORD", "https://www.nice.org.uk/guidance/CG184/chapter/recommendations"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 324}, {"group": "Surgery", "topic": "Vascular", "stem": "A 69-year-old man is brought to the emergency department because of severe abdominal pain radiating to his left flank for 30 minutes. He is weak and has been unable to stand since the onset of the pain. He vomited twice on the way to the hospital. He has not passed stools for 3 days. He has hypertension, coronary heart disease, and peptic ulcer disease. He has smoked half a pack of cigarettes daily for 46 years. Current medications include enalapril, metoprolol, aspirin, simvastatin, and pantoprazole. He appears ill. His temperature is 37°C (98.6°F), pulse is 131/min, respirations are 31/min, and blood pressure is 82/56 mm Hg. Pulse oximetry on room air shows an oxygen saturation of 92%. The lungs are clear to auscultation. Cardiac examination shows no abnormalities. Examination shows a painful pulsatile abdominal mass. Intravenous fluid resuscitation is begun. Which of the following is the most appropriate next step in management?", "opts": ["Intravenous ampicillin/sulbactam therapy", "Supine and erect x-rays of the abdomen", "CT scan of the abdomen and pelvis with contrast", "Open emergency surgery", "Transfusion of packed red blood cells"], "ans": 3, "exp": "A ruptured AAA with shock and flank pain needs immediate surgical repair. Delaying for imaging in an unstable patient costs lives.", "why": ["Antibiotics do not address haemorrhage.", "Abdominal X-ray wastes time and cannot confirm rupture.", "CT is only for stable patients; this man is hypotensive.", "", "Transfusion is supportive and will not control the bleeding."], "refs": [["NICE NG156: ruptured AAA, rationale and impact", "https://www.nice.org.uk/guidance/NG156/chapter/rationale-and-impact"]], "note": "Main point checked against the linked source; fine detail also from your course explanation.", "src": "Linked sources", "id": 325}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 38-year-old man comes to the physician because of a 2-week history of severe pain while passing stools. The stools are covered with bright red blood. He has been avoiding defecation because of the pain. Last year, he was hospitalized for pilonidal sinus surgery. He has had chronic lower back pain ever since he had an accident at his workplace 10 years ago. The patient's father was diagnosed with colon cancer at the age of 62. Current medications include oxycodone and gabapentin. He is 163 cm (5 ft 4 in) tall and weighs 100 kg (220 lb); BMI is 37.6 kg/m2. Vital signs are within normal limits. The abdomen is soft and nontender. Digital rectal examination was not performed because of severe pain. His hemoglobin is 16.3 mg/dL and his leukocyte count is 8300/mm3. Which of the following is the most appropriate next step in management?", "opts": ["Botulinum toxin injection", "Tract curettage", "Sitz baths and topical nifedipine", "Colonoscopy", "Anal sphincterotomy"], "ans": 2, "exp": "Acute anal fissure is treated first with conservative measures: fibre, stool softeners and warm sitz baths, plus a topical sphincter relaxant such as nifedipine. Surgery or botulinum toxin is for those who fail this.", "why": ["Botulinum toxin is second-line, after topical therapy fails.", "Tract curettage treats pilonidal sinus, not a fissure.", "", "Colonoscopy is not needed as the first step for a classic fissure picture.", "Sphincterotomy is for chronic fissures not healing with medical therapy."], "refs": [["MSD Manual: anal fissure", "https://www.msdmanuals.com/en-gb/professional/gastrointestinal-disorders/anorectal-disorders/anal-fissure"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 326}, {"group": "Surgery", "topic": "Vascular", "stem": "A 53-year-old Asian woman comes to the physician because of a 2- month history of severe pain in her right leg while walking. She used to be able to walk a half-mile (800-m) to the grocery store but has been unable to walk 200 meters without stopping because of the pain over the past month. She can continue to walk after a break of around 5 minutes. She has hypertension, atrial fibrillation, and type 2 diabetes mellitus. She has smoked one pack of cigarettes daily for the past 32 years. Current medications include metformin, enalapril, aspirin, and warfarin. Vital signs are within normal limits. Examination shows an irregularly irregular pulse. The right lower extremity is cooler than the left lower extremity. The skin over the right leg appears shiny and dry. Femoral pulses are palpated bilaterally; pedal pulses are diminished on the right side. Which of the following is the most appropriate next step in management?", "opts": ["Duplex ultrasonography", "CT angiography", "Digital subtraction angiography", "Ankle-brachial index", "MR angiography"], "ans": 3, "exp": "The ankle-brachial pressure index is the first test to confirm PAD in someone with claudication. NICE reserves duplex ultrasound for planning revascularisation. Note that in diabetes a normal or raised ABPI does not rule out disease because of calcified vessels.", "why": ["Duplex is used once revascularisation is being considered.", "CT angiography is a later imaging choice if MR angiography is not possible.", "Digital subtraction angiography is invasive and not a first test.", "", "MR angiography is a later imaging step."], "refs": [["NICE CG147: peripheral arterial disease", "https://www.nice.org.uk/guidance/CG147/chapter/recommendations"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 327}, {"group": "Surgery", "topic": "Orthopaedics", "stem": "A 38-year-old man comes to the physician because of progressive pain and swelling of his left knee for the past 2 days. He has been taking ibuprofen for the past 2 days without improvement. Four days ago, he scraped his left knee while playing baseball. He has a 2-month history of progressive pain and stiffness in his back. The pain starts after waking up and lasts for 20 minutes. He has type 2 diabetes mellitus. His older sister has rheumatoid arthritis. He is 170 cm (5 ft 7 in) tall and weighs 91 kg (201 lb); BMI is 31.5 kg/m2. Temperature is 39°C (102.2°F), pulse is 90/min, and blood pressure is 135/85 mm Hg. Examination shows an erythematous, tender, and swollen left knee; range of motion is limited. There are abrasions over the lateral aspect of the left knee. The remainder of the examination shows no abnormalities. Laboratory studies show a leukocyte count of 13,500/mm3 and an erythrocyte sedimentation rate of 70 mm/h. Which of the following is the most appropriate next step in management?", "opts": ["Bone scan", "MRI of the left knee", "Continued ibuprofen intake", "Intra-articular glucocorticoid injection", "Arthrocentesis of the left knee"], "ans": 4, "exp": "A hot swollen joint with fever needs urgent aspiration, ideally before antibiotics, and the fluid goes for cell count, Gram stain, culture and crystals. Diabetes is a risk factor.", "why": ["A bone scan will not exclude septic arthritis and delays treatment.", "MRI is not the first step; aspiration gives the diagnosis.", "Continuing NSAIDs leaves a possibly infected joint untreated.", "Steroid injection into an infected joint is dangerous.", ""], "refs": [["iatrox: septic arthritis", "https://www.iatrox.com/academy/ukmla/septic-arthritis"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 328}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 58-year-old woman comes to the emergency department because of a 2- day history of worsening upper abdominal pain. She reports nausea and vomiting, and is unable to tolerate oral intake. She appears uncomfortable. Her temperature is 38.1°C (100.6°F), pulse is 92/min, respirations are 18/min, and blood pressure is 132/85 mm Hg. Examination shows yellowish discoloration of her sclera. Her abdomen is tender in the right upper quadrant. There is no abdominal distention or organomegaly. Laboratory studies show: Hemoglobin 13 g/dL Leukocyte count 16,000/mm3 Serum Urea nitrogen 25 mg/dL Creatinine 2 mg/dL Alkaline phosphatase 432 U/L Alanine aminotransferase 196 U/L Aspartate transaminase 207 U/L Bilirubin Total 3.8 mg/dL Direct 2.7 mg/dL Lipase 82 U/L (N = 14–280) Ultrasound of the right upper quadrant shows dilated intrahepatic and extrahepatic bile ducts and multiple hyperechoic spheres within the gallbladder. The pancreas is not well visualized. Intravenous ﬂuid resuscitation and antibiotic therapy with ceftriaxone and metronidazole is begun. Twelve hours later, the patient appears acutely ill and is not oriented to time. Her temperature is 39.1°C (102.4°F), pulse is 105/min, respirations are 22/min, and blood pressure is 112/82 mm Hg. Which of the following is the most appropriate next step in management?", "opts": ["Laparoscopic cholecystectomy", "MRCP", "Percutaneous cholecystostomy", "Abdominal CT scan", "ERCP"], "ans": 4, "exp": "Fever, jaundice and RUQ pain suggest ascending cholangitis. Antibiotics are started, and biliary drainage by ERCP is the definitive treatment, within 24-48 hours for moderate disease and urgently for severe disease.", "why": ["Cholecystectomy does not clear an obstructed bile duct.", "MRCP diagnoses but does not treat, and drainage should not wait.", "Cholecystostomy drains the gallbladder, not the obstructed common bile duct.", "CT adds little and delays drainage.", ""], "refs": [["Emergency Care BC: ascending cholangitis", "https://emergencycarebc.ca/clinical_resource/clinical-summary/ascending-cholangitis/"]], "note": "Sources checked for the main point; remaining detail is from your course explanation.", "src": "Linked sources", "id": 329}, {"group": "Surgery", "topic": "Upper GI / HPB", "stem": "A 52-year-old man comes to the physician because of a 3-month history of upper abdominal pain and nausea that occurs about 3 hours after eating and at night. The symptoms improve with eating. After eating, he often has a feeling of fullness and bloating. He has had several episodes of dark stools over the past month. He has smoked one pack of cigarettes daily for 40 years and drinks 2 alcoholic beverages daily. He takes no medications. His temperature is 36.4°C (97.5°F), pulse is 80/min, and blood pressure is 110/70 mm Hg. Abdominal examination shows epigastric tenderness with no guarding or rebound. Bowel sounds are normal. A urea breath test is positive. Which of the following treatments is most appropriate to prevent further complications of this patient's disease?", "opts": ["Ranitidine and pantoprazole", "Distal gastrectomy with gastroduodenostomy", "Amoxicillin, clarithromycin, and omeprazole", "Fundoplication, hiatoplasty, and gastropexy", "Truncal vagotomy"], "ans": 2, "exp": "H. pylori-positive duodenal ulcer is treated with eradication therapy: a PPI plus two antibiotics (here amoxicillin and clarithromycin).", "why": ["Two acid suppressants do not eradicate the organism.", "Gastrectomy is reserved for complications or failed treatment.", "", "Fundoplication treats reflux.", "Vagotomy is rarely used now that eradication therapy exists."], "refs": [["NICE CG184: dyspepsia and GORD (test and treat)", "https://www.nice.org.uk/guidance/CG184/chapter/recommendations"]], "note": "NICE page confirms test-and-treat; the specific regimen is from your course quiz. Check local antibiotic policy for the current regimen.", "src": "Linked sources", "id": 330}, {"group": "Surgery", "topic": "Neurosurgery", "stem": "A 77-year-old man is brought to the emergency department by his wife because of headache, nausea, and vomiting for 24 hours. His wife says that over the past 2 weeks, he has been more irritable and has had trouble remembering to do routine errands. Two weeks ago, he fell during a skiing accident but did not lose consciousness. He has coronary artery disease and hypertension. He has smoked one pack of cigarettes daily for 50 years. He has had 2 glasses of wine daily since his retirement 10 years ago. Current medications include atenolol, enalapril, furosemide, atorvastatin, and aspirin. He appears acutely ill. He is oriented to person but not to place or time. His temperature is 37°C (98.6°F), pulse is 99/min, respirations are 16/min, and blood pressure is 160/90 mm Hg. During the examination, he is uncooperative and unable to answer questions. Deep tendon reﬂexes are 4+ on the left and 2+ on the right. Babinski's sign is present on the left. There is mild weakness of the left iliopsoas and hamstring muscles. A CT scan of the head without contrast shows a high-density, 15-mm crescentic collection across the right hemispheric convexity. Which of the following is the most appropriate next step in the management of this patient?", "opts": ["Observation", "Recombinant tissue plasminogen activator administration", "Perform a lumbar puncture", "Obtain an MRI of the head", "Surgical evacuation"], "ans": 4, "exp": "Older age and alcohol cause brain atrophy, so bridging veins stretch and tear after minor head injury, causing subdural haematoma. Confusion with signs of raised pressure points to evacuation.", "why": ["Observation is only for small asymptomatic collections.", "tPA would worsen bleeding.", "Lumbar puncture risks herniation with a mass lesion.", "MRI is not needed to proceed once CT shows a large symptomatic collection.", ""], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 331}, {"group": "Surgery", "topic": "Urology", "stem": "A 13-year-old boy is brought to the emergency department by his mother because of vomiting and severe testicular pain for 3 hours. The boy has had 4–5 episodes of vomiting during this period. He has never had a similar episode in the past and takes no medications. His father died of testicular cancer at the age of 50. His immunizations are up-to-date. He appears anxious and uncomfortable. His temperature is 37°C (98.6°F), pulse is 90/min, respirations are 14/min, and blood pressure is 100/60 mm Hg. Cardiopulmonary examination shows no abnormalities. The abdomen is soft and nondistended. The left scrotum is firm, erythematous, and swollen. There is severe tenderness on palpation of the scrotum that persists on elevation of the testes. Stroking the inner side of the left thigh fails to elicit elevation of the scrotum. Which of the following is the most appropriate next step in management?", "opts": ["Ceftriaxone and doxycycline therapy", "CT scan of the abdomen and pelvis", "Surgical exploration of the scrotum", "Urine dipstick", "Doppler ultrasound of the scrotum"], "ans": 2, "exp": "Sudden severe testicular pain with vomiting in a young teenager is torsion until proven otherwise. Immediate surgical exploration with detorsion and bilateral orchidopexy is needed, and imaging must not delay it.", "why": ["Antibiotics treat epididymitis, which is not the likely diagnosis here.", "CT does not help and wastes time.", "", "Urinalysis delays treatment and does not exclude torsion.", "Doppler can be used if the diagnosis is genuinely uncertain, but it must not delay surgery when torsion is likely."], "refs": [["iatrox: testicular torsion", "https://www.iatrox.com/academy/ukmla/testicular-torsion"]], "note": "Main point checked against the linked source; fine detail also from your course explanation.", "src": "Linked sources", "id": 332}, {"group": "Surgery", "topic": "Urology", "stem": "A 59-year-old man comes to the physician because of a 3-month history of frequent urination. He has to urinate every 1–2 hours during the day and wakes up at least 2–3 times at night to urinate. He also reports that over the last 2 months, he has difﬁculty initiating micturition and the urinary stream is weak, with prolonged terminal dribbling. His pulse is 72/min, and blood pressure is 158/105 mm Hg. Rectal exam shows a smooth, symmetrically enlarged prostate without any tenderness or irregularities. Prostate-speciﬁc antigen is within the reference range and urinalysis shows no abnormalities. A postvoid ultrasound shows a residual bladder volume of 110 mL. Which of the following is the most appropriate next step in management?", "opts": ["Bladder catheterization", "Transurethral resection of the prostate", "Prostate biopsy", "Terazosin therapy", "Finasteride therapy"], "ans": 3, "exp": "For symptomatic BPH, an alpha-blocker (terazosin, tamsulosin) is first-line because it relaxes bladder neck and prostate smooth muscle.", "why": ["Catheterisation is for retention, not stable symptoms.", "TURP is for those failing medical therapy or with complications.", "A normal PSA and benign-feeling prostate do not call for biopsy.", "", "A 5-alpha-reductase inhibitor is added mainly for large prostates and works slowly."], "refs": [["RCSI Surgery Moodle quiz (your file)", ""]], "note": "Explanation comes from your RCSI course quiz and standard teaching; not yet checked against an external guideline.", "src": "RCSI course quiz", "id": 333}, {"group": "Surgery", "topic": "Colorectal", "stem": "A 28-year-old woman comes to the physician with a history of bright red blood in her stools for 3 days. She has defecated once per day. She does not have fever, pain on defecation, or abdominal pain. She was treated for a urinary tract infection with levofloxacin around 3 months ago. Menses occur at regular intervals of 28–30 days and lasts 3–4 days. Her father died of colon cancer 4 years ago. Her only medication is an i
