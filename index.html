colitis", "https://www.iatrox.com/academy/ukmla/ulcerative-colitis"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 386}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "A 34-year-old man is diagnosed with ulcerative colitis. Which statement is most true about this condition?", "opts": ["Afro-Caribbean populations have an increased risk", "Asian populations have an increased risk", "Current smokers have an increased risk", "Former smokers have an increased risk", "Middle Eastern populations have an increased risk"], "ans": 3, "exp": "Smoking is protective in UC, so non-smokers and ex-smokers are at higher risk, and UC often appears or flares after quitting.", "why": ["UC is more common in people of white European ancestry.", "Asian populations do not carry the highest risk.", "Current smoking is protective, not a risk.", "", "No special risk is established for Middle Eastern populations."], "refs": [["iatrox: ulcerative colitis", "https://www.iatrox.com/academy/ukmla/ulcerative-colitis"]], "note": "Source confirms the smoking relationship; the ethnicity statements are from general teaching and not from this page.", "src": "Linked sources", "id": 387}, {"group": "Medicine", "topic": "Gastroenterology", "stem": "An 18-year-old man presents with jaundice, with a normal examination. He started co-amoxiclav two days ago for a UTI. Bloods: Hb 13 (13-16.5), unconjugated bilirubin 48 (3-17), ALT 5 (5-35), AST 6 (5-35), ALP 50 (30-150). What is the most likely underlying diagnosis to explain his jaundice?", "opts": ["Alcoholic hepatitis", "Crigler-Najjar type 2", "Gilbert syndrome", "Hepatitis A", "Hepatitis B"], "ans": 2, "exp": "Isolated unconjugated hyperbilirubinaemia with normal liver enzymes and no haemolysis is Gilbert syndrome. Illness, fasting, dehydration or drugs can unmask it, and it needs no treatment.", "why": ["Alcoholic hepatitis raises the transaminases and gives conjugated hyperbilirubinaemia.", "Crigler-Najjar type 2 is rare and usually presents in infancy or childhood.", "", "Hepatitis A causes markedly raised ALT and AST.", "Hepatitis B also raises the transaminases."], "refs": [["Genomics Education Programme: elevated unconjugated bilirubin", "https://www.genomicseducation.hee.nhs.uk/genotes/in-the-clinic/presentation-patient-with-elevated-unconjugated-hyperbilirubin/"]], "note": "The source doesn't discuss Crigler-Najjar; that contrast is standard teaching.", "src": "Linked sources", "id": 388}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 19-year-old woman standing at a music concert feels nauseous, dizzy and light-headed, becomes pale and collapses, but is aware of her surroundings. She recovers within seconds. She has no chest pain. HR 80 bpm, BP 130/75, normal heart sounds and sinus rhythm on ECG. Which is the most likely diagnosis?", "opts": ["SVT", "Long QT syndrome", "Vasovagal syncope", "Carotid sinus syndrome", "Epilepsy"], "ans": 2, "exp": "Vasovagal (reflex) syncope is typically triggered by prolonged standing, heat or emotion after a prodrome of light-headedness, nausea, sweating and pallor. A normal ECG is reassuring.", "why": ["SVT would have a fast heart rate or palpitations at the time.", "Long QT has an abnormal ECG and arrhythmic collapse with little warning.", "", "Carotid sinus syndrome affects older people, triggered by neck pressure.", "Epilepsy would cause convulsive features and post-ictal confusion."], "refs": [["iatrox: syncope", "https://www.iatrox.com/academy/ukmla/syncope"]], "note": "Main point checked against the linked source.", "src": "Linked sources", "id": 389}, {"group": "Medicine", "topic": "Cardiology", "stem": "A 70-year-old woman is on day 2 after a total hip replacement. She has type 2 diabetes, hypertension and a 40 pack-year smoking history. She suddenly feels unwell with nausea, vomiting and profuse sweating but denies chest pain. She is hypotensive and diaphoretic with a mitral regurgitation murmur. ECG function b64(u){let s='';for(let k=0;k<u.length;k+=8192)s+=String.fromCharCode.apply(null,u.subarray(k,k+8192));return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'')}
function unb64(t){t=t.replace(/-/g,'+').replace(/_/g,'/');while(t.length%4)t+='=';const s=atob(t),u=new Uint8Array(s.length);for(let k=0;k<s.length;k++)u[k]=s.charCodeAt(k);return u}
async function pack(){const j=JSON.stringify({r:S,c:C,p:P});try{if(window.CompressionStream){const cs=new Blob([j]).stream().pipeThrough(new CompressionStream('gzip'));return 'g1.'+b64(new Uint8Array(await new Response(cs).arrayBuffer()))}}catch(e){}return 'r1.'+b64(new TextEncoder().encode(j))}
async function unpack(code){code=String(code).trim();const m=code.match(/[#?&]p=([^&\s]+)/);if(m)code=m[1];const k=code.slice(0,3),b=unb64(code.slice(3));let j;
 if(k=='g1.'){const ds=new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'));j=await new Response(ds).text()}else if(k=='r1.')j=new TextDecoder().decode(b);else throw 0;
 const o=JSON.parse(j);if(!o||typeof o.r!='object')throw 0;return o}
function mergeIn(o){let n=0;for(const k in (o.p||{}))if(!P[k]){P[k]=1;n++}
 for(const k in o.r){const a=S[k],b=o.r[k];if(!a){S[k]=b;continue}
  const ad=a.due==null?1e18:a.due,bd=b.due==null?1e18:b.due,d=Math.min(ad,bd);
  S[k]=Object.assign({},b,a,{due:d==1e18?null:d,w:a.w||b.w,hl:[...(a.hl||[]),...(b.hl||[]).filter(x=>!(a.hl||[]).some(y=>y.t==x.t))],note:a.note||b.note||''})}
 persist();return n}

  try{await navigator.clipboard.writeText(xferOut);xferMsg+=' It has been copied.'}catch(e){xferMsg+=' Copy it from the box below.'}}catch(e){xferMsg='Could not create the link.'}render();setTimeout(()=>{const t=$('xout');if(t){t.focus({preventScroll:true});t.select()}},30)}
async function doImport(code){try{const o=await unpack(code);const n=mergeIn(o);xferMsg='Imported. '+n+' new question'+(n==1?'':'s')+' marked done, plus your reminders, highlights and notes.';pend=null;try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}catch(e){xferMsg='That link or code did not work. Copy it again in full.'}render()}
function xferCard(){return `<div class="card" style="margin-top:16px"><h2>Move to another device</h2><div class="mu sm">Your progress is saved in this browser. To use it on another device, make a ${standalone?'transfer link':'transfer code'} here and ${standalone?'open it':'paste it'} there. It is a copy from this moment, so make a new one if you keep studying.</div>
 <div class="row" style="margin-top:12px;justify-content:flex-start"><button class="btn" onclick="makeXfer()">${standalone?'Copy transfer link':'Make transfer code'}</button></div>
 ${xferOut?`<textarea id="xout" readonly rows="3" style="font-family:var(--mono);font-size:12px">${esc(xferOut)}</textarea>`:''}

 <div class="row" style="margin-top:8px;justify-content:flex-start"><button class="btn" onclick="doImport($('xin').value)">Import</button></div>
 ${xferMsg?`<div class="warn" style="margin-top:10px">${esc(xferMsg)}</div>`:''}</div>`}

 else if(xferMsg&&tab!='review'){v.insertAdjacentHTML('afterbegin',`<div class="warn" style="margin-bottom:12px">${esc(xferMsg)}</div>`);xferMsg=''}}
if(/^#p=/.test(location.hash))pend=location.hash;
